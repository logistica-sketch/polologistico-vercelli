// Documento singolo: riga in bozza (origine 'libero') + originale in pdf-documenti/{id}/originale.pdf.
// L'originale non si modifica mai: ogni generazione riparte da lì.
async function creaDocumentoLiberoPdf(file){
  if (file.size > MAX_MB_PDF_LIBERO * 1024 * 1024){ alert(`Il file supera i ${MAX_MB_PDF_LIBERO} MB.`); return; }
  const bytes = new Uint8Array(await file.arrayBuffer());
  const testa = String.fromCharCode.apply(null, bytes.subarray(0, 1024));
  if (testa.indexOf("%PDF") < 0){ alert("Il file scelto non è un PDF."); return; }
  try { await pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported:false }).promise; }
  catch(e){ alert("Questo file non si apre come PDF: " + e.message); return; }
  chiudiModal();

  const titolo = (file.name.replace(/\.pdf$/i, "").trim() || "Documento").slice(0, 200);
  const { data, error } = await sb.from("pdf_documenti").insert({
    origine: "libero", modello_id: null, titolo, stato: "bozza",
    campi: [], elementi: [], valori: {}, riferimenti: {}, firme_completate: [], creato_da: state.user.id
  }).select("id").single();
  if (error){ alert("Errore: " + error.message); return; }
  const docId = data.id;
  const path = `${docId}/originale.pdf`;
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_PDF_DOCUMENTI).upload(path, bytes, { contentType:"application/pdf", upsert:false });
  if (upErr){ alert("Documento creato, ma il PDF originale non è stato caricato: " + upErr.message + "\nAnnulla il documento e riprova."); apriDettaglioDocumentoPdf(docId); return; }
  const hash = await sha256HexPdf(bytes);
  const { error: updErr } = await sb.from("pdf_documenti").update({ pdf_originale_path: path }).eq("id", docId);
  if (updErr){ alert("Errore: " + updErr.message); apriDettaglioDocumentoPdf(docId); return; }
  await registraAuditPdf([{ documento_id: docId, evento: "creato", sha256: hash, dettagli: { origine: "libero", file: file.name.slice(0, 200), dimensione: file.size } }]);
  apriEditorLiberoPdf(docId);
}

/* ---------- DOCUMENTI SINGOLI: editor ----------
   Stesso _ed degli altri editor con libero = true; modo "modello" = disegno, "compila" = compilazione.
   Elementi disegnati (pdf_documenti.elementi): { id, tipo, pagina (da 1), x, y, larghezza, altezza, ...proprietà }
   in punti PDF, origine in alto a sinistra; ordine di disegno = ordine nell'array, i campi stanno sopra.
   Immagini e firme: PNG in pdf-documenti/{id}/asset-{uuid}.png, nel JSON solo il percorso (path). */
const TIPI_ELEMENTO_PDF = {
  testo:    { label:"Testo",    w:160, h:22, icon:"ti-typography" },
  riquadro: { label:"Riquadro", w:140, h:70, icon:"ti-square" },
  copri:    { label:"Copri",    w:140, h:24, icon:"ti-eraser" },
  linea:    { label:"Linea",    w:160, h:10, icon:"ti-line" },
  immagine: { label:"Immagine", w:120, h:80, icon:"ti-photo" },
  firma:    { label:"Firma",    w:150, h:60, icon:"ti-signature" }
};
const ALLINEAMENTI_PDF = { sinistra:"Sinistra", centro:"Centro", destra:"Destra" };
const ORIENTAMENTI_LINEA_PDF = { orizzontale:"Orizzontale", verticale:"Verticale", giu:"Libera ↘", su:"Libera ↗" };
const PASSI_ANNULLA_PDF = 40;
const MAX_MB_IMMAGINE_PDF = 10;

function coloreSicuroPdf(c, def){ return /^#[0-9a-f]{6}$/i.test(c || "") ? c : def; }
function numeroPdf(v, min, max, def){ const n = Number(v); return Number.isFinite(n) ? Math.max(min, Math.min(max, n)) : def; }
function uidElementoPdf(){ return "e" + uidCampoPdf().slice(1); }
function raggioRiquadroPdf(o){ return Math.min(8, o.larghezza / 2, o.altezza / 2); }
// estremi della linea nel suo riquadro, y verso il basso
function estremiLineaPdf(o){
  const w = o.larghezza, h = o.altezza;
  if (o.orientamento === "verticale") return [w / 2, 0, w / 2, h];
  if (o.orientamento === "giu") return [0, 0, w, h];
  if (o.orientamento === "su") return [0, h, w, 0];
  return [0, h / 2, w, h / 2];
}

function nuovoElementoPdf(tipo, pagina, cx, cy, w, h){
  const t = TIPI_ELEMENTO_PDF[tipo];
  const p = _ed.pagine[pagina - 1];
  w = Math.min(w || t.w, p.w); h = Math.min(h || t.h, p.h);
  const o = {
    id: uidElementoPdf(), tipo, pagina,
    x: arrotondaPdf(Math.max(0, Math.min(p.w - w, cx - w / 2))),
    y: arrotondaPdf(Math.max(0, Math.min(p.h - h, cy - h / 2))),
    larghezza: arrotondaPdf(w), altezza: arrotondaPdf(h)
  };
  if (tipo === "testo") Object.assign(o, { contenuto:"Testo", dimensione:11, colore:"#000000", grassetto:false, allineamento:"sinistra" });
  else if (tipo === "riquadro") Object.assign(o, { colore_bordo:"#000000", spessore:1, riempimento:null, arrotondato:false });
  else if (tipo === "copri") Object.assign(o, { colore_bordo:"#ffffff", spessore:0, riempimento:"#ffffff", arrotondato:false });
  else if (tipo === "linea") Object.assign(o, { colore:"#000000", spessore:1, orientamento:"orizzontale" });
  return o;
}

function nomeOggettoEd(o){
  if (!eElementoEd(o)) return o.nome || "";
  if (o.tipo === "testo"){ const r = String(o.contenuto || "").split("\n")[0].trim(); return r ? (r.length > 30 ? r.slice(0, 30) + "…" : r) : "Testo"; }
  return TIPI_ELEMENTO_PDF[o.tipo]?.label || o.tipo;
}

// Anteprima HTML dell'elemento: stessa resa del PDF generato (Helvetica, punti × --k)
function htmlContenutoElementoEd(o){
  const k = "var(--k,1)";
  if (o.tipo === "testo"){
    const al = { sinistra:"left", centro:"center", destra:"right" }[o.allineamento] || "left";
    return `<div class="tx" style="font-size:calc(${k} * ${numeroPdf(o.dimensione, 4, 96, 11)}px);color:${coloreSicuroPdf(o.colore, "#000000")};font-weight:${o.grassetto ? 700 : 400};text-align:${al};">${escapeHtml(o.contenuto || "")}</div>`;
  }
  if (o.tipo === "riquadro" || o.tipo === "copri"){
    const sp = numeroPdf(o.spessore, 0, 20, 0);
    const bordo = sp ? `calc(${k} * ${sp}px) solid ${coloreSicuroPdf(o.colore_bordo, "#000000")}` : "none";
    const fondo = o.riempimento ? coloreSicuroPdf(o.riempimento, "#ffffff") : "transparent";
    return `<div class="bx" style="border:${bordo};background:${fondo};border-radius:${o.arrotondato ? `calc(${k} * ${raggioRiquadroPdf(o)}px)` : "0"};"></div>`;
  }
  if (o.tipo === "linea"){
    const [x1, y1, x2, y2] = estremiLineaPdf(o);
    return `<svg viewBox="0 0 ${o.larghezza} ${o.altezza}" preserveAspectRatio="none" aria-hidden="true"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${coloreSicuroPdf(o.colore, "#000000")}" vector-effect="non-scaling-stroke" style="stroke-width:calc(${k} * ${numeroPdf(o.spessore, 0.25, 20, 1)}px)"/></svg>`;
  }
  const src = _ed.asset && _ed.asset[o.path];
  return src ? `<img alt="" src="${src}">` : `<div class="mancante">Immagine non disponibile</div>`;
}

function elementoElementoEd(o){
  const e = _ed;
  const modifica = e.modo === "modello";
  const el = document.createElement("div");
  el.className = `pe-el t-${o.tipo} ${modifica ? "modifica" : "statico"}${modifica && e.sel === o.id ? " sel" : ""}`;
  el.dataset.id = o.id;
  el.innerHTML = htmlContenutoElementoEd(o) + (modifica ? `<span class="maniglia" aria-hidden="true"></span>` : "");
  if (modifica){
    el.tabIndex = 0;
    el.setAttribute("aria-label", `${TIPI_ELEMENTO_PDF[o.tipo]?.label || o.tipo}: ${nomeOggettoEd(o)}`);
    el.addEventListener("focus", () => { if (_ed && _ed.sel !== o.id) selezionaCampoEd(o.id); });
  }
  posizionaCampoEd(el, o);
  return el;
}

/* annulla / ripeti: istantanee di campi + elementi, solo in memoria.
   segnaEd va chiamata PRIMA della modifica; con la stessa chiave entro 1,5 s le modifiche si sommano in un passo */
function fotoEd(){ return JSON.stringify({ campi: _ed.campi, elementi: _ed.elementi || [] }); }
function segnaEd(chiave, foto){
  const e = _ed;
  if (!e) return;
  e.modificato = true;
  if (!e.undo) return;
  const ora = Date.now();
  if (chiave && e.ultimaChiave === chiave && ora - e.ultimaOra < 1500){ e.ultimaOra = ora; return; }
  e.undo.push(foto || fotoEd());
  if (e.undo.length > PASSI_ANNULLA_PDF) e.undo.shift();
  e.redo = [];
  e.ultimaChiave = chiave || null; e.ultimaOra = ora;
  aggiornaAnnullaEd();
}
function annullaEd(ripeti){
  const e = _ed;
  if (!e || !e.undo) return;
  const da = ripeti ? e.redo : e.undo, verso = ripeti ? e.undo : e.redo;
  if (!da.length) return;
  verso.push(fotoEd());
  const s = JSON.parse(da.pop());
  e.campi = s.campi; e.elementi = s.elementi;
  if (e.sel && !oggettoEd(e.sel)) e.sel = null;
  e.modificato = true; e.ultimaChiave = null;
  renderCampiEd(); renderPannelliEd(); aggiornaAnnullaEd();
}
function aggiornaAnnullaEd(){
  const e = _ed;
  const a = document.getElementById("pe-ed-annulla"), r = document.getElementById("pe-ed-ripeti");
  if (a) a.disabled = !e.undo.length;
  if (r) r.disabled = !e.redo.length;
}

function duplicaOggettoEd(id){
  const e = _ed;
  const o = oggettoEd(id);
  if (!o) return;
  const elemento = eElementoEd(o);
  const p = e.pagine[o.pagina - 1];
  segnaEd();
  const n = JSON.parse(JSON.stringify(o));
  n.id = elemento ? uidElementoPdf() : uidCampoPdf();
  n.x = arrotondaPdf(Math.max(0, Math.min(p.w - n.larghezza, o.x + 10)));
  n.y = arrotondaPdf(Math.max(0, Math.min(p.h - n.altezza, o.y + 10)));
  if (elemento) e.elementi.push(n);
  else { n.nome = `${o.nome} (copia)`.slice(0, 80); e.campi.push(n); }
  renderCampiEd();
  selezionaCampoEd(n.id);
}

// verso +1 = porta avanti (disegnato dopo), -1 = porta indietro
function spostaOrdineEd(id, verso){
  const e = _ed;
  const o = oggettoEd(id);
  if (!o) return;
  const arr = eElementoEd(o) ? e.elementi : e.campi;
  const i = arr.findIndex(x => x.id === id), j = i + verso;
  if (j < 0 || j >= arr.length) return;
  segnaEd();
  [arr[i], arr[j]] = [arr[j], arr[i]];
  renderCampiEd(); renderPannelliEd();
}

  return `
    <div class="pe-azioni-ogg">

/* apertura */
async function apriEditorLiberoPdf(id){
  if (!editorPdfCompleto()){ alert("Solo chi ha l'Editor PDF completo può modificare i documenti da PDF caricato."); return; }
  document.getElementById("page-content").innerHTML = `<div class="loading-spin">Preparo il documento…</div>`;
  const { data: doc, error } = await sb.from("pdf_documenti").select("*").eq("id", id).maybeSingle();
  if (error || !doc){ alert("Errore: " + (error?.message || "documento non trovato")); renderEditorPdf(); return; }
  if (doc.stato !== "bozza" || !doc.pdf_originale_path){
    alert("Questo documento non è più modificabile."); await renderEditorPdf(); apriDettaglioDocumentoPdf(id); return;
  }
  let bytes;
  try { bytes = await scaricaBytesPdf(STORAGE_BUCKET_PDF_DOCUMENTI, doc.pdf_originale_path); }
  catch(e){ alert(e.message); renderEditorPdf(); return; }

  const elementi = Array.isArray(doc.elementi) ? doc.elementi : [];
  const asset = {};
  await Promise.all([...new Set(elementi.filter(o => o.path).map(o => o.path))].map(async path => {
    try { asset[path] = await scaricaComeDataUrl(STORAGE_BUCKET_PDF_DOCUMENTI, path); }
    catch(err){ console.warn(err.message); }
  }));
  let volontario = null, tlc = null;
  const rif = doc.riferimenti || {};
  if (rif.volontario_id){
    const { data } = await sb.from("volontari_formazione").select(COLONNE_VOLONTARIO_PDF).eq("id", rif.volontario_id).maybeSingle();
    volontario = data || null;
  }
  if (rif.tlc_id){
    const { data } = await sb.from("tlc_apparati").select(COLONNE_TLC_PDF).eq("id", rif.tlc_id).maybeSingle();
    tlc = data || null;
  }
  _ed = {
    modo: "modello", libero: true, daModello: false, prova: false, modello: null, documento: doc,
    campi: JSON.parse(JSON.stringify(doc.campi || [])), elementi: JSON.parse(JSON.stringify(elementi)),
    valori: { ...(doc.valori || {}) }, asset, pagine: [], pdfBytes: bytes,
    sel: null, tool: null, volontario, tlc, titolo: doc.titolo, titoloToccato: true, modificato: false,
    undo: [], redo: [], zoom: "adatta"
  };
  mostraEditorPdf();
}

/* pannelli */
function renderSxLiberoEd(sx, avvisoRuotate){
  const e = _ed;
  const nPag = e.pagine.length;
  const gruppi = [];
  for (let i = 1; i <= nPag; i++){
    const voci = [...e.elementi.filter(o => o.pagina === i), ...e.campi.filter(c => c.pagina === i)];

/* immagini e firme */
// File immagine o dataURL → PNG (lato lungo al massimo 2000 px)
function immagineInPngPdf(src){
  return new Promise((res, rej) => {
    const url = typeof src === "string" ? src : URL.createObjectURL(src);
    const img = new Image();
    img.onload = () => {
      if (typeof src !== "string") URL.revokeObjectURL(url);
      const s = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.naturalWidth * s)); cv.height = Math.max(1, Math.round(img.naturalHeight * s));
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(blob => blob ? res({ blob, dataUrl: cv.toDataURL("image/png"), w: cv.width, h: cv.height }) : rej(new Error("Conversione dell'immagine non riuscita.")), "image/png");
    };
    img.onerror = () => { if (typeof src !== "string") URL.revokeObjectURL(url); rej(new Error("Immagine non leggibile.")); };
    img.src = url;
  });
}

function paginaVisibileEd(){
  let pagina = 1, area = -1;
  document.querySelectorAll(".pe-pagina").forEach(w => {
    const r = w.getBoundingClientRect();
    const vis = Math.max(0, Math.min(r.bottom, innerHeight) - Math.max(r.top, 0));
    if (vis > area){ area = vis; pagina = +w.dataset.pagina; }
  });
  return pagina;
}

// extra: proprietà aggiuntive dell'elemento (es. libreria_id). Il PNG è sempre una copia nella cartella del documento.
async function inserisciImmagineEd(tipo, img, extra){
  const e = _ed;
  const path = `${e.documento.id}/asset-${crypto.randomUUID()}.png`;
  const { error } = await sb.storage.from(STORAGE_BUCKET_PDF_DOCUMENTI).upload(path, img.blob, { contentType:"image/png", upsert:false });
  if (error) throw new Error("Caricamento dell'immagine non riuscito: " + error.message);
  if (_ed !== e) return;
  e.asset[path] = img.dataUrl;
  const pagina = paginaVisibileEd();
  const p = e.pagine[pagina - 1];
  const wrap = document.querySelector(`.pe-pagina[data-pagina="${pagina}"]`);
  const r = wrap.getBoundingClientRect();
  const k = r.width / p.w;
  const cy = Math.max(0, Math.min(r.height, innerHeight / 2 - r.top)) / k;
  let w = TIPI_ELEMENTO_PDF[tipo].w, h = w * img.h / img.w;
  if (h > p.h / 2){ h = p.h / 2; w = h * img.w / img.h; }
  segnaEd();
  const o = nuovoElementoPdf(tipo, pagina, p.w / 2, cy, w, h);
  o.path = path;
  o.larghezza_px = img.w; o.altezza_px = img.h;
  if (extra) Object.assign(o, extra);
  e.elementi.push(o);
  overlayEd(pagina).appendChild(elementoElementoEd(o));
  selezionaCampoEd(o.id);
  return o;
}

function aggiungiImmagineEd(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/png,image/jpeg,.png,.jpg,.jpeg";
  inp.addEventListener("change", async () => {
    const f = inp.files[0];
    if (!f) return;
    if (!/^image\/(png|jpeg)$/.test(f.type)){ alert("Scegli un'immagine PNG o JPG."); return; }
    if (f.size > MAX_MB_IMMAGINE_PDF * 1024 * 1024){ alert(`L'immagine supera i ${MAX_MB_IMMAGINE_PDF} MB.`); return; }
    try { await inserisciImmagineEd("immagine", await immagineInPngPdf(f)); }
    catch(err){ alert(err.message); }
  });
  inp.click();
}

/* ---------- DOCUMENTI SINGOLI: generazione ----------
   Si riparte sempre dall'originale: elementi nell'ordine dell'array, poi i campi
   ("finito": valori disegnati; "compilabile": veri campi AcroForm; "modello": nessun campo). */
function rgbHexPdf(hex){
  const h = coloreSicuroPdf(hex, "#000000");
  return PDFLib.rgb(parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255);
}

// a capo come il riquadro HTML (pre-wrap + break-word): righe che stanno in larghezza
function righeTestoPdf(testo, font, size, larghezza){
  const righe = [];
  const entra = s => font.widthOfTextAtSize(s, size) <= larghezza;
  for (const par of String(testo).replace(/\r/g, "").split("\n").map(testoSicuroPdf)){
    let riga = "";
    for (const parola of (par.match(/\S+ *| +/g) || [])){
      if (entra(riga + parola)){ riga += parola; continue; }
      if (riga) righe.push(riga.trimEnd());
      riga = "";
      let resto = parola;
      while (resto && !entra(resto.trimEnd())){
        let n = resto.length - 1;
        while (n > 1 && !entra(resto.slice(0, n))) n--;
        righe.push(resto.slice(0, n));
        resto = resto.slice(n);
      }
      riga = resto;
    }
    righe.push(riga.trimEnd());
  }
  return righe;
}

async function disegnaElementiPdf(doc, pagine, elementi, asset){
  const { StandardFonts } = PDFLib;
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const immagini = {};
  for (const o of elementi){
    const p = pagine[o.pagina - 1];
    if (!p) continue;
    const H = p.getHeight();
    const w = o.larghezza, h = o.altezza;
    if (o.tipo === "testo"){
      const size = numeroPdf(o.dimensione, 4, 96, 11);
      const f = o.grassetto ? bold : font;
      const color = rgbHexPdf(o.colore);
      righeTestoPdf(o.contenuto || "", f, size, Math.max(1, w - 4)).forEach((r, i) => {
        const base = i * size * 1.2 + size * 0.94;          // linea di base, dall'alto del riquadro
        if (base > h + size * 0.25 || !r) return;           // come overflow:hidden nell'editor
        const tw = f.widthOfTextAtSize(r, size);
        const x = o.allineamento === "centro" ? o.x + (w - tw) / 2 : o.allineamento === "destra" ? o.x + w - 2 - tw : o.x + 2;
        p.drawText(r, { x, y: H - o.y - base, size, font: f, color });
      });
    } else if (o.tipo === "riquadro" || o.tipo === "copri"){
      const sp = numeroPdf(o.spessore, 0, 20, 0);
      const stile = {};
      if (o.riempimento) stile.color = rgbHexPdf(o.riempimento);
      if (sp > 0){ stile.borderColor = rgbHexPdf(o.colore_bordo); stile.borderWidth = sp; }
      if (!stile.color && !stile.borderWidth) continue;
      // il bordo sta dentro il riquadro, come nell'editor (box-sizing: border-box)
      const iw = Math.max(0.1, w - sp), ih = Math.max(0.1, h - sp);
      if (o.arrotondato){
        const r = Math.max(0, raggioRiquadroPdf(o) - sp / 2);
        const path = `M ${r} 0 H ${iw - r} A ${r} ${r} 0 0 1 ${iw} ${r} V ${ih - r} A ${r} ${r} 0 0 1 ${iw - r} ${ih} H ${r} A ${r} ${r} 0 0 1 0 ${ih - r} V ${r} A ${r} ${r} 0 0 1 ${r} 0 Z`;
        p.drawSvgPath(path, { x: o.x + sp / 2, y: H - o.y - sp / 2, ...stile });
      } else {
        p.drawRectangle({ x: o.x + sp / 2, y: H - o.y - h + sp / 2, width: iw, height: ih, ...stile });
      }
    } else if (o.tipo === "linea"){
      const [x1, y1, x2, y2] = estremiLineaPdf(o);
      p.drawLine({ start:{ x: o.x + x1, y: H - o.y - y1 }, end:{ x: o.x + x2, y: H - o.y - y2 },
        thickness: numeroPdf(o.spessore, 0.25, 20, 1), color: rgbHexPdf(o.colore) });
    } else if (o.tipo === "immagine" || o.tipo === "firma"){
      const src = asset[o.path];
      if (!src) throw new Error("Un'immagine del documento non è disponibile: esci e riapri il documento.");
      if (!immagini[o.path]) immagini[o.path] = await doc.embedPng(src);
      const img = immagini[o.path];
      const s = Math.min(w / img.width, h / img.height);
      const iw = img.width * s, ih = img.height * s;
      p.drawImage(img, { x: o.x + (w - iw) / 2, y: H - o.y - h + (h - ih) / 2, width: iw, height: ih });
    }
  }
}

// Campi veri (AcroForm) per il PDF compilabile. pdf-lib non crea campi firma digitale:
// per "sign" un riquadro con la scritta Firma e un campo testo per nome e data.
function aggiungiCampiAcroFormPdf(doc, pagine, campi, valori, font){
  const { rgb } = PDFLib;
  const form = doc.getForm();
  const usati = new Set();
  const nomeUnico = base => {
    const b = String(base || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 _-]/g, "").trim().replace(/\s+/g, "_").slice(0, 40) || "campo";
    let n = 1;
    while (usati.has(`${b}_${n}`)) n++;
    usati.add(`${b}_${n}`);
    return `${b}_${n}`;
  };
  const stile = { font, borderWidth: 0.6, borderColor: rgb(.55, .62, .75), backgroundColor: rgb(.93, .95, .99) };
  for (const c of campi){
    const p = pagine[c.pagina - 1];
    if (!p) continue;
    const H = p.getHeight();
    const rett = { x: c.x, y: H - c.y - c.altezza, width: c.larghezza, height: c.altezza };
    const v = valori[c.id];
    if (c.tipo === "text" || c.tipo === "date"){
      const size = c.dimensione_testo || 10;
      const tf = form.createTextField(nomeUnico(c.nome));
      if (c.altezza > size * 2.4) tf.enableMultiline();
      if (v) tf.setText(testoSicuroPdf(v));
      tf.addToPage(p, { ...rett, ...stile });
      tf.setFontSize(size);
    } else if (c.tipo === "check"){
      const cb = form.createCheckBox(nomeUnico(c.nome));
      cb.addToPage(p, { ...rett, borderWidth: 0.8, borderColor: rgb(.35, .45, .6), backgroundColor: rgb(1, 1, 1) });
      if (v) cb.check();
    } else if (c.tipo === "sign"){
      p.drawRectangle({ ...rett, borderColor: rgb(.55, .62, .75), borderWidth: 0.8, borderDashArray: [3, 2] });
      p.drawText("Firma", { x: c.x + 3, y: H - c.y - 9, size: 7, font, color: rgb(.45, .5, .58) });
      const hNome = 14;
      const sotto = H - c.y - c.altezza - hNome - 1;
      const tf = form.createTextField(nomeUnico(`${c.nome} nome e data`));
      tf.addToPage(p, { x: c.x, y: sotto >= 0 ? sotto : H - c.y - c.altezza, width: c.larghezza, height: hNome, ...stile });
      tf.setFontSize(8);
    }
  }
  form.updateFieldAppearances(font);
}

// modo: "finito" | "compilabile" | "modello". Ritorna { bytes, firme }
async function generaBytesLiberoPdf(modo){
  const e = _ed;
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.load(e.pdfBytes.slice(), { ignoreEncryption:true });
  try { const form = doc.getForm(); if (form.getFields().length) form.flatten(); } catch(err){ /* nessun modulo AcroForm */ }
  const pagine = doc.getPages();
  await disegnaElementiPdf(doc, pagine, e.elementi, e.asset);
  const font = await doc.embedFont(StandardFonts.Helvetica);
  let firme = [];
  if (modo === "finito"){
    firme = await disegnaValoriCampiPdf(doc, pagine, e.campi, e.valori, font);
    const ora = new Date();
    pagine[pagine.length - 1].drawText(
      testoSicuroPdf(`${firme.length || e.elementi.some(o => o.tipo === "firma") ? "Compilato e firmato elettronicamente" : "Documento generato"} il ${oggiItPdf()} alle ${oraItPdf(ora)} – Polo Logistico 1 RGPT/CAP Vercelli`),
      { x: 28, y: 14, size: 6.5, font, color: rgb(.45, .5, .58) });
  } else if (modo === "compilabile"){
    aggiungiCampiAcroFormPdf(doc, pagine, e.campi, e.valori, font);
  }
  doc.setProducer("Polo Logistico 1 RGPT/CAP Vercelli – Editor PDF");
  doc.setModificationDate(new Date());
  return { bytes: await doc.save(), firme };
}

/* 5a – PDF finito: v{n}.pdf, stato in_firma / firmato / completato */
async function generaFinitoLiberoPdf(){
  const e = _ed;
  await preparaCompilazioneLiberoEd();
  if (_ed !== e) return;
  const mancanti = e.campi.filter(c => c.obbligatorio && c.dato !== "esterno" && !campoProntoEd(c));
  if (mancanti.length){
    if (e.modo !== "compila") await cambiaModoLiberoEd("compila");
    evidenziaMancantiEd();
    alert(mancanti.length === 1 ? `Manca un campo obbligatorio: ${mancanti[0].nome}` : `Mancano ${mancanti.length} campi obbligatori, segnati in rosso.`);
    return;
  }
  const firmeCampi = e.campi.filter(c => c.tipo === "sign");
  const daFirmareConLink = firmeCampi.filter(c => c.dato === "esterno" && c.obbligatorio !== false).length;
  if (!confirm(`Generare il PDF finito di "${e.titolo.trim()}"?\nDopo questo passaggio il documento non si modifica più.` +
    (daFirmareConLink ? `\n\n${daFirmareConLink === 1 ? "Un campo firma resta" : daFirmareConLink + " campi firma restano"} da firmare con link: crealo dal Dettaglio.` : ""))) return;

  bottoniGeneraLiberoEd(true);
  let gen, hash;
  try {
    gen = await generaBytesLiberoPdf("finito");
    hash = await sha256HexPdf(gen.bytes);
  } catch(err){
    alert("Non sono riuscito a generare il PDF (il file originale potrebbe essere protetto): " + err.message);
    bottoniGeneraLiberoEd(false); return;
  }
  const firme = gen.firme;
  const completo = campiFirmaObbligatoriPdf(e.campi).every(id => firme.includes(id));
  const stato = !completo ? "in_firma" : (firmeCampi.length ? "firmato" : "completato");
  const docId = e.documento.id;
  const prec = e.documento.versione_pdf || 0;
  const versione = prec + 1;
  const path = `${docId}/v${versione}.pdf`;
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_PDF_DOCUMENTI).upload(path, gen.bytes, { contentType:"application/pdf", upsert:false });
  if (upErr){ alert("Errore upload: " + upErr.message); bottoniGeneraLiberoEd(false); return; }
  const adesso = new Date().toISOString();
  const { data, error } = await sb.from("pdf_documenti").update({
    titolo: e.titolo.trim().slice(0, 200), elementi: elementiPulitiPdf(e.elementi), campi: campiPulitiPdf(e.campi),
    valori: valoriSenzaFirmeEd(), riferimenti: riferimentiEd(), firme_completate: firme,
    pdf_path: path, versione_pdf: versione, sha256: hash, stato,
    firmato_il: stato === "firmato" ? adesso : null
  }).eq("id", docId).eq("stato", "bozza").eq("versione_pdf", prec).select("id").maybeSingle();
  if (error){ alert("Errore: " + error.message); bottoniGeneraLiberoEd(false); return; }
  if (!data){ alert("Il documento è stato modificato da qualcun altro nel frattempo (o non è più una bozza): esci e riaprilo."); bottoniGeneraLiberoEd(false); return; }

  const righe = [{ documento_id: docId, evento: "salvato", sha256: hash,
    dettagli: { versione, stato, origine: "libero", elementi: e.elementi.length, firme_elementi: e.elementi.filter(o => o.tipo === "firma").length } }];
  firme.forEach(cid => righe.push({ documento_id: docId, evento: "firma_interna", campo_id: cid, sha256: hash, dettagli: { versione, ...(e.firmeLibreria?.[cid] || {}) } }));
  if (stato !== "in_firma") righe.push({ documento_id: docId, evento: "completato", sha256: hash, dettagli: { versione, stato } });
  const errAudit = await registraAuditPdf(righe);
  if (errAudit) alert("Documento salvato, ma il registro non è stato aggiornato: " + errAudit.message);

  e.modificato = false;
  _pdfEdTab = "documenti";
  await renderEditorPdf();
  apriDettaglioDocumentoPdf(docId);
}

/* 5b – PDF compilabile: compilabile-v{n}.pdf, scaricato; pdf_path e stato non cambiano */
async function esportaCompilabileLiberoPdf(){
  const e = _ed;
  if (e.modificato && !(await salvaBozzaLiberoPdf())) return;
  await preparaCompilazioneLiberoEd();
  if (_ed !== e) return;
  bottoniGeneraLiberoEd(true);
  try {
    const { bytes } = await generaBytesLiberoPdf("compilabile");
    const hash = await sha256HexPdf(bytes);
    const docId = e.documento.id;
    const { data: files, error: lsErr } = await sb.storage.from(STORAGE_BUCKET_PDF_DOCUMENTI).list(docId, { limit: 1000 });
    if (lsErr) throw new Error("Elenco dei file non disponibile: " + lsErr.message);
    let n = 1 + Math.max(0, ...(files || []).map(f => { const m = /^compilabile-v(\d+)\.pdf$/.exec(f.name); return m ? +m[1] : 0; }));
    let path = `${docId}/compilabile-v${n}.pdf`;
    let { error: upErr } = await sb.storage.from(STORAGE_BUCKET_PDF_DOCUMENTI).upload(path, bytes, { contentType:"application/pdf", upsert:false });
    if (upErr && /exist|duplicate/i.test(upErr.message)){
      n++; path = `${docId}/compilabile-v${n}.pdf`;
      ({ error: upErr } = await sb.storage.from(STORAGE_BUCKET_PDF_DOCUMENTI).upload(path, bytes, { contentType:"application/pdf", upsert:false }));
    }
    if (upErr) throw new Error("Archiviazione non riuscita: " + upErr.message);
    const errAudit = await registraAuditPdf([{ documento_id: docId, evento: "esportato_compilabile", sha256: hash, dettagli: { versione: n, path, campi: e.campi.length } }]);
    const url = URL.createObjectURL(new Blob([bytes], { type:"application/pdf" }));
    const a = document.createElement("a");
    a.href = url; a.download = pulisciNomeFile(e.titolo || "documento").slice(0, 120) + "_compilabile.pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    if (errAudit) alert("PDF compilabile scaricato, ma il registro non è stato aggiornato: " + errAudit.message);
  } catch(err){
    alert("Non sono riuscito a creare il PDF compilabile: " + err.message);
  }
  bottoniGeneraLiberoEd(false);
}

/* 5c – Salva come modello: PDF base con i soli elementi disegnati in pdf-modelli, stessi campi */
async function salvaComeModelloLiberoPdf(){
  const e = _ed;

  if (!nome || !nome.trim()) return;
  bottoniGeneraLiberoEd(true);
  try {

    const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_PDF_MODELLI).upload(path, bytes, { contentType:"application/pdf", upsert:false });
    if (upErr) throw new Error("Errore upload: " + upErr.message);

      pdf_path: path, pagine, campi: campiPulitiPdf(e.campi), versione: 1, creato_da: state.user.id

  }
  bottoniGeneraLiberoEd(false);
}

async function renderAnteprimaDocumentoPdf(path){
  const box = document.getElementById("pe-anteprima");
  const url = await urlFirmato(STORAGE_BUCKET_PDF_DOCUMENTI, path, 300);
  if (!box || !document.body.contains(box)) return;
  if (!url){ box.innerHTML = `<div class="storico-empty">Anteprima non disponibile.</div>`; return; }
  try {
    const pdf = await pdfjsLib.getDocument({ url, isEvalSupported:false }).promise;
    box.innerHTML = "";
    const larg = Math.min(box.clientWidth - 20 || 700, 760);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (let i = 1; i <= pdf.numPages; i++){
      if (!document.body.contains(box)) return;
      const page = await pdf.getPage(i);
      const v1 = page.getViewport({ scale:1 });
      const vp = page.getViewport({ scale: Math.min(3, (larg * dpr) / v1.width) });
      const cv = document.createElement("canvas");
      cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      cv.style.width = Math.floor(vp.width / dpr) + "px";
      box.appendChild(cv);
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    }
  } catch(e){
    box.innerHTML = `<div class="storico-empty">Anteprima non disponibile: ${escapeHtml(e.message)}</div>`;
  }
}

async function scaricaDocumentoPdf(doc){

const ERRORI_ELIMINA_MODELLO_PDF = {
  non_autorizzato: "Non hai i permessi per eliminare i modelli.",
  modello_non_trovato: "Il modello non esiste più."
};

// pdf_elimina_modello: senza documenti cancella la riga ('eliminato'), altrimenti la archivia con eliminato_il
// ('archiviato') e i documenti restano intatti. pdf_audit lo scrive la funzione, log_attivita il trigger.
async function eliminaModelloPdf(m){
  if (!m || !editorPdfCompleto()) return;
  const { count, error: cErr } = await sb.from("pdf_documenti").select("id", { count:"exact", head:true }).eq("modello_id", m.id);
  if (cErr){ alert("Errore: " + cErr.message); return; }
  const n = count || 0;
  const msg = n === 0
    ? `Il modello «${m.nome}» verrà eliminato definitivamente. Continuare?`
    : `Il modello «${m.nome}» è stato usato in ${n} ${n === 1 ? "documento" : "documenti"}. Verrà tolto dall'elenco e non si potrà più usare; i documenti già creati restano intatti. Continuare?`;
  if (!confirm(msg)) return;
  const { data, error } = await sb.rpc("pdf_elimina_modello", { p_id: m.id });
  const codice = (data && typeof data === "object" ? data.errore : null)
    || Object.keys(ERRORI_ELIMINA_MODELLO_PDF).find(k => (error?.message || "").includes(k));
  if (codice){
    alert(ERRORI_ELIMINA_MODELLO_PDF[codice] || ("Errore: " + codice));
    if (codice === "modello_non_trovato") renderTabModelliPdf();
    return;
  }
  if (error){ alert("Errore: " + error.message); return; }
  const esito = typeof data === "string" ? data : data?.esito;
  if (esito === "eliminato" && m.pdf_path){
    const { error: rmErr } = await sb.storage.from(STORAGE_BUCKET_PDF_MODELLI).remove([m.pdf_path]);
    if (rmErr) console.warn("File del modello non rimosso:", rmErr.message);
  }
  alert("Modello eliminato");
  renderTabModelliPdf();
}

async function creaModelloPdf(ev){
  const file = ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  const bytes = new Uint8Array(await file.arrayBuffer());
  const testa = String.fromCharCode.apply(null, bytes.subarray(0, 1024));
  if (testa.indexOf("%PDF") < 0){ alert("Il file scelto non è un PDF."); return; }
  const nome = prompt("Nome del modello:", file.name.replace(/\.pdf$/i, ""));
  if (!nome || !nome.trim()) return;

  let pagine = [], ruotate = false;
  try {
    const pdf = await pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported:false }).promise;
    for (let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      if (page.rotate) ruotate = true;
      const v = page.getViewport({ scale:1 });
      pagine.push({ larghezza: arrotondaPdf(v.width), altezza: arrotondaPdf(v.height) });
    }
  } catch(e){ alert("Questo file non si apre come PDF: " + e.message); return; }
  if (ruotate) alert("Attenzione: il PDF ha pagine ruotate. I campi del modello potrebbero non allinearsi nel PDF finale: se possibile usa un PDF senza rotazione.");

  const path = `${crypto.randomUUID()}.pdf`;
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_PDF_MODELLI).upload(path, bytes, { contentType: "application/pdf", upsert: false });
  if (upErr){ alert("Errore upload: " + upErr.message); return; }
  const { data, error } = await sb.from("pdf_modelli")
    .insert({ nome: nome.trim().slice(0, 150), pdf_path: path, pagine, campi: [], versione: 1, creato_da: state.user.id })
    .select("id").single();
  if (error){ alert("Errore: " + error.message); return; }
  apriEditorModelloPdf(data.id);
}

/* ---------- EDITOR: pagine e campi ---------- */
async function renderPagineEd(){
  const e = _ed;
  const box = document.getElementById("pe-pagine");
  let pdf;
  try { pdf = await pdfjsLib.getDocument({ data: e.pdfBytes.slice(), isEvalSupported:false }).promise; }
  catch(err){ box.innerHTML = `<div class="empty-state">Questo file non si apre come PDF: ${escapeHtml(err.message)}</div>`; return false; }
  if (_ed !== e) return false;
  const stage = document.getElementById("pe-stage");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const avail = Math.min((stage.clientWidth || 800) - 32, 820);
  const voci = [];
  e.pagine = []; e.ruotate = false;
  for (let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    if (page.rotate) e.ruotate = true;
    const v1 = page.getViewport({ scale:1 });
    e.pagine.push({ w: v1.width, h: v1.height });
    // zoom dei documenti singoli: "adatta" alla larghezza oppure 1 / 1.5 (1 pt = 4/3 px)
    const zoom = typeof e.zoom === "number" ? e.zoom : null;
    const largCss = zoom ? v1.width * zoom * 4 / 3 : avail;
    const vp = page.getViewport({ scale: Math.max(1, Math.min(zoom ? 4 : 3, (largCss * dpr) / v1.width)) });
    const wrap = document.createElement("div");
    wrap.className = "pe-pagina"; wrap.dataset.pagina = i; wrap.style.aspectRatio = `${v1.width} / ${v1.height}`;
    if (zoom){ wrap.style.width = largCss + "px"; wrap.style.maxWidth = "none"; }
    const cv = document.createElement("canvas");
    cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    const ov = document.createElement("div");
    ov.className = "pe-overlay"; ov.dataset.pagina = i;
    ov.addEventListener("pointerdown", onOverlayDownEd);
    const n = document.createElement("div");
    n.className = "pe-pnum"; n.textContent = `Pagina ${i} di ${pdf.numPages}`;
    wrap.append(cv, ov, n);
    voci.push({ wrap, page, vp, cv });
  }
  if (_ed !== e) return false;
  box.innerHTML = "";
  if (_edRo) _edRo.disconnect();
  _edRo = new ResizeObserver(ro => ro.forEach(r => {
    const p = e.pagine[+r.target.dataset.pagina - 1];
    if (p) r.target.style.setProperty("--k", r.contentRect.width / p.w);
  }));
  voci.forEach(v => { box.appendChild(v.wrap); _edRo.observe(v.wrap); });
  // campi su pagine che il PDF non ha: scartati
  e.campi = e.campi.filter(c => c.pagina >= 1 && c.pagina <= e.pagine.length);
  if (e.elementi) e.elementi = e.elementi.filter(o => o.pagina >= 1 && o.pagina <= e.pagine.length);
  (async () => {
    for (const v of voci){
      if (_ed !== e) return;
      try { await v.page.render({ canvasContext: v.cv.getContext("2d"), viewport: v.vp }).promise; } catch(err){ /* pagina non disegnabile */ }
    }
  })();
  return true;
}

function posizionaCampoEd(el, c){
  const p = _ed.pagine[c.pagina - 1];
  el.style.left = (c.x / p.w * 100) + "%";
  el.style.top = (c.y / p.h * 100) + "%";
  el.style.width = (c.larghezza / p.w * 100) + "%";
  el.style.height = (c.altezza / p.h * 100) + "%";

function elementoCampoEd(c){
  const e = _ed;
  if (e.modo === "modello"){
    const el = document.createElement("div");
    el.className = `pe-campo t-${c.tipo}${e.sel === c.id ? " sel" : ""}`;
    el.dataset.id = c.id; el.tabIndex = 0;
    el.setAttribute("aria-label", `${TIPI_CAMPO_PDF[c.tipo].label}: ${c.nome}`);
    const ph = c.tipo === "sign"
      ? (c.dato === "esterno" ? "Firma esterna" : c.dato === "sistema.firma_utente" ? "Firma utente" : "Firma")
      : c.tipo === "check" ? "" : etichettaDatoPdf(c.dato);
    el.innerHTML = `<span class="tag"><i class="ti ${TIPI_CAMPO_PDF[c.tipo].icon}"></i>${escapeHtml(c.nome)}${c.obbligatorio ? " *" : ""}</span><span class="ph">${escapeHtml(ph)}</span><span class="maniglia" aria-hidden="true"></span>`;
    el.addEventListener("focus", () => { if (_ed && _ed.sel !== c.id) selezionaCampoEd(c.id); });
    posizionaCampoEd(el, c);
    return el;
  }
  const el = document.createElement("div");
  el.className = "pe-cf"; el.dataset.id = c.id;
  posizionaCampoEd(el, c);
  const v = e.valori[c.id];
  if (c.tipo === "text" || c.tipo === "date"){
    const inp = document.createElement("input");
    inp.type = "text"; inp.value = v || ""; inp.setAttribute("aria-label", c.nome);
    if (c.tipo === "date") inp.placeholder = "gg/mm/aaaa";
    inp.addEventListener("input", () => { e.valori[c.id] = inp.value; e.modificato = true; el.classList.remove("manca"); renderStatoCompilazioneEd(); });
    el.appendChild(inp);
  } else if (c.tipo === "check"){
    const b = document.createElement("button");
    b.type = "button"; b.className = "cb"; b.setAttribute("aria-pressed", v ? "true" : "false"); b.setAttribute("aria-label", c.nome);
    b.textContent = v ? "X" : "";
    b.addEventListener("click", () => { e.valori[c.id] = !e.valori[c.id]; e.modificato = true; aggiornaCampoEd(c); renderStatoCompilazioneEd(); });
    el.appendChild(b);
  } else if (c.dato === "esterno"){
    const d = document.createElement("div");
    d.className = "sg esterna";
    d.textContent = "Firma esterna: link dopo il salvataggio";
    el.appendChild(d);
  } else if (c.dato === "sistema.firma_utente"){
    const d = document.createElement("div");
    d.className = "sg" + (v ? " fatta" : "");
    d.style.cursor = "default";
    d.innerHTML = v ? `<img alt="" src="${v}">` : "Firma personale non trovata: caricala in Impostazioni";
    el.appendChild(d);
  } else {
    const b = document.createElement("button");
    b.type = "button"; b.className = "sg" + (v ? " fatta" : "");
    b.setAttribute("aria-label", (v ? "Rifai " : "Inserisci ") + c.nome);
    b.innerHTML = v ? `<img alt="" src="${v}">` : "Tocca per firmare";
    b.addEventListener("click", () => apriFirmaCampoPdf(c));
    el.appendChild(b);
  }
  return el;
}

function renderCampiEd(){
  const e = _ed;
  document.querySelectorAll(".pe-overlay").forEach(ov => { ov.innerHTML = ""; ov.classList.toggle("piazza", e.modo === "modello" && !!e.tool); });
  // elementi disegnati (documenti singoli) sotto, nell'ordine dell'array; i campi sopra
  (e.elementi || []).forEach(o => { const ov = overlayEd(o.pagina); if (ov) ov.appendChild(elementoElementoEd(o)); });
  e.campi.forEach(c => { const ov = overlayEd(c.pagina); if (ov) ov.appendChild(elementoCampoEd(c)); });
}

// campo o elemento disegnato con quell'id
function oggettoEd(id){
  const e = _ed;
  return e.campi.find(x => x.id === id) || (e.elementi || []).find(x => x.id === id) || null;
}
function eElementoEd(o){ return !!(_ed.elementi || []).find(x => x.id === o.id); }

function aggiornaCampoEd(c){
  const vecchio = document.querySelector(`.pe-overlay [data-id="${c.id}"]`);
  const ov = overlayEd(c.pagina);
  if (!ov) return;
  const nuovo = eElementoEd(c) ? elementoElementoEd(c) : elementoCampoEd(c);
  if (vecchio && vecchio.parentNode === ov) ov.replaceChild(nuovo, vecchio);
  else { if (vecchio) vecchio.remove(); ov.appendChild(nuovo); }
}

/* ---------- EDITOR: interazione sul modello ---------- */
function onOverlayDownEd(ev){
  const e = _ed;
  if (!e || e.modo !== "modello") return;
  const ov = ev.currentTarget;
  const pagina = +ov.dataset.pagina;
  const p = e.pagine[pagina - 1];
  const r = ov.getBoundingClientRect();
  const k = r.width / p.w;
  const el = ev.target.closest(".pe-campo, .pe-el.modifica");
  if (el){
    const c = oggettoEd(el.dataset.id);
    if (!c) return;
    if (e.sel !== c.id) selezionaCampoEd(c.id);
    _edDrag = { c, el, ridimensiona: ev.target.classList.contains("maniglia"), sx: ev.clientX, sy: ev.clientY,
      ox: c.x, oy: c.y, ow: c.larghezza, oh: c.altezza, k, p, mosso: false,
      elemento: el.classList.contains("pe-el"), prima: e.undo ? fotoEd() : null };
    ev.preventDefault();
    return;
  }
  if (e.tool){
    const cx = (ev.clientX - r.left) / k, cy = (ev.clientY - r.top) / k;
    if (e.tool.startsWith("el-")){
      segnaEd();
      const o = nuovoElementoPdf(e.tool.slice(3), pagina, cx, cy);
      e.elementi.push(o);
      e.tool = null;
      document.querySelectorAll(".pe-overlay").forEach(o => o.classList.remove("piazza"));
      ov.appendChild(elementoElementoEd(o));
      selezionaCampoEd(o.id);
      ev.preventDefault();
      return;
    }
    const t = TIPI_CAMPO_PDF[e.tool];
    const n = e.campi.filter(x => x.tipo === e.tool).length + 1;
    const c = {
      id: uidCampoPdf(), nome: `${t.label} ${n}`, tipo: e.tool, pagina,
      x: arrotondaPdf(Math.max(0, Math.min(p.w - t.w, cx - t.w / 2))),
      y: arrotondaPdf(Math.max(0, Math.min(p.h - t.h, cy - t.h / 2))),
      larghezza: t.w, altezza: t.h,
      dato: e.tool === "date" && !e.libero ? "sistema.oggi" : "manuale",
      obbligatorio: e.tool === "sign", dimensione_testo: 10.5
    };
    segnaEd();
    e.campi.push(c);
    e.tool = null;
    document.querySelectorAll(".pe-overlay").forEach(o => o.classList.remove("piazza"));
    ov.appendChild(elementoCampoEd(c));
    selezionaCampoEd(c.id);
    ev.preventDefault();
    return;
  }
  selezionaCampoEd(null);
}

window.addEventListener("pointermove", ev => {
  const d = _edDrag;
  if (!d) return;
  const dx = (ev.clientX - d.sx) / d.k, dy = (ev.clientY - d.sy) / d.k;
  if (Math.abs(dx) + Math.abs(dy) > 0.5) d.mosso = true;
  const c = d.c, p = d.p;
  if (d.ridimensiona){
    if (c.tipo === "check"){
      const s = Math.max(8, Math.min(Math.min(p.w - c.x, p.h - c.y), d.ow + Math.max(dx, dy)));
      c.larghezza = c.altezza = arrotondaPdf(s);
    } else if (d.elemento && (c.tipo === "immagine" || c.tipo === "firma") && !ev.shiftKey){
      // proporzioni dell'immagine (Maiusc = libere)
      const rap = c.larghezza_px && c.altezza_px ? c.larghezza_px / c.altezza_px : d.ow / d.oh;
      let w = Math.max(4, Math.min(p.w - c.x, d.ow + dx)), h = w / rap;
      if (h > p.h - c.y){ h = p.h - c.y; w = h * rap; }
      c.larghezza = arrotondaPdf(w); c.altezza = arrotondaPdf(h);
    } else {
      c.larghezza = arrotondaPdf(Math.max(d.elemento ? 4 : 20, Math.min(p.w - c.x, d.ow + dx)));
      c.altezza = arrotondaPdf(Math.max(d.elemento ? 4 : 10, Math.min(p.h - c.y, d.oh + dy)));
    }
  } else {
    c.x = arrotondaPdf(Math.max(0, Math.min(p.w - c.larghezza, d.ox + dx)));
    c.y = arrotondaPdf(Math.max(0, Math.min(p.h - c.altezza, d.oy + dy)));
  }
  posizionaCampoEd(d.el, c);
});

window.addEventListener("pointerup", () => {
  if (!_edDrag) return;
  const { mosso, prima } = _edDrag;
  _edDrag = null;
  if (mosso && _ed){ segnaEd(null, prima); renderDxEd(); if (_ed.libero) renderSxEd(); }
});

document.addEventListener("keydown", ev => {
  const e = _ed;
  if (!e || e.modo !== "modello" || state.route !== "editorpdf") return;
  if (document.getElementById("modal-overlay")) return;
  const tg = ev.target;
  if (tg && (tg.tagName === "INPUT" || tg.tagName === "SELECT" || tg.tagName === "TEXTAREA")) return;
  // documenti singoli: annulla / ripeti / duplica
  if (e.libero && (ev.ctrlKey || ev.metaKey)){
    const t = ev.key.toLowerCase();
    if (t === "z" && !ev.shiftKey){ ev.preventDefault(); annullaEd(false); return; }
    if (t === "y" || (t === "z" && ev.shiftKey)){ ev.preventDefault(); annullaEd(true); return; }
    if (t === "d" && e.sel){ ev.preventDefault(); duplicaOggettoEd(e.sel); return; }
  }
  if (!e.sel) return;
  const c = oggettoEd(e.sel);
  if (!c) return;
  const p = e.pagine[c.pagina - 1];
  const passo = ev.shiftKey ? 10 : 1;
  if (ev.key.startsWith("Arrow")) segnaEd("frecce-" + c.id);
  if (ev.key === "ArrowLeft") c.x = Math.max(0, c.x - passo);
  else if (ev.key === "ArrowRight") c.x = Math.min(p.w - c.larghezza, c.x + passo);
  else if (ev.key === "ArrowUp") c.y = Math.max(0, c.y - passo);
  else if (ev.key === "ArrowDown") c.y = Math.min(p.h - c.altezza, c.y + passo);
  else if (ev.key === "Delete" || ev.key === "Backspace"){ ev.preventDefault(); eliminaCampoEd(c.id); return; }
  else return;
  ev.preventDefault();
  c.x = arrotondaPdf(c.x); c.y = arrotondaPdf(c.y);
  e.modificato = true;
  const el = document.querySelector(`.pe-overlay [data-id="${c.id}"]`);
  if (el) posizionaCampoEd(el, c);
  renderDxEd();
});

function selezionaCampoEd(id){
  _ed.sel = id;
  document.querySelectorAll(".pe-campo, .pe-el").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
  renderPannelliEd();
}

function eliminaCampoEd(id){
  const e = _ed;
  segnaEd();
  e.campi = e.campi.filter(c => c.id !== id);
  if (e.elementi) e.elementi = e.elementi.filter(o => o.id !== id);
  delete e.valori[id];
  const el = document.querySelector(`.pe-overlay [data-id="${id}"]`);
  if (el) el.remove();
  e.sel = null;
  e.modificato = true;
  renderPannelliEd();
}

/* ---------- EDITOR: pannelli ---------- */
function renderPannelliEd(){ renderSxEd(); renderDxEd(); }

function renderSxEd(){
  const e = _ed;
  const sx = document.getElementById("pe-sx");
  if (!sx) return;
  const avvisoRuotate = e.ruotate ? `<div class="es-avviso">Il PDF ha pagine ruotate: i campi potrebbero non allinearsi nel PDF finale.</div>` : "";
  if (e.libero && e.modo === "modello"){ renderSxLiberoEd(sx, avvisoRuotate); return; }
  if (e.modo === "modello"){
    sx.innerHTML = `
      ${avvisoRuotate}
      <h4>Modello</h4>

        ${Object.entries(TIPI_CAMPO_PDF).map(([k,t]) => `<button type="button" class="pe-tool ${e.tool===k?"on":""}" data-pe-tool="${k}"><i class="ti ${t.icon}"></i>${t.label}</button>`).join("")}
      </div>
      <p class="pe-hint ${e.tool ? "on" : ""}">${e.tool ? `Ora tocca il punto del foglio dove va il campo ${TIPI_CAMPO_PDF[e.tool].label.toLowerCase()}.` : "Scegli un tipo, poi tocca il punto del foglio."}</p>
      <h4>Campi nel modello (${e.campi.length})</h4>
      ${e.campi.length ? `<ul class="pe-lista">${e.campi.map(c => `
        <li><button type="button" class="${e.sel===c.id?"on":""}" data-pe-scegli="${c.id}">
          <i class="ti ${TIPI_CAMPO_PDF[c.tipo].icon}"></i><span class="nm">${escapeHtml(c.nome)}</span><span class="pg">p. ${c.pagina}</span>
        </button></li>`).join("")}</ul>` : `<p class="pe-hint">Nessun campo.</p>`}
    `;
    document.getElementById("pe-nome-modello").addEventListener("input", ev => {
      e.nomeModello = ev.target.value; e.modificato = true;
      document.getElementById("pe-ed-titolo").textContent = "Modello: " + e.nomeModello;
    });
    document.getElementById("pe-descr-modello").addEventListener("input", ev => { e.descrModello = ev.target.value; e.modificato = true; });
    sx.querySelectorAll("[data-pe-tool]").forEach(b => b.addEventListener("click", () => {
      e.tool = e.tool === b.dataset.peTool ? null : b.dataset.peTool;
      document.querySelectorAll(".pe-overlay").forEach(o => o.classList.toggle("piazza", !!e.tool));
      renderSxEd();
    }));
    sx.querySelectorAll("[data-pe-scegli]").forEach(b => b.addEventListener("click", () => {
      selezionaCampoEd(b.dataset.peScegli);
      const el = document.querySelector(`.pe-campo[data-id="${b.dataset.peScegli}"]`);
      if (el) el.scrollIntoView({ block:"center", behavior:"smooth" });
    }));
    return;
  }

  const usa = gruppiUsatiPdf(e.campi);
  const serveFirmaUtente = e.campi.some(c => c.dato === "sistema.firma_utente");
  sx.innerHTML = `
    ${avvisoRuotate}
    ${e.prova ? `<div class="es-avviso">Prova di compilazione con dati reali: niente viene salvato.</div>` : ""}
    ${usa.volontario ? `
      <h4>Volontario</h4>
      <input type="search" class="es-input-mail" id="pe-cerca-vol" placeholder="Cognome o codice fiscale…">
      <div class="pe-risultati" id="pe-ris-vol"></div>
      ${e.volontario ? `<div class="pe-scelto"><strong>${escapeHtml(e.volontario.cognome)} ${escapeHtml(e.volontario.nome)}</strong><br>${escapeHtml(e.volontario.codice_fiscale || "")} ${e.volontario.sezione_ana ? "· " + escapeHtml(e.volontario.sezione_ana) : ""}</div>` : ""}` : ""}
    ${usa.tlc ? `
      <h4>Materiale TLC</h4>
      <input type="search" class="es-input-mail" id="pe-cerca-tlc" placeholder="Codice ANA o matricola…">
      <div class="pe-risultati" id="pe-ris-tlc"></div>
      ${e.tlc ? `<div class="pe-scelto"><strong>${escapeHtml(e.tlc.codice_ana || "")}</strong> ${escapeHtml([e.tlc.marca, e.tlc.modello].filter(Boolean).join(" "))}<br>${e.tlc.matricola ? "Matricola " + escapeHtml(e.tlc.matricola) : ""}</div>` : ""}` : ""}
    <h4>Compilazione</h4>
    <p class="pe-hint">I campi collegati si riempiono da soli; puoi correggerli scrivendo sul foglio. Caselle e firme si completano toccandole.</p>
    ${serveFirmaUtente && !e.firmaUtente ? `<div class="es-avviso" style="margin-top:10px;">Il modello usa la tua firma personale, ma non l'hai ancora caricata: vai in Impostazioni → La mia firma personale.</div>` : ""}
    ${e.documento ? `<p class="pe-hint">Modifica di una bozza: le firme interne già apposte vanno ripetute.</p>` : ""}

  if (usa.volontario) collegaRicercaPdf("pe-cerca-vol", "pe-ris-vol", cercaVolontariPdf, v => `${escapeHtml(v.cognome)} ${escapeHtml(v.nome)} <span style="color:var(--grigio-600);">${escapeHtml(v.codice_fiscale || "")}</span>`, v => { e.volontario = v; datiCollegatiCambiatiEd(); });
  if (usa.tlc) collegaRicercaPdf("pe-cerca-tlc", "pe-ris-tlc", cercaTlcPdf, t => `<strong>${escapeHtml(t.codice_ana || "")}</strong> ${escapeHtml([t.marca, t.modello].filter(Boolean).join(" "))} <span style="color:var(--grigio-600);">${escapeHtml(t.matricola || "")}</span>`, t => { e.tlc = t; datiCollegatiCambiatiEd(); });

function collegaRicercaPdf(inputId, risId, cerca, etichetta, scegli){
  const inp = document.getElementById(inputId);
  const ris = document.getElementById(risId);
  let timer = null, ultima = 0;
  inp.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const q = inp.value.replace(/[^A-Za-zÀ-ÿ0-9' ]/g, "").trim();
      if (q.length < 2){ ris.innerHTML = ""; return; }
      const n = ++ultima;
      const { data, error } = await cerca(q);
      if (n !== ultima || !document.body.contains(ris)) return;
      if (error){ ris.innerHTML = `<p class="pe-hint">Errore: ${escapeHtml(error.message)}</p>`; return; }
      if (!data.length){ ris.innerHTML = `<p class="pe-hint">Nessun risultato (o non hai accesso a questi dati).</p>`; return; }
      ris.innerHTML = data.map((r, i) => `<button type="button" data-i="${i}">${etichetta(r)}</button>`).join("");
      ris.querySelectorAll("button").forEach(b => b.addEventListener("click", () => scegli(data[+b.dataset.i])));
    }, 300);
  });
}

function cercaVolontariPdf(q){
  return sb.from("volontari_formazione").select(COLONNE_VOLONTARIO_PDF)
    .or(`cognome.ilike.%${q}%,codice_fiscale.ilike.%${q}%`).order("cognome").order("nome").limit(15);
}
function cercaTlcPdf(q){
  return sb.from("tlc_apparati").select(COLONNE_TLC_PDF)
    .or(`codice_ana.ilike.%${q}%,matricola.ilike.%${q}%`).order("codice_ana").limit(15);
}

function datiCollegatiCambiatiEd(){
  const e = _ed;
  riempiValoriEd(false);
  if (!e.titoloToccato && !e.prova) e.titolo = titoloPropostoEd();
  e.modificato = true;
  renderCampiEd();
  renderPannelliEd();
}

function renderDxEd(){
  const e = _ed;
  const dx = document.getElementById("pe-dx");
  if (!dx) return;
  if (e.modo === "modello"){
    const c = e.sel && e.campi.find(x => x.id === e.sel);
    if (e.libero){
      const o = e.sel && (e.elementi || []).find(x => x.id === e.sel);
      if (o){ renderDxElementoEd(dx, o); return; }
      if (!c){ renderDxLiberoVuotoEd(dx); return; }
    }
    if (!c){
      dx.innerHTML = `
        <h4>Come si prepara un modello</h4>
        <ol style="margin:0;padding-left:18px;font-size:12.5px;line-height:1.6;">
          <li>Scegli un tipo di campo e tocca il punto del foglio dove va.</li>
          <li>Collega ogni campo a un dato (volontario, materiale, sistema) o lascialo da compilare a mano.</li>
          <li>Per le firme di persone esterne scegli "Firma esterna con link".</li>
          <li>Prova il modello con "Prova compilazione", poi salvalo.</li>
        </ol>
        <p class="pe-hint">Trascina i campi per spostarli, usa l'angolo per ridimensionarli, le frecce per rifinire (Maiusc = 10 punti), Canc per eliminarli.</p>
      `;
      return;
    }
    const opzioniDato = (() => {
      const gruppi = {};
      DATI_PDF.filter(d => d.tipi.includes(c.tipo)).forEach(d => { (gruppi[d.gruppo] = gruppi[d.gruppo] || []).push(d); });
      return Object.entries(gruppi).map(([g, ds]) => `<optgroup label="${escapeHtml(g)}">${ds.map(d => `<option value="${d.key}" ${d.key===c.dato?"selected":""}>${escapeHtml(d.label)}</option>`).join("")}</optgroup>`).join("");
    })();
    dx.innerHTML = `
      <h4>Campo selezionato</h4>
      <div class="form-field"><label>Nome</label><input id="pe-p-nome" maxlength="80" value="${escapeHtml(c.nome)}"></div>
      <div class="form-field"><label>Tipo</label>
        <select id="pe-p-tipo">${Object.entries(TIPI_CAMPO_PDF).map(([k,t]) => `<option value="${k}" ${k===c.tipo?"selected":""}>${t.label}</option>`).join("")}</select></div>
      <div class="form-field"><label>Dato collegato</label><select id="pe-p-dato">${opzioniDato}</select></div>
      ${(c.tipo === "text" || c.tipo === "date") ? `<div class="form-field"><label>Dimensione del testo</label><input type="number" id="pe-p-dim" min="6" max="24" step="0.5" value="${c.dimensione_testo || 10}"></div>` : ""}
      <div class="form-checkbox"><input type="checkbox" id="pe-p-obbl" ${c.obbligatorio ? "checked" : ""}><label for="pe-p-obbl" style="margin:0;">Obbligatorio</label></div>
      <p class="pe-hint">Pagina ${c.pagina}, x ${arrotondaPdf(c.x)}, y ${arrotondaPdf(c.y)}, ${arrotondaPdf(c.larghezza)} × ${arrotondaPdf(c.altezza)} pt.</p>
      ${e.libero ? htmlAzioniOggettoEd() : `<button type="button" class="btn-danger" id="pe-p-elimina" style="margin-top:12px;width:100%;">Elimina il campo</button>`}
    `;
    if (e.libero) collegaAzioniOggettoEd(c);
    document.getElementById("pe-p-nome").addEventListener("input", ev => { segnaEd("nome-" + c.id); c.nome = ev.target.value; aggiornaCampoEd(c); renderSxEd(); });
    document.getElementById("pe-p-tipo").addEventListener("change", ev => {
      segnaEd();
      c.tipo = ev.target.value;
      const t = TIPI_CAMPO_PDF[c.tipo];
      if (!DATI_PDF.some(d => d.key === c.dato && d.tipi.includes(c.tipo))) c.dato = c.tipo === "date" ? "sistema.oggi" : "manuale";
      if (c.tipo === "check"){ c.larghezza = c.altezza = t.w; }
      else if (c.tipo === "sign"){ c.larghezza = Math.max(c.larghezza, 120); c.altezza = Math.max(c.altezza, 48); }
      else { c.altezza = Math.min(c.altezza, t.h + 6); }
      const p = e.pagine[c.pagina - 1];
      c.x = Math.min(c.x, p.w - c.larghezza); c.y = Math.min(c.y, p.h - c.altezza);
      e.modificato = true;
      aggiornaCampoEd(c); renderPannelliEd();
    });
    document.getElementById("pe-p-dato").addEventListener("change", ev => { segnaEd(); c.dato = ev.target.value; aggiornaCampoEd(c); });
    const dim = document.getElementById("pe-p-dim");
    if (dim) dim.addEventListener("input", ev => { const v = parseFloat(ev.target.value); if (v >= 6 && v <= 24){ segnaEd("dim-" + c.id); c.dimensione_testo = v; aggiornaCampoEd(c); } });
    document.getElementById("pe-p-obbl").addEventListener("change", ev => { segnaEd(); c.obbligatorio = ev.target.checked; aggiornaCampoEd(c); });
    if (!e.libero) document.getElementById("pe-p-elimina").addEventListener("click", () => eliminaCampoEd(c.id));
    return;
  }

  if (e.libero){ renderDxCompilaLiberoEd(dx); return; }
  dx.innerHTML = `
    ${e.prova ? "" : `
      <h4>Titolo del documento</h4>
      <div class="form-field"><input id="pe-titolo" maxlength="200" value="${escapeHtml(e.titolo)}"></div>`}
    <h4>Stato della compilazione</h4>
    <div id="pe-stato"></div>
    ${e.prova
      ? `<button type="button" class="btn-save" id="pe-btn-prova" style="width:100%;margin-top:12px;">Scarica il PDF di prova</button>`
      : `<button type="button" class="btn-save" id="pe-btn-genera" style="width:100%;margin-top:12px;">Genera e salva il PDF</button>
         <button type="button" class="btn-cancel" id="pe-btn-bozza" style="width:100%;margin-top:8px;">Salva come bozza</button>`}
    <p class="pe-hint" style="margin-top:14px;">Firma elettronica semplice: va bene per moduli interni, prestiti e prese visione. Per atti formali verso enti serve la firma digitale.</p>
  `;
  renderStatoCompilazioneEd();
  if (e.prova){
    document.getElementById("pe-btn-prova").addEventListener("click", () => scaricaProvaPdf());
  } else {
    document.getElementById("pe-titolo").addEventListener("input", ev => { e.titolo = ev.target.value; e.titoloToccato = true; e.modificato = true; });
    document.getElementById("pe-btn-genera").addEventListener("click", () => salvaDocumentoPdf(false));
    document.getElementById("pe-btn-bozza").addEventListener("click", () => salvaDocumentoPdf(true));
  }
}

/* ---------- EDITOR: compilazione ---------- */
async function preparaCompilazionePdf(){
  const e = _ed;
  if (e.campi.some(c => c.dato === "sistema.firma_utente") && e.firmaUtente === undefined){
    e.firmaUtente = null;
    if (state.profile.firma_personale_path){
      try {
        const url = await scaricaComeDataUrl(STORAGE_BUCKET_FIRME_PERSONALI, state.profile.firma_personale_path);
        e.firmaUtente = await ritagliaFirmaDataUrlPdf(url);
      } catch(err){ console.warn(err.message); }
    }
  }
  // una bozza riaperta tiene i valori salvati; un documento nuovo prende i dati collegati
  riempiValoriEd(!!e.documento && !e.riempito);
  e.riempito = true;
  if (!e.titolo && !e.prova) e.titolo = titoloPropostoEd();
}

function risolviDatoEd(dato){
  const v = _ed.volontario, t = _ed.tlc;
  if (dato.startsWith("volontari.")){
    if (!v) return null;
    switch (dato){
      case "volontari.nome_completo": return `${v.nome || ""} ${v.cognome || ""}`.trim();
      case "volontari.codice_fiscale": return v.codice_fiscale || "";
      case "volontari.data_nascita": return v.data_nascita ? formatDataIt(v.data_nascita) : "";
      case "volontari.luogo_nascita": return v.luogo_nascita ? v.luogo_nascita + (v.provincia_nascita ? ` (${v.provincia_nascita})` : "") : "";
      case "volontari.sezione": return v.sezione_ana || "";
      case "volontari.telefono": return v.telefono || "";
      case "volontari.email": return v.email || "";
    }
    return null;
  }
  if (dato.startsWith("tlc.")){
    if (!t) return null;
    switch (dato){
      case "tlc.codice_ana": return t.codice_ana || "";
      case "tlc.descrizione": return t.descrizione || "";
      case "tlc.matricola": return t.matricola || "";
      case "tlc.marca_modello": return [t.marca, t.modello].filter(Boolean).join(" ");
      case "tlc.categoria": return [t.categoria, t.sottocategoria_radio].filter(Boolean).join(" – ");
    }
    return null;
  }
  if (dato === "sistema.oggi") return oggiItPdf();
  if (dato === "sistema.utente") return state.profile.nome || state.user.email;
  return null;
}

function riempiValoriEd(soloVuoti){
  const e = _ed;
  e.campi.forEach(c => {
    if (c.dato === "esterno"){ delete e.valori[c.id]; return; }
    if (c.dato === "sistema.firma_utente"){ e.valori[c.id] = e.firmaUtente || ""; return; }
    if (c.dato === "manuale" || !c.dato){ if (!(c.id in e.valori)) e.valori[c.id] = c.tipo === "check" ? false : ""; return; }
    if (soloVuoti && e.valori[c.id]) return;
    const v = risolviDatoEd(c.dato);
    if (v != null) e.valori[c.id] = v;
    else if (!(c.id in e.valori)) e.valori[c.id] = "";
  });
}

function titoloPropostoEd(){
  const e = _ed;
  const v = e.volontario;
  return [e.modello ? e.modello.nome : (e.documento?.titolo || "Documento"), v ? `${v.cognome || ""} ${v.nome || ""}`.trim() : null, oggiItPdf()].filter(Boolean).join(" – ");
}

// Scrive i valori sul PDF del modello. I campi "esterno" restano vuoti (li firma la Edge Function).
// Ritorna { bytes, firme: id dei campi firma apposti }
async function generaBytesPdfEd(){
  const e = _ed;
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.load(e.pdfBytes.slice(), { ignoreEncryption:true });
  try { const form = doc.getForm(); if (form.getFields().length) form.flatten(); } catch(err){ /* nessun modulo AcroForm */ }
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const pagine = doc.getPages();
  const firme = await disegnaValoriCampiPdf(doc, pagine, e.campi, e.valori, font);
  const ora = new Date();
  pagine[pagine.length - 1].drawText(
    testoSicuroPdf(`Compilato e firmato elettronicamente il ${oggiItPdf()} alle ${oraItPdf(ora)} – Polo Logistico 1 RGPT/CAP Vercelli`),
    { x: 28, y: 14, size: 6.5, font, color: rgb(.45, .5, .58) });
  doc.setProducer("Polo Logistico 1 RGPT/CAP Vercelli – Editor PDF");
  doc.setModificationDate(ora);
  return { bytes: await doc.save(), firme };
}

// Scrive i valori dei campi sulle pagine (i campi "esterno" restano vuoti). Ritorna gli id dei campi firma apposti.
async function disegnaValoriCampiPdf(doc, pagine, campi, valori, font){
  const { rgb } = PDFLib;
  const inchiostro = rgb(.05, .1, .25);
  const firme = [];
  for (const c of campi){
    const p = pagine[c.pagina - 1];
    if (!p || c.dato === "esterno") continue;
    const H = p.getHeight();
    const v = valori[c.id];
    if (!v) continue;
    if (c.tipo === "text" || c.tipo === "date"){
      const s = testoSicuroPdf(v);
      let size = c.dimensione_testo || 10;
      while (size > 6 && font.widthOfTextAtSize(s, size) > c.larghezza - 4) size -= 0.5;
      p.drawText(s, { x: c.x + 2, y: H - c.y - c.altezza / 2 - size * 0.35, size, font, color: inchiostro });
    } else if (c.tipo === "check"){
      const m = Math.max(1.5, c.larghezza * 0.18);
      p.drawLine({ start:{ x: c.x + m, y: H - c.y - m }, end:{ x: c.x + c.larghezza - m, y: H - c.y - c.altezza + m }, thickness:1.4, color: inchiostro });
      p.drawLine({ start:{ x: c.x + m, y: H - c.y - c.altezza + m }, end:{ x: c.x + c.larghezza - m, y: H - c.y - m }, thickness:1.4, color: inchiostro });
    } else if (c.tipo === "sign"){
      const img = await doc.embedPng(v);
      const s = Math.min(c.larghezza / img.width, c.altezza / img.height);
      const w = img.width * s, h = img.height * s;
      p.drawImage(img, { x: c.x + (c.larghezza - w) / 2, y: H - c.y - c.altezza + (c.altezza - h) / 2, width: w, height: h });
      firme.push(c.id);
    }
  }
  return firme;
}

function evidenziaMancantiEd(){
  const e = _ed;
  const mancanti = e.campi.filter(c => c.obbligatorio && c.dato !== "esterno" && !campoProntoEd(c));
  document.querySelectorAll(".pe-cf").forEach(el => el.classList.toggle("manca", mancanti.some(c => c.id === el.dataset.id)));
  if (mancanti.length){
    const el = document.querySelector(`.pe-cf[data-id="${mancanti[0].id}"]`);
    if (el) el.scrollIntoView({ block:"center", behavior:"smooth" });
  }
  return mancanti;
}

async function scaricaProvaPdf(){
  const mancanti = evidenziaMancantiEd();
  if (mancanti.length && !confirm(`Mancano ${mancanti.length} campi obbligatori (segnati in rosso). Scaricare comunque la prova?`)) return;
  try {
    const { bytes } = await generaBytesPdfEd();
    const url = URL.createObjectURL(new Blob([bytes], { type:"application/pdf" }));
    const a = document.createElement("a");
    a.href = url; a.download = pulisciNomeFile(_ed.nomeModello || "modello") + "_prova.pdf";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch(err){
    alert("Non sono riuscito a generare il PDF (il file di base potrebbe essere protetto): " + err.message);
  }
}

async function salvaDocumentoPdf(comeBozza){
  const e = _ed;
  if (!e || e.prova) return;
  const titolo = (e.titolo || "").trim();
  if (!titolo){ alert("Indica il titolo del documento."); document.getElementById("pe-titolo")?.focus(); return; }
  if (!comeBozza){
    const mancanti = evidenziaMancantiEd();
    if (mancanti.length){
      alert(mancanti.length === 1 ? `Manca un campo obbligatorio: ${mancanti[0].nome}` : `Mancano ${mancanti.length} campi obbligatori, segnati in rosso.`);
      return;
    }
  }
  const bottoni = [document.getElementById("pe-btn-genera"), document.getElementById("pe-btn-bozza")];
  bottoni.forEach(b => { if (b) b.disabled = true; });
  const riabilita = () => bottoni.forEach(b => { if (b) b.disabled = false; });

  let gen, hash;
  try {
    gen = await generaBytesPdfEd();
    hash = await sha256HexPdf(gen.bytes);
  } catch(err){
    alert("Non sono riuscito a generare il PDF (il file di base potrebbe essere protetto): " + err.message);
    riabilita(); return;
  }
  // valori senza le immagini delle firme
  const valori = {};
  e.campi.forEach(c => { if (c.tipo !== "sign" && c.id in e.valori) valori[c.id] = e.valori[c.id]; });
  const riferimenti = {};
  if (e.volontario) riferimenti.volontario_id = e.volontario.id;
  if (e.tlc) riferimenti.tlc_id = e.tlc.id;
  const firme = gen.firme;
  const completo = campiFirmaObbligatoriPdf(e.campi).every(id => firme.includes(id));
  const stato = comeBozza ? "bozza" : (completo ? "firmato" : "in_firma");
  const adesso = new Date().toISOString();

  let docId = e.documento?.id || null;
  let versione;
  if (!docId){
    // nuovo documento: riga in bozza, poi il PDF v1, poi stato finale
    const { data, error } = await sb.from("pdf_documenti").insert({
      modello_id: e.modello.id, modello_versione: e.modello.versione, titolo: titolo.slice(0, 200), stato: "bozza",
      campi: e.campi, valori, riferimenti, firme_completate: firme, creato_da: state.user.id
    }).select("id").single();
    if (error){ alert("Errore: " + error.message); riabilita(); return; }
    docId = data.id;
    versione = 1;
    const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_PDF_DOCUMENTI)
      .upload(`${docId}/v1.pdf`, gen.bytes, { contentType:"application/pdf", upsert:false });
    if (upErr){ alert("Documento creato come bozza, ma il PDF non è stato caricato: " + upErr.message + "\nRiaprilo dall'elenco e salvalo di nuovo."); e.modificato = false; renderEditorPdf(); return; }
    const { error: updErr } = await sb.from("pdf_documenti").update({
      pdf_path: `${docId}/v1.pdf`, versione_pdf: 1, sha256: hash, stato, firmato_il: stato === "firmato" ? adesso : null
    }).eq("id", docId);
    if (updErr){ alert("Errore: " + updErr.message); e.modificato = false; renderEditorPdf(); return; }
  } else {
    // bozza esistente: nuova versione del PDF, mai sovrascrivere la precedente
    const prec = e.documento.versione_pdf || 0;
    versione = prec + 1;
    const path = `${docId}/v${versione}.pdf`;
    const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_PDF_DOCUMENTI)
      .upload(path, gen.bytes, { contentType:"application/pdf", upsert:false });
    if (upErr){ alert("Errore upload: " + upErr.message); riabilita(); return; }
    const { data, error } = await sb.from("pdf_documenti").update({
      titolo: titolo.slice(0, 200), valori, riferimenti, firme_completate: firme,
      pdf_path: path, versione_pdf: versione, sha256: hash, stato, firmato_il: stato === "firmato" ? adesso : null
    }).eq("id", docId).eq("versione_pdf", prec).eq("stato", "bozza").select("id").maybeSingle();
    if (error){ alert("Errore: " + error.message); riabilita(); return; }
    if (!data){ alert("La bozza è stata modificata da qualcun altro nel frattempo: riaprila dall'elenco."); e.modificato = false; renderEditorPdf(); return; }
  }

  const righe = [{ documento_id: docId, evento: e.documento ? "salvato" : "creato", sha256: hash, dettagli: { versione, stato } }];
  firme.forEach(cid => righe.push({ documento_id: docId, evento: "firma_interna", campo_id: cid, sha256: hash, dettagli: { versione, ...(e.firmeLibreria?.[cid] || {}) } }));
  if (stato === "firmato") righe.push({ documento_id: docId, evento: "completato", sha256: hash, dettagli: { versione } });
  const errAudit = await registraAuditPdf(righe);
  if (errAudit) alert("Documento salvato, ma il registro non è stato aggiornato: " + errAudit.message);

  e.modificato = false;
  _pdfEdTab = "documenti";
  await renderEditorPdf();
  apriDettaglioDocumentoPdf(docId);
}

function campiPulitiPdf(campi){
  return campi.map(c => {
    const o = { id: c.id, nome: c.nome.trim(), tipo: c.tipo, pagina: c.pagina,
      x: arrotondaPdf(c.x), y: arrotondaPdf(c.y), larghezza: arrotondaPdf(c.larghezza), altezza: arrotondaPdf(c.altezza),
      dato: c.dato, obbligatorio: !!c.obbligatorio };
    if (c.tipo === "text" || c.tipo === "date") o.dimensione_testo = c.dimensione_testo || 10;
    return o;
  });
}

async function salvaModelloPdf(){
  const e = _ed;
  const nome = (e.nomeModello || "").trim();
  if (!nome){ alert("Indica il nome del modello."); return; }
  const senzaNome = e.campi.find(c => !(c.nome || "").trim());
  if (senzaNome){ alert("Ogni campo deve avere un nome."); selezionaCampoEd(senzaNome.id); return; }
  const btn = document.getElementById("pe-ed-salva-modello");
  btn.disabled = true;
  const campi = campiPulitiPdf(e.campi);
  const pagine = e.pagine.map(p => ({ larghezza: arrotondaPdf(p.w), altezza: arrotondaPdf(p.h) }));
  const { data, error } = await sb.from("pdf_modelli").update({
    nome: nome.slice(0, 150), descrizione: (e.descrModello || "").trim() || null, campi, pagine, versione: e.modello.versione + 1
  }).eq("id", e.modello.id).eq("versione", e.modello.versione).select("*").maybeSingle();
  btn.disabled = false;
  if (error){ alert("Errore: " + error.message); return; }
  if (!data){ alert("Il modello è stato modificato da qualcun altro nel frattempo: esci e riaprilo."); return; }
  e.modello = data;
  e.modificato = false;
  renderSxEd();
  alert(`Modello salvato (versione ${data.versione}).`);
}

/* ---------- SCHEDA LIBRERIA (firme, sigle, timbri, loghi) ----------
   pdf_libreria: { id, nome, tipo: firma|sigla|timbro|logo, path, larghezza_px, altezza_px, condivisa, attiva,
   creato_da, creato_il }, PNG in pdf-libreria/{uid}/{uuid}.png. Firme e sigle sono personali; timbri e loghi
   si possono condividere (solo completo). Niente si cancella: si rimuove con attiva = false.
   Quando un elemento finisce in un documento il PNG viene copiato nella cartella del documento
   (inserisciImmagineEd) o dentro il PDF generato (campi firma): il documento non dipende dalla libreria.
   La firma personale di Impostazioni (firme-personali) compare in cima in sola lettura, mai duplicata. */
const STORAGE_BUCKET_PDF_LIBRERIA = "pdf-libreria";
const TIPI_LIBRERIA_PDF = { firma:"Firma", sigla:"Sigla", timbro:"Timbro", logo:"Logo" };
const TIPI_CONDIVISIBILI_PDF = ["timbro", "logo"];
const MAX_MB_LIBRERIA_PDF = 5;
const MAX_PX_LIBRERIA_PDF = 1200;
const COLONNE_LIBRERIA_PDF = "id, nome, tipo, path, larghezza_px, altezza_px, condivisa, creato_da, creato_il";

async function caricaLibreriaPdf(){
  const { data, error } = await sb.from("pdf_libreria").select(COLONNE_LIBRERIA_PDF)
    .eq("attiva", true).order("creato_il", { ascending:false });
  if (error) return { error };
  const ordine = v => Object.keys(TIPI_LIBRERIA_PDF).indexOf(v.tipo);
  const righe = (data || []).slice().sort((a, b) => ordine(a) - ordine(b));
  const uid = state.user.id;
  return { mie: righe.filter(v => v.creato_da === uid), condivise: righe.filter(v => v.creato_da !== uid && v.condivisa), error: null };
}

function vocePersonaleLibreriaPdf(){

async function urlAnteprimeLibreriaPdf(voci){

  const pers = voci.find(v => v.personale);
  if (pers) urls.__personale = await urlFirmato(STORAGE_BUCKET_FIRME_PERSONALI, pers.path);
  return urls;
}
function urlVoceLibreriaPdf(urls, v){ return v.personale ? urls.__personale : urls[v.path]; }

// opz.scegli: card cliccabile (selettore); opz.azioni: Rinomina / Rimuovi
function htmlCardLibreriaPdf(v, url, opz = {}){
