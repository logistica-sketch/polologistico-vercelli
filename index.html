async function apriModalNuovaMovimentazioneTlc(){
  if (livelloPermesso("tlc") !== "completo"){ alert("Il tuo livello di accesso TLC non permette questa operazione."); return; }
  const { data: apparatiLiberi, error: errApp } = await caricaTutteLeRighe(() => sb
    .from("tlc_apparati")
    .select("*")
    .order("codice_ana"));
  if (errApp){ alert("Errore: " + errApp.message); return; }

  // Escludi apparati attualmente "in_uso" in una movimentazione non rientrata
  const { data: inUso, error: errInUso } = await sb
    .from("movimentazioni_tlc_apparati")
    .select("apparato_id, movimentazioni_tlc!inner(stato)")
    .eq("movimentazioni_tlc.stato", "in_uso");
  if (errInUso){ alert("Errore: " + errInUso.message); return; }
  const idInUso = new Set((inUso||[]).map(r => r.apparato_id));
  const disponibili = apparatiLiberi.filter(a => !idInUso.has(a.id));

  const haFirmaPersonale = !!state.profile.firma_personale_path;
  const selezionati = new Set(); // id apparati scelti, persiste tra ricerca/filtro

  chiudiModal();
  const overlay = document.createElement("div");
  overlay.id = "modal-overlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <h3>Nuova movimentazione TLC</h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      <div class="modal-body">
        <form id="form-movimentazione-tlc">
          <div class="form-grid">
            <div class="form-field"><label>Consegnato da</label><input value="${escapeHtml(state.profile.nome)}" disabled></div>
            <div class="form-field"><label>Data uscita</label><input type="date" name="data_uscita" value="${new Date().toISOString().slice(0,10)}" required></div>
            <div class="form-field"><label>Nome e cognome ricevente *</label><input name="operatore" required></div>
            <div class="form-field">
              <label>Sezione ANA del ricevente *</label>
              <select name="sezione_ana" required>
                <option value="">— Seleziona —</option>
                ${SEZIONI_ANA.map(s => `<option value="${s}">${s}</option>`).join("")}
              </select>
            </div>
            <div class="form-field full"><label>Motivo</label><input name="motivo"></div>
            <div class="form-field full">
              <label>Apparati da assegnare * <span id="contatore-apparati-selezionati" style="font-weight:600;color:var(--blu-500);">(0 selezionati)</span></label>
              <div class="toolbar" style="margin:6px 0;">
                <input type="search" id="mov-search-apparati" placeholder="Cerca per codice, selettiva, marca, modello…" style="flex:2;">
                <select id="mov-filtro-categoria-apparati" style="flex:1;">
                  <option value="">Tutte le categorie</option>
                  ${_tlcCategorie.map(c => `<option value="${c}">${c}</option>`).join("")}
                </select>
              </div>
              <div id="mov-lista-apparati" style="max-height:280px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--grigio-400);border-radius:8px;padding:8px;width:100%;box-sizing:border-box;"></div>
            </div>
            <div class="form-field full"><label>Note</label><textarea name="note"></textarea></div>

            <div class="form-field full" style="background:var(--grigio-100);border-radius:8px;padding:12px;margin-top:6px;">
              <p style="font-size:12px;color:var(--grigio-800);margin:0 0 10px;">${escapeHtml(TESTO_RESPONSABILITA_TLC)}</p>

              <label>Tipo firma del ricevente</label>
              <div class="radio-group">
                <label><input type="radio" name="tipo_firma" value="autografa" checked> Autografa (stampa e scansione)</label>
                <label><input type="radio" name="tipo_firma" value="digitale"> Digitale (mouse/touch)</label>
              </div>
            </div>
            <div class="form-field full" id="zona-firma-digitale" style="display:none;">
              <label>Firma del ricevente</label>
              <div id="canvas-firma-consegna"></div>
            </div>
            <div class="form-field full">
              <label>Firma di consegna (tua firma personale)</label>
              ${haFirmaPersonale
                ? `<p style="font-size:12px;color:var(--verde);margin:4px 0;">✓ Verrà usata automaticamente la tua firma personale salvata in Impostazioni.</p>`
                : `<p style="font-size:12px;color:var(--rosso);margin:4px 0;">Non hai ancora una firma personale salvata. Vai in Impostazioni → "La mia firma personale" prima di continuare, oppure salva con firma autografa e firma a mano sul foglio stampato.</p>`}
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-cancel" id="btn-cancel-mov-tlc">Annulla</button>
            <button type="submit" class="btn-save">Salva e genera bolla</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  document.getElementById("btn-cancel-mov-tlc").addEventListener("click", chiudiModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) chiudiModal(); });

  function aggiornaContatoreApparati(){
    const el = document.getElementById("contatore-apparati-selezionati");
    if (el) el.textContent = `(${selezionati.size} selezionati)`;
  }

  let gruppiApertiMov = new Set(); // categorie aperte, persiste tra re-render

  function renderListaApparatiMov(){
    const q = (document.getElementById("mov-search-apparati").value || "").toLowerCase();
    const cat = document.getElementById("mov-filtro-categoria-apparati").value;

    const filtrati = disponibili.filter(a => {
      if (cat && a.categoria !== cat) return false;
      if (q){
        const campi = [a.codice_ana, a.selettiva, a.marca, a.modello, a.matricola];
        if (!campi.some(c => (c||"").toLowerCase().includes(q))) return false;
      }
      return true;
    });

    const wrap = document.getElementById("mov-lista-apparati");
    if (disponibili.length === 0){
      wrap.innerHTML = `<p style="font-size:12.5px;color:var(--grigio-600);margin:4px;">Nessun apparato disponibile, tutti in uso.</p>`;
      return;
    }
    if (filtrati.length === 0){
      wrap.innerHTML = `<p style="font-size:12.5px;color:var(--grigio-600);margin:4px;">Nessun apparato corrisponde alla ricerca.</p>`;
      return;
    }

    // Raggruppo per categoria
    const gruppi = {};
    filtrati.forEach(a => {
      const k = a.categoria || "Senza categoria";
      if (!gruppi[k]) gruppi[k] = [];
      gruppi[k].push(a);
    });

    // Se c'è una ricerca attiva, apro automaticamente i gruppi che contengono risultati
    if (q){
      Object.keys(gruppi).forEach(k => gruppiApertiMov.add(k));
    }
    // Se c'è un filtro categoria singolo, apro sempre quel gruppo
    if (cat) gruppiApertiMov.add(cat);

    wrap.innerHTML = Object.keys(gruppi).sort().map(catKey => {
      const apparatiGruppo = gruppi[catKey];
      const selezionatiNelGruppo = apparatiGruppo.filter(a => selezionati.has(a.id)).length;
      const aperto = gruppiApertiMov.has(catKey);
      return `
        <div class="mov-gruppo-cat" style="border-bottom:1px solid var(--grigio-200);">
          <button type="button" class="mov-gruppo-toggle" data-gruppo="${escapeHtml(catKey)}" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:8px 4px;cursor:pointer;text-align:left;">
            <span style="font-size:12px;font-weight:700;color:var(--blu-900);text-transform:uppercase;letter-spacing:.3px;">
              ${escapeHtml(catKey)} <span style="color:var(--grigio-600);font-weight:500;">(${apparatiGruppo.length})</span>
              ${selezionatiNelGruppo > 0 ? `<span class="collapse-badge" style="display:inline-block;margin-left:6px;">${selezionatiNelGruppo}</span>` : ""}
            </span>
            <span style="color:var(--grigio-600);">${aperto ? "▴" : "▾"}</span>
          </button>
          <div class="mov-gruppo-body" style="display:${aperto?"block":"none"};padding-bottom:6px;">
            <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
              <colgroup><col style="width:30px;"><col style="width:85px;"><col></colgroup>
              <tbody>
                ${apparatiGruppo.map(a => `
                  <tr class="riga-apparato-mov" data-apparato-id="${a.id}" style="cursor:pointer;${selezionati.has(a.id)?"background:var(--grigio-100);":""}">
                    <td style="padding:6px 4px;vertical-align:middle;"><input type="checkbox" data-apparato-id="${a.id}" ${selezionati.has(a.id)?"checked":""}></td>
                    <td style="padding:6px 4px;vertical-align:middle;font-family:monospace;font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(a.codice_ana)}</td>
                    <td style="padding:6px 4px;vertical-align:middle;font-size:12.5px;color:var(--grigio-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(a.marca||"")} ${escapeHtml(a.modello||"")}${a.selettiva ? ` · ${escapeHtml(a.selettiva)}` : ""}${a.sottocategoria_radio ? ` · ${a.sottocategoria_radio}` : ""}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }).join("");

    wrap.querySelectorAll(".mov-gruppo-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const g = btn.dataset.gruppo;
        if (gruppiApertiMov.has(g)) gruppiApertiMov.delete(g); else gruppiApertiMov.add(g);
        renderListaApparatiMov();
      });
    });

    wrap.querySelectorAll('input[type="checkbox"][data-apparato-id]').forEach(chk => {
      chk.addEventListener("change", (e) => {
        const id = parseInt(e.target.dataset.apparatoId);
        if (e.target.checked) selezionati.add(id); else selezionati.delete(id);
        aggiornaContatoreApparati();
        renderListaApparatiMov(); // aggiorna badge contatore per gruppo e sfondo riga selezionata
      });
    });

    wrap.querySelectorAll('tr.riga-apparato-mov').forEach(tr => {
      tr.addEventListener("click", (e) => {
        if (e.target.tagName === "INPUT") return; // il checkbox gestisce già il suo click
        const chk = tr.querySelector('input[type="checkbox"]');
        chk.checked = !chk.checked;
        chk.dispatchEvent(new Event("change"));
      });
    });
  }

  document.getElementById("mov-search-apparati").addEventListener("input", renderListaApparatiMov);
  document.getElementById("mov-filtro-categoria-apparati").addEventListener("change", renderListaApparatiMov);
  renderListaApparatiMov();

  let firmaConsegna = null;
  overlay.querySelectorAll('input[name="tipo_firma"]').forEach(radio => {
    radio.addEventListener("change", (e) => {
      const zona = document.getElementById("zona-firma-digitale");
      if (e.target.value === "digitale"){
        zona.style.display = "block";
        firmaConsegna = creaCanvasFirma(document.getElementById("canvas-firma-consegna"));
      } else {
        zona.style.display = "none";
        firmaConsegna = null;
      }
    });
  });

  document.getElementById("form-movimentazione-tlc").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const apparatiSelezionati = Array.from(selezionati);
    const tipoFirma = fd.get("tipo_firma");

    if (apparatiSelezionati.length === 0){ alert("Seleziona almeno un apparato."); return; }
    if (tipoFirma === "digitale" && (!firmaConsegna || firmaConsegna.isEmpty())){
      alert("Firma del ricevente mancante. Firma nel riquadro prima di salvare.");
      return;
    }
    if (!haFirmaPersonale){
      alert("Devi avere una firma personale salvata (Impostazioni → La mia firma personale) per registrare una consegna.");
      return;
    }

    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    let firmaAppPng = null;
    try{
      firmaAppPng = await scaricaComeDataUrl(STORAGE_BUCKET_FIRME_PERSONALI, state.profile.firma_personale_path);
    }catch(err){ console.warn(err.message); firmaAppPng = null; }

    const payload = {
      data_uscita: fd.get("data_uscita"),
      operatore: fd.get("operatore").trim(),
      sezione_ana: fd.get("sezione_ana"),
      motivo: fd.get("motivo") || null,
      note: fd.get("note") || null,
      tipo_firma: tipoFirma,
      consegnato_da: state.user.id,
      consegnato_da_nome: state.profile.nome,
      firma_ricezione_png: tipoFirma === "digitale" ? firmaConsegna.toPng() : null,
      firma_consegna_app_png: firmaAppPng,
      created_by: state.user.id
    };

    const { data: mov, error } = await sb.from("movimentazioni_tlc").insert(payload).select().single();
    if (error){ alert("Errore: " + error.message); btn.disabled=false; btn.textContent="Salva e genera bolla"; return; }

    const righe = apparatiSelezionati.map(id => ({ movimentazione_id: mov.id, apparato_id: id }));
    const { error: errRighe } = await sb.from("movimentazioni_tlc_apparati").insert(righe);
    if (errRighe){
      const { error: errAnnulla } = await sb.from("movimentazioni_tlc").delete().eq("id", mov.id);
      alert("Errore: " + errRighe.message +
        (errAnnulla ? `\n\nInoltre non è stato possibile annullare la movimentazione #${mov.id}: ${errAnnulla.message}` : ""));
      btn.disabled=false; btn.textContent="Salva e genera bolla";
      return;
    }

    const apparatiDettaglio = disponibili.filter(a => apparatiSelezionati.includes(a.id));
    try{
      await generaEArchiviaBollaTlc(mov, apparatiDettaglio);
    }catch(err){
      alert("Movimentazione salvata, ma la generazione della bolla PDF è fallita: " + err.message + "\n\nPuoi ricaricare la bolla firmata manualmente dall'elenco movimentazioni.");
    }

    chiudiModal();
    renderMovimentazioniTlc();
  });
}

async function registraRientroTlc(movId){
  if (livelloPermesso("tlc") !== "completo"){ alert("Il tuo livello di accesso TLC non permette questa operazione."); return; }
  const { data: mov, error: errMov } = await sb.from("movimentazioni_tlc").select("*").eq("id", movId).single();
  if (errMov){ alert("Errore: " + errMov.message); return; }

  if (mov.tipo_firma === "digitale"){
    apriModalFirmaRientro(mov);
    return;
  }

  if (!state.profile.firma_personale_path){
    alert("Devi avere una firma personale salvata (Impostazioni → La mia firma personale) per riprendere in carico il materiale.");
    return;
  }

  // autografa: chiede solo la data, la scansione del ricevente si carica dopo con "Carica firmata".
  // La firma app (chi riprende in carico) è invece sempre quella personale automatica.
  const dataRientro = prompt("Data di rientro (GG/MM/AAAA):", new Date().toLocaleDateString("it-IT"));
  if (!dataRientro) return;
  const iso = parseDataItInput(dataRientro);
  if (!iso){ alert("Formato data non valido."); return; }
  if (iso < mov.data_uscita){
    alert("La data di rientro non può essere precedente alla data di uscita.");
    return;
  }

  let firmaAppPng = null;
  try{
    firmaAppPng = await scaricaComeDataUrl(STORAGE_BUCKET_FIRME_PERSONALI, state.profile.firma_personale_path);
  }catch(err){ console.warn(err.message); firmaAppPng = null; }

  const { error } = await sb.from("movimentazioni_tlc").update({
    data_rientro: iso,
    stato: "rientrato",
    ripreso_da: state.user.id,
    ripreso_da_nome: state.profile.nome,
    firma_ripresa_app_png: firmaAppPng
  }).eq("id", movId);
  if (error){ alert("Errore: " + error.message); return; }
  renderMovimentazioniTlc();
}

function parseDataItInput(s){
  const parts = s.split("/");
  if (parts.length !== 3) return null;
  return `${parts[2]}-${parts[1].padStart(2,"0")}-${parts[0].padStart(2,"0")}`;
}

async function apriModalFirmaRientro(mov){
  const { data: righe, error: errRighe } = await sb
    .from("movimentazioni_tlc_apparati")
    .select("apparato_id, tlc_apparati(*)")
    .eq("movimentazione_id", mov.id);
  if (errRighe){ alert("Errore: " + errRighe.message); return; }
  const apparati = (righe||[]).map(r => r.tlc_apparati).filter(Boolean);
  const haFirmaPersonale = !!state.profile.firma_personale_path;

  chiudiModal();
  const overlay = document.createElement("div");
  overlay.id = "modal-overlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <h3>Rientro movimentazione #${mov.id}</h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      <div class="modal-body">
        <form id="form-rientro-tlc">
          <div class="form-grid">
            <div class="form-field"><label>Data rientro</label><input type="date" name="data_rientro" value="${new Date().toISOString().slice(0,10)}" required></div>
            <div class="form-field"><label>Ripreso in carico da</label><input value="${escapeHtml(state.profile.nome)}" disabled></div>

            <div class="form-field full" style="background:var(--grigio-100);border-radius:8px;padding:12px;">
              <p style="font-size:12px;color:var(--grigio-800);margin:0;">${escapeHtml(TESTO_RESPONSABILITA_TLC)}</p>
            </div>

            <div class="form-field full">
              <label>Firma di restituzione (${escapeHtml(mov.operatore)})</label>
              <div id="canvas-firma-rientro"></div>
            </div>
            <div class="form-field full">
              <label>Firma di ripresa in carico (tua firma personale)</label>
              ${haFirmaPersonale
                ? `<p style="font-size:12px;color:var(--verde);margin:4px 0;">✓ Verrà usata automaticamente la tua firma personale salvata in Impostazioni.</p>`
                : `<p style="font-size:12px;color:var(--rosso);margin:4px 0;">Non hai una firma personale salvata. Vai in Impostazioni → "La mia firma personale" prima di continuare.</p>`}
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-cancel" id="btn-cancel-rientro">Annulla</button>
            <button type="submit" class="btn-save">Registra rientro</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  document.getElementById("btn-cancel-rientro").addEventListener("click", chiudiModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) chiudiModal(); });

  const firmaRientro = creaCanvasFirma(document.getElementById("canvas-firma-rientro"));

  document.getElementById("form-rientro-tlc").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (firmaRientro.isEmpty()){ alert("Firma di restituzione mancante."); return; }
    if (!haFirmaPersonale){ alert("Devi avere una firma personale salvata per riprendere in carico il materiale."); return; }
    const fd = new FormData(e.target);

    const dataRientroForm = fd.get("data_rientro");
    if (dataRientroForm < mov.data_uscita){
      alert("La data di rientro non può essere precedente alla data di uscita.");
      return;
    }

    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    let firmaAppPng = null;
    try{
      firmaAppPng = await scaricaComeDataUrl(STORAGE_BUCKET_FIRME_PERSONALI, state.profile.firma_personale_path);
    }catch(err){ console.warn(err.message); firmaAppPng = null; }

    const aggiornato = {
      data_rientro: fd.get("data_rientro"),
      stato: "rientrato",
      firma_restituzione_png: firmaRientro.toPng(),
      ripreso_da: state.user.id,
      ripreso_da_nome: state.profile.nome,
      firma_ripresa_app_png: firmaAppPng
    };
    const { data: movAggiornato, error } = await sb.from("movimentazioni_tlc").update(aggiornato).eq("id", mov.id).select().single();
    if (error){ alert("Errore: " + error.message); btn.disabled=false; btn.textContent="Registra rientro"; return; }

    try{
      await generaEArchiviaBollaTlc(movAggiornato, apparati, { scarica: true });
    }catch(err){
      alert("Rientro registrato, ma la generazione della bolla PDF è fallita: " + err.message + "\n\nPuoi ricaricare la bolla firmata manualmente dall'elenco movimentazioni.");
    }

    chiudiModal();
    renderMovimentazioniTlc();
  });
}

async function generaEArchiviaBollaTlc(mov, apparati, opzioni){
  opzioni = opzioni || {};
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  // Loghi: ANA a sinistra, Volontariato a destra (entrambi quadrati)
  try{ doc.addImage(LOGO_ANA_V2_BASE64, "PNG", 14, 8, 24, 24); }catch(e){}
  try{ doc.addImage(LOGO_VOLONTARIATO_V2_BASE64, "PNG", 172, 8, 24, 24); }catch(e){}

  doc.setFontSize(11);
  doc.setFont(undefined, "bold");
  doc.setTextColor(46, 125, 50); // verde, coerente con i loghi
  doc.text("ASSOCIAZIONE NAZIONALE ALPINI", 105, 13, { align:"center" });
  doc.text("PROTEZIONE CIVILE 1 RAGGRUPPAMENTO", 105, 19, { align:"center" });
  doc.setTextColor(0, 0, 0);
  doc.setFont(undefined, "normal");
  doc.setFontSize(9.5);
  doc.text("Piemonte - Liguria - Valle D'Aosta", 105, 25, { align:"center" });
  doc.setFontSize(9);
  doc.setFont(undefined, "italic");
  doc.text("Specialità TLC", 105, 30, { align:"center" });
  doc.setFont(undefined, "normal");
  doc.line(14, 36, 196, 36);

  doc.setFontSize(12);
  doc.text("Bolla di movimentazione apparati TLC", 14, 44);
  doc.setFontSize(9);
  doc.text(`N. movimentazione: ${mov.id}`, 14, 50);

  let y = 61;
  const yStart = y;
  doc.setFontSize(10);

  // Colonna sinistra: dati di movimento (date, utenti app)
  let yL = yStart;
  doc.text(`Data uscita: ${formatDataIt(mov.data_uscita)}`, 14, yL); yL += 7;
  doc.text(`Consegnato da: ${mov.consegnato_da_nome || "—"}`, 14, yL); yL += 7;
  if (mov.data_rientro){
    doc.text(`Data rientro: ${formatDataIt(mov.data_rientro)}`, 14, yL); yL += 7;
    doc.text(`Ripreso in carico da: ${mov.ripreso_da_nome || "—"}`, 14, yL); yL += 7;
  }

  // Colonna destra: dati del ricevente
  let yR = yStart;
  doc.text(`Ricevente: ${mov.operatore}`, 110, yR); yR += 7;
  doc.text(`Sezione ANA: ${mov.sezione_ana}`, 110, yR); yR += 7;
  if (mov.motivo){ doc.text(`Motivo: ${mov.motivo}`, 110, yR); yR += 7; }

  y = Math.max(yL, yR) + 4;

  doc.setFont(undefined, "bold");
  doc.text("Apparati assegnati", 14, y); y += 6;
  doc.setFont(undefined, "normal");
  doc.text("Selettiva", 14, y);
  doc.text("Marca/Modello", 60, y);
  doc.text("Categoria", 130, y);
  doc.text("Matricola", 165, y);
  y += 4;
  doc.line(14, y, 196, y);
  y += 6;

  apparati.forEach(a => {
    doc.text(a.selettiva || "—", 14, y);
    doc.text(`${a.marca||""} ${a.modello||""}`.trim().slice(0,30), 60, y);
    doc.text(a.categoria||"—", 130, y);
    doc.text(a.matricola||"—", 165, y);
    y += 7;
  });

  // Blocco firme ancorato in fondo alla pagina, con testo responsabilità appena sopra
  const PAGE_HEIGHT = 297; // A4 in mm
  let yFirme = PAGE_HEIGHT - (mov.stato === "rientrato" ? 62 : 38);

  doc.setFontSize(8.5);
  const testoResp = doc.splitTextToSize(TESTO_RESPONSABILITA_TLC, 182);
  const altezzaTesto = testoResp.length * 4;
  doc.text(testoResp, 14, yFirme - altezzaTesto - 6);

  doc.setFontSize(10);
  doc.setFont(undefined, "bold");
  doc.text("Firma di consegna", 14, yFirme);
  doc.text("Firma di ricezione", 110, yFirme);
  yFirme += 4;

  if (mov.firma_consegna_app_png){
    try{ doc.addImage(mov.firma_consegna_app_png, "PNG", 14, yFirme, 70, 14); }catch(e){}
  }
  if (mov.firma_ricezione_png){
    try{ doc.addImage(mov.firma_ricezione_png, "PNG", 110, yFirme, 70, 14); }catch(e){}
  }
  yFirme += 16;
  doc.line(14, yFirme, 90, yFirme);
  doc.line(110, yFirme, 186, yFirme);
  yFirme += 5;
  doc.setFontSize(8);
  doc.setFont(undefined, "normal");
  doc.text(mov.consegnato_da_nome || "", 14, yFirme);
  doc.text(mov.operatore || "", 110, yFirme);
  yFirme += 8;

  // Riga 2: restituzione (ricevente) / ripresa in carico (utente app) — solo se rientrato
  if (mov.stato === "rientrato"){
    doc.setFontSize(10);
    doc.setFont(undefined, "bold");
    doc.text("Firma di restituzione", 14, yFirme);
    doc.text("Firma di ripresa in carico", 110, yFirme);
    yFirme += 4;

    if (mov.firma_restituzione_png){
      try{ doc.addImage(mov.firma_restituzione_png, "PNG", 14, yFirme, 70, 14); }catch(e){}
    }
    if (mov.firma_ripresa_app_png){
      try{ doc.addImage(mov.firma_ripresa_app_png, "PNG", 110, yFirme, 70, 14); }catch(e){}
    }
    yFirme += 16;
    doc.line(14, yFirme, 90, yFirme);
    doc.line(110, yFirme, 186, yFirme);
    yFirme += 5;
    doc.setFontSize(8);
    doc.setFont(undefined, "normal");
    doc.text(mov.operatore || "", 14, yFirme);
    doc.text(mov.ripreso_da_nome || "", 110, yFirme);
  }

  const blob = doc.output("blob");
  const tipo = mov.stato === "rientrato" ? "rientro" : "uscita";
  const dataRif = (tipo === "rientro" && mov.data_rientro) ? mov.data_rientro : mov.data_uscita;
  const sezioneSlug = pulisciNomeFile(mov.sezione_ana);
  const path = `Bolla_TLC_${dataRif}_${tipo}_${sezioneSlug}_${mov.id}.pdf`;

  const vecchioPath = mov.bolla_path;
  let errArchivio = null;
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_BOLLE).upload(path, blob, { upsert: true, contentType: "application/pdf" });
  if (upErr){
    errArchivio = upErr;
  } else {
    const { error: errAgg } = await sb.from("movimentazioni_tlc").update({ bolla_path: path }).eq("id", mov.id);
    if (errAgg){
      errArchivio = errAgg;
    } else if (vecchioPath && vecchioPath !== path){
      const { error: rmErr } = await sb.storage.from(STORAGE_BUCKET_BOLLE).remove([vecchioPath]);
      if (rmErr) console.warn("Vecchia bolla non rimossa dallo storage:", vecchioPath, rmErr.message);
    }
  }

  if (opzioni.scarica !== false){
    doc.save(`bolla_movimentazione_${mov.id}_${tipo}.pdf`);
  }
  // Il PDF è comunque stato scaricato; segnaliamo al chiamante che l'archiviazione è fallita.
  if (errArchivio) throw new Error("archiviazione della bolla non riuscita: " + errArchivio.message);
}

async function caricaReportFormazione(){
  const body = document.getElementById("report-formazione-body");
  if (!body) return;

  const [{ data: volontari, error: errV }, { data: iscrizioni, error: errI }] = await Promise.all([
    caricaTutteLeRighe(() => sb.from("volontari_formazione").select("id, cognome, nome, sezione_ana")),
    caricaTutteLeRighe(() => sb.from("iscrizioni_corsi").select("stato, attestato_rilasciato, volontario_id, edizioni_corso(id, label, data_corso, stato, catalogo_corsi(codice, descrizione))"))
  ]);
  if (errV || errI){ body.innerHTML = `<p>Errore: ${escapeHtml((errV||errI).message)}</p>`; return; }

  const totVolontari = volontari.length;
  const sezioneDiVolontario = {};
  volontari.forEach(v => sezioneDiVolontario[v.id] = v.sezione_ana || "Non indicata");

  // Per sezione: n. volontari distinti coinvolti in formazione
  const perSezione = {};
  const volontariConIscrizioni = new Set();
  iscrizioni.forEach(r => volontariConIscrizioni.add(r.volontario_id));
  volontari.forEach(v => {
    if (!volontariConIscrizioni.has(v.id)) return;
    const sez = sezioneDiVolontario[v.id];
    perSezione[sez] = (perSezione[sez]||0) + 1;
  });

  // Per corso (edizione): totale iscritti, completati, in verifica, assenti, attestati
  // ("attestati" = iscrizioni con attestato_rilasciato = true)
  const perEdizione = {};
  iscrizioni.forEach(r => {
    const ed = r.edizioni_corso;
    if (!ed) return;
    const key = ed.id;
    if (!perEdizione[key]) perEdizione[key] = {
      label: ed.label, data: ed.data_corso, stato: ed.stato,
      codice: ed.catalogo_corsi?.codice || "—",
      iscritti:0, completati:0, in_verifica:0, assenti:0, attestati:0
    };
    perEdizione[key].iscritti++;
    if (r.attestato_rilasciato === true) perEdizione[key].attestati++;
    if (r.stato === "completato") perEdizione[key].completati++;
    else if (r.stato === "in_verifica" || r.stato === "iscritto") perEdizione[key].in_verifica++;
    else if (r.stato === "assente") perEdizione[key].assenti++;
  });
  const edizioniArr = Object.values(perEdizione).sort((a,b) => (b.data||"").localeCompare(a.data||""));

  // Per tipologia corso (codice catalogo): n. edizioni, n. attestati rilasciati totali
  const perTipologia = {};
  edizioniArr.forEach(e => {
    if (!perTipologia[e.codice]) perTipologia[e.codice] = { edizioni:0, attestati:0 };
    perTipologia[e.codice].edizioni++;
    perTipologia[e.codice].attestati += e.attestati;
  });

  const totIscrizioni = iscrizioni.length;
  const totCompletati = iscrizioni.filter(r => r.stato === "completato").length;
  const totInVerifica = iscrizioni.filter(r => r.stato === "in_verifica" || r.stato === "iscritto").length;
  const totAssenti = iscrizioni.filter(r => r.stato === "assente").length;
  const totAttestati = iscrizioni.filter(r => r.attestato_rilasciato === true).length;

  body.innerHTML = `
    <div class="report-stat-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;">
      <div class="report-stat-box"><div class="report-stat-num">${totVolontari}</div><div class="report-stat-lbl">Volontari censiti</div></div>
      <div class="report-stat-box"><div class="report-stat-num">${volontariConIscrizioni.size}</div><div class="report-stat-lbl">Volontari in formazione</div></div>
      <div class="report-stat-box"><div class="report-stat-num">${edizioniArr.length}</div><div class="report-stat-lbl">Edizioni corso</div></div>
      <div class="report-stat-box"><div class="report-stat-num">${totAttestati}</div><div class="report-stat-lbl">Attestati rilasciati</div></div>
    </div>

    <h4>Per sezione ANA (volontari in formazione)</h4>
    <table class="storico-table">
      <thead><tr><th>Sezione</th><th>Volontari</th></tr></thead>
      <tbody>
        ${Object.entries(perSezione).sort((a,b)=>b[1]-a[1]).map(([sez,n]) => `<tr><td>${escapeHtml(sez)}</td><td>${n}</td></tr>`).join("")}
      </tbody>
    </table>

    <h4 style="margin-top:18px;">Per tipologia corso</h4>
    <table class="storico-table">
      <thead><tr><th>Codice corso</th><th>Edizioni</th><th>Attestati rilasciati</th></tr></thead>
      <tbody>
        ${Object.entries(perTipologia).sort((a,b)=>b[1].attestati-a[1].attestati).map(([cod,d]) => `<tr><td>${escapeHtml(cod)}</td><td>${d.edizioni}</td><td>${d.attestati}</td></tr>`).join("")}
      </tbody>
    </table>

    <h4 style="margin-top:18px;">Per edizione corso</h4>
    <table class="storico-table">
      <thead><tr><th>Edizione</th><th>Codice</th><th>Data</th><th>Stato</th><th>Iscritti</th><th>Completati</th><th>In verifica</th><th>Assenti</th><th>Attestati</th></tr></thead>
      <tbody>
        ${edizioniArr.map(e => `
          <tr>
            <td>${escapeHtml(e.label)}</td>
            <td>${escapeHtml(e.codice)}</td>
            <td>${e.data ? formatDataIt(e.data) : "—"}</td>
            <td>${labelStatoCorso(e.stato)}</td>
            <td>${e.iscritti}</td>
            <td>${e.completati}</td>
            <td>${e.in_verifica}</td>
            <td>${e.assenti}</td>
            <td>${e.attestati}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>

    <div style="margin-top:18px;display:flex;gap:8px;">
      <button class="btn-add" id="btn-export-report-formazione" style="background:var(--blu-700);">📥 Esporta Excel</button>
    </div>
  `;

  document.getElementById("btn-export-report-formazione").addEventListener("click", () => {
    const wb = XLSX.utils.book_new();

    const wsRiepilogo = XLSX.utils.aoa_to_sheet([
      ["Report Formazione", new Date().toLocaleDateString("it-IT")],
      [],
      ["Volontari censiti", totVolontari],
      ["Volontari in formazione", volontariConIscrizioni.size],
      ["Edizioni corso", edizioniArr.length],
      ["Iscrizioni totali", totIscrizioni],
      ["Completati", totCompletati],
      ["Attestati rilasciati", totAttestati],
      ["In verifica", totInVerifica],
      ["Assenti", totAssenti],
    ]);
    XLSX.utils.book_append_sheet(wb, wsRiepilogo, "Riepilogo");

    const wsSezioni = XLSX.utils.json_to_sheet(
      Object.entries(perSezione).sort((a,b)=>b[1]-a[1]).map(([sez,n]) => ({ Sezione: sez, Volontari: n }))
    );
    XLSX.utils.book_append_sheet(wb, wsSezioni, "Per sezione");

    const wsTipologie = XLSX.utils.json_to_sheet(
      Object.entries(perTipologia).map(([cod,d]) => ({ "Codice corso": cod, Edizioni: d.edizioni, "Attestati rilasciati": d.attestati }))
    );
    XLSX.utils.book_append_sheet(wb, wsTipologie, "Per tipologia");

    const wsEdizioni = XLSX.utils.json_to_sheet(
      edizioniArr.map(e => ({
        Edizione: e.label, Codice: e.codice, Data: e.data ? formatDataIt(e.data) : "—", Stato: labelStatoCorso(e.stato),
        Iscritti: e.iscritti, Completati: e.completati, "In verifica": e.in_verifica, Assenti: e.assenti, Attestati: e.attestati
      }))
    );
    XLSX.utils.book_append_sheet(wb, wsEdizioni, "Per edizione");

    XLSX.writeFile(wb, `Report_Formazione_${new Date().toISOString().slice(0,10)}.xlsx`);
  });
}

async function caricaAttestatiMancanti(){
  const body = document.getElementById("attestati-mancanti-body");
  if (!body) return;
  body.innerHTML = `<div class="loading-spin">Verifica in corso…</div>`;

  const { data: datiGrezzi, error } = await caricaTutteLeRighe(() => sb
    .from("iscrizioni_corsi")
    .select("*, volontari_formazione(id, cognome, nome, sezione_ana), edizioni_corso!inner(label, data_corso, stato)")
    .eq("stato", "in_verifica")
    .eq("edizioni_corso.stato", "terminato"));

  if (error){ body.innerHTML = `<p>Errore: ${escapeHtml(error.message)}</p>`; return; }

  const data = (datiGrezzi||[]).sort((a,b) => {
    const ca = a.volontari_formazione.cognome.localeCompare(b.volontari_formazione.cognome);
    return ca !== 0 ? ca : a.volontari_formazione.nome.localeCompare(b.volontari_formazione.nome);
  });

  if (!data || data.length === 0){
    body.innerHTML = `<div class="empty-state"><div class="ic">✅</div>Nessun attestato mancante: tutti gli iscritti ai corsi terminati sono completati o segnati assenti.</div>`;
    return;
  }

  body.innerHTML = `
    <p style="font-size:13px;color:var(--grigio-600);margin-top:0;">${data.length} iscrizioni su corsi terminati ancora "In verifica" — manca l'attestato o il flag Assente.</p>
    <table class="storico-table">
      <thead><tr><th>Cognome Nome</th><th>Sezione</th><th>Corso</th><th>Data</th><th>Assente</th><th>Attestato</th><th></th></tr></thead>
      <tbody>
        ${data.map(r => `
          <tr>
            <td>${escapeHtml(r.volontari_formazione.cognome)} ${escapeHtml(r.volontari_formazione.nome)}</td>
            <td>${escapeHtml(r.volontari_formazione.sezione_ana||"—")}</td>
            <td>${escapeHtml(r.edizioni_corso.label)}</td>
            <td>${r.edizioni_corso.data_corso ? formatDataIt(r.edizioni_corso.data_corso) : "—"}</td>
            <td><input type="checkbox" data-toggle-assente-mancanti="${r.id}"></td>
            <td>
              <label class="btn-add-mini" style="cursor:pointer;padding:5px 10px;font-size:11.5px;">Carica
                <input type="file" accept=".pdf,image/*" style="display:none;" data-upload-attestato-mancanti="${r.id}" data-volontario="${r.volontari_formazione.id}" data-cognome="${escapeHtml(r.volontari_formazione.cognome)}" data-nome="${escapeHtml(r.volontari_formazione.nome)}">
              </label>
            </td>
            <td><a href="#" data-apri-volontario="${r.volontari_formazione.id}" style="color:var(--blu-500);font-weight:600;">Apri scheda</a></td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
  body.querySelectorAll("[data-apri-volontario]").forEach(a => a.addEventListener("click", (ev) => {
    ev.preventDefault();
    apriModalVolontario(parseInt(a.dataset.apriVolontario), "ricerca");
  }));
  body.querySelectorAll("[data-toggle-assente-mancanti]").forEach(chk => chk.addEventListener("change", async (ev) => {
    if (!ev.target.checked) return;
    const iscrizioneId = parseInt(ev.target.dataset.toggleAssenteMancanti);
    const { error } = await sb.from("iscrizioni_corsi").update({ stato: "assente" }).eq("id", iscrizioneId);
    if (error){ alert("Errore: " + error.message); ev.target.checked = false; return; }
    caricaAttestatiMancanti();
  }));
  body.querySelectorAll("[data-upload-attestato-mancanti]").forEach(input => input.addEventListener("change", (ev) => caricaAttestatoDaListaMancanti(ev)));
}

/* ---------- ATTESTATI: collegamento 1:1 con l'iscrizione ----------
   Regola: ogni documento con tipo = 'attestato' DEVE avere iscrizione_id,
   e ogni iscrizione ha al massimo un attestato. Tutti i caricamenti e le
   rimozioni di attestati passano da questi due helper. */

// Carica il file e lo collega all'iscrizione. Se l'iscrizione ha già un
// attestato: sostituisci = "chiedi" (confirm) | true | false.
// Aggiorna l'iscrizione: attestato_rilasciato = true, stato = 'completato',
// data_completamento = data_corso dell'edizione se vuota.
// Ritorna { ok:true } | { saltato:true } | { errore:"..." }.
async function salvaAttestatoIscrizione({ iscrizioneId, volontarioId, file, nomeFile, cognome, nome, note = null, contentType = null, sostituisci = "chiedi" }){
  const { data: isc, error: errIsc } = await sb
    .from("iscrizioni_corsi")
    .select("id, volontario_id, data_completamento, edizioni_corso(label, data_corso)")
    .eq("id", iscrizioneId)
    .maybeSingle();
  if (errIsc) return { errore: errIsc.message };
  if (!isc) return { errore: "iscrizione non trovata" };
  if (isc.volontario_id !== volontarioId) return { errore: "l'iscrizione non appartiene a questo volontario" };

  const { data: vecchio, error: errVecchio } = await sb
    .from("documenti_volontario")
    .select("*")
    .eq("iscrizione_id", iscrizioneId)
    .eq("tipo", "attestato")
    .maybeSingle();
  if (errVecchio) return { errore: errVecchio.message };
  if (vecchio){
    const procedi = sostituisci === "chiedi"
      ? confirm(`L'iscrizione a "${isc.edizioni_corso?.label || ""}" ha già un attestato collegato (${vecchio.nome_file}).\n\nSostituirlo con "${nomeFile}"?`)
      : sostituisci;
    if (!procedi) return { saltato: true };
  }

  const path = `${pulisciNomeFile(`${cognome}_${nome}`)}/${Date.now()}_${pulisciNomeFile(nomeFile)}`;
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_DOC_VOLONTARI).upload(path, file, contentType ? { contentType } : undefined);
  if (upErr) return { errore: "upload non riuscito: " + upErr.message };

  // Sostituzione: la vecchia riga va tolta prima di inserire la nuova (un attestato per iscrizione).
  if (vecchio){
    const { error: errDel } = await sb.from("documenti_volontario").delete().eq("id", vecchio.id);
    if (errDel){
      await sb.storage.from(STORAGE_BUCKET_DOC_VOLONTARI).remove([path]);
      return { errore: errDel.message };
    }
  }

  const { error: errIns } = await sb.from("documenti_volontario").insert({
    volontario_id: volontarioId,
    iscrizione_id: iscrizioneId,
    tipo: "attestato",
    nome_file: nomeFile,
    storage_path: path,
    note,
    created_by: state.user.id
  });
  if (errIns){
    await sb.storage.from(STORAGE_BUCKET_DOC_VOLONTARI).remove([path]);
    if (vecchio){
      // ripristino la riga precedente (il suo file non è ancora stato toccato)
      const { id, ...rigaPrecedente } = vecchio;
      const { error: errRipr } = await sb.from("documenti_volontario").insert(rigaPrecedente);
      if (errRipr) return { errore: `${errIns.message} — e non è stato possibile ripristinare l'attestato precedente (${errRipr.message})` };
    }
    return { errore: errIns.message };
  }

  if (vecchio){
    const { error: rmErr } = await sb.storage.from(STORAGE_BUCKET_DOC_VOLONTARI).remove([vecchio.storage_path]);
    if (rmErr) console.warn("File non rimosso dallo storage:", vecchio.storage_path, rmErr.message);
  }

  const aggiornamento = { attestato_rilasciato: true, stato: "completato" };
  if (!isc.data_completamento && isc.edizioni_corso?.data_corso) aggiornamento.data_completamento = isc.edizioni_corso.data_corso;
  const { error: errAgg } = await sb.from("iscrizioni_corsi").update(aggiornamento).eq("id", iscrizioneId);
  if (errAgg) return { errore: "attestato caricato, ma aggiornamento dell'iscrizione non riuscito: " + errAgg.message };

  return { ok: true };
}

// Rimuove un attestato: cancella la riga, poi il file, poi riporta
// attestato_rilasciato = false sull'iscrizione (lo stato non viene toccato).
// Ritorna true se riuscito; in caso di errore mostra l'alert e ritorna false.
async function rimuoviAttestato(docId){
  const { data: doc, error: getErr } = await sb.from("documenti_volontario").select("storage_path, iscrizione_id").eq("id", docId).maybeSingle();
  if (getErr){ alert("Errore: " + getErr.message); return false; }
  if (!doc){ alert("Errore: attestato non trovato."); return false; }

  const { error: delErr } = await sb.from("documenti_volontario").delete().eq("id", docId);
  if (delErr){ alert("Errore: " + delErr.message); return false; }

  const { error: rmErr } = await sb.storage.from(STORAGE_BUCKET_DOC_VOLONTARI).remove([doc.storage_path]);
  if (rmErr) console.warn("File non rimosso dallo storage:", doc.storage_path, rmErr.message);

  if (doc.iscrizione_id){
    const { error: errAgg } = await sb.from("iscrizioni_corsi").update({ attestato_rilasciato: false }).eq("id", doc.iscrizione_id);
    if (errAgg){ alert("Attestato rimosso, ma aggiornamento dell'iscrizione non riuscito: " + errAgg.message); return false; }
  }
  return true;
}

async function caricaAttestatoDaListaMancanti(ev){

async function importaZipAttestati(ev){
  const file = ev.target.files[0];
  if (!file) return;
  ev.target.value = "";

  const edizioneId = _importZipEdizioneId;
  _importZipEdizioneId = null;
  if (!edizioneId){ alert("Nessuna edizione corso selezionata. Riprova dal pulsante \"Import massivo attestati\"."); return; }
  const edizione = _edizioniCache.find(e => String(e.id) === String(edizioneId));

  if (!confirm(`Importare gli attestati dal file ${file.name} per l'edizione "${edizione?.label||""}"?\n\nOgni PDF deve essere nominato con il codice fiscale del volontario (es. RSSMNL90H01G674A.pdf). Ogni iscrizione ha un solo attestato: se nello ZIP ci sono più file per la stessa persona viene usato il primo.`)) return;

  const content = document.getElementById("page-content");
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(255,255,255,0.9);z-index:600;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;";
  overlay.innerHTML = `<div class="loading-spin">Importazione in corso, non chiudere questa pagina…</div><div id="import-zip-progress" style="font-size:13px;color:var(--grigio-600);"></div>`;
  document.body.appendChild(overlay);
  const progressEl = overlay.querySelector("#import-zip-progress");

  try{
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const pdfEntries = Object.values(zip.files).filter(f => !f.dir && /\.pdf$/i.test(f.name));

    let ok = 0, nonTrovati = [], nonIscrittiEdizione = [], errori = [], saltati = [];
    let sostituisciEsistenti = null; // chiesto una sola volta, al primo attestato già presente
    const iscrizioniGiaImportate = new Set();
    let i = 0;
    for (const entry of pdfEntries){
      i++;
      progressEl.textContent = `${i} di ${pdfEntries.length}…`;

      const nomeBase = entry.name.split("/").pop();
      const cfMatch = nomeBase.match(/^([A-Za-z0-9]{16})/);
      if (!cfMatch){
        errori.push(`${nomeBase}: nome file non contiene un codice fiscale valido`);
        continue;
      }
      const cf = cfMatch[1].toUpperCase();

      const { data: volontario, error: errVol } = await sb.from("volontari_formazione").select("id, cognome, nome").eq("codice_fiscale", cf).maybeSingle();
      if (errVol){ errori.push(`${nomeBase}: ${errVol.message}`); continue; }
      if (!volontario){
        nonTrovati.push(`${nomeBase} (CF: ${cf})`);
        continue;
      }

      const { data: iscrizione, error: errIsc } = await sb.from("iscrizioni_corsi").select("id, stato").eq("volontario_id", volontario.id).eq("edizione_corso_id", edizioneId).maybeSingle();
      if (errIsc){ errori.push(`${nomeBase}: ${errIsc.message}`); continue; }
      if (!iscrizione){
        nonIscrittiEdizione.push(`${nomeBase} (${volontario.cognome} ${volontario.nome}): non iscritto a questa edizione`);
        continue;
      }

      if (iscrizioniGiaImportate.has(iscrizione.id)){
        saltati.push(`${nomeBase} (${volontario.cognome} ${volontario.nome}): altro file per la stessa iscrizione già importato da questo ZIP`);
        continue;
      }

      // Attestato già presente sull'iscrizione: chiedo una volta sola cosa fare per tutto lo ZIP
      if (sostituisciEsistenti === null){
        const { data: esistente, error: errEsist } = await sb.from("documenti_volontario")
          .select("id").eq("iscrizione_id", iscrizione.id).eq("tipo", "attestato").maybeSingle();
        if (errEsist){ errori.push(`${nomeBase}: ${errEsist.message}`); continue; }
        if (esistente){
          sostituisciEsistenti = confirm("Alcuni volontari di questa edizione hanno già un attestato collegato.\n\nOK = sostituisci gli attestati esistenti con quelli dello ZIP\nAnnulla = lascia quelli esistenti e salta questi file");
        }
      }

      try{
        const blob = await entry.async("blob");
        const ris = await salvaAttestatoIscrizione({
          iscrizioneId: iscrizione.id,
          volontarioId: volontario.id,
          file: blob, nomeFile: nomeBase,
          cognome: volontario.cognome, nome: volontario.nome,
          contentType: "application/pdf",
          sostituisci: sostituisciEsistenti === true
        });
        if (ris.errore) throw new Error(ris.errore);
        if (ris.saltato){
          saltati.push(`${nomeBase} (${volontario.cognome} ${volontario.nome}): attestato già presente, non sostituito`);
          continue;
        }
        iscrizioniGiaImportate.add(iscrizione.id);
        ok++;
      }catch(err){
        errori.push(`${nomeBase}: ${err.message}`);
      }
    }

    overlay.remove();
    let msg = `Import completato (${edizione?.label||""}).\nAttestati caricati: ${ok}\nVolontari non trovati: ${nonTrovati.length}\nNon iscritti a questa edizione: ${nonIscrittiEdizione.length}\nSaltati: ${saltati.length}`;
    if (nonTrovati.length) msg += `\n\nNon trovati:\n` + nonTrovati.join("\n");
    if (nonIscrittiEdizione.length) msg += `\n\nNon iscritti a questa edizione:\n` + nonIscrittiEdizione.join("\n");
    if (saltati.length) msg += `\n\nSaltati:\n` + saltati.join("\n");
    if (errori.length) msg += `\n\nErrori:\n` + errori.join("\n");
    alert(msg);

  }catch(err){
    overlay.remove();
    alert("Errore nella lettura dello ZIP: " + err.message);
  }
}

    .select("id, cognome, nome, sezione_ana, iscrizioni_corsi(stato, edizioni_corso(label, data_corso))")
    .or(`cognome.ilike.%${q}%,nome.ilike.%${q}%`)

async function caricaDocumentiEdizione(){
  const e = _modalEdizioneCorrente;
  const wrap = document.getElementById("documenti-edizione-body");
  if (!wrap) return;

  // Cartelle aggiornate dal DB (vengono compilate dalla sync Drive, la cache può essere vecchia)
  const { data: ed, error: errEd } = await sb
    .from("edizioni_corso")
    .select("drive_cartella_attestati_id, drive_cartella_scansioni_id")
    .eq("id", e.id)
    .maybeSingle();
  if (errEd){ wrap.innerHTML = `<p>Errore: ${escapeHtml(errEd.message)}</p>`; return; }

  const { data: iscritti, error: errIsc } = await sb
    .from("iscrizioni_corsi")
    .select("id, stato, attestato_rilasciato, volontari_formazione(cognome, nome, codice_fiscale, sezione_ana)")
    .eq("edizione_corso_id", e.id);
  if (errIsc){ wrap.innerHTML = `<p>Errore: ${escapeHtml(errIsc.message)}</p>`; return; }
  const elenco = (iscritti || []).sort((a,b) => {
    const ca = (a.volontari_formazione?.cognome||"").localeCompare(b.volontari_formazione?.cognome||"");
    return ca !== 0 ? ca : (a.volontari_formazione?.nome||"").localeCompare(b.volontari_formazione?.nome||"");
  });

  let suDrive = 0;
  if (elenco.length){
    const { data: docs, error: errDocs } = await sb
      .from("documenti_volontario")
      .select("id, drive_file_id")
      .eq("tipo", "attestato")
      .in("iscrizione_id", elenco.map(r => r.id));
    if (errDocs){ wrap.innerHTML = `<p>Errore: ${escapeHtml(errDocs.message)}</p>`; return; }
    suDrive = (docs || []).filter(d => d.drive_file_id).length;
  }
  const rilasciati = elenco.filter(r => r.attestato_rilasciato === true).length;

  const pulsanteCartella = (id, etichetta) => id
    ? `<a class="btn-add-mini" style="text-decoration:none;display:inline-block;" href="${urlCartellaDrive(id)}" target="_blank" rel="noopener">📂 Apri ${etichetta}</a>`
    : `<span class="btn-add-mini" style="display:inline-block;background:var(--grigio-400);cursor:default;" title="Cartella non ancora collegata">📂 ${etichetta} non collegata</span>`;

  wrap.innerHTML = `
    <div class="section-title" style="margin-top:0;">Cartelle Drive del corso</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
      ${pulsanteCartella(ed?.drive_cartella_attestati_id, "ATTESTATI")}
      ${pulsanteCartella(ed?.drive_cartella_scansioni_id, "SCANSIONI")}
    </div>
    <p style="font-size:12px;color:var(--grigio-600);margin:0 0 18px;">Si aprono su Google Drive: serve l'accesso alla cartella condivisa dei corsi.</p>

    <div class="section-title">Attestati</div>
    <div class="report-stat-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;">
      <div class="report-stat-box"><div class="report-stat-num">${elenco.length}</div><div class="report-stat-lbl">Iscritti</div></div>
      <div class="report-stat-box"><div class="report-stat-num">${rilasciati}</div><div class="report-stat-lbl">Attestati rilasciati</div></div>
      <div class="report-stat-box"><div class="report-stat-num">${suDrive}</div><div class="report-stat-lbl">Attestati su Drive</div></div>
    </div>
    ${rilasciati > suDrive ? `<p style="font-size:12.5px;color:var(--giallo);margin-top:-8px;">⚠️ ${rilasciati - suDrive} attestati rilasciati non risultano ancora copiati su Drive.</p>` : ""}

    <div class="section-title">Elenco iscritti</div>

function righeIscrittiEdizione(elenco){
  return elenco.map((r, i) => ({
    "N.": i + 1,
    Cognome: r.volontari_formazione?.cognome || "",
    Nome: r.volontari_formazione?.nome || "",
    "Codice fiscale": r.volontari_formazione?.codice_fiscale || "",
    Sezione: r.volontari_formazione?.sezione_ana || "",
    Stato: labelStatoIscrizione(r.stato),
    Attestato: r.attestato_rilasciato ? "Sì" : "No"
  }));
}

function esportaIscrittiEdizioneExcel(e, elenco){
  const ws = XLSX.utils.json_to_sheet(righeIscrittiEdizione(elenco));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Iscritti");
  XLSX.writeFile(wb, `Iscritti_${(e.label||"edizione").replace(/[^a-zA-Z0-9]/g,"_")}.xlsx`);
}

function esportaIscrittiEdizionePdf(e, elenco){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const righe = righeIscrittiEdizione(elenco);

  doc.setFontSize(13);
  doc.text(`Elenco iscritti — ${e.label || ""}`, 14, 14);
  doc.setFontSize(8.5);
  const info = [e.data_corso ? formatDataIt(e.data_corso) : null, e.sede || null, `${righe.length} iscritti`].filter(Boolean).join(" — ");
  doc.text(`${info} — generato il ${formatDataIt(new Date().toISOString().slice(0,10))}`, 14, 20);

  const colonne = [
    { campo:"N.", w:9 }, { campo:"Cognome", w:34 }, { campo:"Nome", w:30 },
    { campo:"Codice fiscale", w:38 }, { campo:"Sezione", w:30 }, { campo:"Stato", w:22 }, { campo:"Attestato", w:18 }
  ];
  let y = 30;
  function intestazione(yPos){
    doc.setFont(undefined, "bold");
    doc.setFontSize(8);
    let x = 14;
    colonne.forEach(c => { doc.text(c.campo, x, yPos); x += c.w; });
    doc.setFont(undefined, "normal");
    doc.line(14, yPos+2, 196, yPos+2);
  }
  intestazione(y);
  y += 7;
  righe.forEach(r => {
    if (y > 285){ doc.addPage(); y = 18; intestazione(y); y += 7; }
    let x = 14;
    colonne.forEach(c => { doc.text(String(r[c.campo]).slice(0, Math.floor(c.w / 1.7)), x, y); x += c.w; });
    y += 6;
  });

  doc.save(`Iscritti_${(e.label||"edizione").replace(/[^a-zA-Z0-9]/g,"_")}.pdf`);
}

async function caricaVolontariDaExcel(ev, e){
  const file = ev.target.files[0];
  if (!file) return;
  ev.target.value = ""; // reset input per permettere ricaricare lo stesso file

  const wrap = document.getElementById("volontari-edizione-list");
  wrap.innerHTML = `<div class="loading-spin">Lettura file ed importazione…</div>`;

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:"array", cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const righe = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });

    // trova la riga di intestazione colonne (quella che contiene "COGNOME")
    let idxHeader = righe.findIndex(r => (r[0]||"").toString().trim().toUpperCase() === "COGNOME");
    if (idxHeader === -1){
      alert("Non trovo l'intestazione 'COGNOME' nel file. Verifica che sia il template corretto.");
      caricaVolontariEdizione();
      return;
    }

    const dati = righe.slice(idxHeader + 1).filter(r => (r[0]||"").toString().trim() !== "");

    let nuovi = 0, aggiornati = 0, iscritti = 0, errori = [];

    for (const r of dati){
      const cognome = (r[0]||"").toString().trim();
      const nome = (r[1]||"").toString().trim();
      const luogoNascita = (r[2]||"").toString().trim() || null;
      const prov = (r[3]||"").toString().trim() || null;
      let dataNascita = r[4];
      if (dataNascita instanceof Date){
        dataNascita = dataNascita.toISOString().slice(0,10);
      } else if (typeof dataNascita === "string" && dataNascita.includes("/")){
        const p = dataNascita.split("/");
        dataNascita = p.length===3 ? `${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}` : null;
      } else {
        dataNascita = null;
      }
      const cf = (r[5]||"").toString().trim().toUpperCase() || null;
      const telefono = (r[6]||"").toString().trim() || null;
      const email = (r[7]||"").toString().trim() || null;
      const sezione = (r[8]||"").toString().trim().toUpperCase() || null;

      if (!cognome || !nome){ continue; }

      try{
        let volontarioId;
        if (cf){
          const { data: esistente, error: errEsist } = await sb.from("volontari_formazione").select("id").eq("codice_fiscale", cf).maybeSingle();
          if (errEsist) throw errEsist;
          if (esistente){
            const { error: errAgg } = await sb.from("volontari_formazione").update({
              cognome, nome, luogo_nascita: luogoNascita, provincia_nascita: prov,
              data_nascita: dataNascita, telefono, email, sezione_ana: sezione
            }).eq("id", esistente.id);
            if (errAgg) throw errAgg;
            volontarioId = esistente.id;
            aggiornati++;
          }
        }
        if (!volontarioId){
          const { data: creato, error: errCrea } = await sb.from("volontari_formazione").insert({
            cognome, nome, codice_fiscale: cf, luogo_nascita: luogoNascita, provincia_nascita: prov,
            data_nascita: dataNascita, telefono, email, sezione_ana: sezione
          }).select().single();
          if (errCrea) throw errCrea;
          volontarioId = creato.id;
          nuovi++;
        }

        const { data: giaIscritto, error: errGia } = await sb.from("iscrizioni_corsi").select("id").eq("volontario_id", volontarioId).eq("edizione_corso_id", e.id).maybeSingle();
        if (errGia) throw errGia;
        if (!giaIscritto){
          const { error: errIscr } = await sb.from("iscrizioni_corsi").insert({ volontario_id: volontarioId, edizione_corso_id: e.id, stato:"iscritto" });
          if (errIscr) throw errIscr;
          iscritti++;
        }
      }catch(err){
        errori.push(`${cognome} ${nome}: ${err.message}`);
      }
    }

    let msg = `Importazione completata.\nNuovi volontari creati: ${nuovi}\nVolontari aggiornati: ${aggiornati}\nIscrizioni aggiunte: ${iscritti}`;
    if (errori.length) msg += `\n\nErrori (${errori.length}):\n` + errori.join("\n");
    alert(msg);

  }catch(err){
    alert("Errore nella lettura del file: " + err.message);
  }

  caricaVolontariEdizione();
}

    .eq("volontario_id", v.id)

  const opzioniIscrizioni = (iscrizioni||[]).map(r =>
    `<option value="${r.id}">${escapeHtml(r.edizioni_corso?.label || "Edizione senza nome")}${r.edizioni_corso?.data_corso ? " — " + formatDataIt(r.edizioni_corso.data_corso) : ""}${r.attestato_rilasciato ? " (ha già un attestato)" : ""}</option>`

      <div class="form-grid">
        <div class="form-field">
          <label>Tipo</label>
          <select name="tipo">
            <option value="attestato">Attestato</option>
            <option value="certificato_medico">Certificato medico</option>
            <option value="altro">Altro</option>
          </select>
        </div>
        <div class="form-field" id="campo-iscrizione-attestato">
          <label>Iscrizione a cui appartiene l'attestato *</label>
          ${opzioniIscrizioni
            ? `<select name="iscrizione_id"><option value="">— Seleziona iscrizione —</option>${opzioniIscrizioni}</select>`
            : `<p style="font-size:12px;color:var(--rosso);margin:4px 0 0;">Il volontario non ha iscrizioni: per caricare un attestato iscrivilo prima a un'edizione.</p>`}
        </div>
        <div class="form-field full"><label>File (PDF o immagine)</label><input type="file" name="file" accept=".pdf,image/*" required></div>
        <div class="form-field full"><label>Note</label><textarea name="note"></textarea></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="btn-cancel-documento-volontario">Annulla</button>
        <button type="submit" class="btn-save">Carica</button>
      </div>
    </form>
  `;
  wrap.prepend(form);
  document.getElementById("btn-cancel-documento-volontario").addEventListener("click", () => form.remove());
  const selectTipo = form.querySelector('select[name="tipo"]');
  const campoIscrizione = document.getElementById("campo-iscrizione-attestato");
  selectTipo.addEventListener("change", () => {
    campoIscrizione.style.display = selectTipo.value === "attestato" ? "" : "none";
  });
  document.getElementById("form-documento-volontario").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const file = fd.get("file");
    const btn = ev.target.querySelector(".btn-save");

    if (fd.get("tipo") === "attestato"){
      const iscrizioneId = parseInt(fd.get("iscrizione_id"));
      if (!iscrizioneId){ alert("Seleziona l'iscrizione a cui appartiene l'attestato."); return; }
      btn.disabled = true; btn.textContent = "Caricamento…";
      const ris = await salvaAttestatoIscrizione({
        iscrizioneId, volontarioId: v.id,
        file, nomeFile: file.name,
        cognome: v.cognome, nome: v.nome,
        note: fd.get("note") || null
      });
      btn.disabled = false; btn.textContent = "Carica";
      if (ris.saltato) return;
      if (ris.errore){ alert("Errore: " + ris.errore); caricaDocumentiVolontario(); return; }
      form.remove();
      caricaDocumentiVolontario();
      return;
    }

    btn.disabled = true; btn.textContent = "Caricamento…";

    const path = `${pulisciNomeFile(`${v.cognome}_${v.nome}`)}/${Date.now()}_${pulisciNomeFile(file.name)}`;
    const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_DOC_VOLONTARI).upload(path, file);
    if (upErr){ alert("Errore upload: " + upErr.message); btn.disabled=false; btn.textContent="Carica"; return; }

    const { error } = await sb.from("documenti_volontario").insert({
      volontario_id: v.id,
      tipo: fd.get("tipo"),
      nome_file: file.name,
      storage_path: path,
      note: fd.get("note") || null,
      created_by: state.user.id
    });
    if (error){ alert("Errore: " + error.message); btn.disabled=false; btn.textContent="Carica"; return; }

    form.remove();
    caricaDocumentiVolontario();
  });
}

const STORAGE_BUCKET_FIRME = "firme";
let _firmeLibreria = [];
let _firmeLibreriaUrl = {};    // URL firmati per l'anteprima, per storage_path
let _firmaSelezionataId = null;
let _pdfCorrente = null;       // documento pdf.js
let _pdfBytesOriginali = null; // ArrayBuffer originale, per pdf-lib
let _firmePosizionate = [];    // { pagina, xPct, yPct, wPct, hPct, firmaUrl, firmaPath }
let _paginaAttivaDrag = null;

async function renderFirmaDocumenti(){
  const content = document.getElementById("page-content");
  content.innerHTML = `
    <div class="firma-layout">

async function caricaLibreriaFirme(){
  const { data, error } = await sb.from("firme_salvate").select("*").order("nome");
  const grid = document.getElementById("firma-lib-grid");
  if (!grid) return;
  if (error){ grid.innerHTML = `<p style="font-size:12px;">Errore: ${escapeHtml(error.message)}</p>`; return; }
  _firmeLibreria = data || [];

  if (_firmeLibreria.length === 0){
    grid.innerHTML = `<p style="font-size:12px;color:var(--grigio-600);grid-column:1/-1;">Nessuna firma salvata. Caricane una.</p>`;
    return;
  }

  _firmeLibreriaUrl = await urlFirmatiMultipli(STORAGE_BUCKET_FIRME, _firmeLibreria.map(f => f.storage_path));

  grid.innerHTML = _firmeLibreria.map(f => {
    const url = _firmeLibreriaUrl[f.storage_path] || "";
    const selezionata = _firmaSelezionataId === f.id;
    return `
      <div class="firma-lib-item ${selezionata?"selezionata":""}" data-id="${f.id}">
        <img src="${url}" alt="${escapeHtml(f.nome)}">
        <div class="nome">${escapeHtml(f.nome)}</div>
        <div class="del" data-elimina-firma="${f.id}">✕</div>
      </div>
    `;
  }).join("");

  grid.querySelectorAll(".firma-lib-item").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.dataset.eliminaFirma) return; // gestito separatamente
      _firmaSelezionataId = parseInt(el.dataset.id);
      caricaLibreriaFirme();
    });
  });
  grid.querySelectorAll("[data-elimina-firma]").forEach(b => b.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!confirm("Eliminare questa firma dalla libreria?")) return;
    const id = parseInt(b.dataset.eliminaFirma);
    const firma = _firmeLibreria.find(f => f.id === id);
    const { error } = await sb.from("firme_salvate").delete().eq("id", id);
    if (error){ alert("Errore: " + error.message); return; }
    if (firma){
      const { error: rmErr } = await sb.storage.from(STORAGE_BUCKET_FIRME).remove([firma.storage_path]);
      if (rmErr) console.warn("File non rimosso dallo storage:", firma.storage_path, rmErr.message);
    }
    if (_firmaSelezionataId === id) _firmaSelezionataId = null;
    caricaLibreriaFirme();
  }));
}

async function caricaNuovaFirma(ev){
  const file = ev.target.files[0];
  if (!file) return;
  ev.target.value = "";
  const nome = prompt("Nome per questa firma (es. il tuo nome):", file.name.replace(/\.png$/i, ""));
  if (!nome) return;

  const path = `${Date.now()}_${pulisciNomeFile(file.name)}`;
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_FIRME).upload(path, file, { contentType: "image/png" });
  if (upErr){ alert("Errore upload: " + upErr.message); return; }

  const { error } = await sb.from("firme_salvate").insert({ nome, storage_path: path, created_by: state.user.id });
  if (error){ alert("Errore: " + error.message); return; }

  caricaLibreriaFirme();
}

async function caricaPdfPerFirma(ev){
  const file = ev.target.files[0];
  if (!file) return;

  document.getElementById("firma-pdf-stato").textContent = "Caricamento PDF…";
  _firmePosizionate = [];

  const buf = await file.arrayBuffer();
  _pdfBytesOriginali = buf.slice(0); // copia, perché pdf.js consuma il buffer

  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  _pdfCorrente = pdf;

  const viewer = document.getElementById("firma-pdf-viewer");
  viewer.innerHTML = "";

  for (let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.3 });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport }).promise;

    const wrap = document.createElement("div");
    wrap.className = "firma-page-wrap";
    wrap.dataset.pagina = i;
    wrap.style.width = viewport.width + "px";
    wrap.style.height = viewport.height + "px";
    wrap.appendChild(canvas);
    wrap.addEventListener("click", (e) => onClickPaginaPerFirma(e, wrap, i));

    const pageNumLabel = document.createElement("div");
    pageNumLabel.className = "firma-page-num";

function onClickPaginaPerFirma(e, wrap, numeroPagina){
  if (e.target.closest(".firma-overlay-sign")) return; // click su firma esistente, non aggiungerne una nuova
  if (!_firmaSelezionataId){
    alert("Seleziona prima una firma dalla libreria a sinistra.");
    return;
  }
  const firma = _firmeLibreria.find(f => f.id === _firmaSelezionataId);

  const rect = wrap.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const larghezzaIniziale = 140;
  const altezzaIniziale = 60;

  const posizione = {
    id: "fp_" + Date.now(),
    pagina: numeroPagina,
    xPct: (x - larghezzaIniziale/2) / rect.width,
    yPct: (y - altezzaIniziale/2) / rect.height,
    wPct: larghezzaIniziale / rect.width,
    hPct: altezzaIniziale / rect.height,
    firmaUrl: _firmeLibreriaUrl[firma.storage_path] || "",
    firmaPath: firma.storage_path
  };
  _firmePosizionate.push(posizione);
  renderOverlayFirma(wrap, posizione);
}

function renderOverlayFirma(wrap, pos){
  const rect = wrap.getBoundingClientRect();
  const overlay = document.createElement("div");
  overlay.className = "firma-overlay-sign";
  overlay.dataset.id = pos.id;
  overlay.style.left = (pos.xPct * rect.width) + "px";
  overlay.style.top = (pos.yPct * rect.height) + "px";
  overlay.style.width = (pos.wPct * rect.width) + "px";
  overlay.style.height = (pos.hPct * rect.height) + "px";
  overlay.innerHTML = `<img src="${pos.firmaUrl}"><div class="firma-resize-handle"></div><div class="del" style="position:absolute;top:-8px;left:-8px;" data-rimuovi-firma="${pos.id}">✕</div>`;
  wrap.appendChild(overlay);

  abilitaDragResize(overlay, wrap, pos);

  overlay.querySelector("[data-rimuovi-firma]").addEventListener("click", (e) => {
    e.stopPropagation();
    overlay.remove();
    _firmePosizionate = _firmePosizionate.filter(p => p.id !== pos.id);
  });
}

function abilitaDragResize(overlay, wrap, pos){
  let modo = null; // 'drag' | 'resize'
  let startX, startY, startLeft, startTop, startW, startH;

  function pointerPos(e){
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  overlay.addEventListener("mousedown", (e) => iniziaAzione(e, "drag"));
  overlay.addEventListener("touchstart", (e) => iniziaAzione(e, "drag"), { passive:false });
  overlay.querySelector(".firma-resize-handle").addEventListener("mousedown", (e) => { e.stopPropagation(); iniziaAzione(e, "resize"); });
  overlay.querySelector(".firma-resize-handle").addEventListener("touchstart", (e) => { e.stopPropagation(); iniziaAzione(e, "resize"); }, { passive:false });

  function iniziaAzione(e, tipo){
    if (e.target.dataset.rimuoviFirma) return;
    e.preventDefault();
    modo = tipo;
    const p = pointerPos(e);
    startX = p.x; startY = p.y;
    startLeft = parseFloat(overlay.style.left);
    startTop = parseFloat(overlay.style.top);
    startW = parseFloat(overlay.style.width);
    startH = parseFloat(overlay.style.height);
    document.addEventListener("mousemove", muovi);
    document.addEventListener("touchmove", muovi, { passive:false });
    document.addEventListener("mouseup", fine);
    document.addEventListener("touchend", fine);
  }

  function muovi(e){
    if (!modo) return;
    e.preventDefault();
    const p = pointerPos(e);
    const dx = p.x - startX, dy = p.y - startY;
    const rect = wrap.getBoundingClientRect();

    if (modo === "drag"){
      overlay.style.left = Math.max(0, Math.min(rect.width - startW, startLeft + dx)) + "px";
      overlay.style.top = Math.max(0, Math.min(rect.height - startH, startTop + dy)) + "px";
    } else {
      overlay.style.width = Math.max(30, startW + dx) + "px";
      overlay.style.height = Math.max(20, startH + dy) + "px";
    }
  }

  function fine(){
    if (!modo) return;
    modo = null;
    document.removeEventListener("mousemove", muovi);
    document.removeEventListener("touchmove", muovi);
    document.removeEventListener("mouseup", fine);
    document.removeEventListener("touchend", fine);

    // aggiorna percentuali salvate
    const rect = wrap.getBoundingClientRect();
    pos.xPct = parseFloat(overlay.style.left) / rect.width;
    pos.yPct = parseFloat(overlay.style.top) / rect.height;
    pos.wPct = parseFloat(overlay.style.width) / rect.width;
    pos.hPct = parseFloat(overlay.style.height) / rect.height;
  }
}

async function generaPdfFirmato(){
  if (!_pdfBytesOriginali){ alert("Carica prima un PDF."); return; }
  if (_firmePosizionate.length === 0){
    if (!confirm("Non hai posizionato nessuna firma. Scaricare comunque il PDF originale?")) return;
  }

  const btn = document.getElementById("btn-scarica-pdf-firmato");
  btn.disabled = true; btn.textContent = "Generazione…";

  try{
    const { PDFDocument } = PDFLib;
    const pdfDoc = await PDFDocument.load(_pdfBytesOriginali.slice(0));
    const pagine = pdfDoc.getPages();

    // cache immagini già scaricate per evitare richieste duplicate
    const cacheImmagini = {};

    for (const pos of _firmePosizionate){
      const pagina = pagine[pos.pagina - 1];
      if (!pagina) continue;
      const { width: pw, height: ph } = pagina.getSize();

      if (!cacheImmagini[pos.firmaPath]){
        const dataUrl = await scaricaComeDataUrl(STORAGE_BUCKET_FIRME, pos.firmaPath);
        cacheImmagini[pos.firmaPath] = await pdfDoc.embedPng(dataUrl);
      }
      const img = cacheImmagini[pos.firmaPath];

      const wPdf = pos.wPct * pw;
      const hPdf = pos.hPct * ph;
      const xPdf = pos.xPct * pw;
      // PDF ha l'origine in basso a sinistra, il viewer in alto: convertiamo
      const yPdf = ph - (pos.yPct * ph) - hPdf;

      pagina.drawImage(img, { x: xPdf, y: yPdf, width: wPdf, height: hPdf });
    }

    const pdfBytesFinale = await pdfDoc.save();
    const blob = new Blob([pdfBytesFinale], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "documento_firmato.pdf";
    a.click();
    URL.revokeObjectURL(url);

  }catch(err){
    alert("Errore nella generazione del PDF: " + err.message);
  }

  btn.disabled = false; btn.textContent = "⬇️ Scarica PDF firmato";
}

async function sha256HexPdf(bytes){
  const h = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("");
}

}

// Ritaglia il bordo vuoto di una firma su canvas e la restituisce come PNG (dataURL), null se vuota
function ritagliaFirmaCanvasPdf(cv){
  const o = ritagliaCanvasPdf(cv);
  return o ? o.toDataURL("image/png") : null;
}
// Stesso ritaglio, ma restituisce il canvas (null se è tutto trasparente)
function ritagliaCanvasPdf(cv){
  const ctx = cv.getContext("2d");
  const w = cv.width, h = cv.height;
  const d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (d[(y*w + x)*4 + 3] > 8){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return null;
  const m = 6;
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
  const o = document.createElement("canvas");
  o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext("2d").drawImage(cv, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}

// Stessa cosa partendo da un'immagine (firma personale salvata in Impostazioni)
function ritagliaFirmaDataUrlPdf(url){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      cv.getContext("2d").drawImage(img, 0, 0);
      res(ritagliaFirmaCanvasPdf(cv) || url);
    };
    img.onerror = () => res(url);
    img.src = url;
  });
}
