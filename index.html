/* ============================================================
   UTILITY
   ============================================================ */
function formatDataIt(dateStr){
  if(!dateStr) return "—";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("it-IT", { day:"2-digit", month:"2-digit", year:"numeric" });
}

function giorniDaOggi(dateStr){
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - oggi) / 86400000);
}

function statoScadenza(dateStr, giorniPreavviso){
  const g = giorniDaOggi(dateStr);
  if (g < 0) return "scaduto";
  if (g <= giorniPreavviso) return "avvicinamento";
  return "ok";
}

function escapeHtml(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   AUTH
   ============================================================ */
async function initAuth(){
  // Pulizia di eventuali token residui salvati in precedenza (prima che
  // persistSession fosse disattivato), così l'app chiede sempre login.
  await sb.auth.signOut().catch(() => {});
  try{
    Object.keys(localStorage).forEach(k => { if (k.startsWith("sb-")) localStorage.removeItem(k); });
    Object.keys(sessionStorage).forEach(k => { if (k.startsWith("sb-")) sessionStorage.removeItem(k); });
  }catch(e){ /* storage non disponibile, ignora */ }

  showLogin();

  sb.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT"){
      showLogin();
    }
  });
}

async function onAuthenticated(user){
  state.user = user;

  // carica profilo applicativo
  const { data: profile, error } = await sb
    .from("app_users")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if (error || !profile){
    // primo accesso: nessun profilo app_users ancora collegato.
    // Creiamo un profilo di default come 'standard' così l'IT Administrator può poi configurarlo da Impostazioni.
    const { data: created } = await sb
      .from("app_users")
      .insert({ id: user.id, nome: user.email.split("@")[0], email: user.email, ruolo: "standard" })
      .select()
      .single();
    state.profile = created || { nome: user.email, ruolo: "standard" };
  } else {
    state.profile = profile;
  }

  // Registra questo accesso nel log (best-effort, non blocca il login se fallisce)
  sb.from("log_accessi").insert({
    utente_id: user.id,
    utente_email: user.email,
    utente_nome: state.profile.nome || user.email
  }).then(() => {}).catch(() => {});

  showApp();
}

function showLogin(){
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app-shell").classList.remove("visible");
}

function showApp(){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-shell").classList.add("visible");
  document.getElementById("sidebar-user-name").textContent = state.profile.nome || state.user.email;
  document.getElementById("sidebar-user-role").textContent = labelRuolo(state.profile.ruolo);
  renderSidebar();
  location.hash = "#/home";
  router();
}

function labelRuolo(r){
  const map = { it_admin:"IT Administrator", specialita:"Specialità", segreteria:"Segreteria", standard:"Standard" };
  return map[r] || r;
}

function userCanSee(permesso){
  if (permesso === "_solo_it_admin") return state.profile.ruolo === "it_admin";
  if (permesso === "_almeno_una_sezione") return paginaImpostazioniHaSezioni();
  if (state.profile.ruolo === "it_admin") return true;
  return !!(state.profile.permessi && state.profile.permessi[permesso]);
}

function livelloPermesso(sezione){
  // Per sezioni con granularità (es. 'tlc'): restituisce 'completo', 'base' o null.
  // it_admin ha sempre 'completo'.
  if (state.profile.ruolo === "it_admin") return "completo";
  const v = state.profile.permessi && state.profile.permessi[sezione];
  if (v === "completo" || v === "base") return v;
  return null;
}

function paginaImpostazioniHaSezioni(){
  // Impostazioni è ora sempre visibile a tutti gli utenti autenticati,
  // perché contiene almeno la sezione "La mia firma personale".
  return true;
}

  const errBox = document.getElementById("login-error");
  const okBox = document.getElementById("login-msg-ok");
  errBox.style.display = "none";
  okBox.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Accesso in corso…";

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = "Accedi";

  if (error){
    errBox.textContent = "Credenziali non valide o utente non abilitato.";
    errBox.style.display = "block";

});

});

function toggleSidebarBackdrop(mostra){
  let backdrop = document.getElementById("sidebar-backdrop");
  if (mostra){
    if (!backdrop){
      backdrop = document.createElement("div");
      backdrop.id = "sidebar-backdrop";
      backdrop.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:90;";
      backdrop.addEventListener("click", () => {
        document.getElementById("sidebar").classList.remove("open");
        toggleSidebarBackdrop(false);
      });
      document.body.appendChild(backdrop);
    }
  } else if (backdrop){
    backdrop.remove();
  }
}

async function refreshAlertBadge(){
  try{
    const { data, error } = await sb.from("v_scadenze").select("*");
    if (error || !data) return;
    const urgenti = data.filter(r => r.data_scadenza && statoScadenza(r.data_scadenza, r.giorni_preavviso) !== "ok");
    const badge = document.getElementById("badge-home");
    if (badge){
      if (urgenti.length > 0){
        badge.textContent = urgenti.length;
        badge.style.display = "inline-block";
      } else {
        badge.style.display = "none";
      }
    }
  }catch(e){ /* silenzioso */ }
}

const PAGE_TITLES = {
  home: ["Home", "Situazione generale e alert"],
  automezzi: ["Automezzi", "Flotta, revisioni e movimentazioni"],
  tlc: ["TLC / Radio", "Apparati e movimentazioni"],
  formazione: ["Formazione", "Corsi e volontari"],
  firma: ["Firma Documenti", "Carica PDF, apponi la firma e scarica"],
  libromatricola: ["Libro Matricola", "Mezzi assicurati e polizze"],
  convocazioni: ["Convocazioni", "Genera convocazioni a riunioni e assemblee"],
  utenti: ["Gestione Utenti", "Utenti abilitati e relativi permessi"],
  impostazioni: ["Impostazioni", "Configurazioni per modulo"]
};

function router(){
  const hash = location.hash.replace("#/", "") || "home";
  let route = MENU.some(m => m.route === hash) ? hash : "home";

  const menuItem = MENU.find(m => m.route === route);
  if (!userCanSee(menuItem.permesso)){
    route = "home";
  }
  state.route = route;

  const [title, sub] = PAGE_TITLES[route] || ["", ""];
  document.getElementById("topbar-title").textContent = title;
  document.getElementById("topbar-sub").textContent = sub;

  renderSidebar();

  const content = document.getElementById("page-content");
  content.innerHTML = `<div class="loading-spin">Caricamento…</div>`;

  if (route === "home") renderHome();
  else if (route === "automezzi") renderAutomezzi();
  else if (route === "tlc") renderTlc();
  else if (route === "formazione") renderFormazione();
  else if (route === "firma") renderFirmaDocumenti();
  else if (route === "libromatricola") renderLibroMatricola();
  else if (route === "convocazioni") renderConvocazioni();
  else if (route === "utenti") renderGestioneUtenti();
  else if (route === "impostazioni") renderImpostazioni();
}
window.addEventListener("hashchange", router);

function attivaToggleCollapse(toggleId, bodyId){
  const toggle = document.getElementById(toggleId);
  const body = document.getElementById(bodyId);
  toggle.addEventListener("click", () => {
    const apri = body.style.display !== "block";
    body.style.display = apri ? "block" : "none";
    toggle.querySelector(".collapse-arrow").textContent = apri ? "▴" : "▾";
  });
}

async function caricaBloccoScadenzeAutomezzi(){
  const [{ data: scadenze }, { data: automezzi }] = await Promise.all([
    sb.from("v_scadenze").select("*"),
    sb.from("automezzi").select("*")
  ]);

  const elenco = (scadenze || [])
    .filter(s => s.data_scadenza)
    .map(s => ({ ...s, stato: statoScadenza(s.data_scadenza, s.giorni_preavviso), giorni: giorniDaOggi(s.data_scadenza) }))
    .filter(s => s.stato !== "ok")
    .sort((a,b) => new Date(a.data_scadenza) - new Date(b.data_scadenza));

  const scaduti = elenco.filter(s => s.stato === "scaduto");
  const inAvvicinamento = elenco.filter(s => s.stato === "avvicinamento");

  document.getElementById("badge-scadenze-automezzi").textContent = elenco.length || "";
  document.getElementById("badge-scadenze-automezzi").style.display = elenco.length ? "inline-block" : "none";

  const body = document.getElementById("body-scadenze-automezzi");
  body.innerHTML = `
    <div class="toolbar" style="justify-content:flex-end;margin-bottom:14px;">
      <button class="btn-add" id="btn-report-revisioni">📄 Report revisioni scadute/in scadenza</button>
    </div>
    <div class="section-title">🔴 Scaduto</div>
    ${renderAlertList(scaduti, "scaduto")}
    <div class="section-title">🟡 In avvicinamento</div>
    ${renderAlertList(inAvvicinamento, "avvicinamento")}
  `;

  document.getElementById("btn-report-revisioni").addEventListener("click", () => generaReportRevisioniMese(automezzi));

  body.querySelectorAll(".alert-row[data-modulo]").forEach(el => {
    el.addEventListener("click", () => {
      const rif = parseInt(el.dataset.rif);
      location.hash = "#/automezzi";
      setTimeout(() => {
        const m = _automezziCache.find(x => x.id === rif);
        if (m) apriModalMezzo(m.id);
      }, 400);
    });
  });

  attivaToggleCollapse("toggle-scadenze-automezzi", "body-scadenze-automezzi");
  document.getElementById("body-scadenze-automezzi").style.display = "block";
}

async function caricaBloccoTlcInUso(){
  const { data, error } = await sb
    .from("movimentazioni_tlc")
    .select("*, movimentazioni_tlc_apparati(tlc_apparati(selettiva, modello))")
    .eq("stato", "in_uso")
    .order("data_uscita", { ascending: true });

  document.getElementById("badge-tlc-in-uso").textContent = (data && data.length) || "";
  document.getElementById("badge-tlc-in-uso").style.display = (data && data.length) ? "inline-block" : "none";

  const body = document.getElementById("body-tlc-in-uso");
  if (error){ body.innerHTML = `<p style="color:var(--rosso);font-size:13px;">Errore: ${escapeHtml(error.message)}</p>`; return; }

  if (!data || data.length === 0){
    body.innerHTML = `<div class="empty-state"><div class="ic">✅</div>Nessuna radio attualmente fuori sede.</div>`;
  } else {
    body.innerHTML = `<div class="alert-list">` + data.map(r => {
      const apparati = (r.movimentazioni_tlc_apparati||[]).map(a => a.tlc_apparati?.selettiva).filter(Boolean).join(", ");
      const giorni = giorniDaOggi(r.data_uscita);
      return `
        <div class="alert-row avvicinamento" data-mov="${r.id}">
          <span class="dot"></span>
          <span class="desc">${escapeHtml(apparati)} — ${escapeHtml(r.operatore)} (${escapeHtml(r.sezione_ana)})</span>
          <span class="tag">USCITA</span>
          <span class="data">${formatDataIt(r.data_uscita)} (da ${Math.abs(giorni)}gg)</span>
        </div>
      `;
    }).join("") + `</div>`;
  }

  body.querySelectorAll(".alert-row[data-mov]").forEach(el => {
    el.addEventListener("click", () => { location.hash = "#/tlc"; });
  });

  attivaToggleCollapse("toggle-tlc-in-uso", "body-tlc-in-uso");
  document.getElementById("body-tlc-in-uso").style.display = "block";
}

function generaReportRevisioniMese(automezzi){
  const oggi = new Date();
  const mesiIt = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

  const elenco = (automezzi || [])
    .filter(m => m.scadenza_revisione && statoScadenza(m.scadenza_revisione, 30) !== "ok")
    .sort((a,b) => new Date(a.scadenza_revisione) - new Date(b.scadenza_revisione));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text("Polo Logistico 1 RGPT/CAP Vercelli", 14, 16);
  doc.setFontSize(11);
  doc.text(`Report revisioni scadute e in scadenza`, 14, 24);
  doc.setFontSize(9);
  doc.text(`Generato il ${formatDataIt(oggi.toISOString().slice(0,10))}`, 14, 30);

  let y = 42;
  doc.setFontSize(9);
  doc.setFont(undefined, "bold");
  doc.text("Targa", 14, y);
  doc.text("Marca/Modello", 45, y);
  doc.text("Categoria", 100, y);
  doc.text("Posizione", 135, y);
  doc.text("Scadenza", 170, y);
  doc.setFont(undefined, "normal");
  y += 4;
  doc.line(14, y, 196, y);
  y += 6;

  if (elenco.length === 0){
    doc.text("Nessuna revisione scaduta o in scadenza.", 14, y);
  } else {
    elenco.forEach(m => {
      if (y > 280){ doc.addPage(); y = 20; }
      const scaduto = statoScadenza(m.scadenza_revisione, 30) === "scaduto";
      if (scaduto) doc.setTextColor(192,57,43); else doc.setTextColor(0,0,0);
      doc.text(m.targa, 14, y);
      doc.text(`${m.marca||""} ${m.modello||""}`.trim().slice(0,28), 45, y);
      doc.text(m.categoria || "—", 100, y);
      doc.text(m.posizione || "—", 135, y);
      doc.text(formatDataIt(m.scadenza_revisione), 170, y);
      doc.setTextColor(0,0,0);
      y += 7;
    });
  }

  doc.save(`report_revisioni_${oggi.toISOString().slice(0,10)}.pdf`);
}

function renderAlertList(items, classe){

const STORAGE_BUCKET_MEZZI = "mezzi-foto";

function pathFotoMezzo(targa, lato){
  // lato: fronte | retro | sx | dx

}
function urlFotoMezzo(targa, lato){
  const { data } = sb.storage.from(STORAGE_BUCKET_MEZZI).getPublicUrl(pathFotoMezzo(targa, lato));

}

function statoOperativoMezzo(m){
  // Il dismesso è definitivo: niente automatismo, resta sempre dismesso.
  if (m.stato_manuale === "dismesso") return "dismesso";
  // Esente da revisione: niente controllo data, mai "Revisionare" automatico.
  if (m.frequenza_revisione_anni === 0) return m.stato_manuale || "operativo";
  // La revisione scaduta vince sempre sugli altri stati (tranne dismesso/esente).
  if (m.scadenza_revisione && statoScadenza(m.scadenza_revisione, 30) === "scaduto"){
    return "revisionare";
  }
  return m.stato_manuale || "operativo";
}

function labelStatoMezzo(s){
  const map = { operativo:"Operativo", revisionare:"Revisionare", in_manutenzione:"In Manutenzione", dismesso:"Dismesso" };
  return map[s] || s;
}

function renderAutomezziGrid(){
  const f = _automezziFiltro;
  const filtrati = _automezziCache.filter(m => {
    if (f.search && !m.targa.toLowerCase().includes(f.search.toLowerCase())) return false;
    if (f.categoria && m.categoria !== f.categoria) return false;
    if (f.posizione && m.posizione !== f.posizione) return false;
    if (f.proprietario && m.proprietario !== f.proprietario) return false;
    return true;
  });

  const attivi = filtrati.filter(m => m.stato_manuale !== "dismesso");
  const dismessi = filtrati.filter(m => m.stato_manuale === "dismesso");

  document.getElementById("am-results-count").textContent = `${attivi.length} di ${_automezziCache.filter(m=>m.stato_manuale!=="dismesso").length} mezzi attivi`;

  const grid = document.getElementById("am-grid");
  if (attivi.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="ic">🔍</div>Nessun mezzo corrisponde ai filtri.</div>`;
  } else {
    grid.innerHTML = renderCardMezziHtml(attivi);
    attaccaListenerCardMezzi(grid);
  }

  // Sezione dismessi, collassabile, in fondo
  let sezioneDismessi = document.getElementById("am-sezione-dismessi");
  if (!sezioneDismessi){
    sezioneDismessi = document.createElement("div");
    sezioneDismessi.id = "am-sezione-dismessi";
    sezioneDismessi.className = "collapse-block";
    sezioneDismessi.style.marginTop = "20px";
    grid.parentElement.appendChild(sezioneDismessi);
  }
  if (dismessi.length === 0){
    sezioneDismessi.style.display = "none";
  } else {
    sezioneDismessi.style.display = "block";
    sezioneDismessi.innerHTML = `
      <button class="collapse-head" id="toggle-am-dismessi">
        <span>🗑️ Mezzi dismessi</span>
        <span class="collapse-badge" style="display:inline-block;background:var(--grigio-600);">${dismessi.length}</span>
        <span class="collapse-arrow">▾</span>
      </button>
      <div class="collapse-body" id="body-am-dismessi"><div class="card-grid">${renderCardMezziHtml(dismessi)}</div></div>
    `;
    attaccaListenerCardMezzi(sezioneDismessi);
    const toggle = document.getElementById("toggle-am-dismessi");
    const bodyDism = document.getElementById("body-am-dismessi");
    toggle.addEventListener("click", () => {
      const apri = bodyDism.style.display !== "block";
      bodyDism.style.display = apri ? "block" : "none";
      toggle.querySelector(".collapse-arrow").textContent = apri ? "▴" : "▾";
    });
  }
}

function renderCardMezziHtml(elenco){
  return elenco.map(m => {
    const statoOp = statoOperativoMezzo(m);

    return `

          ${fotoUrl ? `<img src="${fotoUrl}" alt="${escapeHtml(m.targa)}" onerror="this.parentElement.innerHTML='<span class=ph>🚐</span>'">` : `<span class="ph">🚐</span>`}
          ${m.categoria ? `<span class="badge-cat">${m.categoria}</span>` : ""}

        <div class="info">
          <span class="badge-stato-mezzo ${statoOp}">${labelStatoMezzo(statoOp)}</span>
          <div class="targa">${escapeHtml(m.targa)}</div>

async function eliminaMezzo(id){

  if (error){ alert("Errore: " + error.message); return; }
  chiudiModal();
  renderAutomezzi();
  refreshAlertBadge();
}

function renderTabFotoMezzo(){
  const m = _modalMezzoCorrente;
  const body = document.getElementById("modal-body");
  const lati = [
    { key:"fronte", label:"Fronte (copertina)" },
    { key:"retro", label:"Retro" },
    { key:"sx", label:"Fianco sinistro" },
    { key:"dx", label:"Fianco destro" }
  ];

  body.innerHTML = `
    <div class="foto-grid4">
      ${lati.map(l => {
        const has = m["foto_" + l.key];
        const url = has ? urlFotoMezzo(m.targa, l.key) + "?t=" + Date.now() : null;
        return `
          <div class="foto-slot" id="slot-${l.key}">
            ${url ? `<img src="${url}">` : `<div class="ph"><span class="ic">📷</span>${l.label}</div>`}
            <div class="lbl">${l.label}</div>
            <input type="file" accept="image/*,.heic,.heif" data-lato="${l.key}">
          </div>
        `;
      }).join("")}
    </div>
    <p style="font-size:12px;color:var(--grigio-600);">Tocca un riquadro per caricare o sostituire la foto. Le immagini si salvano automaticamente.</p>
  `;

  body.querySelectorAll('input[type="file"]').forEach(input => {
    input.addEventListener("change", async (e) => {
      let file = e.target.files[0];
      if (!file) return;
      const lato = e.target.dataset.lato;
      const slot = document.getElementById("slot-" + lato);
      slot.classList.add("uploading");

      // Rileva HEIC/HEIF (foto iPhone) e converte in JPEG prima dell'upload,
      // perché Supabase Storage non accetta quel formato.
      const isHeic = /\.heic$/i.test(file.name) || /\.heif$/i.test(file.name) ||
                     file.type === "image/heic" || file.type === "image/heif";
      if (isHeic){
        try{
          const blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.85 });
          file = new File([blob], file.name.replace(/\.(heic|heif)$/i, ".jpg"), { type: "image/jpeg" });
        }catch(convErr){
          slot.classList.remove("uploading");
          alert("Errore nella conversione della foto HEIC. Riprova o usa un'altra foto.");
          return;
        }
      }

      const path = pathFotoMezzo(m.targa, lato);
      const { error } = await sb.storage.from(STORAGE_BUCKET_MEZZI).upload(path, file, { upsert: true, contentType: "image/jpeg" });

      slot.classList.remove("uploading");

      if (error){
        alert("Errore upload: " + error.message);
        return;
      }

      // aggiorna flag in DB
      const campo = "foto_" + lato;
      await sb.from("automezzi").update({ [campo]: true }).eq("id", m.id);
      m[campo] = true;
      const idx = _automezziCache.findIndex(x => x.id === m.id);
      if (idx >= 0) _automezziCache[idx][campo] = true;

      renderTabFotoMezzo();
      if (lato === "fronte") renderAutomezziGrid();
    });
  });
}

async function caricaDocumenti(){
  const m = _modalMezzoCorrente;
  const { data, error } = await sb.from("documenti_automezzi").select("*").eq("automezzo_id", m.id).order("created_at", { ascending:false });
  const wrap = document.getElementById("documenti-list");
  if (!wrap) return;

let _tlcCache = [];

}
let _tlcCategorie = [];
let _tlcMarche = [];
let _tlcSottocategorieRadio = [];
let _tlcFiltro = { search:"", categoria:"", marca:"" };

  const { data } = await sb.from("tlc_categorie").select("*").order("nome");

}

async function caricaMarcheTlc(){
  const { data } = await sb.from("tlc_marche").select("*").order("nome");
  _tlcMarche = (data || []).map(m => m.nome);
}

async function caricaSottocategorieRadioTlc(){

  await caricaSottocategorieRadioTlc();

  content.innerHTML = `

        <option value="">Tutte le categorie</option>
        ${_tlcCategorie.map(c =>
          `<option value="${c}" ${_tlcFiltro.categoria===c?"selected":""}>${c}</option>`).join("")}
      </select>
      <select id="tlc-filtro-marca">
        <option value="">Tutte le marche</option>
        ${_tlcMarche.map(c =>
          `<option value="${c}" ${_tlcFiltro.marca===c?"selected":""}>${c}</option>`).join("")}
      </select>
      ${soloLettura ? "" : `<button class="btn-add" id="tlc-btn-nuovo">+ Nuovo apparato</button>`}
      <button class="btn-add" id="tlc-btn-movimentazioni" style="background:var(--blu-700);">📋 Movimentazioni</button>
      <button class="btn-add" id="tlc-btn-export-excel" style="background:var(--verde);">📊 Esporta Excel</button>
      ${soloLettura ? "" : `
        <label class="btn-add" style="background:var(--grigio-600);cursor:pointer;">
          📥 Importa Excel
          <input type="file" id="tlc-input-import-excel" accept=".xlsx,.xls" style="display:none;">
        </label>
      `}
    </div>
    <div class="results-count" id="tlc-results-count"></div>
    <div class="card-grid" id="tlc-grid"></div>
  `;

  document.getElementById("tlc-search").addEventListener("input", e => { _tlcFiltro.search = e.target.value; renderTlcGrid(); });
  document.getElementById("tlc-filtro-categoria").addEventListener("change", e => { _tlcFiltro.categoria = e.target.value; renderTlcGrid(); });
  document.getElementById("tlc-filtro-marca").addEventListener("change", e => { _tlcFiltro.marca = e.target.value; renderTlcGrid(); });
  if (!soloLettura) document.getElementById("tlc-btn-nuovo").addEventListener("click", () => apriModalTlc(null));
  document.getElementById("tlc-btn-movimentazioni").addEventListener("click", () => renderMovimentazioniTlc());
  document.getElementById("tlc-btn-export-excel").addEventListener("click", () => esportaMagazzinoTlcExcel());
  if (!soloLettura) document.getElementById("tlc-input-import-excel").addEventListener("change", (ev) => importaMagazzinoTlcExcel(ev));

  renderTlcGrid();

function esportaMagazzinoTlcExcel(){
  const dati = _tlcCache.map(a => ({
    "Codice ANA": a.codice_ana,
    "Categoria": a.categoria || "",
    "Sottocategoria (solo Radio)": a.sottocategoria_radio || "",
    "Marca": a.marca || "",
    "Modello": a.modello || "",
    "Matricola": a.matricola || "",
    "Selettiva": a.selettiva || "",
    "Assegnato a": a.assegnato_a || "",
    "Descrizione": a.descrizione || "",
    "Note": a.note || ""
  }));
  const ws = XLSX.utils.json_to_sheet(dati);
  ws["!cols"] = Object.keys(dati[0]||{}).map(() => ({ wch: 18 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Magazzino TLC");
  XLSX.writeFile(wb, `Magazzino_TLC_${new Date().toISOString().slice(0,10)}.xlsx`);
}

async function importaMagazzinoTlcExcel(ev){
  const file = ev.target.files[0];
  if (!file) return;
  ev.target.value = "";

  if (!confirm(`Importare il magazzino da ${file.name}?\n\nSe il Codice ANA esiste già, la riga verrà aggiornata. Se non esiste, verrà creato un nuovo apparato.`)) return;

  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(255,255,255,0.9);z-index:600;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;";
  overlay.innerHTML = `<div class="loading-spin">Importazione in corso…</div><div id="import-tlc-excel-progress" style="font-size:13px;color:var(--grigio-600);"></div>`;
  document.body.appendChild(overlay);
  const progressEl = overlay.querySelector("#import-tlc-excel-progress");

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:"array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const righe = XLSX.utils.sheet_to_json(ws, { defval:"" });

    let creati = 0, aggiornati = 0, errori = [];
    let i = 0;
    for (const riga of righe){
      i++;
      progressEl.textContent = `${i} di ${righe.length}…`;

      const codiceAna = String(riga["Codice ANA"] || "").trim().toUpperCase();
      if (!codiceAna){
        errori.push(`Riga ${i+1}: Codice ANA mancante, saltata.`);
        continue;
      }

      const payload = {
        codice_ana: codiceAna,
        categoria: String(riga["Categoria"] || "").trim().toUpperCase() || null,
        sottocategoria_radio: String(riga["Sottocategoria (solo Radio)"] || "").trim().toUpperCase() || null,
        marca: String(riga["Marca"] || "").trim().toUpperCase() || null,
        modello: String(riga["Modello"] || "").trim() || null,
        matricola: String(riga["Matricola"] || "").trim() || null,
        selettiva: String(riga["Selettiva"] || "").trim().toUpperCase() || null,
        assegnato_a: String(riga["Assegnato a"] || "").trim() || null,
        descrizione: String(riga["Descrizione"] || "").trim() || null,
        note: String(riga["Note"] || "").trim() || null
      };

      try{
        const { data: esistente } = await sb.from("tlc_apparati").select("id").eq("codice_ana", codiceAna).maybeSingle();
        if (esistente){
          const { error } = await sb.from("tlc_apparati").update(payload).eq("id", esistente.id);
          if (error) throw error;
          aggiornati++;
        } else {
          const { error } = await sb.from("tlc_apparati").insert(payload);
          if (error) throw error;
          creati++;
        }
      }catch(err){
        errori.push(`${codiceAna}: ${err.message}`);
      }
    }

    overlay.remove();
    let msg = `Import completato.\nNuovi apparati: ${creati}\nApparati aggiornati: ${aggiornati}`;
    if (errori.length) msg += `\n\nErrori (${errori.length}):\n` + errori.join("\n");
    alert(msg);

    renderTlc();

  }catch(err){
    overlay.remove();
    alert("Errore nella lettura del file: " + err.message);
  }
}

function renderTlcGrid(){
  const f = _tlcFiltro;
  const filtrati = _tlcCache.filter(a => {
    if (f.search){
      const q = f.search.toLowerCase();
      const campi = [a.codice_ana, a.selettiva, a.marca, a.modello, a.matricola, a.assegnato_a, a.descrizione];
      const trovato = campi.some(c => (c || "").toLowerCase().includes(q));
      if (!trovato) return false;
    }
    if (f.categoria && a.categoria !== f.categoria) return false;
    if (f.marca && a.marca !== f.marca) return false;
    return true;
  });

  document.getElementById("tlc-results-count").textContent = `${filtrati.length} di ${_tlcCache.length} apparati`;

  const grid = document.getElementById("tlc-grid");
  if (filtrati.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="ic">🔍</div>Nessun apparato corrisponde ai filtri.</div>`;
    return;
  }

  grid.innerHTML = filtrati.map(a => {
    const inUscita = _idApparatiInUsoTlc.has(a.id);
    return `
    <div class="veicolo-card tlc-card" data-id="${a.id}">
      <div class="tlc-card-head">
        ${a.categoria ? `<span class="badge-cat" style="position:static;">${a.categoria}${a.sottocategoria_radio ? ' · '+a.sottocategoria_radio : ''}</span>` : ""}
        ${inUscita ? `<span class="badge-stato-mezzo revisionare" style="margin:0;">Uscita</span>` : ""}
      </div>
      <div class="info">
        <div class="targa">${escapeHtml(a.codice_ana)}</div>
        <div class="modello">${escapeHtml(a.marca || "")} ${escapeHtml(a.modello || "")}</div>
        <div class="meta">
          ${a.assegnato_a ? `<span>${escapeHtml(a.assegnato_a)}</span>` : `<span>Non assegnato</span>`}
          ${a.selettiva ? `<span>${escapeHtml(a.selettiva)}</span>` : ""}
        </div>
      </div>
    </div>
  `;
  }).join("");

  grid.querySelectorAll(".veicolo-card").forEach(el => {
    el.addEventListener("click", () => apriModalTlc(parseInt(el.dataset.id), livelloPermesso("tlc") !== "completo"));
  });
}

  renderModalTlc();
}

function renderModalTlc(){
  chiudiModal();
  const a = _modalTlcCorrente;
  const isNuovo = !a;

  const overlay = document.createElement("div");
  overlay.id = "modal-overlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <h3 style="display:flex;align-items:center;gap:8px;flex:1;">
          ${isNuovo
            ? `Nuovo apparato`
            : `<input id="input-codice-ana-header" value="${escapeHtml(a.codice_ana||"")}" ${_modalTlcSoloLettura?"disabled":""} style="font-size:16px;font-weight:700;color:var(--blu-900);font-family:monospace;border:1px solid var(--grigio-400);border-radius:6px;padding:4px 8px;width:160px;">`}
        </h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      ${isNuovo ? "" : ""}
      <div class="modal-body" id="modal-body"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) chiudiModal(); });
  overlay.querySelectorAll(".modal-tab").forEach(tab => {
    tab.addEventListener("click", () => { _modalTlcTab = tab.dataset.tab; renderModalTlc(); });
  });

  renderTabDatiTlc();
}

async function generaProssimoCodiceAna(){
  const { data } = await sb
    .from("tlc_apparati")
    .select("codice_ana")
    .ilike("codice_ana", "TLC%")
    .order("codice_ana", { ascending: false });

  let max = 0;
  (data || []).forEach(r => {
    const m = (r.codice_ana || "").match(/^TLC(\d+)$/);
    if (m){
      const n = parseInt(m[1], 10);
      if (n > max) max = n;
    }
  });
  return "TLC" + String(max + 1).padStart(4, "0");
}

function renderTabDatiTlc(){
  const a = _modalTlcCorrente || {};
  const ro = _modalTlcSoloLettura ? "disabled" : "";
  const isNuovo = !a.id;
  const body = document.getElementById("modal-body");
  body.innerHTML = `
    <form id="form-tlc">
      ${_modalTlcSoloLettura ? `<p style="font-size:12px;color:var(--grigio-600);margin-top:0;">Visualizzazione in sola lettura. Il tuo livello di accesso TLC non permette modifiche agli apparati.</p>` : ""}
      <div class="form-grid">
        ${isNuovo ? `
        <div class="form-field full">
          <label>Codice ANA</label>
          <input name="codice_ana" placeholder="Lascia vuoto per generazione automatica (es. TLC0008)">
        </div>` : ""}
        <div class="form-field">
          <label>Categoria</label>
          <select name="categoria" id="select-categoria-tlc" ${ro}>
            <option value="">—</option>
            ${_tlcCategorie.map(c => `<option value="${c}" ${a.categoria===c?"selected":""}>${c}</option>`).join("")}
          </select>
        </div>
        <div class="form-field" id="campo-sottocategoria-radio" style="${a.categoria==='RADIO' ? '' : 'display:none;'}">
          <label>Sottocategoria *</label>
          <select name="sottocategoria_radio" ${ro}>
            <option value="">—</option>
            ${_tlcSottocategorieRadio.map(s => `<option value="${s}" ${a.sottocategoria_radio===s?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
        <div class="form-field">
          <label>Marca</label>
          <select name="marca" ${ro}>
            <option value="">—</option>
            ${_tlcMarche.map(m => `<option value="${m}" ${a.marca===m?"selected":""}>${m}</option>`).join("")}
          </select>
        </div>
        <div class="form-field"><label>Modello</label><input name="modello" value="${escapeHtml(a.modello||"")}" ${ro}></div>
        <div class="form-field"><label>Matricola</label><input name="matricola" value="${escapeHtml(a.matricola||"")}" ${ro}></div>
        <div class="form-field"><label>Assegnato a</label><input name="assegnato_a" value="${escapeHtml(a.assegnato_a||"")}" ${ro}></div>
        <div class="form-field"><label>Selettiva</label><input name="selettiva" value="${escapeHtml(a.selettiva||"")}" ${ro}></div>
        <div class="form-field full"><label>Descrizione</label><input name="descrizione" value="${escapeHtml(a.descrizione||"")}" ${ro}></div>
        <div class="form-field full"><label>Note</label><textarea name="note" ${ro}>${escapeHtml(a.note||"")}</textarea></div>
      </div>
      <div class="form-actions">
        ${(a.id && !_modalTlcSoloLettura) ? `<button type="button" class="btn-danger" id="btn-elimina-tlc">Elimina apparato</button>` : ""}
        <button type="button" class="btn-cancel" id="btn-cancel-tlc">${_modalTlcSoloLettura ? "Chiudi" : "Annulla"}</button>
        ${_modalTlcSoloLettura ? "" : `<button type="submit" class="btn-save">Salva</button>`}
      </div>
    </form>
  `;

  if (!_modalTlcSoloLettura){
    document.getElementById("select-categoria-tlc").addEventListener("change", (e) => {
      document.getElementById("campo-sottocategoria-radio").style.display = e.target.value === "RADIO" ? "block" : "none";
    });
  }

  document.getElementById("btn-cancel-tlc").addEventListener("click", chiudiModal);
  if (a.id && !_modalTlcSoloLettura) document.getElementById("btn-elimina-tlc").addEventListener("click", () => eliminaTlc(a.id));
  if (_modalTlcSoloLettura) return; // niente submit da agganciare

  document.getElementById("form-tlc").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);

    if (fd.get("categoria") === "RADIO" && !fd.get("sottocategoria_radio")){
      alert("Seleziona la sottocategoria per gli apparati di categoria RADIO.");
      return;
    }

    let codiceAna = a.codice_ana;
    if (isNuovo){
      codiceAna = (fd.get("codice_ana") || "").trim().toUpperCase();
      if (!codiceAna){
        codiceAna = await generaProssimoCodiceAna();
      }
    } else if (document.getElementById("input-codice-ana-header")){
      codiceAna = document.getElementById("input-codice-ana-header").value.trim().toUpperCase();
    }

    const payload = {
      codice_ana: codiceAna,
      selettiva: fd.get("selettiva") ? fd.get("selettiva").trim().toUpperCase() : null,
      marca: fd.get("marca") || null,
      categoria: fd.get("categoria") || null,
      sottocategoria_radio: fd.get("categoria") === "RADIO" ? (fd.get("sottocategoria_radio") || null) : null,
      modello: fd.get("modello") || null,
      matricola: fd.get("matricola") || null,
      assegnato_a: fd.get("assegnato_a") || null,
      descrizione: fd.get("descrizione") || null,
      note: fd.get("note") || null
    };
    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    let result;
    if (a.id){
      result = await sb.from("tlc_apparati").update(payload).eq("id", a.id).select().single();
    } else {
      result = await sb.from("tlc_apparati").insert(payload).select().single();
    }

    if (result.error){ alert("Errore: " + result.error.message); btn.disabled=false; btn.textContent="Salva"; return; }

    chiudiModal();
    renderTlc();
  });
}

async function eliminaTlc(id){
  if (!confirm("Eliminare definitivamente questo apparato?")) return;
  const { error } = await sb.from("tlc_apparati").delete().eq("id", id);
  if (error){ alert("Errore: " + error.message); return; }
  chiudiModal();
  renderTlc();
}

/* ---------- HELPER: canvas firma (mouse/touch) ---------- */
function creaCanvasFirma(containerEl){
  containerEl.innerHTML = `<div class="firma-canvas-wrap"><canvas></canvas></div>
    <div class="firma-actions"><button type="button" class="firma-clear">Cancella firma</button></div>`;
  const canvas = containerEl.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  let hasDrawn = false;

  function resize(){
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return; // contenitore non ancora visibile
    const ratio = window.devicePixelRatio || 1;

    // Salva il disegno corrente (se c'è) per ridisegnarlo dopo il resize
    let immagine = null;
    if (hasDrawn && canvas.width > 0 && canvas.height > 0){
      immagine = canvas.toDataURL("image/png");
    }

    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#0b2545";

    if (immagine){
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, 0, 0, rect.width, rect.height); };
      img.src = immagine;
    }
  }
  resize();

  // Ridisegna se cambia dimensione/orientamento del contenitore (es. rotazione telefono)
  let resizeTimeout = null;
  const onResize = () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(resize, 150);
  };
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);
  if (window.ResizeObserver){
    const ro = new ResizeObserver(onResize);
    ro.observe(containerEl);
  }

  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e){ drawing = true; hasDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e){ if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  canvas.addEventListener("touchstart", start, { passive:false });
  canvas.addEventListener("touchmove", move, { passive:false });
  canvas.addEventListener("touchend", end);

  containerEl.querySelector(".firma-clear").addEventListener("click", () => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    hasDrawn = false;
  });

  return {
    isEmpty: () => !hasDrawn,
    toPng: () => canvas.toDataURL("image/png")
  };
}

              </label>

        `}).join("")}

  `;

  });

function pathBollaFirmata(sezione, stato, dataUscita, dataRientro, estensione){
  const tipo = stato === "rientrato" ? "rientro" : "uscita";
  const dataRif = (tipo === "rientro" && dataRientro) ? dataRientro : dataUscita;
  const sezioneSlug = sezione.replace(/\s+/g, "_");
  return `Bolla_TLC_${dataRif}_${tipo}_${sezioneSlug}.${estensione}`;
}

async function caricaBollaFirmata(input){
  const file = input.files[0];
  if (!file) return;
  const movId = parseInt(input.dataset.uploadBolla);
  const estensione = file.name.split(".").pop().toLowerCase();
  const path = pathBollaFirmata(input.dataset.sezione, input.dataset.stato, input.dataset.dataUscita, input.dataset.dataRientro, estensione);
  const vecchioPath = input.dataset.vecchioPath;

  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_BOLLE).upload(path, file, { upsert: true });
  if (upErr){ alert("Errore upload: " + upErr.message); return; }

  if (vecchioPath && vecchioPath !== path){
    await sb.storage.from(STORAGE_BUCKET_BOLLE).remove([vecchioPath]);
  }

  const { error } = await sb.from("movimentazioni_tlc").update({ bolla_path: path }).eq("id", movId);
  if (error){ alert("Errore: " + error.message); return; }

  renderMovimentazioniTlc();
}

    const apparatiDettaglio = disponibili.filter(a => apparatiSelezionati.includes(a.id));
    await generaEArchiviaBollaTlc(mov, apparatiDettaglio);

    chiudiModal();
    renderMovimentazioniTlc();
  });
}

async function registraRientroTlc(movId){
  const { data: mov, error: errMov } = await sb.from("movimentazioni_tlc").select("*").eq("id", movId).single();
  if (errMov){ alert("Errore: " + errMov.message); return; }

  if (mov.tipo_firma === "digitale"){
    apriModalFirmaRientro(mov);
    return;
  }

  if (!state.profile.firma_personale_path){
    alert("Devi avere una firma personale salvata (Impostazioni → La mia firma personale) per riprendere in carico il materiale.");
    return;
  }

  // autografa: chiede solo la data, la scansione del ricevente si carica dopo con "Carica firmata".
  // La firma app (chi riprende in carico) è invece sempre quella personale automatica.
  const dataRientro = prompt("Data di rientro (GG/MM/AAAA):", new Date().toLocaleDateString("it-IT"));
  if (!dataRientro) return;
  const iso = parseDataItInput(dataRientro);
  if (!iso){ alert("Formato data non valido."); return; }
  if (iso < mov.data_uscita){
    alert("La data di rientro non può essere precedente alla data di uscita.");
    return;
  }

  let firmaAppPng = null;
  try{
    const { data: u } = sb.storage.from(STORAGE_BUCKET_FIRME_PERSONALI).getPublicUrl(state.profile.firma_personale_path);
    const resp = await fetch(u.publicUrl);
    const blob = await resp.blob();
    firmaAppPng = await new Promise((res) => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.readAsDataURL(blob);
    });
  }catch(err){ firmaAppPng = null; }

  const { error } = await sb.from("movimentazioni_tlc").update({
    data_rientro: iso,
    stato: "rientrato",
    ripreso_da: state.user.id,
    ripreso_da_nome: state.profile.nome,
    firma_ripresa_app_png: firmaAppPng
  }).eq("id", movId);
  if (error){ alert("Errore: " + error.message); return; }
  renderMovimentazioniTlc();
}

function parseDataItInput(s){
  const parts = s.split("/");
  if (parts.length !== 3) return null;
  return `${parts[2]}-${parts[1].padStart(2,"0")}-${parts[0].padStart(2,"0")}`;
}

          <div class="form-grid">
            <div class="form-field"><label>Data rientro</label><input type="date" name="data_rientro" value="${new Date().toISOString().slice(0,10)}" required></div>
            <div class="form-field"><label>Ripreso in carico da</label><input value="${escapeHtml(state.profile.nome)}" disabled></div>

            <div class="form-field full" style="background:var(--grigio-100);border-radius:8px;padding:12px;">
              <p style="font-size:12px;color:var(--grigio-800);margin:0;">${escapeHtml(TESTO_RESPONSABILITA_TLC)}</p>
            </div>

            <div class="form-field full">
              <label>Firma di restituzione (${escapeHtml(mov.operatore)})</label>
              <div id="canvas-firma-rientro"></div>
            </div>
            <div class="form-field full">
              <label>Firma di ripresa in carico (tua firma personale)</label>
              ${haFirmaPersonale
                ? `<p style="font-size:12px;color:var(--verde);margin:4px 0;">✓ Verrà usata automaticamente la tua firma personale salvata in Impostazioni.</p>`
                : `<p style="font-size:12px;color:var(--rosso);margin:4px 0;">Non hai una firma personale salvata. Vai in Impostazioni → "La mia firma personale" prima di continuare.</p>`}
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-cancel" id="btn-cancel-rientro">Annulla</button>
            <button type="submit" class="btn-save">Registra rientro</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  document.getElementById("btn-cancel-rientro").addEventListener("click", chiudiModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) chiudiModal(); });

  const firmaRientro = creaCanvasFirma(document.getElementById("canvas-firma-rientro"));

  document.getElementById("form-rientro-tlc").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (firmaRientro.isEmpty()){ alert("Firma di restituzione mancante."); return; }
    if (!haFirmaPersonale){ alert("Devi avere una firma personale salvata per riprendere in carico il materiale."); return; }
    const fd = new FormData(e.target);

    const dataRientroForm = fd.get("data_rientro");
    if (dataRientroForm < mov.data_uscita){
      alert("La data di rientro non può essere precedente alla data di uscita.");
      return;
    }

    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    let firmaAppPng = null;
    try{
      const { data: u } = sb.storage.from(STORAGE_BUCKET_FIRME_PERSONALI).getPublicUrl(state.profile.firma_personale_path);
      const resp = await fetch(u.publicUrl);
      const blob = await resp.blob();
      firmaAppPng = await new Promise((res) => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result);
        reader.readAsDataURL(blob);
      });
    }catch(err){ firmaAppPng = null; }

    const aggiornato = {
      data_rientro: fd.get("data_rientro"),
      stato: "rientrato",
      firma_restituzione_png: firmaRientro.toPng(),
      ripreso_da: state.user.id,
      ripreso_da_nome: state.profile.nome,
      firma_ripresa_app_png: firmaAppPng
    };
    const { data: movAggiornato, error } = await sb.from("movimentazioni_tlc").update(aggiornato).eq("id", mov.id).select().single();
    if (error){ alert("Errore: " + error.message); btn.disabled=false; btn.textContent="Registra rientro"; return; }

    await generaEArchiviaBollaTlc(movAggiornato, apparati, { scarica: true });

    chiudiModal();
    renderMovimentazioniTlc();
  });
}

async function generaEArchiviaBollaTlc(mov, apparati, opzioni){
  opzioni = opzioni || {};
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  // Loghi: ANA a sinistra, Volontariato a destra (entrambi quadrati)
  try{ doc.addImage(LOGO_ANA_V2_BASE64, "PNG", 14, 8, 24, 24); }catch(e){}
  try{ doc.addImage(LOGO_VOLONTARIATO_V2_BASE64, "PNG", 172, 8, 24, 24); }catch(e){}

  doc.setFontSize(11);
  doc.setFont(undefined, "bold");
  doc.setTextColor(46, 125, 50); // verde, coerente con i loghi
  doc.text("ASSOCIAZIONE NAZIONALE ALPINI", 105, 13, { align:"center" });
  doc.text("PROTEZIONE CIVILE 1 RAGGRUPPAMENTO", 105, 19, { align:"center" });
  doc.setTextColor(0, 0, 0);
  doc.setFont(undefined, "normal");
  doc.setFontSize(9.5);
  doc.text("Piemonte - Liguria - Valle D'Aosta", 105, 25, { align:"center" });
  doc.setFontSize(9);
  doc.setFont(undefined, "italic");
  doc.text("Specialità TLC", 105, 30, { align:"center" });
  doc.setFont(undefined, "normal");
  doc.line(14, 36, 196, 36);

  doc.setFontSize(12);
  doc.text("Bolla di movimentazione apparati TLC", 14, 44);
  doc.setFontSize(9);
  doc.text(`N. movimentazione: ${mov.id}`, 14, 50);

  let y = 61;
  const yStart = y;
  doc.setFontSize(10);

  // Colonna sinistra: dati di movimento (date, utenti app)
  let yL = yStart;
  doc.text(`Data uscita: ${formatDataIt(mov.data_uscita)}`, 14, yL); yL += 7;
  doc.text(`Consegnato da: ${mov.consegnato_da_nome || "—"}`, 14, yL); yL += 7;
  if (mov.data_rientro){
    doc.text(`Data rientro: ${formatDataIt(mov.data_rientro)}`, 14, yL); yL += 7;
    doc.text(`Ripreso in carico da: ${mov.ripreso_da_nome || "—"}`, 14, yL); yL += 7;
  }

  // Colonna destra: dati del ricevente
  let yR = yStart;
  doc.text(`Ricevente: ${mov.operatore}`, 110, yR); yR += 7;
  doc.text(`Sezione ANA: ${mov.sezione_ana}`, 110, yR); yR += 7;
  if (mov.motivo){ doc.text(`Motivo: ${mov.motivo}`, 110, yR); yR += 7; }

  y = Math.max(yL, yR) + 4;

  doc.setFont(undefined, "bold");
  doc.text("Apparati assegnati", 14, y); y += 6;
  doc.setFont(undefined, "normal");
  doc.text("Selettiva", 14, y);
  doc.text("Marca/Modello", 60, y);
  doc.text("Categoria", 130, y);
  doc.text("Matricola", 165, y);
  y += 4;
  doc.line(14, y, 196, y);
  y += 6;

  apparati.forEach(a => {
    doc.text(a.selettiva, 14, y);
    doc.text(`${a.marca||""} ${a.modello||""}`.trim().slice(0,30), 60, y);
    doc.text(a.categoria||"—", 130, y);
    doc.text(a.matricola||"—", 165, y);
    y += 7;
  });

  // Blocco firme ancorato in fondo alla pagina, con testo responsabilità appena sopra
  const PAGE_HEIGHT = 297; // A4 in mm
  let yFirme = PAGE_HEIGHT - (mov.stato === "rientrato" ? 62 : 38);

  doc.setFontSize(8.5);
  const testoResp = doc.splitTextToSize(TESTO_RESPONSABILITA_TLC, 182);
  const altezzaTesto = testoResp.length * 4;
  doc.text(testoResp, 14, yFirme - altezzaTesto - 6);

  doc.setFontSize(10);
  doc.setFont(undefined, "bold");
  doc.text("Firma di consegna", 14, yFirme);
  doc.text("Firma di ricezione", 110, yFirme);
  yFirme += 4;

  if (mov.firma_consegna_app_png){
    try{ doc.addImage(mov.firma_consegna_app_png, "PNG", 14, yFirme, 70, 14); }catch(e){}
  }
  if (mov.firma_ricezione_png){
    try{ doc.addImage(mov.firma_ricezione_png, "PNG", 110, yFirme, 70, 14); }catch(e){}
  }
  yFirme += 16;
  doc.line(14, yFirme, 90, yFirme);
  doc.line(110, yFirme, 186, yFirme);
  yFirme += 5;
  doc.setFontSize(8);
  doc.setFont(undefined, "normal");
  doc.text(mov.consegnato_da_nome || "", 14, yFirme);
  doc.text(mov.operatore || "", 110, yFirme);
  yFirme += 8;

  // Riga 2: restituzione (ricevente) / ripresa in carico (utente app) — solo se rientrato
  if (mov.stato === "rientrato"){
    doc.setFontSize(10);
    doc.setFont(undefined, "bold");
    doc.text("Firma di restituzione", 14, yFirme);
    doc.text("Firma di ripresa in carico", 110, yFirme);
    yFirme += 4;

    if (mov.firma_restituzione_png){
      try{ doc.addImage(mov.firma_restituzione_png, "PNG", 14, yFirme, 70, 14); }catch(e){}
    }
    if (mov.firma_ripresa_app_png){
      try{ doc.addImage(mov.firma_ripresa_app_png, "PNG", 110, yFirme, 70, 14); }catch(e){}
    }
    yFirme += 16;
    doc.line(14, yFirme, 90, yFirme);
    doc.line(110, yFirme, 186, yFirme);
    yFirme += 5;
    doc.setFontSize(8);
    doc.setFont(undefined, "normal");
    doc.text(mov.operatore || "", 14, yFirme);
    doc.text(mov.ripreso_da_nome || "", 110, yFirme);
  }

  const blob = doc.output("blob");
  const tipo = mov.stato === "rientrato" ? "rientro" : "uscita";
  const dataRif = (tipo === "rientro" && mov.data_rientro) ? mov.data_rientro : mov.data_uscita;
  const sezioneSlug = mov.sezione_ana.replace(/\s+/g, "_");
  const path = `Bolla_TLC_${dataRif}_${tipo}_${sezioneSlug}.pdf`;

  const vecchioPath = mov.bolla_path;
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_BOLLE).upload(path, blob, { upsert: true, contentType: "application/pdf" });
  if (!upErr){
    if (vecchioPath && vecchioPath !== path){
      await sb.storage.from(STORAGE_BUCKET_BOLLE).remove([vecchioPath]);
    }
    await sb.from("movimentazioni_tlc").update({ bolla_path: path }).eq("id", mov.id);
  }

  if (opzioni.scarica !== false){
    doc.save(`bolla_movimentazione_${mov.id}_${tipo}.pdf`);
  }
}

async function caricaAttestatiMancanti(){
  const body = document.getElementById("attestati-mancanti-body");
  if (!body) return;
  body.innerHTML = `<div class="loading-spin">Verifica in corso…</div>`;

  const { data: datiGrezzi, error } = await sb
    .from("iscrizioni_corsi")
    .select("*, volontari_formazione(id, cognome, nome, sezione_ana), edizioni_corso!inner(label, data_corso, stato)")
    .eq("stato", "in_verifica")
    .eq("edizioni_corso.stato", "terminato");

  if (error){ body.innerHTML = `<p>Errore: ${escapeHtml(error.message)}</p>`; return; }

  const data = (datiGrezzi||[]).sort((a,b) => {
    const ca = a.volontari_formazione.cognome.localeCompare(b.volontari_formazione.cognome);
    return ca !== 0 ? ca : a.volontari_formazione.nome.localeCompare(b.volontari_formazione.nome);
  });

  if (!data || data.length === 0){
    body.innerHTML = `<div class="empty-state"><div class="ic">✅</div>Nessun attestato mancante: tutti gli iscritti ai corsi terminati sono completati o segnati assenti.</div>`;
    return;
  }

  body.innerHTML = `
    <p style="font-size:13px;color:var(--grigio-600);margin-top:0;">${data.length} iscrizioni su corsi terminati ancora "In verifica" — manca l'attestato o il flag Assente.</p>
    <table class="storico-table">
      <thead><tr><th>Cognome Nome</th><th>Sezione</th><th>Corso</th><th>Data</th><th>Assente</th><th>Attestato</th><th></th></tr></thead>
      <tbody>
        ${data.map(r => `
          <tr>
            <td>${escapeHtml(r.volontari_formazione.cognome)} ${escapeHtml(r.volontari_formazione.nome)}</td>
            <td>${escapeHtml(r.volontari_formazione.sezione_ana||"—")}</td>
            <td>${escapeHtml(r.edizioni_corso.label)}</td>
            <td>${r.edizioni_corso.data_corso ? formatDataIt(r.edizioni_corso.data_corso) : "—"}</td>
            <td><input type="checkbox" data-toggle-assente-mancanti="${r.id}"></td>
            <td>
              <label class="btn-add-mini" style="cursor:pointer;padding:5px 10px;font-size:11.5px;">Carica
                <input type="file" accept=".pdf,image/*" style="display:none;" data-upload-attestato-mancanti="${r.id}" data-volontario="${r.volontari_formazione.id}" data-cognome="${escapeHtml(r.volontari_formazione.cognome)}" data-nome="${escapeHtml(r.volontari_formazione.nome)}">
              </label>
            </td>
            <td><a href="#" data-apri-volontario="${r.volontari_formazione.id}" style="color:var(--blu-500);font-weight:600;">Apri scheda</a></td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
  body.querySelectorAll("[data-apri-volontario]").forEach(a => a.addEventListener("click", (ev) => {
    ev.preventDefault();
    apriModalVolontario(parseInt(a.dataset.apriVolontario), "ricerca");
  }));
  body.querySelectorAll("[data-toggle-assente-mancanti]").forEach(chk => chk.addEventListener("change", async (ev) => {
    if (!ev.target.checked) return;
    const iscrizioneId = parseInt(ev.target.dataset.toggleAssenteMancanti);
    await sb.from("iscrizioni_corsi").update({ stato: "assente" }).eq("id", iscrizioneId);
    caricaAttestatiMancanti();
  }));
  body.querySelectorAll("[data-upload-attestato-mancanti]").forEach(input => input.addEventListener("change", (ev) => caricaAttestatoDaListaMancanti(ev)));
}

async function caricaAttestatoDaListaMancanti(ev){
  const file = ev.target.files[0];
  if (!file) return;
  const iscrizioneId = parseInt(ev.target.dataset.uploadAttestatoMancanti);
  const volontarioId = parseInt(ev.target.dataset.volontario);
  const cognome = ev.target.dataset.cognome;
  const nome = ev.target.dataset.nome;

  const path = `${cognome}_${nome}/${Date.now()}_${file.name}`.replace(/\s+/g, "_");
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_DOC_VOLONTARI).upload(path, file);
  if (upErr){ alert("Errore upload: " + upErr.message); return; }

  const { error: errDoc } = await sb.from("documenti_volontario").insert({
    volontario_id: volontarioId,
    tipo: "attestato",
    nome_file: file.name,
    storage_path: path,
    created_by: state.user.id
  });
  if (errDoc){ alert("Errore: " + errDoc.message); return; }

  await sb.from("iscrizioni_corsi").update({ stato: "completato" }).eq("id", iscrizioneId);

  caricaAttestatiMancanti();
}


async function importaZipAttestati(ev){
  const file = ev.target.files[0];
  if (!file) return;
  ev.target.value = "";

  if (!confirm(`Importare gli attestati dal file ${file.name}?\n\nOgni PDF deve essere nominato con il codice fiscale del volontario (es. RSSMNL90H01G674A.pdf, o RSSMNL90H01G674A_2.pdf per attestati multipli della stessa persona).`)) return;

  const content = document.getElementById("page-content");
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(255,255,255,0.9);z-index:600;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;";
  overlay.innerHTML = `<div class="loading-spin">Importazione in corso, non chiudere questa pagina…</div><div id="import-zip-progress" style="font-size:13px;color:var(--grigio-600);"></div>`;
  document.body.appendChild(overlay);
  const progressEl = overlay.querySelector("#import-zip-progress");

  try{
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const pdfEntries = Object.values(zip.files).filter(f => !f.dir && /\.pdf$/i.test(f.name));

    let ok = 0, nonTrovati = [], errori = [];
    let i = 0;
    for (const entry of pdfEntries){
      i++;
      progressEl.textContent = `${i} di ${pdfEntries.length}…`;

      const nomeBase = entry.name.split("/").pop();
      const cfMatch = nomeBase.match(/^([A-Za-z0-9]{16})/);
      if (!cfMatch){
        errori.push(`${nomeBase}: nome file non contiene un codice fiscale valido`);
        continue;
      }
      const cf = cfMatch[1].toUpperCase();

      const { data: volontario } = await sb.from("volontari_formazione").select("id, cognome, nome").eq("codice_fiscale", cf).maybeSingle();
      if (!volontario){
        nonTrovati.push(`${nomeBase} (CF: ${cf})`);
        continue;
      }

      try{
        const blob = await entry.async("blob");
        const path = `${volontario.cognome}_${volontario.nome}/${Date.now()}_${nomeBase}`.replace(/\s+/g, "_");
        const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_DOC_VOLONTARI).upload(path, blob, { contentType: "application/pdf" });
        if (upErr) throw upErr;

        const { error: docErr } = await sb.from("documenti_volontario").insert({
          volontario_id: volontario.id,
          tipo: "attestato",
          nome_file: nomeBase,
          storage_path: path,
          created_by: state.user.id
        });
        if (docErr) throw docErr;
        ok++;
      }catch(err){
        errori.push(`${nomeBase}: ${err.message}`);
      }
    }

    overlay.remove();
    let msg = `Import completato.\nAttestati caricati: ${ok}\nVolontari non trovati: ${nonTrovati.length}`;
    if (nonTrovati.length) msg += `\n\nNon trovati:\n` + nonTrovati.join("\n");
    if (errori.length) msg += `\n\nErrori:\n` + errori.join("\n");
    alert(msg);

  }catch(err){
    overlay.remove();
    alert("Errore nella lettura dello ZIP: " + err.message);
  }
}

function labelStatoCorso(s){

function renderFormazioneList(){

  const filtrate = _edizioniCache.filter(e => {

  });

  document.getElementById("form-results-count").textContent = `${filtrate.length} di ${_edizioniCache.length} edizioni corso`;

  const wrap = document.getElementById("form-list");
  if (filtrate.length === 0){
    wrap.innerHTML = `<div class="empty-state"><div class="ic">🎓</div>Nessuna edizione corrisponde ai filtri.</div>`;
    return;
  }

  const statoClasseAlert = { programmato:"avvicinamento", in_corso:"avvicinamento", terminato:"ok", annullato:"scaduto" };

  wrap.innerHTML = `<div class="alert-list">` + filtrate.map(e => {
    const classeCss = statoClasseAlert[e.stato] === "scaduto" ? "scaduto" : (statoClasseAlert[e.stato] === "avvicinamento" ? "avvicinamento" : "");
    return `
    <div class="alert-row ${classeCss}" data-id="${e.id}" style="cursor:pointer;${classeCss==='' ? 'border-left-color:var(--verde);' : ''}">
      <span class="dot" style="${classeCss==='' ? 'background:var(--verde);' : ''}"></span>
      <span class="desc">${escapeHtml(e.label)} — ${escapeHtml(e.catalogo_corsi?.codice||"")} ${e.sede?`(${escapeHtml(e.sede)})`:""}</span>
      <span class="tag" style="background:var(--grigio-100);color:var(--grigio-800);">${labelStatoCorso(e.stato)}</span>
      <span class="data">${e.data_corso ? formatDataIt(e.data_corso) : "—"}</span>
    </div>
  `;
  }).join("") + `</div>`;

  wrap.querySelectorAll(".alert-row[data-id]").forEach(el => {
    el.addEventListener("click", () => apriModalEdizione(parseInt(el.dataset.id)));
  });
}

  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">

        <div id="ricerca-volontari-risultati"><div class="empty-state"><div class="ic">🔍</div>Digita almeno 2 caratteri per cercare.</div></div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  overlay.addEventListener("click", (ev) => { if (ev.target === overlay) chiudiModal(); });

async function eseguiRicercaVolontari(q){
  const wrap = document.getElementById("ricerca-volontari-risultati");
  if (!wrap) return;
  wrap.innerHTML = `<div class="loading-spin">Ricerca…</div>`;

  const { data, error } = await sb
    .from("volontari_formazione")
    .select("id, cognome, nome, sezione_ana, iscrizioni_corsi(stato, edizioni_corso(label, data_corso))")
    .or(`cognome.ilike.%${q}%,nome.ilike.%${q}%`)
    .order("cognome")
    .limit(30);

  if (error){ wrap.innerHTML = `<p>Errore: ${escapeHtml(error.message)}</p>`; return; }
  if (!data || data.length === 0){ wrap.innerHTML = `<div class="empty-state"><div class="ic">🔍</div>Nessun volontario trovato.</div>`; return; }

  wrap.innerHTML = `<div class="alert-list">` + data.map(v => {
    const corsi = (v.iscrizioni_corsi||[]).map(ic => ic.edizioni_corso).filter(Boolean);
    const ultimo = corsi.sort((a,b) => new Date(b.data_corso||0) - new Date(a.data_corso||0))[0];
    return `
      <div class="alert-row" data-id="${v.id}" style="cursor:pointer;border-left-color:var(--blu-500);">
        <span class="dot" style="background:var(--blu-500);"></span>
        <span class="desc">${escapeHtml(v.cognome)} ${escapeHtml(v.nome)} ${v.sezione_ana?`— ${escapeHtml(v.sezione_ana)}`:""}</span>
        <span class="data">${ultimo ? `Ultimo corso: ${escapeHtml(ultimo.label)}` : "Nessun corso registrato"}</span>
      </div>
    `;
  }).join("") + `</div>`;

  wrap.querySelectorAll(".alert-row[data-id]").forEach(el => {
    el.addEventListener("click", () => apriModalVolontario(parseInt(el.dataset.id), "ricerca"));
  });
}

async function caricaVolontariEdizione(){
  const e = _modalEdizioneCorrente;
  const terminato = e.stato === "terminato";
  const { data: datiGrezzi, error } = await sb
    .from("iscrizioni_corsi")
    .select("*, volontari_formazione(id, cognome, nome, sezione_ana)")
    .eq("edizione_corso_id", e.id);
  const data = (datiGrezzi||[]).sort((a,b) => {
    const ca = a.volontari_formazione.cognome.localeCompare(b.volontari_formazione.cognome);
    return ca !== 0 ? ca : a.volontari_formazione.nome.localeCompare(b.volontari_formazione.nome);
  });
  const wrap = document.getElementById("volontari-edizione-list");
  if (!wrap) return;
  if (error){ wrap.innerHTML = `<p>Errore: ${escapeHtml(error.message)}</p>`; return; }
  if (!data || data.length === 0){ wrap.innerHTML = `<div class="storico-empty">Nessun volontario iscritto a questa edizione.</div>`; return; }

  const idVolontari = data.map(r => r.volontari_formazione.id);
  const { data: documenti } = await sb
    .from("documenti_volontario")
    .select("id, volontario_id, storage_path, nome_file")
    .eq("tipo", "attestato")
    .in("volontario_id", idVolontari);
  const attestatoPerVolontario = {};
  (documenti||[]).forEach(d => { attestatoPerVolontario[d.volontario_id] = d; });

  if (!terminato){
    // Vista semplice: prima del termine corso, solo link attestato se presente
    wrap.innerHTML = `
      <table class="storico-table">
        <thead><tr><th>Cognome Nome</th><th>Sezione</th><th>Stato</th><th>Attestato</th></tr></thead>
        <tbody>
          ${data.map(r => {
            const doc = attestatoPerVolontario[r.volontari_formazione.id];
            let linkAttestato = "—";
            if (doc){
              const { data: u } = sb.storage.from(STORAGE_BUCKET_DOC_VOLONTARI).getPublicUrl(doc.storage_path);
              linkAttestato = `<a href="${u.publicUrl}" target="_blank" rel="noopener">Apri</a>`;
            }
            return `
            <tr>
              <td><a href="#" data-apri-volontario="${r.volontari_formazione.id}" style="color:var(--blu-500);font-weight:600;">${escapeHtml(r.volontari_formazione.cognome)} ${escapeHtml(r.volontari_formazione.nome)}</a></td>
              <td>${escapeHtml(r.volontari_formazione.sezione_ana||"—")}</td>
              <td>${labelStatoIscrizione(r.stato)}</td>
              <td>${linkAttestato}</td>
            </tr>
          `;
          }).join("")}
        </tbody>
      </table>
    `;
  } else {
    // Vista corso terminato: flag Assente + upload attestato per riga, stato calcolato
    wrap.innerHTML = `
      <table class="storico-table">
        <thead><tr><th>Cognome Nome</th><th>Sezione</th><th>Assente</th><th>Stato</th><th>Attestato</th></tr></thead>
        <tbody>
          ${data.map(r => {
            const doc = attestatoPerVolontario[r.volontari_formazione.id];
            const assente = r.stato === "assente";
            let cellaAttestato;
            if (doc){
              const { data: u } = sb.storage.from(STORAGE_BUCKET_DOC_VOLONTARI).getPublicUrl(doc.storage_path);
              cellaAttestato = `<a href="${u.publicUrl}" target="_blank" rel="noopener">Apri</a> &nbsp;
                <label style="cursor:pointer;color:var(--blu-500);font-size:11.5px;">Sostituisci
                  <input type="file" accept=".pdf,image/*" style="display:none;" data-upload-attestato="${r.id}" data-volontario="${r.volontari_formazione.id}" data-cognome="${escapeHtml(r.volontari_formazione.cognome)}" data-nome="${escapeHtml(r.volontari_formazione.nome)}">
                </label>`;
            } else if (assente){
              cellaAttestato = `<span style="color:var(--grigio-600);">—</span>`;
            } else {
              cellaAttestato = `<label class="btn-add-mini" style="cursor:pointer;padding:5px 10px;font-size:11.5px;">Carica
                <input type="file" accept=".pdf,image/*" style="display:none;" data-upload-attestato="${r.id}" data-volontario="${r.volontari_formazione.id}" data-cognome="${escapeHtml(r.volontari_formazione.cognome)}" data-nome="${escapeHtml(r.volontari_formazione.nome)}">
              </label>`;
            }
            return `
            <tr>
              <td><a href="#" data-apri-volontario="${r.volontari_formazione.id}" style="color:var(--blu-500);font-weight:600;">${escapeHtml(r.volontari_formazione.cognome)} ${escapeHtml(r.volontari_formazione.nome)}</a></td>
              <td>${escapeHtml(r.volontari_formazione.sezione_ana||"—")}</td>
              <td><input type="checkbox" data-toggle-assente="${r.id}" ${assente?"checked":""}></td>
              <td>${labelStatoIscrizione(r.stato)}</td>
              <td>${cellaAttestato}</td>
            </tr>
          `;
          }).join("")}
        </tbody>
      </table>
    `;

    wrap.querySelectorAll("[data-toggle-assente]").forEach(chk => chk.addEventListener("change", async (ev) => {
      const iscrizioneId = parseInt(ev.target.dataset.toggleAssente);
      const nuovoStato = ev.target.checked ? "assente" : "in_verifica";
      await sb.from("iscrizioni_corsi").update({ stato: nuovoStato }).eq("id", iscrizioneId);
      caricaVolontariEdizione();
    }));

    wrap.querySelectorAll("[data-upload-attestato]").forEach(input => input.addEventListener("change", (ev) => caricaAttestatoIscrizione(ev, e)));
  }

  wrap.querySelectorAll("[data-apri-volontario]").forEach(a => a.addEventListener("click", (ev) => {
    ev.preventDefault();
    apriModalVolontario(parseInt(a.dataset.apriVolontario), "edizione");
  }));
}

async function caricaAttestatoIscrizione(ev, edizione){
  const file = ev.target.files[0];
  if (!file) return;
  const iscrizioneId = parseInt(ev.target.dataset.uploadAttestato);
  const volontarioId = parseInt(ev.target.dataset.volontario);
  const cognome = ev.target.dataset.cognome;
  const nome = ev.target.dataset.nome;

  const path = `${cognome}_${nome}/${Date.now()}_${file.name}`.replace(/\s+/g, "_");
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_DOC_VOLONTARI).upload(path, file);
  if (upErr){ alert("Errore upload: " + upErr.message); return; }

  const { error: errDoc } = await sb.from("documenti_volontario").insert({
    volontario_id: volontarioId,
    tipo: "attestato",
    nome_file: file.name,
    storage_path: path,
    created_by: state.user.id
  });
  if (errDoc){ alert("Errore: " + errDoc.message); return; }

  await sb.from("iscrizioni_corsi").update({ stato: "completato" }).eq("id", iscrizioneId);

  caricaVolontariEdizione();
}

function labelStatoIscrizione(s){
  const map = { iscritto:"Iscritto", in_verifica:"In verifica", completato:"Completato", assente:"Assente" };
  return map[s] || s;
}

function scaricaTemplateExcelCorso(e){
  const intestazione = [
    ["", "", "COORDINAMENTO REGIONALE DEL VOLONTARIATO DI PROTEZIONE CIVILE DEL PIEMONTE ODV"],
    ["", "", "SCUOLA DI FORMAZIONE"],
    [],
    ["", "", "FORMAT PER INSERIMENTO DATI CORSISTI"],
    [],
    [],
    ["ASSOCIAZIONE NAZIONALE ALPINI - ELENCO GENERALE"],
    [],
    [`CORSO : ${e.catalogo_corsi?.codice || e.label}`],
    [`DATA : ${e.data_corso ? formatDataIt(e.data_corso) : ""}`],
    [`SEDE DEL CORSO: ${e.sede || ""}`],
    [],
    [],
    ["COGNOME","NOME","LUOGO NASCITA","PROV","DATA NASCITA","CODICE FISCALE","TELEFONO","MAIL","SEZIONE"]
  ];

  const ws = XLSX.utils.aoa_to_sheet(intestazione);
  ws["!cols"] = [
    {wch:18},{wch:18},{wch:16},{wch:6},{wch:12},{wch:18},{wch:14},{wch:26},{wch:16}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Foglio1");
  XLSX.writeFile(wb, `Template_${e.label.replace(/[^a-zA-Z0-9]/g,"_")}.xlsx`);
}

async function caricaVolontariDaExcel(ev, e){
  const file = ev.target.files[0];
  if (!file) return;
  ev.target.value = ""; // reset input per permettere ricaricare lo stesso file

  const wrap = document.getElementById("volontari-edizione-list");
  wrap.innerHTML = `<div class="loading-spin">Lettura file ed importazione…</div>`;

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:"array", cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const righe = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });

    // trova la riga di intestazione colonne (quella che contiene "COGNOME")
    let idxHeader = righe.findIndex(r => (r[0]||"").toString().trim().toUpperCase() === "COGNOME");
    if (idxHeader === -1){
      alert("Non trovo l'intestazione 'COGNOME' nel file. Verifica che sia il template corretto.");
      caricaVolontariEdizione();
      return;
    }

    const dati = righe.slice(idxHeader + 1).filter(r => (r[0]||"").toString().trim() !== "");

    let nuovi = 0, aggiornati = 0, iscritti = 0, errori = [];

    for (const r of dati){
      const cognome = (r[0]||"").toString().trim();
      const nome = (r[1]||"").toString().trim();
      const luogoNascita = (r[2]||"").toString().trim() || null;
      const prov = (r[3]||"").toString().trim() || null;
      let dataNascita = r[4];
      if (dataNascita instanceof Date){
        dataNascita = dataNascita.toISOString().slice(0,10);
      } else if (typeof dataNascita === "string" && dataNascita.includes("/")){
        const p = dataNascita.split("/");
        dataNascita = p.length===3 ? `${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}` : null;
      } else {
        dataNascita = null;
      }
      const cf = (r[5]||"").toString().trim().toUpperCase() || null;
      const telefono = (r[6]||"").toString().trim() || null;
      const email = (r[7]||"").toString().trim() || null;
      const sezione = (r[8]||"").toString().trim().toUpperCase() || null;

      if (!cognome || !nome){ continue; }

      try{
        let volontarioId;
        if (cf){
          const { data: esistente } = await sb.from("volontari_formazione").select("id").eq("codice_fiscale", cf).maybeSingle();
          if (esistente){
            await sb.from("volontari_formazione").update({
              cognome, nome, luogo_nascita: luogoNascita, provincia_nascita: prov,
              data_nascita: dataNascita, telefono, email, sezione_ana: sezione
            }).eq("id", esistente.id);
            volontarioId = esistente.id;
            aggiornati++;
          }
        }
        if (!volontarioId){
          const { data: creato, error: errCrea } = await sb.from("volontari_formazione").insert({
            cognome, nome, codice_fiscale: cf, luogo_nascita: luogoNascita, provincia_nascita: prov,
            data_nascita: dataNascita, telefono, email, sezione_ana: sezione
          }).select().single();
          if (errCrea) throw errCrea;
          volontarioId = creato.id;
          nuovi++;
        }

        const { data: giaIscritto } = await sb.from("iscrizioni_corsi").select("id").eq("volontario_id", volontarioId).eq("edizione_corso_id", e.id).maybeSingle();
        if (!giaIscritto){
          await sb.from("iscrizioni_corsi").insert({ volontario_id: volontarioId, edizione_corso_id: e.id, stato:"iscritto" });
          iscritti++;
        }
      }catch(err){
        errori.push(`${cognome} ${nome}: ${err.message}`);
      }
    }

    let msg = `Importazione completata.\nNuovi volontari creati: ${nuovi}\nVolontari aggiornati: ${aggiornati}\nIscrizioni aggiunte: ${iscritti}`;
    if (errori.length) msg += `\n\nErrori (${errori.length}):\n` + errori.join("\n");
    alert(msg);

  }catch(err){
    alert("Errore nella lettura del file: " + err.message);
  }

  caricaVolontariEdizione();
}

const STORAGE_BUCKET_FIRME = "firme";
let _firmeLibreria = [];
let _firmaSelezionataId = null;
let _pdfCorrente = null;       // documento pdf.js
let _pdfBytesOriginali = null; // ArrayBuffer originale, per pdf-lib
let _firmePosizionate = [];    // { pagina, xPct, yPct, wPct, hPct, firmaUrl, firmaId }
let _paginaAttivaDrag = null;
