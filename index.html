/* ---------- Pezzi di form condivisi (volontari e ospiti) ---------- */
// opz.disponibile: colonna delle giornate di disponibilità (volontari delle emergenze, non gli ospiti)
// opz.orari: orari già salvati { servizio_id: { dalle, alle } } → campi "dalle/alle" accanto alla giornata; null = orari non richiesti
function htmlGrigliaServiziScelta(c, scelti, opz = {}){
  const tipi = (opz.disponibile ? ORDINE_SERVIZIO : TIPI_SERVIZIO).filter(t => c.servizi.some(s => s.tipo === t));
  const giorni = [...new Set(c.servizi.filter(s => tipi.includes(s.tipo)).map(s => s.giorno))];
  if (!giorni.length) return `<div class="es-aiuto">Nessun servizio previsto.</div>`;
  const conOrari = opz.disponibile && opz.orari;
  return `<table class="storico-table es-griglia-servizi">
    <thead><tr><th>Giorno</th>${tipi.map(t => `<th>${LABEL_SERVIZIO[t]}</th>${t === "disponibile" && conOrari ? "<th>Orario (facoltativo)</th>" : ""}`).join("")}</tr></thead>
    <tbody>${giorni.map(g => `<tr><td>${labelGiornoBreve(g)}</td>${tipi.map(t => {
      const s = c.servizi.find(x => x.giorno === g && x.tipo === t);
      const cella = `<td>${s ? `<input type="checkbox" name="servizi" value="${s.id}" ${(scelti || []).includes(s.id) ? "checked" : ""}>` : "—"}</td>`;
      if (t !== "disponibile" || !conOrari) return cella;
      const o = s ? opz.orari[s.id] : null;
      return cella + `<td style="white-space:nowrap;">${s ? `
        <input type="time" name="ora_dalle_${s.id}" value="${escapeHtml(o?.dalle || "")}" style="width:auto;"> –
        <input type="time" name="ora_alle_${s.id}" value="${escapeHtml(o?.alle || "")}" style="width:auto;">` : ""}</td>`;
    }).join("")}</tr>`).join("")}</tbody>
  </table>
  ${conOrari ? `<div class="es-aiuto" style="margin:6px 0 0;">Orario vuoto = giornata intera.</div>` : ""}
  ${tipi.includes("pernotto") ? `<div class="es-aiuto" style="margin:6px 0 0;">Spuntando il pernotto, la colazione del mattino dopo si spunta da sola (modificabile).</div>` : ""}`;
}

// Orari letti dalla griglia: { servizio_id: { dalle, alle } } solo sulle giornate spuntate e con entrambi gli orari.
// Ritorna { orari, errore }.
function leggiOrariGriglia(f, c, servizi){
  const orari = {};
  for (const s of c.servizi.filter(x => x.tipo === "disponibile" && servizi.includes(x.id))){
    const dalle = f[`ora_dalle_${s.id}`]?.value || "", alle = f[`ora_alle_${s.id}`]?.value || "";
    if (!dalle && !alle) continue;
    if (!dalle || !alle) return { orari, errore:`${labelGiornoBreve(s.giorno)}: indica sia l'inizio sia la fine, oppure lascia vuoto per la giornata intera.` };
    if (dalle === alle) return { orari, errore:`${labelGiornoBreve(s.giorno)}: inizio e fine non possono coincidere.` };
    orari[s.id] = { dalle, alle };
  }
  return { orari, errore:null };
}

// pernotto della notte X spuntato → colazione del giorno X+1 spuntata (resta modificabile a mano)
function collegaColazioneAutomatica(contenitore, c){
  contenitore.querySelectorAll('input[name="servizi"]').forEach(cb => cb.addEventListener("change", () => {
    if (!cb.checked) return;
    const s = c.servizi.find(x => x.id === Number(cb.value));
    if (!s || s.tipo !== "pernotto") return;
    const col = c.servizi.find(x => x.giorno === giornoDopo(s.giorno) && x.tipo === "colazione");
    const cbCol = col ? contenitore.querySelector(`input[name="servizi"][value="${col.id}"]`) : null;
    if (cbCol) cbCol.checked = true;
  }));
}

    const cf = f.codice_fiscale.value.replace(/\s/g, "").toUpperCase();
    if (!cfValido(cf)){ mostraErrore("Codice fiscale non valido: controlla i 16 caratteri."); return; }
    const valori = sel => [...f.querySelectorAll(`input[name="${sel}"]:checked`)].map(x => x.value);
    const servizi = valori("servizi").map(Number);
    // stessi obblighi della pagina delle Sezioni (campi configurati sull'esercitazione)
    const ob = k => campoObbligatorio(c.es, k);
    if (ob("cellulare") && !f.cellulare.value.trim()){ mostraErrore("Il cellulare è obbligatorio."); return; }
    if (ob("note") && !f.note.value.trim()){ mostraErrore("Le note sono obbligatorie."); return; }
    if (ob("patenti") && !valori("patenti").length){ mostraErrore("Indica almeno una patente."); return; }
    if (ob("abilitazioni") && !valori("abilitazioni").length){ mostraErrore("Indica almeno un'abilitazione."); return; }
    if (ob("tipologia") && !f.tipologia.value){ mostraErrore("Indica la tipologia."); return; }
    if (ob("servizi") && c.servizi.length && !servizi.length){ mostraErrore("Indica almeno una giornata, un pasto o un pernotto."); return; }
    if (att("esigenze")){
      const errEsig = erroreEsigenze(c, valori("esigenze"), f.esigenze_note.value.trim());
      if (errEsig){ mostraErrore(errEsig); return; }
    }
    const lettura = att("servizi") && att("orari") ? leggiOrariGriglia(f, c, servizi) : { orari:null, errore:null };
    if (lettura.errore){ mostraErrore(lettura.errore); return; }

    // Collegamento facoltativo all'anagrafica Formazione (se l'utente può leggerla)
    let volontarioId = a?.volontario_id ?? null;
    if (!a || a.codice_fiscale !== cf){
      const { data: vf } = await sb.from("volontari_formazione").select("id").eq("codice_fiscale", cf).maybeSingle();
      volontarioId = vf?.id ?? null;
    }
    const payload = {
      attivazione_id: c.es.id,
      attivazione_sezione_id: parseInt(f.sezione_id.value),
      volontario_id: volontarioId,
      cognome: f.cognome.value.trim().toUpperCase(),
      nome: f.nome.value.trim().toUpperCase(),
      codice_fiscale: cf
    };
    // i campi non richiesti non si toccano (restano come sono)
    if (att("cellulare")) payload.cellulare = f.cellulare.value.trim() || null;
    if (att("note")) payload.note = f.note.value.trim() || null;
    if (att("patenti")) payload.patenti = valori("patenti");
    if (att("abilitazioni")) payload.abilitazioni = valori("abilitazioni");
    if (att("esigenze")){
      payload.esigenze = valori("esigenze");
      payload.esigenze_note = f.esigenze_note.value.trim() || null;
    }
    if (att("tipologia")) payload.tipologia = f.tipologia.value || null;
    if (att("art39")) payload.art39 = f.art39.checked;
    const btn = f.querySelector(".btn-save");
    btn.disabled = true;

    let id = a?.id;
    const r = id
      ? await sb.from("adesioni").update(payload).eq("id", id)
      : await sb.from("adesioni").insert(payload).select("id").single();
    if (r.error){
      btn.disabled = false;
      mostraErrore(r.error.code === "23505" ? "Questo codice fiscale è già iscritto a questo evento." : "Errore: " + r.error.message);
      return;
    }
    if (!id) id = r.data.id;

    if (!att("servizi")){ apriCruscottoEsercitazione(c.es.id, "volontari"); return; }
    // servizi: solo le differenze
    const prima = a?.servizi || [];
    const daTogliere = prima.filter(s => !servizi.includes(s));
    const daAggiungere = servizi.filter(s => !prima.includes(s));
    if (daTogliere.length){
      const { error } = await sb.from("adesione_servizi").delete().eq("adesione_id", id).in("servizio_id", daTogliere);
      if (error){ btn.disabled = false; mostraErrore("Volontario salvato, ma errore sui servizi: " + error.message); return; }
    }
    if (daAggiungere.length){
      const { error } = await sb.from("adesione_servizi").insert(daAggiungere.map(s => ({ adesione_id:id, servizio_id:s })));
      if (error){ btn.disabled = false; mostraErrore("Volontario salvato, ma errore sui servizi: " + error.message); return; }
    }
    // orari: aggiorno solo le giornate scelte il cui orario è cambiato (vuoto = giornata intera)
    if (lettura.orari){
      const giornate = c.servizi.filter(s => s.tipo === "disponibile" && servizi.includes(s.id));
      for (const s of giornate){
        const nuovo = lettura.orari[s.id] || null, vecchio = (a?.orari || {})[s.id] || null;
        if (descriviOrario(nuovo) === descriviOrario(vecchio)) continue;
        const { error } = await sb.from("adesione_servizi")
          .update({ ora_dalle: nuovo ? nuovo.dalle : null, ora_alle: nuovo ? nuovo.alle : null })
          .eq("adesione_id", id).eq("servizio_id", s.id);
        if (error){ btn.disabled = false; mostraErrore("Volontario salvato, ma errore sugli orari: " + error.message); return; }
      }
    }
    apriCruscottoEsercitazione(c.es.id, "volontari");
  });
}

/* ---------- Scheda Cucina (anche livello base): dati da attivazione_cucina() ---------- */
function righeCucina(c){
  return ((c.cucina && c.cucina.servizi) || []).map(s => ({
    ...s,
    totale: s.volontari + s.ospiti + s.extra,
    esigenzeTesto: Object.entries(s.esigenze || {}).sort((a,b) => b[1] - a[1]).map(([k,n]) => `${k} ${n}`).join(" · "),
    extraTesto: (s.extra_dettaglio || []).map(x => `${x.descrizione} ${x.quantita}`).join(", ")
  }));
}

// HTML della cucina, usato sia a schermo sia per la stampa (perStampa = stili semplici, niente classi dell'app)
function htmlCucina(c, perStampa){
  const righe = righeCucina(c);
  if (!righe.length) return `<div class="storico-empty">Nessun servizio previsto.</div>`;
  const giorni = [...new Set(righe.map(r => r.giorno))];
  const cl = perStampa ? "" : ` class="storico-table es-cucina-tabella"`;
  return giorni.map(g => {
    const delGiorno = righe.filter(r => r.giorno === g);
    return `
      <h3 class="${perStampa ? "" : "es-cucina-giorno"}">${escapeHtml(new Date(g + "T00:00:00").toLocaleDateString("it-IT", { weekday:"long", day:"numeric", month:"long", year:"numeric" }))}</h3>
      <table${cl}>
        <thead><tr><th>Servizio</th><th>Volontari</th><th>Ospiti</th><th>Extra</th><th>Totale</th><th>Esigenze alimentari</th></tr></thead>
        <tbody>${delGiorno.map(r => `
          <tr>
            <td><strong>${LABEL_SERVIZIO[r.tipo] || escapeHtml(r.tipo)}</strong></td>
            <td>${r.volontari}</td>
            <td>${r.ospiti}</td>
            <td>${r.extra}${r.extraTesto ? `<div style="font-size:11px;color:#8a93a3;">${escapeHtml(r.extraTesto)}</div>` : ""}</td>
            <td><strong>${r.totale}</strong>${r.tipo === "pernotto" ? " posti letto" : ""}</td>
            <td>${r.tipo === "pernotto" ? "—" : escapeHtml(r.esigenzeTesto || "—")}</td>
          </tr>
          ${r.tipo !== "pernotto" && (r.con_nota || []).length ? `
          <tr><td></td><td colspan="5" style="font-size:12px;">
            ${r.con_nota.map(p => `⚠️ <strong>${escapeHtml(p.nome)}</strong> (${escapeHtml(p.provenienza || (p.tipo === "ospite" ? "ospite" : "—"))}): ${escapeHtml((p.esigenze || []).join(", "))}${p.nota ? ` – ${escapeHtml(p.nota)}` : ""}`).join("<br>")}
          </td></tr>` : ""}`).join("")}
        </tbody>
      </table>`;
  }).join("");
}

/* ---------- Scheda Sezioni: link pubblici (token solo via attivazione_link) ---------- */
function urlAdesione(token){
  return new URL(`adesione.html?t=${encodeURIComponent(token)}`, location.href).href;
}

function nuovoUuid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

function testoMailAdesione(es, sezione, link){

  const oggetto = `${T.Nome} "${es.titolo}" – ${emergenza ? "disponibilità" : "adesioni"} Sezione ${sezione}`;
  const testo = [
    "Buongiorno,",

      ? `per l'emergenza "${es.titolo}" (${ENTI_ESERCITAZIONE[es.ente] || es.ente}) ${date}${es.luogo ? ` a ${es.luogo}` : ""} chiediamo alla Sezione ${sezione} di comunicare le disponibilità.`
      : `la Sezione ${sezione} è invitata all'esercitazione "${es.titolo}" (${ENTI_ESERCITAZIONE[es.ente] || es.ente}) che si terrà ${date}${es.luogo ? ` a ${es.luogo}` : ""}.`,
    "",

    body.innerHTML = `<div class="loading-spin">Caricamento…</div>`;
    const { data, error } = await sb.rpc("attivazione_link", { p_attivazione_id: c.es.id });
    if (error){ body.innerHTML = `<p>Errore: ${escapeHtml(error.message)}</p>`; return; }
    (data || []).forEach(r => link.set(r.attivazione_sezione_id, r));
  }

  const avvisi = [];
  if (c.es.stato === "bozza") avvisi.push("L'evento è in <strong>bozza</strong>: i link non funzionano finché non imposti lo stato \"Adesioni aperte\".");
  if (c.es.stato === "chiusa" || c.es.stato === "conclusa") avvisi.push("Le adesioni sono chiuse: i link mostrano i dati ma non permettono modifiche.");

  body.innerHTML = `
    ${avvisi.map(a => `<div class="es-avviso">${a}</div>`).join("")}
    ${completo ? "" : `<p class="es-aiuto">I link per le Sezioni sono disponibili solo con accesso completo.</p>`}
    ${c.sezioni.length ? `
    <div style="overflow-x:auto;">
      <table class="storico-table">
        <thead><tr><th>Sezione</th><th>Stato</th><th>Risposto il</th><th>Volontari</th>${completo ? "<th></th>" : ""}</tr></thead>
        <tbody>
          ${c.sezioni.map(s => {
            const l = link.get(s.id);
            return `
            <tr>
              <td><strong>${escapeHtml(s.sezione)}</strong>${l?.email_pc ? `<div class="es-aiuto" style="margin:2px 0 0;">${escapeHtml(l.email_pc)}</div>` : ""}</td>
              <td><span class="es-badge es-sez-badge-${s.stato}">${STATI_SEZIONE_ESERCITAZIONE[s.stato]}</span></td>
              <td>${s.risposto_at ? formatDataOraIt(s.risposto_at) : "—"}</td>
              <td>${s.stato === "non_partecipa" ? "—" : volPerSez.get(s.id) || 0}</td>
              ${completo ? `<td style="white-space:nowrap;">${l ? `
                <button class="row-del" style="color:var(--blu-500);" data-copia="${s.id}">📋 Copia link</button>
                <button class="row-del" style="color:var(--blu-500);" data-mail="${s.id}" ${l.email_pc ? "" : "disabled title=\"Mail PC non impostata (Impostazioni)\""}>✉️ Mail</button>
                <button class="row-del" data-rigenera="${s.id}">🔄 Rigenera</button>` : "—"}</td>` : ""}
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>` : `<div class="storico-empty">Nessuna Sezione invitata.</div>`}
  `;
  if (!completo) return;

  body.querySelectorAll("[data-copia]").forEach(b => b.addEventListener("click", async () => {
    const l = link.get(parseInt(b.dataset.copia));
    if (await copiaTesto(urlAdesione(l.token))){ const t = b.textContent; b.textContent = "✓ Copiato"; setTimeout(() => b.textContent = t, 1500); }
  }));
  body.querySelectorAll("[data-mail]").forEach(b => b.addEventListener("click", () => {
    const l = link.get(parseInt(b.dataset.mail));
    if (!l?.email_pc){ alert("Mail PC della Sezione non impostata: aggiungila in Impostazioni."); return; }
    const { oggetto, testo } = testoMailAdesione(c.es, l.sezione, urlAdesione(l.token));
    location.href = `mailto:${encodeURIComponent(l.email_pc)}?subject=${encodeURIComponent(oggetto)}&body=${encodeURIComponent(testo)}`;
  }));
  body.querySelectorAll("[data-rigenera]").forEach(b => b.addEventListener("click", async () => {
    const id = parseInt(b.dataset.rigenera);
    const l = link.get(id);
    if (!confirm(`Rigenerare il link della Sezione ${l?.sezione || ""}? Il link inviato finora smetterà di funzionare e andrà mandato quello nuovo. Le adesioni già inserite restano.`)) return;
    const { error } = await sb.from("attivazione_sezioni").update({ token: nuovoUuid() }).eq("id", id);
    if (error){ alert("Errore: " + error.message); return; }
    renderTabSezioniEsercitazione();
  }));
}

/* ---------- Export Excel (foglio Volontari + foglio Riepilogo) ---------- */
function esportaEsercitazioneExcel(){
  const c = _cruscotto;
  const completo = esercitazioniCompleto();
  const r = calcolaRiepilogoEsercitazione(c);
  const etichettaServizio = s => `${labelGiornoBreve(s.giorno)} ${LABEL_SERVIZIO[s.tipo]}`;

  const att = k => campoAttivo(c.es, k);
  const emergenza = c.es.tipo === "emergenza";
  const conPasti = c.servizi.some(s => s.tipo !== "disponibile");
  // giornata di disponibilità: "X" oppure l'orario (gli orari li vede solo completo)
  const cellaServizio = (a, s) => !a.servizi.includes(s.id) ? "" : (s.tipo === "disponibile" && (a.orari || {})[s.id] ? descriviOrario(a.orari[s.id]) : "X");
  const righeVolontari = c.adesioni.map(a => {
    const riga = { Sezione: a.sezione, Cognome: a.cognome, Nome: a.nome };
    if (att("tipologia")) riga.Tipologia = a.tipologia || "";
    if (completo) riga["Codice fiscale"] = a.codice_fiscale;
    if (completo && att("cellulare")) riga.Cellulare = a.cellulare || "";
    if (completo && att("art39")) riga["Art. 39"] = a.art39 ? "SI" : "";
    if (att("patenti")) riga.Patenti = a.patenti.join(", ");
    if (att("abilitazioni")) riga.Abilitazioni = a.abilitazioni.join(", ");
    if (att("servizi")) c.servizi.forEach(s => { riga[etichettaServizio(s)] = cellaServizio(a, s); });
    if (completo && att("esigenze")){
      riga["Esigenze alimentari"] = (a.esigenze || []).join(", ");
      riga["Nota esigenze"] = a.esigenze_note || "";
    }
    if (completo && att("note")) riga.Note = a.note || "";
    return riga;
  });
  const wsVolontari = righeVolontari.length
    ? XLSX.utils.json_to_sheet(righeVolontari)
    : XLSX.utils.aoa_to_sheet([["Nessun volontario iscritto"]]);

  const aoa = [
    [testiTipo(c.es.tipo).Nome, c.es.titolo],
    ["Ente", ENTI_ESERCITAZIONE[c.es.ente] || c.es.ente],
    ["Date", periodoAttivazioneIt(c.es)],
    ["Luogo", c.es.luogo || ""],
    ["Stato", STATI_ESERCITAZIONE[c.es.stato] || c.es.stato],
    ["Esportato il", formatDataOraIt(new Date().toISOString())],
    [],
    ["Volontari", r.volontari],
    ["Sezioni che hanno inviato l'adesione", `${r.sezioniRisposto}/${r.sezioniTotali}`],
    ["Sezioni che non partecipano", r.sezioniNonPartecipa],
    ...(emergenza ? [["Mezzi", c.mezzi.length], ["Righe di materiali", c.materiali.length]] : []),
    ...(conPasti ? [
      ["Pasti totali (con ospiti ed extra)", r.pasti],
      ["Pernotti totali", r.pernotti],
      ["Posti letto (notte più piena)", r.postiLetto],
      [],
      ["Giorno", ...TIPI_SERVIZIO.map(t => LABEL_SERVIZIO[t])],
      ...r.perGiorno.map(g => [labelGiornoBreve(g.giorno), ...TIPI_SERVIZIO.map(t => g[t] === null ? "—" : g[t])])
    ] : []),
    [],
    ["Sezione", "Stato", "Risposto il", "Volontari"],
    ...c.sezioni.map(s => [s.sezione, STATI_SEZIONE_ESERCITAZIONE[s.stato], s.risposto_at ? formatDataOraIt(s.risposto_at) : "", s.stato === "non_partecipa" ? 0 : r.volontariPerSezione.get(s.id) || 0]),
    ...(att("patenti") ? [[], ["Patente", "Volontari"], ...r.patenti.map(p => [p.nome, p.n])] : []),
    ...(att("abilitazioni") ? [[], ["Abilitazione", "Volontari"], ...r.abilitazioni.map(p => [p.nome, p.n])] : [])
  ];
  // Foglio Cucina: per ogni servizio volontari + ospiti + extra, esigenze per tipo e persone da segnalare
  const nomiEsigenze = c.esigenze.map(e => e.nome);
  const aoaCucina = [
    ["Giorno", "Servizio", "Volontari", "Ospiti", "Extra", "Dettaglio extra", "Totale", ...nomiEsigenze, "Da segnalare"],
    ...righeCucina(c).map(s => [
      labelGiornoBreve(s.giorno), LABEL_SERVIZIO[s.tipo] || s.tipo, s.volontari, s.ospiti, s.extra, s.extraTesto, s.totale,
      ...nomiEsigenze.map(n => s.tipo === "pernotto" ? "" : ((s.esigenze || {})[n] || 0)),
      s.tipo === "pernotto" ? "" : (s.con_nota || []).map(p => `${p.nome} (${p.provenienza || p.tipo}): ${(p.esigenze || []).join(", ")}${p.nota ? " – " + p.nota : ""}`).join("; ")
    ])
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsVolontari, "Volontari");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Riepilogo");
  if (emergenza){
    // Per giorno: stessi numeri della scheda Riepilogo (attivazione_giorni)
    const tipologie = att("tipologia") ? tipologieRiepilogo(c) : [];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
      ["Giorno", "Volontari", ...(att("orari") ? ["Giornata intera", "Con orario", "Fasce orarie"] : []), ...tipologie,
       ...(att("tipologia") ? ["Tipologia non indicata"] : []), ...(att("patenti") ? ["Patenti"] : []), ...(att("abilitazioni") ? ["Abilitazioni"] : []), "Mezzi"],
      ...c.giorni.map(g => [labelGiornoBreve(g.giorno), g.volontari,
        ...(att("orari") ? [g.volontari - g.con_orario, g.con_orario, testoConteggi(g.fasce)] : []),
        ...tipologie.map(t => (g.tipologie || {})[t] || 0), ...(att("tipologia") ? [(g.tipologie || {})[""] || 0] : []),
        ...(att("patenti") ? [testoConteggi(g.patenti)] : []), ...(att("abilitazioni") ? [testoConteggi(g.abilitazioni)] : []), g.mezzi])
    ]), "Per giorno");
    const giorniEvento = c.servizi.filter(s => s.tipo === "disponibile");
    XLSX.utils.book_append_sheet(wb, c.mezzi.length
      ? XLSX.utils.json_to_sheet(c.mezzi.map(m => {
          const riga = { Sezione: m.sezione, Mezzo: m.tipo, Targa: m.targa || "", Note: m.note || "" };
          giorniEvento.forEach(s => { riga[labelGiornoBreve(s.giorno)] = m.giorni.includes(s.giorno) ? "X" : ""; });
          return riga;
        }))
      : XLSX.utils.aoa_to_sheet([["Nessun mezzo indicato"]]), "Mezzi");
    XLSX.utils.book_append_sheet(wb, c.materiali.length
      ? XLSX.utils.json_to_sheet(c.materiali.map(m => ({ Sezione: m.sezione, "Quantità": m.quantita, Descrizione: m.descrizione, Note: m.note || "" })))
      : XLSX.utils.aoa_to_sheet([["Nessun materiale indicato"]]), "Materiali");
    if (completo && att("art39")){
      const conArt39 = c.adesioni.filter(a => a.art39);
      XLSX.utils.book_append_sheet(wb, conArt39.length
        ? XLSX.utils.json_to_sheet(conArt39.map(a => ({
            Sezione: a.sezione, Cognome: a.cognome, Nome: a.nome, "Codice fiscale": a.codice_fiscale,
            Giornate: giorniEvento.filter(s => a.servizi.includes(s.id)).map(s => `${labelGiornoBreve(s.giorno)}${a.orari[s.id] ? " " + descriviOrario(a.orari[s.id]) : ""}`).join(", ")
          })))
        : XLSX.utils.aoa_to_sheet([["Nessun volontario chiede l'art. 39"]]), "Art. 39");
    }
  }
  if (conPasti) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaCucina), "Cucina");
  if (completo && c.ospiti.length){
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(c.ospiti.map(o => {
      const riga = { Nome: o.nome, "Ente / ruolo": o.ente_ruolo || "", "Esigenze alimentari": (o.esigenze || []).join(", "), "Nota esigenze": o.esigenze_note || "", Note: o.note || "" };
      c.servizi.filter(s => s.tipo !== "disponibile").forEach(s => { riga[etichettaServizio(s)] = o.servizi.includes(s.id) ? "X" : ""; });
      return riga;
    })), "Ospiti");
  }
  XLSX.writeFile(wb, `${testiTipo(c.es.tipo).Nome}_${(c.es.titolo || "").replace(/[^a-zA-Z0-9]+/g, "_").slice(0,60)}_${c.es.data_inizio}.xlsx`);
}

async function renderListaEsigenzeEsercitazione(){
  const { data, error } = await sb.from("attivazioni_esigenze").select("id, nome, con_nota").order("ordine").order("nome");
  const wrap = document.getElementById("es-esigenze-list");
  if (!wrap) return;
  if (error){ wrap.innerHTML = `<p>Errore: ${escapeHtml(error.message)}</p>`; return; }
  if (!data || !data.length){ wrap.innerHTML = `<div class="storico-empty">Nessuna voce definita.</div>`; return; }
  wrap.innerHTML = `
    <table class="storico-table">
      <thead><tr><th>Nome</th><th>Con nota</th><th></th></tr></thead>
      <tbody>${data.map(v => `
        <tr>
          <td>${escapeHtml(v.nome)}</td>
          <td><input type="checkbox" data-con-nota="${v.id}" ${v.con_nota ? "checked" : ""} title="Chiede la nota e mostra il nome in cucina"></td>
          <td><button class="row-del" data-id="${v.id}" data-nome="${escapeHtml(v.nome)}">Elimina</button></td>
        </tr>`).join("")}
      </tbody>
    </table>`;
  wrap.querySelectorAll("[data-con-nota]").forEach(cb => cb.addEventListener("change", async () => {
    const { error } = await sb.from("attivazioni_esigenze").update({ con_nota: cb.checked }).eq("id", parseInt(cb.dataset.conNota));
    if (error){ alert("Errore: " + error.message); cb.checked = !cb.checked; }
  }));
  wrap.querySelectorAll(".row-del").forEach(b => b.addEventListener("click", async () => {
    if (!confirm(`Eliminare l'esigenza "${b.dataset.nome}"? Non sarà più selezionabile; chi l'ha già indicata la conserva.`)) return;
    const { error } = await sb.from("attivazioni_esigenze").delete().eq("id", parseInt(b.dataset.id));
    if (error){ alert("Errore: " + error.message); return; }
    renderListaEsigenzeEsercitazione();
  }));
}

async function aggiungiEsigenzaEsercitazione(){
  const nome = prompt("Nome nuova esigenza alimentare (es. Vegano, Senza lattosio…):");
  if (!nome || !nome.trim()) return;
  const conNota = confirm("Per questa esigenza serve una nota (es. a cosa è allergico) e la cucina deve vedere il nome della persona?\n\nOK = sì, Annulla = no");
  const { data: ultime, error: errOrd } = await sb.from("attivazioni_esigenze").select("ordine").order("ordine", { ascending:false }).limit(1);
  if (errOrd){ alert("Errore: " + errOrd.message); return; }
  const n = nome.trim();
  const { error } = await sb.from("attivazioni_esigenze").insert({ nome: n.charAt(0).toUpperCase() + n.slice(1), con_nota: conNota, ordine: (ultime?.[0]?.ordine || 0) + 1 });
  if (error){ alert(error.code === "23505" ? "Questa esigenza esiste già." : "Errore: " + error.message); return; }
  renderListaEsigenzeEsercitazione();
}

/* ---------- Impostazioni: liste Esercitazioni e mail PC delle Sezioni ---------- */
async function renderListaVociEsercitazione(tabella, wrapId, etichetta){
  const { data, error } = await sb.from(tabella).select("id, nome").order("ordine").order("nome");
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  if (error){ wrap.innerHTML = `<p>Errore: ${escapeHtml(error.message)}</p>`; return; }
  if (!data || data.length === 0){ wrap.innerHTML = `<div class="storico-empty">Nessuna voce definita.</div>`; return; }
  wrap.innerHTML = `
    <table class="storico-table">
      <thead><tr><th>Nome</th><th></th></tr></thead>
      <tbody>
        ${data.map(v => `<tr><td>${escapeHtml(v.nome)}</td><td><button class="row-del" data-id="${v.id}" data-nome="${escapeHtml(v.nome)}">Elimina</button></td></tr>`).join("")}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll(".row-del").forEach(b => b.addEventListener("click", async () => {
    // la tipologia è collegata ai volontari (on delete set null): chi l'aveva resta senza
    const effetto = tabella === "attivazioni_tipologie" ? "i volontari che l'avevano restano senza tipologia" : "i volontari già iscritti la conservano";
    if (!confirm(`Eliminare la ${etichetta} "${b.dataset.nome}"? Non sarà più selezionabile; ${effetto}.`)) return;

const STORAGE_BUCKET_FIRME_PERSONALI = "firme-personali";

function apriFormCambioPassword(){
  const box = document.getElementById("cambio-password-form");
  box.innerHTML = `
    <form id="form-cambia-password">
      <div class="form-field" style="margin-bottom:8px;">
        <label>Nuova password</label>
        <input type="password" name="nuova_password" required minlength="6">
      </div>
      <div class="form-field" style="margin-bottom:8px;">
        <label>Conferma nuova password</label>
        <input type="password" name="conferma_password" required minlength="6">
      </div>
      <div id="errore-cambio-password" style="color:var(--rosso);font-size:12px;margin-bottom:8px;display:none;"></div>
      <div class="form-actions" style="border-top:none;padding-top:0;">
        <button type="button" class="btn-cancel" id="btn-annulla-cambio-password">Annulla</button>
        <button type="submit" class="btn-save">Salva password</button>
      </div>
    </form>
  `;
  document.getElementById("btn-annulla-cambio-password").addEventListener("click", () => { box.innerHTML = ""; });
  document.getElementById("form-cambia-password").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const nuova = fd.get("nuova_password");
    const conferma = fd.get("conferma_password");
    const errBox = document.getElementById("errore-cambio-password");
    errBox.style.display = "none";

    if (nuova !== conferma){
      errBox.textContent = "Le due password non coincidono.";
      errBox.style.display = "block";
      return;
    }

    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    const { error } = await sb.auth.updateUser({ password: nuova });

    if (error){
      errBox.textContent = "Errore: " + error.message;
      errBox.style.display = "block";
      btn.disabled = false; btn.textContent = "Salva password";
      return;
    }

    box.innerHTML = `<p style="font-size:12.5px;color:var(--verde);">Password aggiornata con successo.</p>`;
  });
}

async function renderFirmaPersonaleBox(){
  const box = document.getElementById("firma-personale-box");
  if (!box) return;

  const path = state.profile.firma_personale_path;
  let urlFirma = null;
  if (path){
    const u = await urlFirmato(STORAGE_BUCKET_FIRME_PERSONALI, path);
    // l'URL firmato contiene già "?", quindi il cache-busting va con "&"
    urlFirma = u ? u + "&t=" + Date.now() : null;
  }

  box.innerHTML = `
    <div class="stat-card" style="max-width:340px;">
      ${urlFirma ? `<img src="${urlFirma}" alt="La tua firma" style="max-width:100%;height:80px;object-fit:contain;display:block;margin-bottom:10px;">` : `<p style="font-size:12.5px;color:var(--grigio-600);">Nessuna firma salvata.</p>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-add-mini" id="btn-disegna-firma-personale">${urlFirma ? "Rifai la firma" : "Crea la mia firma"}</button>
        <label class="btn-add-mini" style="cursor:pointer;">
          Carica immagine PNG
          <input type="file" id="input-carica-firma-png" accept="image/png" style="display:none;">
        </label>
      </div>
    </div>
    <div id="firma-personale-editor" style="margin-top:12px;"></div>
  `;

  document.getElementById("input-carica-firma-png").addEventListener("change", async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    ev.target.value = "";

    const nuovoPath = `${state.user.id}.png`;
    const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_FIRME_PERSONALI).upload(nuovoPath, file, { upsert:true, contentType:"image/png" });
    if (upErr){ alert("Errore upload: " + upErr.message); return; }

    const { error } = await sb.from("app_users").update({ firma_personale_path: nuovoPath }).eq("id", state.user.id);
    if (error){ alert("Errore: " + error.message); return; }

    state.profile.firma_personale_path = nuovoPath;
    renderFirmaPersonaleBox();
  });

  document.getElementById("btn-disegna-firma-personale").addEventListener("click", () => {
    const editorBox = document.getElementById("firma-personale-editor");
    editorBox.innerHTML = `
      <div id="canvas-firma-personale"></div>
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="btn-annulla-firma-personale">Annulla</button>
        <button type="button" class="btn-save" id="btn-salva-firma-personale">Salva firma</button>
      </div>
    `;
    const firma = creaCanvasFirma(document.getElementById("canvas-firma-personale"));

    document.getElementById("btn-annulla-firma-personale").addEventListener("click", () => { editorBox.innerHTML = ""; });
    document.getElementById("btn-salva-firma-personale").addEventListener("click", async () => {
      if (firma.isEmpty()){ alert("Disegna la firma prima di salvare."); return; }
      const btn = document.getElementById("btn-salva-firma-personale");
      btn.disabled = true; btn.textContent = "Salvataggio…";

      const dataUrl = firma.toPng();
      const blob = await (await fetch(dataUrl)).blob();
      const nuovoPath = `${state.user.id}.png`;

      const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_FIRME_PERSONALI).upload(nuovoPath, blob, { upsert:true, contentType:"image/png" });
      if (upErr){ alert("Errore upload: " + upErr.message); btn.disabled=false; btn.textContent="Salva firma"; return; }

      const { error } = await sb.from("app_users").update({ firma_personale_path: nuovoPath }).eq("id", state.user.id);
      if (error){ alert("Errore: " + error.message); btn.disabled=false; btn.textContent="Salva firma"; return; }

      state.profile.firma_personale_path = nuovoPath;
      editorBox.innerHTML = "";
      renderFirmaPersonaleBox();
    });
  });
}

let _utenteEspansoId = null;

function renderListaUtenti(utenti){
  const wrap = document.getElementById("utenti-list");
  wrap.innerHTML = utenti.map(u => {
    const espanso = _utenteEspansoId === u.id;
    return `
    <div class="collapse-block" style="margin-bottom:10px;">
      <button class="collapse-head" data-toggle-utente="${u.id}">
        <span>${escapeHtml(u.nome)}</span>
        <span class="tag" style="background:var(--grigio-100);color:var(--grigio-800);margin-left:8px;">${labelRuolo(u.ruolo)}</span>
        <span class="tag" style="background:${u.attivo?"var(--verde-bg)":"var(--rosso-bg)"};color:${u.attivo?"var(--verde)":"var(--rosso)"};">${u.attivo?"Attivo":"Disattivato"}</span>
        <span class="collapse-arrow">${espanso?"▴":"▾"}</span>
      </button>
      <div class="collapse-body" id="utente-body-${u.id}" style="display:${espanso?"block":"none"};">
        <div class="form-grid">
          <div class="form-field"><label>Nome</label><input data-field="nome" data-id="${u.id}" value="${escapeHtml(u.nome)}"></div>
          <div class="form-field"><label>Email</label><input value="${escapeHtml(u.email)}" disabled></div>
          <div class="form-field">
            <label>Ruolo</label>
            <select data-field="ruolo" data-id="${u.id}">
              ${["it_admin","specialita","segreteria","standard"].map(r => `<option value="${r}" ${u.ruolo===r?"selected":""}>${labelRuolo(r)}</option>`).join("")}
            </select>
          </div>
          <div class="form-field">
            <label>Attivo</label>
            <div class="form-checkbox"><input type="checkbox" data-field="attivo" data-id="${u.id}" ${u.attivo?"checked":""}><label style="margin:0;">Utente attivo</label></div>
          </div>
          <div class="form-field full">
            <label>Pagine abilitate</label>
            <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;align-items:center;">
              ${PAGINE_PERMESSO.map(p => {
                if (p.livelli){
                  const valoreAttuale = (u.permessi && (u.permessi[p.key] === "completo" || u.permessi[p.key] === "base")) ? u.permessi[p.key] : "no";
                  return `
                    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;">
                      ${p.label}
                      <select data-perm-livello="${p.key}" data-id="${u.id}" style="font-size:12px;padding:3px 6px;">
                        <option value="no" ${valoreAttuale==="no"?"selected":""}>Nessun accesso</option>
                        <option value="base" ${valoreAttuale==="base"?"selected":""}>Base</option>
                        <option value="completo" ${valoreAttuale==="completo"?"selected":""}>Completo</option>
                      </select>
                    </label>
                  `;
                }
                return `
                  <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;">
                    <input type="checkbox" data-perm="${p.key}" data-id="${u.id}" ${u.permessi && u.permessi[p.key] ? "checked" : ""}>
                    ${p.label}
                  </label>
                `;
              }).join("")}
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-cancel" data-reset-password="${u.id}" data-email="${escapeHtml(u.email)}">Resetta password</button>
          <button class="btn-save" data-save="${u.id}">Salva</button>
        </div>
      </div>
    </div>
  `;
  }).join("");

  wrap.querySelectorAll('[data-toggle-utente]').forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.toggleUtente;
      _utenteEspansoId = (_utenteEspansoId === id) ? null : id;
      renderListaUtenti(utenti);
    });
  });
  wrap.querySelectorAll('[data-save]').forEach(btn => {
    btn.addEventListener("click", () => salvaUtente(btn.dataset.save, utenti));
  });
  wrap.querySelectorAll('[data-reset-password]').forEach(btn => {
    btn.addEventListener("click", () => resettaPasswordUtente(btn.dataset.email));
  });
}

async function resettaPasswordUtente(email){
  if (!confirm(`Inviare a ${email} un'email per reimpostare la password?`)) return;
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if (error){ alert("Errore: " + error.message); return; }
  alert("Email di reset password inviata.");
}

async function salvaUtente(id, utenti){
  const nome = document.querySelector(`[data-field="nome"][data-id="${id}"]`).value.trim();
  const ruolo = document.querySelector(`[data-field="ruolo"][data-id="${id}"]`).value;
  const attivo = document.querySelector(`[data-field="attivo"][data-id="${id}"]`).checked;
  const permessi = {};
  PAGINE_PERMESSO.forEach(p => {
    if (p.livelli){
      const valore = document.querySelector(`[data-perm-livello="${p.key}"][data-id="${id}"]`).value;
      permessi[p.key] = valore === "no" ? false : valore;
    } else {
      permessi[p.key] = document.querySelector(`[data-perm="${p.key}"][data-id="${id}"]`).checked;
    }
  });

  const { error } = await sb.from("app_users").update({ nome, ruolo, attivo, permessi }).eq("id", id);
  if (error){ alert("Errore: " + error.message); return; }

  if (id === state.user.id){
    state.profile.nome = nome;
    state.profile.ruolo = ruolo;
    state.profile.permessi = permessi;
    document.getElementById("sidebar-user-name").textContent = nome;
    document.getElementById("sidebar-user-role").textContent = labelRuolo(ruolo);
    renderSidebar();
  }

  alert("Utente aggiornato.");
  renderGestioneUtenti();
}

  pdf_modelli: "Modelli PDF", pdf_documenti: "Documenti PDF"
};
const LABEL_OPERAZIONE_LOG = { INSERT:"Creazione", UPDATE:"Modifica", DELETE:"Eliminazione" };

async function apriModalSessione(utenteId, accessoIl, nomeUtente, tutteLeSessioni){
  // Trova la sessione successiva dello STESSO utente per delimitare la finestra temporale
  const sessioniUtente = tutteLeSessioni
    .filter(s => s.utente_id === utenteId)
    .sort((a,b) => new Date(a.accesso_il) - new Date(b.accesso_il));
  const idx = sessioniUtente.findIndex(s => s.accesso_il === accessoIl);
  const fine = (idx >= 0 && idx < sessioniUtente.length - 1) ? sessioniUtente[idx + 1].accesso_il : null;

  chiudiModal();
  const overlay = document.createElement("div");
  overlay.id = "modal-overlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:900px;">
      <div class="modal-head">
        <h3>${escapeHtml(nomeUtente)} — sessione del ${formatDataOraIt(accessoIl)}</h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size:12.5px;color:var(--grigio-600);margin-top:0;">
          Operazioni eseguite da ${formatDataOraIt(accessoIl)}${fine ? ` a ${formatDataOraIt(fine)} (accesso successivo)` : " ad ora (sessione più recente)"}.
        </p>
        <div id="sessione-attivita-list"><div class="loading-spin">Caricamento…</div></div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  overlay.addEventListener("click", (ev) => { if (ev.target === overlay) chiudiModal(); });

  let query = sb.from("log_attivita").select("*").eq("utente_id", utenteId).gte("creato_il", accessoIl).order("creato_il", { ascending:false });
  if (fine) query = query.lt("creato_il", fine);

  const { data, error } = await query;
  const wrap = document.getElementById("sessione-attivita-list");
  if (error){ wrap.innerHTML = `<p>Errore: ${escapeHtml(error.message)}</p>`; return; }

  if (!data || data.length === 0){
    wrap.innerHTML = `<div class="empty-state"><div class="ic">📋</div>Nessuna operazione registrata in questa sessione.</div>`;
    return;
  }

  wrap.innerHTML = `
    <table class="storico-table">
      <thead><tr><th>Data/ora</th><th>Tabella</th><th>Operazione</th><th>Dettaglio</th></tr></thead>
      <tbody>
        ${data.map(r => `
          <tr>
            <td style="white-space:nowrap;">${formatDataOraIt(r.creato_il)}</td>
            <td>${LABEL_TABELLE_LOG[r.tabella] || r.tabella}</td>
            <td><span class="tag" style="background:${coloreOperazioneLog(r.operazione)};color:#fff;">${LABEL_OPERAZIONE_LOG[r.operazione]}</span></td>
            <td>${descrizioneSinteticaLog(r)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function formatDataOraIt(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("it-IT") + " " + d.toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" });
}

function coloreOperazioneLog(op){
  if (op === "INSERT") return "var(--verde)";
  if (op === "DELETE") return "var(--rosso)";
  return "var(--giallo)";
}

function descrizioneSinteticaLog(r){
  const dati = r.dati_dopo || r.dati_prima || {};
  const candidati = ["targa","selettiva","label","cognome","nome","nome_file","codice","titolo"];
  let etichetta = "";
  for (const c of candidati){
    if (dati[c]){ etichetta += (etichetta ? " " : "") + dati[c]; if (etichetta.split(" ").length >= 2) break; }
  }
  if (!etichetta) etichetta = `ID ${r.record_id || "?"}`;

  if (r.operazione === "UPDATE" && r.dati_prima && r.dati_dopo){
    const cambiati = Object.keys(r.dati_dopo).filter(k => JSON.stringify(r.dati_prima[k]) !== JSON.stringify(r.dati_dopo[k]) && k !== "updated_at");
    if (cambiati.length > 0){
      return `${escapeHtml(etichetta)} — campi modificati: ${cambiati.map(escapeHtml).join(", ")}`;
    }
  }
  return escapeHtml(etichetta);
}
