function formatDataIt(dateStr){
  if(!dateStr) return "—";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("it-IT", { day:"2-digit", month:"2-digit", year:"numeric" });
}

function giorniDaOggi(dateStr){
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - oggi) / 86400000);
}

function statoScadenza(dateStr, giorniPreavviso){
  const g = giorniDaOggi(dateStr);
  if (g < 0) return "scaduto";
  if (g <= giorniPreavviso) return "avvicinamento";
  return "ok";
}

// Rende un segmento di percorso sicuro per lo storage: niente accenti,
// solo [A-Za-z0-9._-], "_" ripetuti compressi.
function pulisciNomeFile(s){
  return String(s ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Za-z0-9._-]/g, "_")
    .replace(/_+/g, "_");
}

/* I file su storage si aprono SOLO con URL firmati (mai URL pubblici),
   così i bucket possono diventare privati senza toccare il codice. */

// URL firmato per un singolo file (default 1 ora). null se non disponibile.
async function urlFirmato(bucket, path, secondi = 3600){
  if (!path) return null;
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, secondi);
  if (error){ console.warn(`URL firmato non disponibile (${bucket}/${path}):`, error.message); return null; }
  return data.signedUrl;
}

// URL firmati per più file con una sola chiamata. Ritorna { path: url }.
async function urlFirmatiMultipli(bucket, paths, secondi = 3600){
  const unici = [...new Set((paths || []).filter(Boolean))];
  if (unici.length === 0) return {};
  const { data, error } = await sb.storage.from(bucket).createSignedUrls(unici, secondi);
  if (error){ console.warn(`URL firmati non disponibili (${bucket}):`, error.message); return {}; }
  const mappa = {};
  (data || []).forEach(r => { if (r.signedUrl && !r.error) mappa[r.path] = r.signedUrl; });
  return mappa;
}

// Apre un documento in una nuova scheda con un URL firmato valido 60 secondi.
// La finestra si apre subito (dentro il click) così i browser mobile non la bloccano.
async function apriFileStorage(bucket, path){
  const win = window.open("", "_blank");
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 60);
  if (error || !data?.signedUrl){
    if (win) win.close();
    alert("Impossibile aprire il file: " + (error?.message || "URL non disponibile"));
    return;
  }
  if (win) win.location.href = data.signedUrl;
  else location.href = data.signedUrl;
}

// Collega i pulsanti [data-apri-file] (con data-bucket) dentro un contenitore.
function attaccaListenerApriFile(contenitore){

    e.preventDefault();
    apriFileStorage(b.dataset.bucket, b.dataset.apriFile);

// Carica tutte le righe di una query superando il limite di 1000 righe di Supabase,
// a blocchi con .range(). creaQuery deve restituire ogni volta una query NUOVA
// (es. () => sb.from("x").select("*").order("nome")), perché il builder non è riutilizzabile.
// Aggiunge .order("id") come ultimo criterio così i blocchi sono stabili.
// Ritorna { data, error } come una normale chiamata Supabase.
async function caricaTutteLeRighe(creaQuery){
  const BLOCCO = 1000;
  let tutte = [];
  for (let da = 0; ; da += BLOCCO){
    const { data, error } = await creaQuery().order("id").range(da, da + BLOCCO - 1);
    if (error) return { data: null, error };
    tutte = tutte.concat(data || []);
    if (!data || data.length < BLOCCO) break;
  }
  return { data: tutte, error: null };
}

// Scarica un file dallo storage e lo restituisce come dataURL (per i PDF).
async function scaricaComeDataUrl(bucket, path){
  const { data: blob, error } = await sb.storage.from(bucket).download(path);
  if (error) throw new Error(`Download non riuscito (${bucket}/${path}): ${error.message}`);
  return await new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.onerror = () => rej(reader.error);
    reader.readAsDataURL(blob);
  });
}

function escapeHtml(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   AUTH
   ============================================================ */
async function initAuth(){
  // Pulizia di eventuali token residui salvati in precedenza (prima che
  // persistSession fosse disattivato), così l'app chiede sempre login.
  await sb.auth.signOut().catch(() => {});
  try{
    Object.keys(localStorage).forEach(k => { if (k.startsWith("sb-")) localStorage.removeItem(k); });
    Object.keys(sessionStorage).forEach(k => { if (k.startsWith("sb-")) sessionStorage.removeItem(k); });
  }catch(e){ /* storage non disponibile, ignora */ }

  showLogin();

  sb.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT"){
      showLogin();
    }
  });
}

async function onAuthenticated(user){
  state.user = user;

  // carica profilo applicativo
  const { data: profile, error } = await sb
    .from("app_users")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if (error || !profile){
    // primo accesso: nessun profilo app_users ancora collegato.
    // Creiamo un profilo di default come 'standard' così l'IT Administrator può poi configurarlo da Impostazioni.
    const { data: created } = await sb
      .from("app_users")
      .insert({ id: user.id, nome: user.email.split("@")[0], email: user.email, ruolo: "standard" })
      .select()
      .single();
    state.profile = created || { nome: user.email, ruolo: "standard" };
  } else {
    state.profile = profile;
  }

  if (profile && profile.attivo === false){
    await sb.auth.signOut().catch(() => {});
    state.user = null;
    state.profile = null;
    const errBox = document.getElementById("login-error");
    errBox.textContent = "Utente disattivato, contatta l'amministratore IT";
    errBox.style.display = "block";
    return;
  }

  // Registra questo accesso nel log (best-effort, non blocca il login se fallisce)
  sb.from("log_accessi").insert({
    utente_id: user.id,
    utente_email: user.email,
    utente_nome: state.profile.nome || user.email
  }).then(() => {}).catch(() => {});

  showApp();
}

  document.getElementById("sidebar-user-role").textContent = labelRuolo(state.profile.ruolo);

  location.hash = "#/home";
  router();
}

function labelRuolo(r){
  const map = { it_admin:"IT Administrator", specialita:"Specialità", segreteria:"Segreteria", standard:"Standard" };
  return map[r] || r;
}

function userCanSee(permesso){
  if (permesso === "_solo_it_admin") return state.profile.ruolo === "it_admin";
  if (permesso === "_almeno_una_sezione") return paginaImpostazioniHaSezioni();
  if (state.profile.ruolo === "it_admin") return true;
  return !!(state.profile.permessi && state.profile.permessi[permesso]);
}

function livelloPermesso(sezione){
  // Per sezioni con granularità (es. 'tlc'): restituisce 'completo', 'base' o null.
  // it_admin ha sempre 'completo'.
  if (state.profile.ruolo === "it_admin") return "completo";
  const v = state.profile.permessi && state.profile.permessi[sezione];
  if (v === "completo" || v === "base") return v;
  return null;
}

function paginaImpostazioniHaSezioni(){
  // Impostazioni è ora sempre visibile a tutti gli utenti autenticati,
  // perché contiene almeno la sezione "La mia firma personale".
  return true;
}

  sidebar.classList.toggle("open");

});

function toggleSidebarBackdrop(mostra){
  let backdrop = document.getElementById("sidebar-backdrop");
  if (mostra){
    if (!backdrop){
      backdrop = document.createElement("div");
      backdrop.id = "sidebar-backdrop";
      backdrop.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:90;";
      backdrop.addEventListener("click", () => {
        document.getElementById("sidebar").classList.remove("open");
        toggleSidebarBackdrop(false);
      });
      document.body.appendChild(backdrop);
    }
  } else if (backdrop){
    backdrop.remove();
  }
}

async function refreshAlertBadge(){
  try{
    const { data, error } = await sb.from("v_scadenze").select("*");
    if (error || !data) return;
    const urgenti = data.filter(r => r.data_scadenza && statoScadenza(r.data_scadenza, r.giorni_preavviso) !== "ok");
    const badge = document.getElementById("badge-home");
    if (badge){
      if (urgenti.length > 0){
        badge.textContent = urgenti.length;
        badge.style.display = "inline-block";
      } else {
        badge.style.display = "none";
      }
    }
  }catch(e){ /* silenzioso */ }
}

  home: ["Home", "Situazione generale e alert"],
  automezzi: ["Automezzi", "Flotta, revisioni e movimentazioni"],
  tlc: ["TLC / Radio", "Apparati e movimentazioni"],

  emergenze: ["Emergenze", "Disponibilità delle Sezioni"],
  utenti: ["Gestione Utenti", "Utenti abilitati e relativi permessi"],
  impostazioni: ["Impostazioni", "Configurazioni per modulo"]
};

let _routerIgnoraHash = false;
function router(){
  if (_routerIgnoraHash){ _routerIgnoraHash = false; return; }
  // documento singolo dell'Editor PDF con modifiche non salvate
  if (_ed && _ed.libero && location.hash !== "#/editorpdf"){
    if (_ed.modificato && !confirm("Ci sono modifiche non salvate nel documento. Uscire comunque?")){
      _routerIgnoraHash = true; location.hash = "#/editorpdf"; return;
    }
    _ed = null;
  }
  const hash = location.hash.replace("#/", "") || "home";
  let route = MENU.some(m => m.route === hash) ? hash : "home";

  const menuItem = MENU.find(m => m.route === route);
  if (!userCanSee(menuItem.permesso)){
    route = "home";
  }
  state.route = route;

  const [title, sub] = PAGE_TITLES[route] || ["", ""];
  document.getElementById("topbar-title").textContent = title;
  document.getElementById("topbar-sub").textContent = sub;

  renderSidebar();

  const content = document.getElementById("page-content");
  content.innerHTML = `<div class="loading-spin">Caricamento…</div>`;

  if (route === "home") renderHome();
  else if (route === "automezzi") renderAutomezzi();
  else if (route === "tlc") renderTlc();
  else if (route === "formazione") renderFormazione();
  else if (route === "firma") renderFirmaDocumenti();
  else if (route === "editorpdf") renderEditorPdf();
  else if (route === "libromatricola") renderLibroMatricola();
  else if (route === "esercitazioni") renderAttivazioni("esercitazione");
  else if (route === "emergenze") renderAttivazioni("emergenza");
  else if (route === "utenti") renderGestioneUtenti();
  else if (route === "impostazioni") renderImpostazioni();
}
window.addEventListener("hashchange", router);

function attivaToggleCollapse(toggleId, bodyId){
  const toggle = document.getElementById(toggleId);
  const body = document.getElementById(bodyId);
  toggle.addEventListener("click", () => {
    const apri = body.style.display !== "block";
    body.style.display = apri ? "block" : "none";
    toggle.querySelector(".collapse-arrow").textContent = apri ? "▴" : "▾";
  });
}

async function caricaBloccoScadenzeAutomezzi(){
  const [{ data: scadenze, error: errScad }, { data: automezzi, error: errMezzi }] = await Promise.all([
    sb.from("v_scadenze").select("*"),
    caricaTutteLeRighe(() => sb.from("automezzi").select("*"))
  ]);
  if (errScad || errMezzi){ alert("Errore: " + (errScad || errMezzi).message); return; }

  const elenco = (scadenze || [])
    .filter(s => s.data_scadenza)
    .map(s => ({ ...s, stato: statoScadenza(s.data_scadenza, s.giorni_preavviso), giorni: giorniDaOggi(s.data_scadenza) }))
    .filter(s => s.stato !== "ok")
    .sort((a,b) => new Date(a.data_scadenza) - new Date(b.data_scadenza));

  const scaduti = elenco.filter(s => s.stato === "scaduto");
  const inAvvicinamento = elenco.filter(s => s.stato === "avvicinamento");

  document.getElementById("badge-scadenze-automezzi").textContent = elenco.length || "";
  document.getElementById("badge-scadenze-automezzi").style.display = elenco.length ? "inline-block" : "none";

  const body = document.getElementById("body-scadenze-automezzi");
  body.innerHTML = `
    <div class="toolbar" style="justify-content:flex-end;margin-bottom:14px;">
      <button class="btn-add" id="btn-report-revisioni">📄 Report revisioni scadute/in scadenza</button>
    </div>
    <div class="section-title">🔴 Scaduto</div>
    ${renderAlertList(scaduti, "scaduto")}
    <div class="section-title">🟡 In avvicinamento</div>
    ${renderAlertList(inAvvicinamento, "avvicinamento")}
  `;

  document.getElementById("btn-report-revisioni").addEventListener("click", () => generaReportRevisioniMese(automezzi));

  body.querySelectorAll(".alert-row[data-modulo]").forEach(el => {
    el.addEventListener("click", () => {
      const rif = parseInt(el.dataset.rif);
      location.hash = "#/automezzi";
      setTimeout(() => {
        const m = _automezziCache.find(x => x.id === rif);
        if (m) apriModalMezzo(m.id);
      }, 400);
    });
  });

  attivaToggleCollapse("toggle-scadenze-automezzi", "body-scadenze-automezzi");
  document.getElementById("body-scadenze-automezzi").style.display = "block";
}

async function caricaBloccoTlcInUso(){
  const { data, error } = await caricaTutteLeRighe(() => sb
    .from("movimentazioni_tlc")
    .select("*, movimentazioni_tlc_apparati(tlc_apparati(selettiva, modello))")
    .eq("stato", "in_uso")
    .order("data_uscita", { ascending: true }));

  document.getElementById("badge-tlc-in-uso").textContent = (data && data.length) || "";
  document.getElementById("badge-tlc-in-uso").style.display = (data && data.length) ? "inline-block" : "none";

  const body = document.getElementById("body-tlc-in-uso");
  if (error){ body.innerHTML = `<p style="color:var(--rosso);font-size:13px;">Errore: ${escapeHtml(error.message)}</p>`; return; }

  if (!data || data.length === 0){
    body.innerHTML = `<div class="empty-state"><div class="ic">✅</div>Nessuna radio attualmente fuori sede.</div>`;
  } else {
    body.innerHTML = `<div class="alert-list">` + data.map(r => {
      const apparati = (r.movimentazioni_tlc_apparati||[]).map(a => a.tlc_apparati?.selettiva).filter(Boolean).join(", ");
      const giorni = giorniDaOggi(r.data_uscita);
      return `
        <div class="alert-row avvicinamento" data-mov="${r.id}">
          <span class="dot"></span>
          <span class="desc">${escapeHtml(apparati)} — ${escapeHtml(r.operatore)} (${escapeHtml(r.sezione_ana)})</span>
          <span class="tag">USCITA</span>
          <span class="data">${formatDataIt(r.data_uscita)} (da ${Math.abs(giorni)}gg)</span>
        </div>
      `;
    }).join("") + `</div>`;
  }

  body.querySelectorAll(".alert-row[data-mov]").forEach(el => {
    el.addEventListener("click", () => { location.hash = "#/tlc"; });
  });

  attivaToggleCollapse("toggle-tlc-in-uso", "body-tlc-in-uso");
  document.getElementById("body-tlc-in-uso").style.display = "block";
}

function generaReportRevisioniMese(automezzi){
  const oggi = new Date();
  const mesiIt = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

  const elenco = (automezzi || [])
    .filter(m => m.scadenza_revisione && statoScadenza(m.scadenza_revisione, 30) !== "ok")
    .sort((a,b) => new Date(a.scadenza_revisione) - new Date(b.scadenza_revisione));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text("Polo Logistico 1 RGPT/CAP Vercelli", 14, 16);
  doc.setFontSize(11);
  doc.text(`Report revisioni scadute e in scadenza`, 14, 24);
  doc.setFontSize(9);
  doc.text(`Generato il ${formatDataIt(oggi.toISOString().slice(0,10))}`, 14, 30);

  let y = 42;
  doc.setFontSize(9);
  doc.setFont(undefined, "bold");
  doc.text("Targa", 14, y);
  doc.text("Marca/Modello", 45, y);
  doc.text("Categoria", 100, y);
  doc.text("Posizione", 135, y);
  doc.text("Scadenza", 170, y);
  doc.setFont(undefined, "normal");
  y += 4;
  doc.line(14, y, 196, y);
  y += 6;

  if (elenco.length === 0){
    doc.text("Nessuna revisione scaduta o in scadenza.", 14, y);
  } else {
    elenco.forEach(m => {
      if (y > 280){ doc.addPage(); y = 20; }
      const scaduto = statoScadenza(m.scadenza_revisione, 30) === "scaduto";
      if (scaduto) doc.setTextColor(192,57,43); else doc.setTextColor(0,0,0);
      doc.text(m.targa, 14, y);
      doc.text(`${m.marca||""} ${m.modello||""}`.trim().slice(0,28), 45, y);
      doc.text(m.categoria || "—", 100, y);
      doc.text(m.posizione || "—", 135, y);
      doc.text(formatDataIt(m.scadenza_revisione), 170, y);
      doc.setTextColor(0,0,0);
      y += 7;
    });
  }

  doc.save(`report_revisioni_${oggi.toISOString().slice(0,10)}.pdf`);
}

function renderAlertList(items, classe){
  if (items.length === 0){
    return `<div class="empty-state"><div class="ic">✅</div>Nessuna voce in questo stato.</div>`;
  }
  return `<div class="alert-list">` + items.map(it => `
    <div class="alert-row ${classe}" data-modulo="${it.modulo}" data-rif="${it.riferimento_id}">
      <span class="dot"></span>
      <span class="desc">${escapeHtml(it.descrizione)}</span>
      <span class="tag">${it.tipo}</span>
      <span class="data">${formatDataIt(it.data_scadenza)} ${it.giorni < 0 ? `(${Math.abs(it.giorni)}gg fa)` : `(in ${it.giorni}gg)`}</span>
    </div>
  `).join("") + `</div>`;
}

const STORAGE_BUCKET_MEZZI = "mezzi-foto";
let _automezziCache = [];
let _automezziFiltro = { search:"", categoria:"", posizione:"", proprietario:"" };

function pathFotoMezzo(targa, lato){
  // lato: fronte | retro | sx | dx
  // Niente pulisciNomeFile qui: questo percorso serve anche in lettura
  // (URL firmati delle foto) e le foto esistenti sono salvate con la targa originale,
  // spazi compresi (es. "GRU GC437HZ"). Pulirlo le renderebbe irraggiungibili.
  return `${targa}/${lato}.jpg`;
}
// URL firmati delle foto frontali per la griglia, per id mezzo (riempita in renderAutomezzi)
let _automezziFotoUrl = {};

async function renderAutomezzi(){
  const content = document.getElementById("page-content");
  const { data, error } = await caricaTutteLeRighe(() => sb.from("automezzi").select("*").order("targa"));

  if (error){
    content.innerHTML = `<div class="placeholder-page"><h3>Errore</h3><p>${escapeHtml(error.message)}</p></div>`;
    return;
  }
  _automezziCache = data;

  const conFoto = data.filter(m => m.foto_fronte);
  const urlPerPath = await urlFirmatiMultipli(STORAGE_BUCKET_MEZZI, conFoto.map(m => pathFotoMezzo(m.targa, "fronte")));
  _automezziFotoUrl = {};
  conFoto.forEach(m => { _automezziFotoUrl[m.id] = urlPerPath[pathFotoMezzo(m.targa, "fronte")] || null; });

  content.innerHTML = `
    <div class="toolbar">
      <input type="search" id="am-search" placeholder="Cerca per targa…" value="${escapeHtml(_automezziFiltro.search)}">
      <select id="am-filtro-categoria">
        <option value="">Tutte le categorie</option>
        ${["AUTOCARRO","PULMINO","PICKUP","AUTOVETTURA","CARRELLO","ATTREZZATURA","MMT"].map(c =>
          `<option value="${c}" ${_automezziFiltro.categoria===c?"selected":""}>${c}</option>`).join("")}
      </select>
      <select id="am-filtro-posizione">
        <option value="">Tutte le posizioni</option>
        ${["POLO VERCELLI","SEZIONE","VOLONTARIO"].map(p =>
          `<option value="${p}" ${_automezziFiltro.posizione===p?"selected":""}>${p}</option>`).join("")}
      </select>
      <select id="am-filtro-proprietario">
        <option value="">Tutti i proprietari</option>
        ${["ANA","CAP","REGIONE PIEMONTE"].map(p =>
          `<option value="${p}" ${_automezziFiltro.proprietario===p?"selected":""}>${p}</option>`).join("")}
      </select>
      <button class="btn-add" id="am-btn-nuovo">+ Nuovo mezzo</button>
    </div>
    <div class="results-count" id="am-results-count"></div>
    <div class="card-grid" id="am-grid"></div>
  `;

  document.getElementById("am-search").addEventListener("input", e => { _automezziFiltro.search = e.target.value; renderAutomezziGrid(); });
  document.getElementById("am-filtro-categoria").addEventListener("change", e => { _automezziFiltro.categoria = e.target.value; renderAutomezziGrid(); });
  document.getElementById("am-filtro-posizione").addEventListener("change", e => { _automezziFiltro.posizione = e.target.value; renderAutomezziGrid(); });
  document.getElementById("am-filtro-proprietario").addEventListener("change", e => { _automezziFiltro.proprietario = e.target.value; renderAutomezziGrid(); });
  document.getElementById("am-btn-nuovo").addEventListener("click", () => apriModalMezzo(null));

  renderAutomezziGrid();
}

function statoOperativoMezzo(m){
  // Il dismesso è definitivo: niente automatismo, resta sempre dismesso.
  if (m.stato_manuale === "dismesso") return "dismesso";
  // Esente da revisione: niente controllo data, mai "Revisionare" automatico.
  if (m.frequenza_revisione_anni === 0) return m.stato_manuale || "operativo";
  // La revisione scaduta vince sempre sugli altri stati (tranne dismesso/esente).
  if (m.scadenza_revisione && statoScadenza(m.scadenza_revisione, 30) === "scaduto"){
    return "revisionare";
  }
  return m.stato_manuale || "operativo";
}

function labelStatoMezzo(s){
  const map = { operativo:"Operativo", revisionare:"Revisionare", in_manutenzione:"In Manutenzione", dismesso:"Dismesso" };
  return map[s] || s;
}

function renderAutomezziGrid(){
  const f = _automezziFiltro;
  const filtrati = _automezziCache.filter(m => {
    if (f.search && !m.targa.toLowerCase().includes(f.search.toLowerCase())) return false;
    if (f.categoria && m.categoria !== f.categoria) return false;
    if (f.posizione && m.posizione !== f.posizione) return false;
    if (f.proprietario && m.proprietario !== f.proprietario) return false;
    return true;
  });

  const attivi = filtrati.filter(m => m.stato_manuale !== "dismesso");
  const dismessi = filtrati.filter(m => m.stato_manuale === "dismesso");

  document.getElementById("am-results-count").textContent = `${attivi.length} di ${_automezziCache.filter(m=>m.stato_manuale!=="dismesso").length} mezzi attivi`;

  const grid = document.getElementById("am-grid");
  if (attivi.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="ic">🔍</div>Nessun mezzo corrisponde ai filtri.</div>`;
  } else {
    grid.innerHTML = renderCardMezziHtml(attivi);
    attaccaListenerCardMezzi(grid);
  }

  // Sezione dismessi, collassabile, in fondo
  let sezioneDismessi = document.getElementById("am-sezione-dismessi");
  if (!sezioneDismessi){
    sezioneDismessi = document.createElement("div");
    sezioneDismessi.id = "am-sezione-dismessi";
    sezioneDismessi.className = "collapse-block";
    sezioneDismessi.style.marginTop = "20px";
    grid.parentElement.appendChild(sezioneDismessi);
  }
  if (dismessi.length === 0){
    sezioneDismessi.style.display = "none";
  } else {
    sezioneDismessi.style.display = "block";
    sezioneDismessi.innerHTML = `
      <button class="collapse-head" id="toggle-am-dismessi">
        <span>🗑️ Mezzi dismessi</span>
        <span class="collapse-badge" style="display:inline-block;background:var(--grigio-600);">${dismessi.length}</span>
        <span class="collapse-arrow">▾</span>
      </button>
      <div class="collapse-body" id="body-am-dismessi"><div class="card-grid">${renderCardMezziHtml(dismessi)}</div></div>
    `;
    attaccaListenerCardMezzi(sezioneDismessi);
    const toggle = document.getElementById("toggle-am-dismessi");
    const bodyDism = document.getElementById("body-am-dismessi");
    toggle.addEventListener("click", () => {
      const apri = bodyDism.style.display !== "block";
      bodyDism.style.display = apri ? "block" : "none";
      toggle.querySelector(".collapse-arrow").textContent = apri ? "▴" : "▾";
    });
  }
}

function renderCardMezziHtml(elenco){
  return elenco.map(m => {
    const statoOp = statoOperativoMezzo(m);
    const fotoUrl = m.foto_fronte ? (_automezziFotoUrl[m.id] || null) : null;
    return `
      <div class="veicolo-card" data-id="${m.id}">
        <div class="foto-wrap">
          ${fotoUrl ? `<img src="${fotoUrl}" alt="${escapeHtml(m.targa)}" onerror="this.parentElement.innerHTML='<span class=ph>🚐</span>'">` : `<span class="ph">🚐</span>`}
          ${m.categoria ? `<span class="badge-cat">${m.categoria}</span>` : ""}
        </div>
        <div class="info">
          <span class="badge-stato-mezzo ${statoOp}">${labelStatoMezzo(statoOp)}</span>
          <div class="targa">${escapeHtml(m.targa)}</div>
          <div class="modello">${escapeHtml(m.marca || "")} ${escapeHtml(m.modello || "")}</div>
          <div class="meta">
            ${m.posizione ? `<span>${m.posizione}</span>` : ""}
            ${m.proprietario ? `<span>${m.proprietario}</span>` : ""}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function attaccaListenerCardMezzi(container){
  container.querySelectorAll(".veicolo-card[data-id]").forEach(el => {
    el.addEventListener("click", () => apriModalMezzo(parseInt(el.dataset.id)));
  });
}

/* ---------- MODAL MEZZO ---------- */
let _modalMezzoCorrente = null;
let _modalMezzoTab = "dati";

function apriModalMezzo(id){
  _modalMezzoCorrente = id ? _automezziCache.find(m => m.id === id) : null;
  _modalMezzoTab = "dati";
  renderModalMezzo();
}

function chiudiModal(){
  const ov = document.getElementById("modal-overlay");
  if (ov) ov.remove();
}

function renderModalMezzo(){
  chiudiModal();
  const m = _modalMezzoCorrente;
  const isNuovo = !m;

  const overlay = document.createElement("div");
  overlay.id = "modal-overlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <h3>${isNuovo ? "Nuovo mezzo" : escapeHtml(m.targa)}</h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      ${isNuovo ? "" : `
        <div class="modal-tabs">
          <div class="modal-tab ${_modalMezzoTab==="dati"?"active":""}" data-tab="dati">Scheda</div>
          <div class="modal-tab ${_modalMezzoTab==="foto"?"active":""}" data-tab="foto">Foto</div>
          <div class="modal-tab ${_modalMezzoTab==="documenti"?"active":""}" data-tab="documenti">Documenti</div>
          <div class="modal-tab ${_modalMezzoTab==="manutenzioni"?"active":""}" data-tab="manutenzioni">Manutenzioni</div>
          <div class="modal-tab ${_modalMezzoTab==="movimenti"?"active":""}" data-tab="movimenti">Movimentazioni</div>
        </div>
      `}
      <div class="modal-body" id="modal-body"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) chiudiModal(); });

  overlay.querySelectorAll(".modal-tab").forEach(tab => {
    tab.addEventListener("click", () => { _modalMezzoTab = tab.dataset.tab; renderModalMezzo(); });
  });

  if (isNuovo || _modalMezzoTab === "dati") renderTabDatiMezzo();
  else if (_modalMezzoTab === "foto") renderTabFotoMezzo();
  else if (_modalMezzoTab === "documenti") renderTabDocumenti();
  else if (_modalMezzoTab === "manutenzioni") renderTabManutenzioni();
  else if (_modalMezzoTab === "movimenti") renderTabMovimentiMezzo();
}

      const ok = confirm("Stai per dismettere definitivamente questo mezzo.\n\nUna volta dismesso, il mezzo verrà spostato nella sezione \"Mezzi dismessi\" e non sarà più possibile riportarlo operativo.\n\nConfermi la dismissione?");
      if (!ok) return;
    }

    const payload = {
      targa: fd.get("targa").trim().toUpperCase(),
      marca: fd.get("marca") || null,
      modello: fd.get("modello") || null,
      posti: fd.get("posti") ? parseInt(fd.get("posti")) : null,
      categoria: fd.get("categoria") || null,
      proprietario: fd.get("proprietario") || null,
      posizione: fd.get("posizione") || null,
      scadenza_revisione: fd.get("scadenza_revisione") || null,
      frequenza_revisione_anni: parseInt(fd.get("frequenza_revisione_anni")),
      stato_manuale: nuovoStato,
      descrizione: fd.get("descrizione") || null,
      carte_carburante: fd.get("carte_carburante") || null,
      ha_telepass: fd.get("ha_telepass") === "on",
      numero_telepass: fd.get("ha_telepass") === "on" ? (fd.get("numero_telepass") || null) : null,
      assicurato_2026: fd.get("assicurato_2026") === "on",
      note: fd.get("note") || null
    };

    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    let result;
    if (m.id){
      result = await sb.from("automezzi").update(payload).eq("id", m.id).select().single();
    } else {
      result = await sb.from("automezzi").insert(payload).select().single();
    }

    if (result.error){
      alert("Errore salvataggio: " + result.error.message);
      btn.disabled = false; btn.textContent = "Salva";
      return;
    }

    chiudiModal();
    renderAutomezzi();

async function renderTabFotoMezzo(){
  const m = _modalMezzoCorrente;
  const body = document.getElementById("modal-body");
  const lati = [
    { key:"fronte", label:"Fronte (copertina)" },
    { key:"retro", label:"Retro" },
    { key:"sx", label:"Fianco sinistro" },
    { key:"dx", label:"Fianco destro" }
  ];

  const urlPerPath = await urlFirmatiMultipli(STORAGE_BUCKET_MEZZI,
    lati.filter(l => m["foto_" + l.key]).map(l => pathFotoMezzo(m.targa, l.key)));

  body.innerHTML = `
    <div class="foto-grid4">
      ${lati.map(l => {
        const has = m["foto_" + l.key];
        const firmato = has ? urlPerPath[pathFotoMezzo(m.targa, l.key)] : null;
        // l'URL firmato contiene già "?", quindi il cache-busting va con "&"
        const url = firmato ? firmato + "&t=" + Date.now() : null;
        return `
          <div class="foto-slot" id="slot-${l.key}">
            ${url ? `<img src="${url}">` : `<div class="ph"><span class="ic">📷</span>${l.label}</div>`}
            <div class="lbl">${l.label}</div>
            <input type="file" accept="image/*,.heic,.heif" data-lato="${l.key}">
          </div>
        `;
      }).join("")}
    </div>
    <p style="font-size:12px;color:var(--grigio-600);">Tocca un riquadro per caricare o sostituire la foto. Le immagini si salvano automaticamente.</p>
  `;

  body.querySelectorAll('input[type="file"]').forEach(input => {
    input.addEventListener("change", async (e) => {
      let file = e.target.files[0];
      if (!file) return;
      const lato = e.target.dataset.lato;
      const slot = document.getElementById("slot-" + lato);
      slot.classList.add("uploading");

      // Rileva HEIC/HEIF (foto iPhone) e converte in JPEG prima dell'upload,
      // perché Supabase Storage non accetta quel formato.
      const isHeic = /\.heic$/i.test(file.name) || /\.heif$/i.test(file.name) ||
                     file.type === "image/heic" || file.type === "image/heif";
      if (isHeic){
        try{
          const blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.85 });
          file = new File([blob], file.name.replace(/\.(heic|heif)$/i, ".jpg"), { type: "image/jpeg" });
        }catch(convErr){
          slot.classList.remove("uploading");
          alert("Errore nella conversione della foto HEIC. Riprova o usa un'altra foto.");
          return;
        }
      }

      const path = pathFotoMezzo(m.targa, lato);
      const { error } = await sb.storage.from(STORAGE_BUCKET_MEZZI).upload(path, file, { upsert: true, contentType: "image/jpeg" });

      slot.classList.remove("uploading");

      if (error){
        alert("Errore upload: " + error.message);
        return;
      }

      // aggiorna flag in DB
      const campo = "foto_" + lato;
      const { error: errFlag } = await sb.from("automezzi").update({ [campo]: true }).eq("id", m.id);
      if (errFlag){ alert("Errore: " + errFlag.message); return; }
      m[campo] = true;
      const idx = _automezziCache.findIndex(x => x.id === m.id);
      if (idx >= 0) _automezziCache[idx][campo] = true;

      renderTabFotoMezzo();
      if (lato === "fronte"){
        const u = await urlFirmato(STORAGE_BUCKET_MEZZI, path);
        _automezziFotoUrl[m.id] = u ? u + "&t=" + Date.now() : null;
        renderAutomezziGrid();
      }
    });
  });
}

    <div class="results-count" id="tlc-results-count"></div>
    <div id="tlc-grid"></div>
  `;

  document.getElementById("tlc-search").addEventListener("input", e => { _tlcFiltro.search = e.target.value; renderTlcGrid(); });
  document.getElementById("tlc-filtro-categoria").addEventListener("change", e => { _tlcFiltro.categoria = e.target.value; renderTlcGrid(); });
  document.getElementById("tlc-filtro-marca").addEventListener("change", e => { _tlcFiltro.marca = e.target.value; renderTlcGrid(); });
  if (!soloLettura) document.getElementById("tlc-btn-nuovo").addEventListener("click", () => apriModalTlc(null));
  document.getElementById("tlc-btn-movimentazioni").addEventListener("click", () => renderMovimentazioniTlc());
  document.getElementById("tlc-btn-export-excel").addEventListener("click", () => esportaMagazzinoTlcExcel());
  if (!soloLettura) document.getElementById("tlc-input-import-excel").addEventListener("change", (ev) => importaMagazzinoTlcExcel(ev));

  renderTlcGrid();
}

function esportaMagazzinoTlcExcel(){
  const dati = _tlcCache.map(a => ({
    "Codice ANA": a.codice_ana,
    "Categoria": a.categoria || "",
    "Sottocategoria (solo Radio)": a.sottocategoria_radio || "",
    "Marca": a.marca || "",
    "Modello": a.modello || "",
    "Matricola": a.matricola || "",
    "Selettiva": a.selettiva || "",
    "Assegnato a": a.assegnato_a || "",
    "Descrizione": a.descrizione || "",
    "Note": a.note || ""
  }));
  const ws = XLSX.utils.json_to_sheet(dati);
  ws["!cols"] = Object.keys(dati[0]||{}).map(() => ({ wch: 18 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Magazzino TLC");
  XLSX.writeFile(wb, `Magazzino_TLC_${new Date().toISOString().slice(0,10)}.xlsx`);
}

async function importaMagazzinoTlcExcel(ev){
  const file = ev.target.files[0];
  if (!file) return;
  ev.target.value = "";

  if (!confirm(`Importare il magazzino da ${file.name}?\n\nSe il Codice ANA esiste già, la riga verrà aggiornata. Se non esiste, verrà creato un nuovo apparato.`)) return;

  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(255,255,255,0.9);z-index:600;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;";
  overlay.innerHTML = `<div class="loading-spin">Importazione in corso…</div><div id="import-tlc-excel-progress" style="font-size:13px;color:var(--grigio-600);"></div>`;
  document.body.appendChild(overlay);
  const progressEl = overlay.querySelector("#import-tlc-excel-progress");

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:"array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const righe = XLSX.utils.sheet_to_json(ws, { defval:"" });

    let creati = 0, aggiornati = 0, errori = [];
    let i = 0;
    for (const riga of righe){
      i++;
      progressEl.textContent = `${i} di ${righe.length}…`;

      const codiceAna = String(riga["Codice ANA"] || "").trim().toUpperCase();
      if (!codiceAna){
        errori.push(`Riga ${i+1}: Codice ANA mancante, saltata.`);
        continue;
      }

      const categoria = String(riga["Categoria"] || "").trim().toUpperCase() || null;
      const marca = String(riga["Marca"] || "").trim().toUpperCase() || null;
      const sottocategoriaRadio = String(riga["Sottocategoria (solo Radio)"] || "").trim().toUpperCase() || null;

      // Validazione contro le liste canoniche gestite in Impostazioni:
      // niente categorie/marche/sottocategorie "fantasma" introdotte da un refuso nel file.
      if (categoria && !_tlcCategorie.includes(categoria)){
        errori.push(`${codiceAna}: categoria "${categoria}" non esiste tra quelle gestite in Impostazioni, riga saltata.`);
        continue;
      }
      if (marca && !_tlcMarche.includes(marca)){
        errori.push(`${codiceAna}: marca "${marca}" non esiste tra quelle gestite in Impostazioni, riga saltata.`);
        continue;
      }
      if (categoria === "RADIO"){
        if (!sottocategoriaRadio){
          errori.push(`${codiceAna}: categoria RADIO richiede la sottocategoria, riga saltata.`);
          continue;
        }
        if (!_tlcSottocategorieRadio.includes(sottocategoriaRadio)){
          errori.push(`${codiceAna}: sottocategoria "${sottocategoriaRadio}" non esiste tra quelle gestite in Impostazioni, riga saltata.`);
          continue;
        }
      }

      const payload = {
        codice_ana: codiceAna,
        categoria: categoria,
        sottocategoria_radio: categoria === "RADIO" ? sottocategoriaRadio : null,
        marca: marca,
        modello: String(riga["Modello"] || "").trim() || null,
        matricola: String(riga["Matricola"] || "").trim() || null,
        selettiva: String(riga["Selettiva"] || "").trim().toUpperCase() || null,
        assegnato_a: String(riga["Assegnato a"] || "").trim() || null,
        descrizione: String(riga["Descrizione"] || "").trim() || null,
        note: String(riga["Note"] || "").trim() || null
      };

      try{
        const { data: esistente, error: errEsist } = await sb.from("tlc_apparati").select("id").eq("codice_ana", codiceAna).maybeSingle();
        if (errEsist) throw errEsist;
        if (esistente){
          const { error } = await sb.from("tlc_apparati").update(payload).eq("id", esistente.id);
          if (error) throw error;
          aggiornati++;
        } else {
          const { error } = await sb.from("tlc_apparati").insert(payload);
          if (error) throw error;
          creati++;
        }
      }catch(err){
        errori.push(`${codiceAna}: ${err.message}`);
      }
    }

    overlay.remove();
    let msg = `Import completato.\nNuovi apparati: ${creati}\nApparati aggiornati: ${aggiornati}`;
    if (errori.length) msg += `\n\nErrori (${errori.length}):\n` + errori.join("\n");
    alert(msg);

    renderTlc();

  }catch(err){
    overlay.remove();
    alert("Errore nella lettura del file: " + err.message);
  }
}

let _tlcGruppiAperti = new Set(); // categorie aperte, persiste tra re-render finché resti sulla pagina

function renderCardApparatoTlc(a){
  const inUscita = _idApparatiInUsoTlc.has(a.id);
  return `
    <div class="veicolo-card tlc-card" data-id="${a.id}">
      <div class="tlc-card-head">
        ${a.categoria ? `<span class="badge-cat" style="position:static;">${a.categoria}${a.sottocategoria_radio ? ' · '+a.sottocategoria_radio : ''}</span>` : ""}
        ${inUscita ? `<span class="badge-stato-mezzo revisionare" style="margin:0;">Uscita</span>` : ""}
      </div>
      <div class="info">
        <div class="targa">${escapeHtml(a.codice_ana)}</div>
        <div class="modello">${escapeHtml(a.marca || "")} ${escapeHtml(a.modello || "")}</div>
        <div class="meta">
          ${a.assegnato_a ? `<span>${escapeHtml(a.assegnato_a)}</span>` : `<span>Non assegnato</span>`}
          ${a.selettiva ? `<span>${escapeHtml(a.selettiva)}</span>` : ""}
        </div>
      </div>
    </div>
  `;
}

function renderTlcGrid(){
  const f = _tlcFiltro;
  const filtrati = _tlcCache.filter(a => {
    if (f.search){
      const q = f.search.toLowerCase();
      const campi = [a.codice_ana, a.selettiva, a.marca, a.modello, a.matricola, a.assegnato_a, a.descrizione];
      const trovato = campi.some(c => (c || "").toLowerCase().includes(q));
      if (!trovato) return false;
    }
    if (f.categoria && a.categoria !== f.categoria) return false;
    if (f.marca && a.marca !== f.marca) return false;
    return true;
  });

  document.getElementById("tlc-results-count").textContent = `${filtrati.length} di ${_tlcCache.length} apparati`;

  const grid = document.getElementById("tlc-grid");
  if (filtrati.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="ic">🔍</div>Nessun apparato corrisponde ai filtri.</div>`;
    return;
  }

  // Sezione fissa in cima: apparati attualmente in uscita (tra quelli filtrati)
  const inUscita = filtrati.filter(a => _idApparatiInUsoTlc.has(a.id));
  let htmlUscita = "";
  if (inUscita.length > 0){
    htmlUscita = `
      <div class="stat-card" style="margin-bottom:20px;border-left:3px solid var(--rosso);">
        <div class="section-title" style="margin:0 0 10px;color:var(--rosso);">📤 Attualmente in uscita (${inUscita.length})</div>
        <div class="tlc-lista-verticale">${inUscita.map(renderCardApparatoTlc).join("")}</div>
      </div>
    `;
  }

  // Raggruppamento per categoria, collassabile, chiuso di default
  // (esclude gli apparati "in uscita", già mostrati nel riquadro fisso sopra)
  const gruppi = {};
  filtrati.filter(a => !_idApparatiInUsoTlc.has(a.id)).forEach(a => {
    const k = a.categoria || "Senza categoria";
    if (!gruppi[k]) gruppi[k] = [];
    gruppi[k].push(a);
  });

  const htmlGruppi = Object.keys(gruppi).sort().map(cat => {
    const apparatiGruppo = gruppi[cat];
    const aperto = _tlcGruppiAperti.has(cat);
    return `
      <div class="collapse-block" style="margin-bottom:10px;">
        <button class="collapse-head" data-gruppo-tlc="${escapeHtml(cat)}">
          <span>${escapeHtml(cat)}</span>
          <span class="collapse-badge" style="display:inline-block;">${apparatiGruppo.length}</span>
          <span class="collapse-arrow">${aperto?"▴":"▾"}</span>
        </button>
        <div class="collapse-body" style="display:${aperto?"block":"none"};">
          <div class="tlc-lista-verticale">${apparatiGruppo.map(renderCardApparatoTlc).join("")}</div>
        </div>
      </div>
    `;
  }).join("");

  grid.innerHTML = htmlUscita + htmlGruppi;

  grid.querySelectorAll("[data-gruppo-tlc]").forEach(btn => {
    btn.addEventListener("click", () => {
      const g = btn.dataset.gruppoTlc;
      if (_tlcGruppiAperti.has(g)) _tlcGruppiAperti.delete(g); else _tlcGruppiAperti.add(g);
      renderTlcGrid();
    });
  });

  grid.querySelectorAll(".veicolo-card").forEach(el => {
    el.addEventListener("click", () => apriModalTlc(parseInt(el.dataset.id), livelloPermesso("tlc") !== "completo"));
  });
}

let _modalTlcCorrente = null;
let _modalTlcTab = "dati";

let _modalTlcSoloLettura = false;

function apriModalTlc(id, soloLettura){
  _modalTlcCorrente = id ? _tlcCache.find(a => a.id === id) : null;
  _modalTlcTab = "dati";
  _modalTlcSoloLettura = !!soloLettura;
  renderModalTlc();
}

function renderModalTlc(){
  chiudiModal();
  const a = _modalTlcCorrente;
  const isNuovo = !a;

  const overlay = document.createElement("div");
  overlay.id = "modal-overlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <h3 style="display:flex;align-items:center;gap:8px;flex:1;">
          ${isNuovo
            ? `Nuovo apparato`
            : `<input id="input-codice-ana-header" value="${escapeHtml(a.codice_ana||"")}" ${_modalTlcSoloLettura?"disabled":""} style="font-size:16px;font-weight:700;color:var(--blu-900);font-family:monospace;border:1px solid var(--grigio-400);border-radius:6px;padding:4px 8px;width:160px;">`}
        </h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      ${isNuovo ? "" : ""}
      <div class="modal-body" id="modal-body"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) chiudiModal(); });
  overlay.querySelectorAll(".modal-tab").forEach(tab => {
    tab.addEventListener("click", () => { _modalTlcTab = tab.dataset.tab; renderModalTlc(); });
  });

  renderTabDatiTlc();
}

async function generaProssimoCodiceAna(){
  const { data, error } = await caricaTutteLeRighe(() => sb
    .from("tlc_apparati")
    .select("codice_ana")
    .ilike("codice_ana", "TLC%")
    .order("codice_ana", { ascending: false }));
  if (error){ alert("Errore: " + error.message); return null; }

  let max = 0;
  (data || []).forEach(r => {
    const m = (r.codice_ana || "").match(/^TLC(\d+)$/);
    if (m){
      const n = parseInt(m[1], 10);
      if (n > max) max = n;
    }
  });
  return "TLC" + String(max + 1).padStart(4, "0");
}

function renderTabDatiTlc(){
  const a = _modalTlcCorrente || {};
  const ro = _modalTlcSoloLettura ? "disabled" : "";
  const isNuovo = !a.id;
  const body = document.getElementById("modal-body");
  body.innerHTML = `
    <form id="form-tlc">
      ${_modalTlcSoloLettura ? `<p style="font-size:12px;color:var(--grigio-600);margin-top:0;">Visualizzazione in sola lettura. Il tuo livello di accesso TLC non permette modifiche agli apparati.</p>` : ""}
      <div class="form-grid">
        ${isNuovo ? `
        <div class="form-field full">
          <label>Codice ANA</label>
          <input name="codice_ana" placeholder="Lascia vuoto per generazione automatica (es. TLC0008)">
        </div>` : ""}
        <div class="form-field">
          <label>Categoria</label>
          <select name="categoria" id="select-categoria-tlc" ${ro}>
            <option value="">—</option>
            ${_tlcCategorie.map(c => `<option value="${c}" ${a.categoria===c?"selected":""}>${c}</option>`).join("")}
          </select>
        </div>
        <div class="form-field" id="campo-sottocategoria-radio" style="${a.categoria==='RADIO' ? '' : 'display:none;'}">
          <label>Sottocategoria *</label>
          <select name="sottocategoria_radio" ${ro}>
            <option value="">—</option>
            ${_tlcSottocategorieRadio.map(s => `<option value="${s}" ${a.sottocategoria_radio===s?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
        <div class="form-field">
          <label>Marca</label>
          <select name="marca" ${ro}>
            <option value="">—</option>
            ${_tlcMarche.map(m => `<option value="${m}" ${a.marca===m?"selected":""}>${m}</option>`).join("")}
          </select>
        </div>
        <div class="form-field"><label>Modello</label><input name="modello" value="${escapeHtml(a.modello||"")}" ${ro}></div>
        <div class="form-field"><label>Matricola</label><input name="matricola" value="${escapeHtml(a.matricola||"")}" ${ro}></div>
        <div class="form-field"><label>Assegnato a</label><input name="assegnato_a" value="${escapeHtml(a.assegnato_a||"")}" ${ro}></div>
        <div class="form-field"><label>Selettiva</label><input name="selettiva" value="${escapeHtml(a.selettiva||"")}" ${ro}></div>
        <div class="form-field full"><label>Descrizione</label><input name="descrizione" value="${escapeHtml(a.descrizione||"")}" ${ro}></div>
        <div class="form-field full"><label>Note</label><textarea name="note" ${ro}>${escapeHtml(a.note||"")}</textarea></div>
      </div>
      <div class="form-actions">
        ${(a.id && !_modalTlcSoloLettura) ? `<button type="button" class="btn-danger" id="btn-elimina-tlc">Elimina apparato</button>` : ""}
        <button type="button" class="btn-cancel" id="btn-cancel-tlc">${_modalTlcSoloLettura ? "Chiudi" : "Annulla"}</button>
        ${_modalTlcSoloLettura ? "" : `<button type="submit" class="btn-save">Salva</button>`}
      </div>
    </form>
  `;

  if (!_modalTlcSoloLettura){
    document.getElementById("select-categoria-tlc").addEventListener("change", (e) => {
      document.getElementById("campo-sottocategoria-radio").style.display = e.target.value === "RADIO" ? "block" : "none";
    });
  }

  document.getElementById("btn-cancel-tlc").addEventListener("click", chiudiModal);
  if (a.id && !_modalTlcSoloLettura) document.getElementById("btn-elimina-tlc").addEventListener("click", () => eliminaTlc(a.id));
  if (_modalTlcSoloLettura) return; // niente submit da agganciare

  document.getElementById("form-tlc").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);

    if (fd.get("categoria") === "RADIO" && !fd.get("sottocategoria_radio")){
      alert("Seleziona la sottocategoria per gli apparati di categoria RADIO.");
      return;
    }

    let codiceAna = a.codice_ana;
    if (isNuovo){
      codiceAna = (fd.get("codice_ana") || "").trim().toUpperCase();
      if (!codiceAna){
        codiceAna = await generaProssimoCodiceAna();
        if (!codiceAna) return;
      }
    } else if (document.getElementById("input-codice-ana-header")){
      codiceAna = document.getElementById("input-codice-ana-header").value.trim().toUpperCase();
    }

    if (codiceAna !== a.codice_ana){
      let query = sb.from("tlc_apparati").select("id").eq("codice_ana", codiceAna);
      if (a.id) query = query.neq("id", a.id);
      const { data: duplicato, error: errDup } = await query.maybeSingle();
      if (errDup){ alert("Errore: " + errDup.message); return; }
      if (duplicato){
        alert(`Il codice ANA "${codiceAna}" è già assegnato a un altro apparato. Scegline uno diverso.`);
        return;
      }
    }

    const payload = {
      codice_ana: codiceAna,
      selettiva: fd.get("selettiva") ? fd.get("selettiva").trim().toUpperCase() : null,
      marca: fd.get("marca") || null,
      categoria: fd.get("categoria") || null,
      sottocategoria_radio: fd.get("categoria") === "RADIO" ? (fd.get("sottocategoria_radio") || null) : null,
      modello: fd.get("modello") || null,
      matricola: fd.get("matricola") || null,
      assegnato_a: fd.get("assegnato_a") || null,
      descrizione: fd.get("descrizione") || null,
      note: fd.get("note") || null
    };
    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    let result;
    if (a.id){
      result = await sb.from("tlc_apparati").update(payload).eq("id", a.id).select().single();
    } else {
      result = await sb.from("tlc_apparati").insert(payload).select().single();
    }

    if (result.error){ alert("Errore: " + result.error.message); btn.disabled=false; btn.textContent="Salva"; return; }

    chiudiModal();
    renderTlc();
  });
}

async function eliminaTlc(id){
  if (!confirm("Eliminare definitivamente questo apparato?")) return;
  const { error } = await sb.from("tlc_apparati").delete().eq("id", id);
  if (error){ alert("Errore: " + error.message); return; }
  chiudiModal();
  renderTlc();
}

/* ---------- HELPER: canvas firma (mouse/touch) ---------- */
function creaCanvasFirma(containerEl){
  containerEl.innerHTML = `<div class="firma-canvas-wrap"><canvas></canvas></div>
    <div class="firma-actions"><button type="button" class="firma-clear">Cancella firma</button></div>`;
  const canvas = containerEl.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  let hasDrawn = false;

  function resize(){
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return; // contenitore non ancora visibile
    const ratio = window.devicePixelRatio || 1;

    // Salva il disegno corrente (se c'è) per ridisegnarlo dopo il resize
    let immagine = null;
    if (hasDrawn && canvas.width > 0 && canvas.height > 0){
      immagine = canvas.toDataURL("image/png");
    }

    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#0b2545";

    if (immagine){
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, 0, 0, rect.width, rect.height); };
      img.src = immagine;
    }
  }
  resize();

  // Ridisegna se cambia dimensione/orientamento del contenitore (es. rotazione telefono)
  let resizeTimeout = null;
  const onResize = () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(resize, 150);
  };
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);
  if (window.ResizeObserver){
    const ro = new ResizeObserver(onResize);
    ro.observe(containerEl);
  }

  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e){ drawing = true; hasDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e){ if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  canvas.addEventListener("touchstart", start, { passive:false });
  canvas.addEventListener("touchmove", move, { passive:false });
  canvas.addEventListener("touchend", end);

  containerEl.querySelector(".firma-clear").addEventListener("click", () => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    hasDrawn = false;
  });

  return {
    isEmpty: () => !hasDrawn,
    toPng: () => canvas.toDataURL("image/png")
  };
}


async function renderMovimentazioniTlc(){
  const content = document.getElementById("page-content");
  const { data, error } = await caricaTutteLeRighe(() => sb
    .from("movimentazioni_tlc")
    .select("*, movimentazioni_tlc_apparati(apparato_id, tlc_apparati(selettiva, modello))")
    .order("data_uscita", { ascending:false }));

  if (error){ content.innerHTML = `<div class="placeholder-page"><h3>Errore</h3><p>${escapeHtml(error.message)}</p></div>`; return; }

  const soloLettura = livelloPermesso("tlc") !== "completo";

  content.innerHTML = `
    <div class="toolbar" style="justify-content:space-between;">
      <button class="btn-cancel" id="btn-torna-apparati-tlc">← Torna agli apparati</button>
      ${soloLettura ? "" : `<button class="btn-add" id="btn-nuova-movimentazione-tlc">+ Nuova movimentazione</button>`}
    </div>
    ${soloLettura ? `<p style="font-size:12px;color:var(--grigio-600);">Visualizzazione in sola lettura. Il tuo livello di accesso TLC non permette di registrare movimentazioni.</p>` : ""}
    <div id="movimentazioni-tlc-list"></div>
  `;
  document.getElementById("btn-torna-apparati-tlc").addEventListener("click", () => renderTlc());
  if (!soloLettura) document.getElementById("btn-nuova-movimentazione-tlc").addEventListener("click", () => apriModalNuovaMovimentazioneTlc());
  renderTabellaMovimentazioniTlc(data, soloLettura);
}

function renderTabellaMovimentazioniTlc(data, soloLettura){
  const wrap = document.getElementById("movimentazioni-tlc-list");
  if (!data || data.length === 0){
    wrap.innerHTML = `<div class="empty-state"><div class="ic">📻</div>Nessuna movimentazione registrata.</div>`;
    return;
  }
  wrap.innerHTML = `
    <table class="storico-table">
      <thead><tr><th>Uscita</th><th>Rientro</th><th>Operatore</th><th>Sezione</th><th>Apparati</th><th>Stato</th><th>Bolla</th>${soloLettura ? "" : "<th></th><th></th>"}</tr></thead>
      <tbody>
        ${data.map(r => {
          const apparati = (r.movimentazioni_tlc_apparati||[]).map(a => a.tlc_apparati?.selettiva).filter(Boolean).join(", ");
          return `
          <tr>
            <td>${formatDataIt(r.data_uscita)}</td>
            <td>${r.data_rientro ? formatDataIt(r.data_rientro) : "—"}</td>
            <td>${escapeHtml(r.operatore)}</td>
            <td>${escapeHtml(r.sezione_ana)}</td>
            <td>${escapeHtml(apparati)}</td>
            <td>${r.stato === "in_uso" ? '<span class="tag" style="background:var(--giallo-bg);color:var(--giallo);">IN USO</span>' : '<span class="tag" style="background:var(--verde-bg);color:var(--verde);">RIENTRATO</span>'}</td>
            <td>${r.bolla_path ? `<a href="#" role="button" data-apri-file="${escapeHtml(r.bolla_path)}" data-bucket="${STORAGE_BUCKET_BOLLE}">PDF</a>` : "—"}</td>
            ${soloLettura ? "" : `
            <td>
              <label class="row-del" style="cursor:pointer;">
                Carica firmata
                <input type="file" accept="application/pdf,image/*" style="display:none;" data-upload-bolla="${r.id}" data-stato="${r.stato}" data-sezione="${r.sezione_ana}" data-data-uscita="${r.data_uscita}" data-data-rientro="${r.data_rientro||''}" data-vecchio-path="${r.bolla_path||''}">
              </label>
            </td>
            <td>${r.stato === "in_uso" ? `<button class="row-del" style="color:var(--blu-500);" data-rientro="${r.id}">Registra rientro</button>` : ""}</td>
            `}
          </tr>
        `}).join("")}
      </tbody>
    </table>
  `;
  attaccaListenerApriFile(wrap);
  if (soloLettura) return;
  wrap.querySelectorAll("[data-upload-bolla]").forEach(input => {
    input.addEventListener("change", (e) => caricaBollaFirmata(e.target));
  });
  wrap.querySelectorAll("[data-rientro]").forEach(b => b.addEventListener("click", () => registraRientroTlc(parseInt(b.dataset.rientro))));
}

function pathBollaFirmata(sezione, stato, dataUscita, dataRientro, estensione, movId){
  const tipo = stato === "rientrato" ? "rientro" : "uscita";
  const dataRif = (tipo === "rientro" && dataRientro) ? dataRientro : dataUscita;
  const sezioneSlug = pulisciNomeFile(sezione);
  return `Bolla_TLC_${dataRif}_${tipo}_${sezioneSlug}_${movId}.${estensione}`;
}

async function caricaBollaFirmata(input){
  if (livelloPermesso("tlc") !== "completo"){ alert("Il tuo livello di accesso TLC non permette questa operazione."); return; }
  const file = input.files[0];
  if (!file) return;
  const movId = parseInt(input.dataset.uploadBolla);
  const estensione = file.name.split(".").pop().toLowerCase();
  const path = pathBollaFirmata(input.dataset.sezione, input.dataset.stato, input.dataset.dataUscita, input.dataset.dataRientro, estensione, movId);
  const vecchioPath = input.dataset.vecchioPath;

  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_BOLLE).upload(path, file, { upsert: true });
  if (upErr){ alert("Errore upload: " + upErr.message); return; }

  const { error } = await sb.from("movimentazioni_tlc").update({ bolla_path: path }).eq("id", movId);
  if (error){ alert("Errore: " + error.message); return; }

  if (vecchioPath && vecchioPath !== path){
    const { error: rmErr } = await sb.storage.from(STORAGE_BUCKET_BOLLE).remove([vecchioPath]);
    if (rmErr) console.warn("Vecchia bolla non rimossa dallo storage:", vecchioPath, rmErr.message);
  }

  renderMovimentazioniTlc();
}
