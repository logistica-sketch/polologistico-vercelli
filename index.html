    : v.personale ? `<div class="pe-lib-azioni"><span class="pe-hint" style="margin:0;">Si cambia in Impostazioni</span></div>` : "";
  return `<div class="pe-lib-card">${img}${meta}${azioni}</div>`;
}

async function renderTabLibreriaPdf(){
  const box = document.getElementById("pe-contenuto");
  box.innerHTML = `
    <div class="pe-lib-avviso"><i class="ti ti-alert-triangle"></i> Carica solo la tua firma. Le firme e le sigle sono personali e non si possono condividere.</div>
    <div class="toolbar">
      <button class="btn-add" id="pe-lib-carica"><i class="ti ti-upload"></i> Carica immagine</button>
      <button class="btn-add" id="pe-lib-disegna" style="background:var(--blu-300);"><i class="ti ti-writing-sign"></i> Disegna</button>
    </div>
    <div id="pe-lib-lista"><div class="loading-spin">Caricamento…</div></div>
  `;
  document.getElementById("pe-lib-carica").addEventListener("click", () => scegliFileLibreriaPdf(f => apriModalLibreriaPdf("carica", f)));
  document.getElementById("pe-lib-disegna").addEventListener("click", () => apriModalLibreriaPdf("disegna"));
  const r = await caricaLibreriaPdf();
  let wrap = document.getElementById("pe-lib-lista");
  if (!wrap) return;
  if (r.error){ wrap.innerHTML = `<div class="storico-empty">Errore: ${escapeHtml(r.error.message)}</div>`; return; }
  const pers = vocePersonaleLibreriaPdf();
  const mie = pers ? [pers, ...r.mie] : r.mie;
  const urls = await urlAnteprimeLibreriaPdf([...mie, ...r.condivise]);
  wrap = document.getElementById("pe-lib-lista");
  if (!wrap) return;
  wrap.innerHTML = `
    <h3 class="pe-lib-sez">Le mie (${mie.length})</h3>
    <div class="pe-lib-griglia">${mie.length ? mie.map(v => htmlCardLibreriaPdf(v, urlVoceLibreriaPdf(urls, v), { azioni: !v.personale })).join("")
      : `<p class="pe-lib-vuota">Ancora niente: carica o disegna la tua firma.</p>`}</div>
    <h3 class="pe-lib-sez">Condivise (${r.condivise.length})</h3>
    <div class="pe-lib-griglia">${r.condivise.length ? r.condivise.map(v => htmlCardLibreriaPdf(v, urls[v.path])).join("")
      : `<p class="pe-lib-vuota">Nessun timbro o logo condiviso.</p>`}</div>
  `;
  wrap.querySelectorAll("[data-pe-lib-rinomina]").forEach(b => b.addEventListener("click", () => rinominaLibreriaPdf(r.mie.find(v => v.id === b.dataset.peLibRinomina))));
  wrap.querySelectorAll("[data-pe-lib-rimuovi]").forEach(b => b.addEventListener("click", () => rimuoviLibreriaPdf(r.mie.find(v => v.id === b.dataset.peLibRimuovi))));
}

async function rinominaLibreriaPdf(v){
  if (!v) return;
  const nome = (prompt("Nuovo nome:", v.nome) || "").trim();
  if (!nome || nome === v.nome) return;
  const { data, error } = await sb.from("pdf_libreria").update({ nome: nome.slice(0, 100) }).eq("id", v.id).select("id").maybeSingle();
  if (error){ alert("Errore: " + error.message); return; }
  if (!data){ alert("Non puoi modificare questo elemento."); return; }
  renderTabLibreriaPdf();
}

// rimuovere = attiva false: il file resta, i documenti che lo usano hanno già la loro copia
async function rimuoviLibreriaPdf(v){
  if (!v || !confirm(`Rimuovere «${v.nome}» dalla libreria?\nI documenti in cui è già stato usato non cambiano.`)) return;
  const { data, error } = await sb.from("pdf_libreria").update({ attiva: false }).eq("id", v.id).select("id").maybeSingle();
  if (error){ alert("Errore: " + error.message); return; }
  if (!data){ alert("Non puoi rimuovere questo elemento."); return; }
  await registraAuditPdf([{ documento_id: null, evento: "libreria_rimossa", dettagli: { libreria_id: v.id, nome: v.nome, tipo: v.tipo } }]);
  renderTabLibreriaPdf();
}

// img: { blob, w, h }; dati: { nome, tipo, condivisa }. Ritorna la riga creata.
async function salvaInLibreriaPdf(img, dati){
  const tipo = TIPI_LIBRERIA_PDF[dati.tipo] ? dati.tipo : "firma";
  const condivisa = !!dati.condivisa && TIPI_CONDIVISIBILI_PDF.includes(tipo) && editorPdfCompleto();
  const path = `${state.user.id}/${crypto.randomUUID()}.png`;
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_PDF_LIBRERIA).upload(path, img.blob, { contentType:"image/png", upsert:false });
  if (upErr) throw new Error("Caricamento nella libreria non riuscito: " + upErr.message);
  const { data, error } = await sb.from("pdf_libreria").insert({
    nome: (dati.nome || TIPI_LIBRERIA_PDF[tipo]).slice(0, 100), tipo, path,
    larghezza_px: img.w, altezza_px: img.h, condivisa, creato_da: state.user.id
  }).select(COLONNE_LIBRERIA_PDF).single();
  if (error){
    const { error: rmErr } = await sb.storage.from(STORAGE_BUCKET_PDF_LIBRERIA).remove([path]);
    if (rmErr) console.warn("File della libreria non rimosso:", rmErr.message);
    throw new Error("Salvataggio nella libreria non riuscito: " + error.message);
  }
  await registraAuditPdf([{ documento_id: null, evento: "libreria_aggiunta", dettagli: { libreria_id: data.id, nome: data.nome, tipo, condivisa } }]);
  return data;
}

/* preparazione delle immagini nel browser */
function scegliFileLibreriaPdf(onFile){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/png,image/jpeg,.png,.jpg,.jpeg";
  inp.addEventListener("change", () => {
    const f = inp.files[0];
    if (!f) return;
    if (!/^image\/(png|jpeg)$/.test(f.type)){ alert("Scegli un'immagine PNG o JPG."); return; }
    if (f.size > MAX_MB_LIBRERIA_PDF * 1024 * 1024){ alert(`L'immagine supera i ${MAX_MB_LIBRERIA_PDF} MB.`); return; }
    onFile(f);
  });
  inp.click();
}

function caricaImmagineFilePdf(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Immagine non leggibile.")); };
    img.src = url;
  });
}

// immagine ruotata di quarti di giro, ridotta per lavorare veloce (lato lungo al massimo 2400 px)
function baseLavoroImmaginePdf(img, quarti){
  const s = Math.min(1, MAX_PX_LIBRERIA_PDF * 2 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
  const dritta = quarti % 2 === 0;
  const cv = document.createElement("canvas");
  cv.width = dritta ? w : h; cv.height = dritta ? h : w;
  const ctx = cv.getContext("2d");
  ctx.translate(cv.width / 2, cv.height / 2);
  ctx.rotate(quarti * Math.PI / 2);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  return cv;
}

// opz: { sfondo, soglia, morbido, ritaglia }. Pixel quasi bianchi → trasparenti, ritaglio sui bordi
// del tratto, lato lungo al massimo 1200 px. null se non resta niente.
function elaboraImmagineLibreriaPdf(base, opz){
  const cv = document.createElement("canvas");
  cv.width = base.width; cv.height = base.height;
  const ctx = cv.getContext("2d");
  ctx.drawImage(base, 0, 0);
  if (opz.sfondo){
    const dati = ctx.getImageData(0, 0, cv.width, cv.height), d = dati.data;
    const soglia = opz.soglia, banda = opz.morbido ? 30 : 0;
    for (let i = 0; i < d.length; i += 4){
      const l = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
      if (l >= soglia) d[i+3] = 0;
      else if (banda && l > soglia - banda) d[i+3] = Math.round(d[i+3] * (soglia - l) / banda);
    }
    ctx.putImageData(dati, 0, 0);
  }
  let out = cv;
  if (opz.ritaglia){ out = ritagliaCanvasPdf(cv); if (!out) return null; }
  const s = Math.min(1, MAX_PX_LIBRERIA_PDF / Math.max(out.width, out.height));
  if (s < 1){
    const f = document.createElement("canvas");
    f.width = Math.max(1, Math.round(out.width * s)); f.height = Math.max(1, Math.round(out.height * s));
    const fx = f.getContext("2d");
    fx.imageSmoothingQuality = "high";
    fx.drawImage(out, 0, 0, f.width, f.height);
    out = f;
  }
  return out;
}

function canvasInPngPdf(cv){
  return new Promise((res, rej) => cv.toBlob(blob => blob
    ? res({ blob, dataUrl: cv.toDataURL("image/png"), w: cv.width, h: cv.height })
    : rej(new Error("Conversione dell'immagine non riuscita.")), "image/png"));
}

// Nome, tipo e condivisione. modo "sempre" (si salva comunque) o "facoltativo" (casella da spuntare)
function htmlCampiLibreriaPdf(tipi, tipo, modo, casella){
  return `
    <div class="pe-lib-campi">
      ${modo === "facoltativo" ? `<div class="form-checkbox"><input type="checkbox" id="pe-lib-salva"><label for="pe-lib-salva" style="margin:0;">${escapeHtml(casella)}</label></div>` : ""}
      <div class="form-field"><label>Nome</label><input id="pe-lib-nome" maxlength="100" value="${escapeHtml(TIPI_LIBRERIA_PDF[tipo])}"></div>
      <div class="form-field"><label>Tipo</label><select id="pe-lib-tipo">${tipi.map(k => `<option value="${k}" ${k===tipo?"selected":""}>${TIPI_LIBRERIA_PDF[k]}</option>`).join("")}</select></div>
      ${editorPdfCompleto() ? `<div class="form-checkbox" id="pe-lib-cond-riga"><input type="checkbox" id="pe-lib-condivisa"><label for="pe-lib-condivisa" style="margin:0;">Condividi con tutti gli utenti dell'Editor PDF</label></div>` : ""}
    </div>`;
}
function collegaCampiLibreriaPdf(box, onTipo){
  const salva = box.querySelector("#pe-lib-salva"), nome = box.querySelector("#pe-lib-nome");
  const sel = box.querySelector("#pe-lib-tipo"), cond = box.querySelector("#pe-lib-condivisa");
  let nomeToccato = false;
  nome.addEventListener("input", () => { nomeToccato = true; });
  const aggiorna = () => {
    const attivo = !salva || salva.checked;
    nome.disabled = !attivo;
    if (cond){
      const ok = TIPI_CONDIVISIBILI_PDF.includes(sel.value);
      box.querySelector("#pe-lib-cond-riga").style.display = ok ? "" : "none";
      if (!ok) cond.checked = false;
      cond.disabled = !attivo;
    }
  };
  sel.addEventListener("change", () => { if (!nomeToccato) nome.value = TIPI_LIBRERIA_PDF[sel.value]; aggiorna(); if (onTipo) onTipo(sel.value); });
  if (salva) salva.addEventListener("change", aggiorna);
  aggiorna();
}
function leggiCampiLibreriaPdf(box){
  const salva = box.querySelector("#pe-lib-salva");
  return {
    salva: !salva || salva.checked,
    nome: box.querySelector("#pe-lib-nome").value.trim(),
    tipo: box.querySelector("#pe-lib-tipo").value,
    condivisa: !!box.querySelector("#pe-lib-condivisa")?.checked
  };
}

// Conferma comune: controlla il nome, blocca il pulsante, passa l'immagine a onFatto (che può lanciare errori)
async function confermaLibreriaPdf(box, btn, img, onFatto){
  const dati = leggiCampiLibreriaPdf(box);
  if (dati.salva && !dati.nome){ alert("Indica un nome per la libreria."); box.querySelector("#pe-lib-nome").focus(); return; }
  btn.disabled = true;
  try { await onFatto(img, dati); }
  catch(err){ alert(err.message); if (btn.isConnected) btn.disabled = false; }
}

// Carica: anteprima prima/dopo, rimuovi sfondo, ritaglio automatico, rotazione.
// opz: { tipo, tipi, modo, casella, ok, onFatto(img, dati), onAnnulla }
async function montaPreparaImmaginePdf(box, file, opz){
  box.innerHTML = `<div class="loading-spin">Apro l'immagine…</div>`;
  let img;
  try { img = await caricaImmagineFilePdf(file); }
  catch(err){ box.innerHTML = `<p class="pe-hint">${escapeHtml(err.message)}</p>`; return; }
  const personale = t => t === "firma" || t === "sigla";
  const st = { quarti: 0, sfondo: personale(opz.tipo), soglia: 235, morbido: true, ritaglia: true, base: null, esito: null };
  let sfondoToccato = false;
  box.innerHTML = `
    <div class="pe-prep-anteprime">
      <figure><figcaption>Prima</figcaption><div class="pe-lib-img pe-scacchi" id="pe-prep-prima"></div></figure>
      <figure><figcaption>Dopo</figcaption><div class="pe-lib-img pe-scacchi" id="pe-prep-dopo"></div></figure>
    </div>
    <div class="pe-prep-opz">
      <label><input type="checkbox" id="pe-prep-sfondo" ${st.sfondo ? "checked" : ""}> Rimuovi sfondo</label>
      <label>Soglia <input type="range" id="pe-prep-soglia" min="200" max="250" step="1" value="${st.soglia}"> <span id="pe-prep-soglia-v">${st.soglia}</span></label>
      <label><input type="checkbox" id="pe-prep-morbido" checked> Ammorbidisci i bordi</label>
    </div>
    <div class="pe-prep-opz">
      <label><input type="checkbox" id="pe-prep-ritaglia" checked> Ritaglia automatico</label>
      <button type="button" class="btn-cancel" id="pe-prep-ruota"><i class="ti ti-rotate-clockwise"></i> Ruota 90°</button>
      <span class="pe-hint" id="pe-prep-dim" style="margin:0;"></span>
    </div>
    ${htmlCampiLibreriaPdf(opz.tipi, opz.tipo, opz.modo, opz.casella)}
    <div class="form-actions">
      <button class="btn-cancel" id="pe-prep-annulla">Annulla</button>
      <button class="btn-save" id="pe-prep-ok">${escapeHtml(opz.ok)}</button>
    </div>
  `;
  const q = id => box.querySelector("#" + id);
  let inCoda = false;
  const ridisegna = () => {
    if (inCoda) return;
    inCoda = true;
    requestAnimationFrame(() => {
      inCoda = false;
      if (!q("pe-prep-prima")) return;
      if (!st.base){ st.base = baseLavoroImmaginePdf(img, st.quarti); q("pe-prep-prima").replaceChildren(st.base); }
      st.esito = elaboraImmagineLibreriaPdf(st.base, st);
      q("pe-prep-dopo").replaceChildren(...(st.esito ? [st.esito] : []));
      q("pe-prep-dim").textContent = st.esito ? `${st.esito.width} × ${st.esito.height} px` : "Non resta niente: abbassa la soglia o togli «Rimuovi sfondo».";
      q("pe-prep-soglia").disabled = q("pe-prep-morbido").disabled = !st.sfondo;
    });
  };
  q("pe-prep-sfondo").addEventListener("change", ev => { st.sfondo = ev.target.checked; sfondoToccato = true; ridisegna(); });
  q("pe-prep-soglia").addEventListener("input", ev => { st.soglia = +ev.target.value; q("pe-prep-soglia-v").textContent = st.soglia; ridisegna(); });
  q("pe-prep-morbido").addEventListener("change", ev => { st.morbido = ev.target.checked; ridisegna(); });
  q("pe-prep-ritaglia").addEventListener("change", ev => { st.ritaglia = ev.target.checked; ridisegna(); });
  q("pe-prep-ruota").addEventListener("click", () => { st.quarti = (st.quarti + 1) % 4; st.base = null; ridisegna(); });
  collegaCampiLibreriaPdf(box, t => {
    if (sfondoToccato) return;
    st.sfondo = personale(t); q("pe-prep-sfondo").checked = st.sfondo; ridisegna();
  });
  q("pe-prep-annulla").addEventListener("click", () => opz.onAnnulla());
  q("pe-prep-ok").addEventListener("click", async ev => {
    if (!st.esito){ alert("L'immagine è vuota: abbassa la soglia o togli «Rimuovi sfondo»."); return; }
    const btn = ev.currentTarget;
    let png;
    try { png = await canvasInPngPdf(st.esito); } catch(err){ alert(err.message); return; }
    await confermaLibreriaPdf(box, btn, png, opz.onFatto);
  });
  ridisegna();
}

// Disegna con signature_pad. opz: { modo, casella, ok, onFatto(img, dati), onAnnulla }
function montaDisegnoPdf(box, opz){
  if (!window.SignaturePad){ box.innerHTML = `<p class="pe-hint">Il riquadro firma non si è caricato: controlla la connessione e ricarica la pagina.</p>`; return; }
  box.innerHTML = `
    <p class="es-aiuto" style="margin:0 0 10px;">Firma con il dito o con il mouse nel riquadro.</p>
    <div class="pe-pad"><span class="linea"></span><canvas aria-label="Riquadro firma"></canvas></div>
    ${htmlCampiLibreriaPdf(["firma", "sigla"], "firma", opz.modo, opz.casella)}
    <div class="form-actions">
      <button class="btn-cancel" id="pe-dis-cancella" style="margin-right:auto;">Cancella</button>
      <button class="btn-cancel" id="pe-dis-annulla">Annulla</button>
      <button class="btn-save" id="pe-dis-ok">${escapeHtml(opz.ok)}</button>
    </div>
  `;
  const cv = box.querySelector(".pe-pad canvas");
  const r = Math.max(window.devicePixelRatio || 1, 1);
  cv.width = cv.offsetWidth * r; cv.height = cv.offsetHeight * r;
  cv.getContext("2d").scale(r, r);
  const pad = new SignaturePad(cv, { penColor: "#16256e", minWidth: 0.8, maxWidth: 2.6 });
  collegaCampiLibreriaPdf(box);
  box.querySelector("#pe-dis-cancella").addEventListener("click", () => pad.clear());
  box.querySelector("#pe-dis-annulla").addEventListener("click", () => opz.onAnnulla());
  box.querySelector("#pe-dis-ok").addEventListener("click", async ev => {
    const btn = ev.currentTarget;
    const tratto = pad.isEmpty() ? null : elaboraImmagineLibreriaPdf(cv, { ritaglia: true });
    if (!tratto){ alert("Il riquadro è vuoto: firma prima di continuare."); return; }
    let png;
    try { png = await canvasInPngPdf(tratto); } catch(err){ alert(err.message); return; }
    await confermaLibreriaPdf(box, btn, png, opz.onFatto);
  });
}

function apriModalBasePdf(titolo, larghezza){
  chiudiModal();
  const overlay = document.createElement("div");
  overlay.id = "modal-overlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:${larghezza}px;">
      <div class="modal-head">
        <h3>${escapeHtml(titolo)}</h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  return overlay.querySelector(".modal-body");
}

// Scheda Libreria: Carica (file già scelto) o Disegna, sempre con salvataggio
function apriModalLibreriaPdf(modo, file){
  const corpo = apriModalBasePdf(modo === "carica" ? "Aggiungi alla libreria" : "Disegna e salva nella libreria", 640);
  const opz = {
    tipo: "firma", tipi: Object.keys(TIPI_LIBRERIA_PDF), modo: "sempre", ok: "Salva nella libreria", onAnnulla: chiudiModal,
    onFatto: async (img, dati) => {
      await salvaInLibreriaPdf(img, dati);
      chiudiModal();
      if (state.route === "editorpdf" && document.getElementById("pe-lib-lista")) renderTabLibreriaPdf();
    }
  };
  if (modo === "carica") montaPreparaImmaginePdf(corpo, file, opz);
  else montaDisegnoPdf(corpo, opz);
}

// Selettore unico per apporre firme e immagini: Libreria / Disegna / Carica.
// opz: { titolo, onScelta({ dataUrl, tipo: firma|sigla|timbro|logo, libreria_id|null }) }
function apriSelettoreFirmaPdf(opz){
  const corpo = apriModalBasePdf(opz.titolo || "Firma", 680);
  corpo.innerHTML = `
    <div class="pe-tabs">${[["libreria","Libreria"], ["disegna","Disegna"], ["carica","Carica"]].map(([k,l]) => `<button type="button" class="pe-tab" data-pe-sel="${k}">${l}</button>`).join("")}</div>
    <div></div>
  `;
  const dentro = corpo.lastElementChild;
  let scheda = null;
  const scegli = async s => { chiudiModal(); await opz.onScelta(s); };
  const fatto = async (img, dati) => {
    const riga = dati.salva ? await salvaInLibreriaPdf(img, dati) : null;
    await scegli({ dataUrl: img.dataUrl, tipo: riga ? riga.tipo : dati.tipo, libreria_id: riga ? riga.id : null });
  };
  const comuni = { modo: "facoltativo", onAnnulla: chiudiModal, onFatto: fatto };
  const mostra = k => {
    scheda = k;
    corpo.querySelectorAll("[data-pe-sel]").forEach(b => b.classList.toggle("active", b.dataset.peSel === k));
    if (k === "disegna") montaDisegnoPdf(dentro, { ...comuni, casella: "Salva anche nella libreria", ok: "Applica la firma" });
    else if (k === "carica"){
      dentro.innerHTML = `
        <p class="es-aiuto" style="margin:0 0 10px;">PNG o JPG fino a ${MAX_MB_LIBRERIA_PDF} MB: la foto o la scansione della tua firma, di un timbro o di un logo.</p>
        <button type="button" class="btn-save" id="pe-sel-file"><i class="ti ti-upload"></i> Scegli l'immagine</button>`;
      dentro.querySelector("#pe-sel-file").addEventListener("click", () => scegliFileLibreriaPdf(f => {
        if (scheda === "carica" && dentro.isConnected) montaPreparaImmaginePdf(dentro, f, {
          ...comuni, tipo: "firma", tipi: Object.keys(TIPI_LIBRERIA_PDF), casella: "Salva nella libreria", ok: "Usa questa immagine" });
      }));
    } else mostraLibreriaSelettorePdf(dentro, scegli, () => scheda === "libreria" && dentro.isConnected);
  };
  corpo.querySelectorAll("[data-pe-sel]").forEach(b => b.addEventListener("click", () => mostra(b.dataset.peSel)));
  mostra("libreria");
}

async function mostraLibreriaSelettorePdf(box, scegli, ancoraQui){
  box.innerHTML = `<div class="loading-spin">Caricamento…</div>`;
  const r = await caricaLibreriaPdf();
  if (!ancoraQui()) return;
  if (r.error){ box.innerHTML = `<p class="pe-hint">Libreria non disponibile: ${escapeHtml(r.error.message)}. Usa Disegna o Carica.</p>`; return; }
  const pers = vocePersonaleLibreriaPdf();
  const mie = pers ? [pers, ...r.mie] : r.mie;
  const voci = [...mie, ...r.condivise];
  if (!voci.length){ box.innerHTML = `<p class="pe-hint">La libreria è vuota: usa <b>Disegna</b> o <b>Carica</b> e spunta «Salva nella libreria» per ritrovarla la prossima volta.</p>`; return; }
  const urls = await urlAnteprimeLibreriaPdf(voci);
  if (!ancoraQui()) return;
  box.innerHTML = `
    <h3 class="pe-lib-sez" style="margin-top:0;">Le mie</h3>
    <div class="pe-lib-griglia">${mie.length ? mie.map(v => htmlCardLibreriaPdf(v, urlVoceLibreriaPdf(urls, v), { scegli: true })).join("") : `<p class="pe-lib-vuota">Nessuna.</p>`}</div>
    ${r.condivise.length ? `<h3 class="pe-lib-sez">Condivise</h3>
    <div class="pe-lib-griglia">${r.condivise.map(v => htmlCardLibreriaPdf(v, urls[v.path], { scegli: true })).join("")}</div>` : ""}
  `;
  box.querySelectorAll("[data-pe-lib-scegli]").forEach(b => b.addEventListener("click", async () => {
    const k = b.dataset.peLibScegli;
    const v = k === "__personale" ? pers : voci.find(x => x.id === k);
    if (!v) return;
    b.disabled = true;
    try {
      const url = v.personale
        ? await ritagliaFirmaDataUrlPdf(await scaricaComeDataUrl(STORAGE_BUCKET_FIRME_PERSONALI, v.path))
        : await scaricaComeDataUrl(STORAGE_BUCKET_PDF_LIBRERIA, v.path);
      await scegli({ dataUrl: url, tipo: v.tipo, libreria_id: v.personale ? null : v.id });
    } catch(err){ b.disabled = false; alert("Elemento non disponibile: " + err.message); }
  }));
}

// Campo firma in compilazione: il PNG scelto finisce solo dentro il PDF generato
function apriFirmaCampoPdf(c){
  apriSelettoreFirmaPdf({ titolo: c.nome, onScelta: s => {
    const e = _ed;
    if (!e) return;
    e.valori[c.id] = s.dataUrl;
    e.firmeLibreria = e.firmeLibreria || {};
    if (s.libreria_id) e.firmeLibreria[c.id] = { libreria_id: s.libreria_id, tipo: s.tipo };
    else delete e.firmeLibreria[c.id];
    e.modificato = true;
    aggiornaCampoEd(c);
    renderStatoCompilazioneEd();
  }});
}

    caricaRegistroPdf();
  };
  ["pe-reg-dal", "pe-reg-al", "pe-reg-evento"].forEach(id => document.getElementById(id).addEventListener("change", ricarica));
  document.getElementById("pe-reg-excel").addEventListener("click", () => esportaRegistroPdfExcel());
  await caricaRegistroPdf();

async function caricaRegistroPdf(){
  const f = _pdfRegistroFiltro;
  const { data, error } = await caricaTutteLeRighe(() => {
    let q = sb.from("pdf_audit").select("*");
    if (f.dal) q = q.gte("creato_il", new Date(f.dal + "T00:00:00").toISOString());
    if (f.al) q = q.lt("creato_il", new Date(new Date(f.al + "T00:00:00").getTime() + 86400000).toISOString());
    if (f.evento) q = q.eq("evento", f.evento);
    return q.order("creato_il", { ascending:false });
  });
  const wrap = document.getElementById("pe-reg-lista");
  if (!wrap) return;
  if (error){ wrap.innerHTML = `<div class="storico-empty">Errore: ${escapeHtml(error.message)}</div>`; return; }
  _pdfRegistroCache = data || [];
  // pdf_audit non ha più la chiave esterna verso pdf_documenti (il registro sopravvive all'eliminazione):
  // i titoli si leggono a parte, a blocchi
  const ids = [...new Set(_pdfRegistroCache.map(a => a.documento_id).filter(Boolean))];
  const titoli = {};
  for (let i = 0; i < ids.length; i += 200){
    const { data: docs, error: dErr } = await sb.from("pdf_documenti").select("id, titolo").in("id", ids.slice(i, i + 200));
    if (dErr){ wrap.innerHTML = `<div class="storico-empty">Errore: ${escapeHtml(dErr.message)}</div>`; return; }
    (docs || []).forEach(d => { titoli[d.id] = d.titolo; });
  }
  _pdfRegistroCache.forEach(a => { a._titolo = titoli[a.documento_id] || ""; });
  document.getElementById("pe-reg-count").textContent = `${_pdfRegistroCache.length} eventi`;
  if (_pdfRegistroCache.length === 0){ wrap.innerHTML = `<div class="empty-state"><div class="ic">🗂️</div>Nessun evento nel periodo scelto.</div>`; return; }
  wrap.innerHTML = `
    <div class="stat-card" style="padding:6px 10px;overflow-x:auto;">
      <table class="storico-table es-tabella-click">
        <thead><tr><th>Quando</th><th>Documento</th><th>Evento</th><th>Chi</th><th>IP</th><th>Impronta</th></tr></thead>
        <tbody>
          ${_pdfRegistroCache.map(a => `
            <tr data-doc="${a._titolo ? escapeHtml(a.documento_id) : ""}">
              <td style="white-space:nowrap;">${formatDataOraIt(a.creato_il)}</td>
              <td>${escapeHtml(a._titolo || (a.dettagli?.nome ? "Libreria: " + a.dettagli.nome : "—"))}</td>
              <td>${EVENTI_PDF_AUDIT[a.evento] || escapeHtml(a.evento)}</td>
              <td>${escapeHtml(a.attore || "—")}</td>
              <td>${escapeHtml(a.ip || "")}</td>
              <td class="pe-hash" title="${escapeHtml(a.sha256 || "")}">${a.sha256 ? escapeHtml(a.sha256.slice(0, 12)) + "…" : ""}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
  wrap.querySelectorAll("tr[data-doc]").forEach(tr => { if (tr.dataset.doc) tr.addEventListener("click", () => apriDettaglioDocumentoPdf(tr.dataset.doc)); });
}

function esportaRegistroPdfExcel(){
  if (!_pdfRegistroCache.length){ alert("Nessun evento da esportare."); return; }
  const righe = _pdfRegistroCache.map(a => ({
    "Data/ora": formatDataOraIt(a.creato_il),
    "Documento": a._titolo || (a.dettagli?.nome ? "Libreria: " + a.dettagli.nome : ""),
    "Evento": EVENTI_PDF_AUDIT[a.evento] || a.evento,
    "Campo": a.campo_id || "",
    "Chi": a.attore || "",
    "IP": a.ip || "",
    "Dispositivo": a.user_agent || "",
    "Impronta SHA-256": a.sha256 || "",
    "Dettagli": a.dettagli ? JSON.stringify(a.dettagli) : ""
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(righe), "Registro");
  const f = _pdfRegistroFiltro;
  XLSX.writeFile(wb, `Registro_Editor_PDF_${f.dal || "inizio"}_${f.al || "oggi"}.xlsx`);
}

function renderLibroMatricolaTable(){
  const f = _libroMatricolaFiltro;
  const filtrati = _libroMatricolaCache.filter(r => {
    if (f.search){
      const q = f.search.toLowerCase();
      const campi = [r.targa_telaio, r.descrizione_bene, r.sezione];
      if (!campi.some(c => (c||"").toLowerCase().includes(q))) return false;
    }
    if (f.sezione && r.sezione !== f.sezione) return false;
    if (f.tipo && r.veicolo_tipo !== f.tipo) return false;
    return true;
  });

  const attivi = filtrati.filter(r => r.stato !== "dismesso");
  const dismessi = filtrati.filter(r => r.stato === "dismesso");

  document.getElementById("lm-results-count").textContent = `${attivi.length} di ${_libroMatricolaCache.filter(r=>r.stato!=="dismesso").length} mezzi attivi`;

  const wrap = document.getElementById("lm-table-wrap");
  wrap.innerHTML = renderTabellaLibroMatricola(attivi, "lm-tabella-attivi");

  // Sezione dismessi collassabile
  let sezioneDismessi = document.getElementById("lm-sezione-dismessi");
  if (!sezioneDismessi){
    sezioneDismessi = document.createElement("div");
    sezioneDismessi.id = "lm-sezione-dismessi";
    sezioneDismessi.className = "collapse-block";
    sezioneDismessi.style.marginTop = "20px";
    wrap.appendChild(sezioneDismessi);
  } else {
    wrap.appendChild(sezioneDismessi);
  }
  if (dismessi.length === 0){
    sezioneDismessi.style.display = "none";
  } else {
    sezioneDismessi.style.display = "block";
    sezioneDismessi.innerHTML = `
      <button class="collapse-head" id="lm-toggle-dismessi">
        <span>🗑️ Mezzi dismessi</span>
        <span class="collapse-badge" style="display:inline-block;background:var(--grigio-600);">${dismessi.length}</span>
        <span class="collapse-arrow">▾</span>
      </button>
      <div class="collapse-body" id="lm-body-dismessi">${renderTabellaLibroMatricola(dismessi, "lm-tabella-dismessi")}</div>
    `;
    const toggle = document.getElementById("lm-toggle-dismessi");
    const body = document.getElementById("lm-body-dismessi");
    toggle.addEventListener("click", () => {
      const apri = body.style.display !== "block";
      body.style.display = apri ? "block" : "none";
      toggle.querySelector(".collapse-arrow").textContent = apri ? "▴" : "▾";
    });
  }

  document.querySelectorAll(".lm-riga[data-id]").forEach(tr => {
    tr.addEventListener("click", () => apriModalMezzoLibroMatricola(parseInt(tr.dataset.id)));
  });
}

function renderModalLibroMatricola(){

      stato: fd.get("stato"),
      note: fd.get("note") || null
    };
    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    let result;
    if (r.id){
      result = await sb.from("libro_matricola").update(payload).eq("id", r.id).select().single();
    } else {
      result = await sb.from("libro_matricola").insert(payload).select().single();
    }
    if (result.error){ alert("Errore: " + result.error.message); btn.disabled=false; btn.textContent="Salva"; return; }

    chiudiModal();
    renderLibroMatricola();
  });
}

/* ---------- EXPORT PDF ---------- */
function esportaLibroMatricolaPdf(righe, titolo){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape" });

  doc.setFontSize(13);
  doc.text(titolo, 14, 14);
  doc.setFontSize(8.5);
  doc.text(`Generato il ${formatDataIt(new Date().toISOString().slice(0,10))} — ${righe.length} mezzi`, 14, 20);

  let y = 30;
  const colonne = [
    { label:"Targa/Telaio", w:28 },
    { label:"Descrizione", w:55 },
    { label:"Sezione", w:30 },
    { label:"Tipo veicolo", w:48 },
    { label:"Premio RC", w:22 },
    { label:"Premio TL", w:22 },
    { label:"Data incl.", w:24 }
  ];
  function intestazione(yPos){
    doc.setFont(undefined, "bold");
    doc.setFontSize(8);
    let x = 14;
    colonne.forEach(c => { doc.text(c.label, x, yPos); x += c.w; });
    doc.setFont(undefined, "normal");
    doc.line(14, yPos+2, 280, yPos+2);
  }
  intestazione(y);
  y += 7;

  righe.forEach(r => {
    if (y > 195){ doc.addPage(); y = 18; intestazione(y); y += 7; }
    let x = 14;
    const valori = [
      r.targa_telaio,
      (r.descrizione_bene||"—").slice(0,32),
      (r.sezione||"—").slice(0,18),
      (r.veicolo_tipo||"—").slice(0,28),
      r.premio_annuo_rc!=null ? Number(r.premio_annuo_rc).toFixed(2) : "—",
      r.premio_annuo_tutela_legale!=null ? Number(r.premio_annuo_tutela_legale).toFixed(2) : "—",
      r.data_inclusione ? formatDataIt(r.data_inclusione) : "—"
    ];
    valori.forEach((v, i) => { doc.text(String(v), x, y); x += colonne[i].w; });
    y += 6;
  });

  doc.save(`${titolo.replace(/\s+/g,"_")}.pdf`);
}

/* ---------- IMPORT MASSIVO ZIP POLIZZE ---------- */
async function importaZipPolizzeLibroMatricola(ev){
  const file = ev.target.files[0];
  if (!file) return;
  ev.target.value = "";

  if (!confirm(`Importare le polizze dal file ${file.name}?\n\nOgni PDF nella root deve essere nominato NUMERO_TARGA.PDF (es. 000053_GA132VZ.PDF) → tipo Polizza.\nOgni PDF nella cartella CAI deve essere nominato TARGA_CAI.PDF → tipo CAI.\n\nVerranno associati al mezzo corrispondente per targa, con anno ${new Date().getFullYear()}.`)) return;

  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(255,255,255,0.9);z-index:600;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;";
  overlay.innerHTML = `<div class="loading-spin">Importazione in corso, non chiudere questa pagina…</div><div id="import-zip-polizze-progress" style="font-size:13px;color:var(--grigio-600);"></div>`;
  document.body.appendChild(overlay);
  const progressEl = overlay.querySelector("#import-zip-polizze-progress");

  const annoCorrente = new Date().getFullYear();

  try{
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const pdfEntries = Object.values(zip.files).filter(f => !f.dir && /\.pdf$/i.test(f.name));

    let ok = 0, nonTrovati = [], errori = [];
    let i = 0;
    for (const entry of pdfEntries){
      i++;
      progressEl.textContent = `${i} di ${pdfEntries.length}…`;

      const nomeBase = entry.name.split("/").pop();
      const inCartellaCai = /\/CAI\//i.test(entry.name) || /_CAI\.PDF$/i.test(nomeBase);

      let targa = null, tipo = null;
      if (inCartellaCai){
        const m = nomeBase.match(/^(.+?)_CAI\.PDF$/i);
        if (m){ targa = m[1].toUpperCase(); tipo = "cai"; }
      } else {
        const m = nomeBase.match(/^\d+_(.+?)\.PDF$/i);
        if (m){ targa = m[1].toUpperCase(); tipo = "polizza"; }
      }

      if (!targa){
        errori.push(`${nomeBase}: nome file non riconosciuto (formato atteso NUMERO_TARGA.PDF o TARGA_CAI.PDF)`);
        continue;
      }

      const mezzo = _libroMatricolaCache.find(r => (r.targa_telaio||"").toUpperCase() === targa);
      if (!mezzo){
        nonTrovati.push(`${nomeBase} (targa: ${targa})`);
        continue;
      }

      try{
        const blob = await entry.async("blob");
        const path = `${pulisciNomeFile(mezzo.targa_telaio)}/${Date.now()}_${pulisciNomeFile(nomeBase)}`;
        const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_DOC_LIBRO_MATRICOLA).upload(path, blob, { contentType: "application/pdf" });
        if (upErr) throw upErr;

        const nomeFileSalvato = `${mezzo.targa_telaio} - ${tipo === "cai" ? "CAI" : "Polizza"} ${annoCorrente}`;
        const { error: docErr } = await sb.from("documenti_libro_matricola").insert({
          libro_matricola_id: mezzo.id,
          tipo: tipo,
          anno: annoCorrente,
          nome_file: nomeFileSalvato,
          storage_path: path,
          created_by: state.user.id
        });
        if (docErr) throw docErr;
        ok++;
      }catch(err){
        errori.push(`${nomeBase}: ${err.message}`);
      }
    }

    overlay.remove();
    let msg = `Import completato.\nDocumenti caricati: ${ok}\nMezzi non trovati: ${nonTrovati.length}`;
    if (nonTrovati.length) msg += `\n\nNon trovati:\n` + nonTrovati.join("\n");
    if (errori.length) msg += `\n\nErrori:\n` + errori.join("\n");
    alert(msg);

    renderLibroMatricola();

  }catch(err){
    overlay.remove();
    alert("Errore nella lettura dello ZIP: " + err.message);
  }
}

/* ============================================================
   MODULO ATTIVAZIONI (Esercitazioni + Emergenze)
   Stesso motore (tabella attivazioni con tipo 'esercitazione' | 'emergenza'),
   due voci di menu. Permessi separati per tipo: 'esercitazioni' / 'emergenze',
   ciascuno con livelli completo (gestione, CF e cellulare) / base (sola
   lettura, adesioni dalla vista v_adesioni_base).
   Il token del link pubblico NON è leggibile da tabella: si ottiene solo
   con la RPC attivazione_link() (riservata a completo).
   ============================================================ */
let _attivazioneTipo = "esercitazione"; // tipo della voce di menu aperta
const TESTI_TIPO = {
  esercitazione: { nome:"esercitazione", Nome:"Esercitazione", plurale:"esercitazioni", nuova:"Nuova esercitazione", icona:"🏕️", route:"esercitazioni" },
  emergenza:     { nome:"emergenza",     Nome:"Emergenza",     plurale:"emergenze",     nuova:"Nuova emergenza",     icona:"🚨", route:"emergenze" }
};
function testiTipo(tipo){ return TESTI_TIPO[tipo || _attivazioneTipo] || TESTI_TIPO.esercitazione; }
function permessoTipo(tipo){ return (tipo || _attivazioneTipo) === "emergenza" ? "emergenze" : "esercitazioni"; }
// Ultimo giorno della griglia: data fine, oppure (emergenza aperta) la finestra estendibile
function ultimoGiornoAttivazione(es){ return (es && (es.data_fine || es.fine_finestra)) || null; }
function periodoAttivazioneIt(es){
  if (!es.data_fine) return `dal ${formatDataIt(es.data_inizio)} (in corso${es.fine_finestra ? `, finestra fino al ${formatDataIt(es.fine_finestra)}` : ""})`;
  return es.data_fine !== es.data_inizio ? `${formatDataIt(es.data_inizio)} → ${formatDataIt(es.data_fine)}` : formatDataIt(es.data_inizio);
}
let _esercitazioniCache = [];
let _esercitazioniFiltro = { search:"", stato:"" };
const ENTI_ESERCITAZIONE = { CAP:"CAP", "1RGPT":"1° RGPT" };
const STATI_ESERCITAZIONE = { bozza:"Bozza", aperta:"Adesioni aperte", chiusa:"Adesioni chiuse", conclusa:"Conclusa" };
const STATI_SEZIONE_ESERCITAZIONE = { risposto:"Risposto", in_attesa:"In attesa", non_partecipa:"Non partecipa" };
// Pasti e pernotti, nell'ordine del giorno: colazione, pranzo, cena, pernotto
const TIPI_SERVIZIO = ["colazione", "pranzo", "cena", "pernotto"];
// Le emergenze hanno in più la giornata di disponibilità ("disponibile"), prima dei pasti
const ORDINE_SERVIZIO = ["disponibile", ...TIPI_SERVIZIO];
const LABEL_SERVIZIO = { disponibile:"Disponibile", colazione:"Colazione", pranzo:"Pranzo", cena:"Cena", pernotto:"Pernotto" };
function tipiGriglia(tipo){ return (tipo || _attivazioneTipo) === "emergenza" ? ORDINE_SERVIZIO : TIPI_SERVIZIO; }
const MAX_GIORNI_ESERCITAZIONE = 31;
// Campi configurabili per evento (colonna attivazioni.campi). Cognome, nome e CF sono sempre obbligatori.
// senzaObbligatorio: solo non richiesto / facoltativo. soloEmergenza: non compare nelle esercitazioni.
const CAMPI_ESERCITAZIONE = [
  { k:"tipologia", label:"Tipologia (caposquadra…)", soloEmergenza:true },
  { k:"cellulare", label:"Cellulare" },
  { k:"patenti", label:"Patenti" },
  { k:"abilitazioni", label:"Abilitazioni" },
  { k:"servizi", label:"Pasti e pernotti", labelEmergenza:"Giornate, pasti e pernotti" },
  { k:"orari", label:"Orari nella giornata", senzaObbligatorio:true, soloEmergenza:true },
  { k:"art39", label:"Richiesta art. 39", senzaObbligatorio:true, soloEmergenza:true },
  { k:"esigenze", label:"Esigenze alimentari", senzaObbligatorio:true },
  { k:"note", label:"Note" },
  { k:"mezzi", label:"Mezzi della Sezione", senzaObbligatorio:true, soloEmergenza:true },
  { k:"materiali", label:"Materiali della Sezione", senzaObbligatorio:true, soloEmergenza:true }
];
function campiPerTipo(tipo){ return CAMPI_ESERCITAZIONE.filter(c => !c.soloEmergenza || tipo === "emergenza"); }
const LIVELLI_CAMPO = { non_richiesto:"Non richiesto", facoltativo:"Facoltativo", obbligatorio:"Obbligatorio" };
const CAMPI_DEFAULT = { cellulare:"facoltativo", patenti:"facoltativo", abilitazioni:"facoltativo", servizi:"facoltativo", esigenze:"facoltativo", note:"non_richiesto" };
const CAMPI_DEFAULT_EMERGENZA = { tipologia:"obbligatorio", cellulare:"obbligatorio", patenti:"facoltativo", abilitazioni:"facoltativo",
  servizi:"obbligatorio", orari:"facoltativo", art39:"facoltativo", esigenze:"non_richiesto", note:"facoltativo", mezzi:"facoltativo", materiali:"facoltativo" };
// Su un evento salvato questi campi, se assenti, valgono "non richiesto" (gli altri "facoltativo"), come in adesione_salva
const CAMPI_NON_RICHIESTI_SE_ASSENTI = ["esigenze", "tipologia", "art39", "orari", "mezzi", "materiali"];
// Valori per un nuovo evento: i default del suo tipo
function livelloCampo(es, k, tipo){
  if (es && es.campi) return es.campi[k] || (CAMPI_NON_RICHIESTI_SE_ASSENTI.includes(k) ? "non_richiesto" : "facoltativo");
  const def = (tipo || _attivazioneTipo) === "emergenza" ? CAMPI_DEFAULT_EMERGENZA : CAMPI_DEFAULT;
  return def[k] || (CAMPI_NON_RICHIESTI_SE_ASSENTI.includes(k) ? "non_richiesto" : "facoltativo");
}
// "08:00" ↔ ora del DB ("08:00:00")
function oraBreve(t){ return t ? String(t).slice(0, 5) : ""; }
function descriviOrario(o){ return o ? `${o.dalle}–${o.alle}` : "giornata intera"; }
// pernotto della notte X → colazione del giorno X+1
function giornoDopo(iso){
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + 1);
  return d.toISOString().slice(0, 10);
}
function campoAttivo(es, k){ return livelloCampo(es, k) !== "non_richiesto"; }
function campoObbligatorio(es, k){ return livelloCampo(es, k) === "obbligatorio"; }

// "completo" sul tipo indicato (di default il tipo della voce di menu aperta)
function esercitazioniCompleto(tipo){ return livelloPermesso(permessoTipo(tipo)) === "completo"; }
// Impostazioni: liste condivise gestibili con uno dei due permessi completo
function gestisceAttivazioni(){ return esercitazioniCompleto("esercitazione") || esercitazioniCompleto("emergenza"); }

// Codice fiscale: formato + carattere di controllo (stessa regola di cf_valido() sul DB)
function cfValido(cf){
  if (!/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/.test(cf || "")) return false;
  const dispari = [1,0,5,7,9,13,15,17,19,21,2,4,18,20,11,3,6,8,12,14,16,10,22,25,24,23];
  let s = 0;
  for (let i = 0; i < 15; i++){
    const c = cf[i];
    const v = /[0-9]/.test(c) ? c.charCodeAt(0) - 48 : c.charCodeAt(0) - 65;
    s += (i % 2 === 0) ? dispari[v] : v;
  }
  return cf[15] === String.fromCharCode(65 + s % 26);
}

// Date ISO (yyyy-mm-dd) dal primo all'ultimo giorno compresi
function giorniTra(inizio, fine){
  const out = [];
  if (!inizio || !fine) return out;
  const d = new Date(inizio + "T00:00:00Z");
  const f = new Date(fine + "T00:00:00Z");
  while (d <= f && out.length <= MAX_GIORNI_ESERCITAZIONE){
    out.push(d.toISOString().slice(0,10));
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return out;
}

function labelGiornoBreve(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("it-IT", { weekday:"short", day:"2-digit", month:"2-digit" });
}

// timestamptz <-> valore di <input type="datetime-local"> (ora locale)
function isoAInputLocale(iso){
  if (!iso) return "";
  const d = new Date(iso);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function inputLocaleAIso(v){ return v ? new Date(v).toISOString() : null; }

function formatDataOraIt(iso){
  if (!iso) return "—";
  return new Date(iso).toLocaleString("it-IT", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

      id:a.id, sezione_id:a.attivazione_sezione_id, volontario_id:a.volontario_id,
      cognome:a.cognome, nome:a.nome, codice_fiscale:a.codice_fiscale, cellulare:a.cellulare,
      patenti:a.patenti || [], abilitazioni:a.abilitazioni || [], note:a.note,
      esigenze:a.esigenze || [], esigenze_note:a.esigenze_note,
      tipologia:a.tipologia, art39:!!a.art39,
      servizi:(a.adesione_servizi || []).map(x => x.servizio_id),
      // orari per giornata di disponibilità: { servizio_id: { dalle, alle } }; assente = giornata intera
      orari:Object.fromEntries((a.adesione_servizi || []).filter(x => x.ora_dalle)
        .map(x => [x.servizio_id, { dalle:oraBreve(x.ora_dalle), alle:oraBreve(x.ora_alle) }]))
    })), error:null };
  }
  const { data, error } = await caricaTutteLeRighe(() => sb
    .from("v_adesioni_base")
    .select("id, attivazione_sezione_id, cognome, nome, patenti, abilitazioni, servizi, tipologia")
    .eq("attivazione_id", esercitazioneId));
  if (error) return { data:null, error };
  return { data: data.map(a => ({
    id:a.id, sezione_id:a.attivazione_sezione_id, cognome:a.cognome, nome:a.nome,
    patenti:a.patenti || [], abilitazioni:a.abilitazioni || [], esigenze:[], servizi:a.servizi || [],
    tipologia:a.tipologia, orari:{}
  })), error:null };
}

// Punto d'ingresso delle due voci di menu (Esercitazioni / Emergenze)
function renderAttivazioni(tipo){
  if (_attivazioneTipo !== tipo) _esercitazioniFiltro = { search:"", stato:"" };
  _attivazioneTipo = tipo;
  renderEsercitazioni();
}

async function renderEsercitazioni(){
  const content = document.getElementById("page-content");
  const completo = esercitazioniCompleto();
  const T = testiTipo();

  const [{ data: esercitazioni, error }, { data: sezioni, error: errSez }] = await Promise.all([
    sb.from("attivazioni").select("*").eq("tipo", _attivazioneTipo).order("data_inizio", { ascending:false }),
    caricaTutteLeRighe(() => sb.from("attivazione_sezioni").select("id, attivazione_id, stato"))
  ]);
  if (error || errSez){
    content.innerHTML = `<div class="placeholder-page"><h3>Errore</h3><p>${escapeHtml((error||errSez).message)}</p></div>`;
    return;
  }
  const { data: adesioni, error: errAd } = await caricaTutteLeRighe(() =>
    sb.from(completo ? "adesioni" : "v_adesioni_base").select("id, attivazione_id"));
  if (errAd){ content.innerHTML = `<div class="placeholder-page"><h3>Errore</h3><p>${escapeHtml(errAd.message)}</p></div>`; return; }

  _esercitazioniCache = (esercitazioni || []).map(e => {
    const sez = sezioni.filter(s => s.attivazione_id === e.id);
    return {
      ...e,
      n_sezioni: sez.length,
      n_risposte: sez.filter(s => s.stato !== "in_attesa").length,
      n_volontari: adesioni.filter(a => a.attivazione_id === e.id).length
    };
  });

  content.innerHTML = `
    <div class="toolbar">
      <input type="search" id="es-search" placeholder="Cerca per titolo o luogo…" value="${escapeHtml(_esercitazioniFiltro.search)}">
      <select id="es-filtro-stato">
        <option value="">Tutti gli stati</option>
        ${Object.entries(STATI_ESERCITAZIONE).map(([k,l]) => `<option value="${k}" ${_esercitazioniFiltro.stato===k?"selected":""}>${l}</option>`).join("")}
      </select>
      ${completo ? `<button class="btn-add" id="es-btn-nuova">+ ${T.nuova}</button>` : ""}
    </div>
    <div class="results-count" id="es-results-count"></div>
    <div id="es-list"></div>
  `;
  document.getElementById("es-search").addEventListener("input", e => { _esercitazioniFiltro.search = e.target.value; renderEsercitazioniList(); });
  document.getElementById("es-filtro-stato").addEventListener("change", e => { _esercitazioniFiltro.stato = e.target.value; renderEsercitazioniList(); });
  if (completo) document.getElementById("es-btn-nuova").addEventListener("click", () => apriModalEsercitazione(null));
  renderEsercitazioniList();
}

function renderEsercitazioniList(){
  const f = _esercitazioniFiltro;
  const q = f.search.trim().toLowerCase();
  const elenco = _esercitazioniCache.filter(e =>
    (!f.stato || e.stato === f.stato) &&
    (!q || (e.titolo||"").toLowerCase().includes(q) || (e.luogo||"").toLowerCase().includes(q)));
  const T = testiTipo();
  document.getElementById("es-results-count").textContent = `${elenco.length} ${T.plurale}`;
  const wrap = document.getElementById("es-list");
  if (elenco.length === 0){
    wrap.innerHTML = `<div class="empty-state"><div class="ic">${T.icona}</div>${_esercitazioniCache.length ? `Nessuna ${T.nome} corrisponde ai filtri.` : `Nessuna ${T.nome} creata.`}</div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="stat-card" style="padding:6px 10px;overflow-x:auto;">
      <table class="storico-table es-tabella-click">
        <thead><tr><th>Titolo</th><th>Ente</th><th>Date</th><th>Stato</th><th>Sezioni risposto</th><th>Volontari</th></tr></thead>
        <tbody>
          ${elenco.map(e => `
            <tr data-id="${e.id}">
              <td><strong>${escapeHtml(e.titolo)}</strong>${e.luogo ? `<div style="font-size:11.5px;color:var(--grigio-600);">${escapeHtml(e.luogo)}</div>` : ""}</td>
              <td>${ENTI_ESERCITAZIONE[e.ente] || escapeHtml(e.ente)}</td>
              <td>${periodoAttivazioneIt(e)}</td>
              <td>${badgeStatoEsercitazione(e.stato)}</td>
              <td>${e.n_risposte}/${e.n_sezioni}</td>
              <td>${e.n_volontari}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
  wrap.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", () => apriCruscottoEsercitazione(parseInt(tr.dataset.id))));
}

/* ---------- NUOVA / MODIFICA ---------- */
async function apriModalEsercitazione(id){
  if (!esercitazioniCompleto()){ alert("Il tuo livello di accesso non permette questa operazione."); return; }

  const { data: sezioniAna, error: errSa } = await sb.from("sezioni_ana").select("nome, in_cap, in_rgpt, ordine").order("ordine");
  if (errSa){ alert("Errore: " + errSa.message); return; }

  let es = null, servizi = [], invitate = [];
  if (id){
    const [r1, r2, r3] = await Promise.all([
      sb.from("attivazioni").select("*").eq("id", id).maybeSingle(),
      sb.from("attivazione_servizi").select("id, giorno, tipo").eq("attivazione_id", id),
      sb.from("attivazione_sezioni").select("id, sezione, stato").eq("attivazione_id", id)
    ]);
    const err = r1.error || r2.error || r3.error;
    if (err){ alert("Errore: " + err.message); return; }
    if (!r1.data){ alert(`${testiTipo().Nome} non trovata.`); return; }
    es = r1.data; servizi = r2.data || []; invitate = r3.data || [];
  }
  const tipo = es ? es.tipo : _attivazioneTipo;
  const T = testiTipo(tipo);
  const emergenza = tipo === "emergenza";

  chiudiModal();
  const overlay = document.createElement("div");
  overlay.id = "modal-overlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box modal-box-lg">
      <div class="modal-head">
        <h3>${es ? `Modifica ${T.nome}` : T.nuova}</h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      <div class="modal-body">
        <form id="form-esercitazione">
          <div class="form-grid">
            <div class="form-field full"><label>Titolo *</label><input name="titolo" required maxlength="150" value="${escapeHtml(es?.titolo||"")}"></div>
            <div class="form-field">
              <label>Ente *</label>
              <select name="ente" required>
                ${Object.entries(ENTI_ESERCITAZIONE).map(([k,l]) => `<option value="${k}" ${es?.ente===k?"selected":""}>${l}</option>`).join("")}
              </select>
            </div>
            <div class="form-field"><label>Luogo</label><input name="luogo" maxlength="150" value="${escapeHtml(es?.luogo||"")}"></div>
            <div class="form-field"><label>Data inizio *</label><input type="date" name="data_inizio" required value="${es?.data_inizio||""}"></div>
            <div class="form-field"><label>Data fine${emergenza ? " (se nota)" : " *"}</label><input type="date" name="data_fine" ${emergenza ? "" : "required"} value="${es?.data_fine||""}"></div>
            ${emergenza ? `<div class="form-field"><label>Griglia dei giorni fino al</label><input type="date" name="fine_finestra" value="${es?.fine_finestra||""}">
              <div class="es-aiuto" style="margin:4px 0 0;">Se la data fine non è nota, la griglia dei giorni arriva fin qui: si può estendere quando serve.</div></div>` : ""}
            <div class="form-field"><label>Chiusura adesioni</label><input type="datetime-local" name="chiusura_adesioni" value="${isoAInputLocale(es?.chiusura_adesioni)}">
              ${emergenza ? `<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">
                ${[6, 12, 24].map(h => `<button type="button" class="btn-add-mini" data-scadenza-ore="${h}">tra ${h} ore</button>`).join("")}
              </div>` : ""}</div>
            <div class="form-field">
              <label>Stato</label>
              <select name="stato">
                ${Object.entries(STATI_ESERCITAZIONE).map(([k,l]) => `<option value="${k}" ${(es?.stato||"bozza")===k?"selected":""}>${l}</option>`).join("")}
              </select>
            </div>
            <div class="form-field full"><label>Descrizione</label><textarea name="descrizione" maxlength="2000">${escapeHtml(es?.descrizione||"")}</textarea></div>
            <div class="form-field full"><label>Referente / contatto</label><input name="referente" maxlength="300" placeholder="es. Mario Rossi – 333 1234567 (facoltativo)" value="${escapeHtml(es?.referente||"")}"></div>
          </div>

          <div class="section-title" style="margin-top:20px;">Campi richiesti alle Sezioni</div>
          <p class="es-aiuto">Cognome, nome e codice fiscale sono sempre obbligatori. I campi "non richiesti" non compaiono nel modulo delle Sezioni, nel cruscotto e negli Excel.</p>
          <div class="es-campi-griglia">
            ${campiPerTipo(tipo).map(c => `
              <label>${(emergenza && c.labelEmergenza) || c.label}
                <select name="campo_${c.k}">
                  ${Object.entries(LIVELLI_CAMPO).filter(([v]) => !(c.senzaObbligatorio && v === "obbligatorio"))
                    .map(([v,l]) => `<option value="${v}" ${livelloCampo(es, c.k, tipo)===v?"selected":""}>${l}</option>`).join("")}
                </select>
              </label>`).join("")}
          </div>
          ${emergenza ? `<p class="es-aiuto">Art. 39: la Sezione segnala solo se il volontario chiede i benefici; i dati del datore di lavoro li gestisce la Sezione. Il dato è visibile solo con accesso completo.</p>` : ""}

          <div class="section-title" style="margin-top:20px;">${emergenza ? "Giornate e servizi" : "Servizi per giorno"}</div>
          <p class="es-aiuto">${emergenza
            ? "\"Disponibile\" = giornata in cui le Sezioni possono indicare i volontari disponibili (con orari, se richiesti). Pasti e pernotti solo se servono."
            : "Le Sezioni potranno indicare, per ogni volontario, solo i servizi spuntati qui. La colazione segue il pernotto della notte prima (modificabile)."}</p>
          <div id="es-servizi-griglia"></div>

          <div class="section-title" style="margin-top:20px;">Sezioni invitate</div>
          <p class="es-aiuto">Precompilate in base all'ente; puoi aggiungerne o toglierne. Ogni Sezione riceve il proprio link.</p>
          <div style="display:flex;gap:8px;margin-bottom:8px;">
            <button type="button" class="btn-add-mini" id="es-sez-da-ente">Seleziona in base all'ente</button>
            <button type="button" class="btn-cancel" style="padding:6px 12px;font-size:12px;" id="es-sez-nessuna">Togli tutte</button>
          </div>
          <div class="es-sezioni-check" id="es-sezioni-check">
            ${sezioniAna.map(s => `
              <label><input type="checkbox" name="sezione" value="${escapeHtml(s.nome)}"
                ${(es ? invitate.some(i => i.sezione === s.nome) : s.in_cap) ? "checked" : ""}> ${escapeHtml(s.nome)}</label>`).join("")}
          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" id="btn-annulla-esercitazione">Annulla</button>
            <button type="submit" class="btn-save">Salva</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  document.getElementById("btn-annulla-esercitazione").addEventListener("click", chiudiModal);

  const form = document.getElementById("form-esercitazione");

  // Griglia servizi: ricostruita quando cambiano le date, mantenendo le spunte già fatte
  const spunte = new Map(); // "giorno|tipo" -> bool
  servizi.forEach(s => spunte.set(`${s.giorno}|${s.tipo}`, true));
  // nuova esercitazione: pranzo e cena ogni giorno, pernotto tutte le notti tranne l'ultimo giorno,
  // colazione nei giorni preceduti da una notte con pernotto (di norma dal 2° giorno)
  // emergenza: solo la giornata di disponibilità, anche sui giorni aggiunti estendendo la finestra
  const precompila = !es;
  const tipi = tipiGriglia(tipo);
  // ultimo giorno della griglia: data fine oppure, per un'emergenza senza fine, la finestra
  const ultimoGiorno = () => form.data_fine.value || (form.fine_finestra ? form.fine_finestra.value : "");
  function disegnaServizi(){
    const giorni = giorniTra(form.data_inizio.value, ultimoGiorno());
    const box = document.getElementById("es-servizi-griglia");
    if (!giorni.length){ box.innerHTML = `<div class="storico-empty">Indica le date per vedere i giorni.</div>`; return; }
    if (giorni.length > MAX_GIORNI_ESERCITAZIONE){ box.innerHTML = `<div class="storico-empty">Massimo ${MAX_GIORNI_ESERCITAZIONE} giorni.</div>`; return; }
    box.innerHTML = `
      <table class="storico-table es-griglia-servizi">
        <thead><tr><th>Giorno</th>${tipi.map(t => `<th>${LABEL_SERVIZIO[t]}</th>`).join("")}</tr></thead>
        <tbody>
          ${giorni.map((g, i) => `<tr><td>${labelGiornoBreve(g)}</td>${tipi.map(t => {
            const k = `${g}|${t}`;
            if (!spunte.has(k) && emergenza){
              spunte.set(k, t === "disponibile");
            } else if (!spunte.has(k) && precompila){
              if (t === "colazione") spunte.set(k, i > 0 && !!spunte.get(`${giorni[i-1]}|pernotto`));
              else if (t === "pernotto") spunte.set(k, i < giorni.length - 1);
              else spunte.set(k, true);
            }
            return `<td><input type="checkbox" data-servizio="${k}" ${spunte.get(k) ? "checked" : ""}></td>`;
          }).join("")}</tr>`).join("")}
        </tbody>
      </table>`;
    box.querySelectorAll("[data-servizio]").forEach(c => c.addEventListener("change", () => {
      spunte.set(c.dataset.servizio, c.checked);
      // pernotto della notte X → colazione del giorno X+1 (resta modificabile)
      const [g, t] = c.dataset.servizio.split("|");
      if (t !== "pernotto") return;
      const kCol = `${giornoDopo(g)}|colazione`;
      const cCol = box.querySelector(`[data-servizio="${kCol}"]`);
      if (!cCol) return;
      cCol.checked = c.checked;
      spunte.set(kCol, c.checked);
    }));
  }
  form.data_inizio.addEventListener("change", () => {
    const inizio = form.data_inizio.value;
    if (inizio && !emergenza && (!form.data_fine.value || form.data_fine.value < inizio)) form.data_fine.value = inizio;
    if (inizio && emergenza && (!form.fine_finestra.value || form.fine_finestra.value < inizio)) form.fine_finestra.value = inizio;
    disegnaServizi();
  });
  form.data_fine.addEventListener("change", disegnaServizi);
  if (form.fine_finestra) form.fine_finestra.addEventListener("change", disegnaServizi);
  disegnaServizi();
  // emergenza: scadenza rapida da adesso
  form.querySelectorAll("[data-scadenza-ore]").forEach(b => b.addEventListener("click", () => {
    const d = new Date(Date.now() + parseInt(b.dataset.scadenzaOre) * 3600 * 1000);
    d.setSeconds(0, 0);
    form.chiusura_adesioni.value = isoAInputLocale(d.toISOString());
  }));

  function selezionaDaEnte(){
    const ente = form.ente.value;
    form.querySelectorAll('input[name="sezione"]').forEach(c => {
      const s = sezioniAna.find(x => x.nome === c.value);
      c.checked = ente === "CAP" ? !!s?.in_cap : !!s?.in_rgpt;
    });
  }
  document.getElementById("es-sez-da-ente").addEventListener("click", selezionaDaEnte);
  document.getElementById("es-sez-nessuna").addEventListener("click", () => form.querySelectorAll('input[name="sezione"]').forEach(c => c.checked = false));
  if (!es) form.ente.addEventListener("change", selezionaDaEnte);

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = form.querySelector(".btn-save");
    if (emergenza && !form.data_fine.value && !form.fine_finestra.value){ alert("Indica la data fine oppure fino a quando aprire la griglia dei giorni."); return; }
    if (form.data_fine.value && form.data_fine.value < form.data_inizio.value){ alert("La data di fine non può essere precedente alla data di inizio."); return; }
    if (emergenza && form.fine_finestra.value && form.fine_finestra.value < form.data_inizio.value){ alert("La griglia dei giorni non può finire prima della data di inizio."); return; }
    const giorni = giorniTra(form.data_inizio.value, ultimoGiorno());
    if (!giorni.length){ alert("La data di fine non può essere precedente alla data di inizio."); return; }
    if (giorni.length > MAX_GIORNI_ESERCITAZIONE){ alert(`Un'${T.nome} può coprire al massimo ${MAX_GIORNI_ESERCITAZIONE} giorni.`); return; }
    const serviziVoluti = [];
    giorni.forEach(g => tipi.forEach(t => { if (spunte.get(`${g}|${t}`)) serviziVoluti.push({ giorno:g, tipo:t }); }));
    const sezioniVolute = [...form.querySelectorAll('input[name="sezione"]:checked')].map(c => c.value);
    if (!sezioniVolute.length){ alert("Seleziona almeno una Sezione da invitare."); return; }

    const payload = {
      titolo: form.titolo.value.trim(),
      ente: form.ente.value,
      luogo: form.luogo.value.trim() || null,
      tipo,
      data_inizio: form.data_inizio.value,
      data_fine: form.data_fine.value || null,
      fine_finestra: emergenza ? (form.fine_finestra.value || null) : null,
      chiusura_adesioni: inputLocaleAIso(form.chiusura_adesioni.value),
      stato: form.stato.value,
      descrizione: form.descrizione.value.trim() || null,
      referente: form.referente.value.trim() || null,
      campi: Object.fromEntries(campiPerTipo(tipo).map(c => [c.k, form["campo_" + c.k].value]))
    };
    if (payload.campi.servizi === "obbligatorio" && !serviziVoluti.length){
      alert(`${emergenza ? "Giornate, pasti e pernotti" : "Pasti e pernotti"} sono obbligatori, ma non hai spuntato nessun servizio.`);
      return;
    }
    if (emergenza && payload.campi.orari !== "non_richiesto" && !serviziVoluti.some(s => s.tipo === "disponibile")){
      alert("Hai chiesto gli orari, ma nessuna giornata è segnata come \"Disponibile\".");
      return;
    }
    btn.disabled = true; btn.textContent = "Salvataggio…";
    const esito = await salvaEsercitazione(es, payload, servizi, serviziVoluti, invitate, sezioniVolute);
    btn.disabled = false; btn.textContent = "Salva";
    if (!esito) return;
    chiudiModal();
    renderEsercitazioni();
    apriCruscottoEsercitazione(esito);
  });
}

// Salva testata + differenze di servizi e Sezioni invitate. Ritorna l'id o null (errore già mostrato).
async function salvaEsercitazione(es, payload, serviziAttuali, serviziVoluti, invitateAttuali, sezioniVolute){
  const chiave = s => `${s.giorno}|${s.tipo}`;
  const voluti = new Set(serviziVoluti.map(chiave));
  const daTogliereServizi = serviziAttuali.filter(s => !voluti.has(chiave(s)));
  const daAggiungereServizi = serviziVoluti.filter(s => !serviziAttuali.some(a => chiave(a) === chiave(s)));
  const daTogliereSezioni = invitateAttuali.filter(s => !sezioniVolute.includes(s.sezione));
  const daAggiungereSezioni = sezioniVolute.filter(n => !invitateAttuali.some(s => s.sezione === n));

  // Conferme: togliere servizi o Sezioni cancella anche le scelte/adesioni collegate
  if (daTogliereServizi.length){
    const { count, error } = await sb.from("adesione_servizi").select("servizio_id", { count:"exact", head:true })
      .in("servizio_id", daTogliereServizi.map(s => s.id));
    if (error){ alert("Errore: " + error.message); return null; }
    if (count && !confirm(`Stai togliendo ${daTogliereServizi.length} servizi già scelti da ${count} volontari: le loro scelte per quei servizi verranno cancellate. Continuare?`)) return null;
  }
  const sezioniConRisposta = daTogliereSezioni.filter(s => s.stato !== "in_attesa");
  if (sezioniConRisposta.length && !confirm(`Stai togliendo Sezioni che hanno già risposto (${sezioniConRisposta.map(s => s.sezione).join(", ")}): le loro adesioni verranno cancellate. Continuare?`)) return null;

  let id = es?.id;
  if (id){
    const { error } = await sb.from("attivazioni").update(payload).eq("id", id);
    if (error){ alert("Errore: " + error.message); return null; }
  } else {
    const { data, error } = await sb.from("attivazioni").insert(payload).select("id").single();
    if (error){ alert("Errore: " + error.message); return null; }
    id = data.id;
  }

  if (daTogliereServizi.length){
    const { error } = await sb.from("attivazione_servizi").delete().in("id", daTogliereServizi.map(s => s.id));
    if (error){ alert(`${testiTipo(payload.tipo).Nome} salvata, ma errore sui servizi: ` + error.message); return id; }
  }
  if (daAggiungereServizi.length){
    const { error } = await sb.from("attivazione_servizi").insert(daAggiungereServizi.map(s => ({ attivazione_id:id, giorno:s.giorno, tipo:s.tipo })));
    if (error){ alert(`${testiTipo(payload.tipo).Nome} salvata, ma errore sui servizi: ` + error.message); return id; }
  }
  if (daTogliereSezioni.length){
    const { error } = await sb.from("attivazione_sezioni").delete().in("id", daTogliereSezioni.map(s => s.id));
    if (error){ alert(`${testiTipo(payload.tipo).Nome} salvata, ma errore sulle Sezioni: ` + error.message); return id; }
  }
  if (daAggiungereSezioni.length){
    // niente select('*'): il token non è leggibile, si ottiene con attivazione_link()
    const { error } = await sb.from("attivazione_sezioni").insert(daAggiungereSezioni.map(n => ({ attivazione_id:id, sezione:n }))).select("id");
    if (error){ alert(`${testiTipo(payload.tipo).Nome} salvata, ma errore sulle Sezioni: ` + error.message); return id; }
  }
  return id;
}

async function eliminaEsercitazione(id){
  if (!esercitazioniCompleto()) return;
  const es = _esercitazioniCache.find(e => e.id === id);
  if (!confirm(`Eliminare definitivamente l'${testiTipo().nome} "${es?.titolo || ""}"? Verranno cancellate anche tutte le adesioni delle Sezioni.`)) return;
  const { error } = await sb.from("attivazioni").delete().eq("id", id);
  if (error){ alert("Errore: " + error.message); return; }
  chiudiModal();
  renderEsercitazioni();
}

/* ---------- CRUSCOTTO ---------- */
let _cruscotto = null; // { es, servizi, sezioni, adesioni, ospiti, extra, cucina, patenti, abilitazioni, esigenze, tab, filtro }

async function apriCruscottoEsercitazione(id, tab){
  const completo = esercitazioniCompleto();
  const vuoto = Promise.resolve({ data:[], error:null });
  const [r1, r2, r3, r4, r5, ad, r6, r7, r8, r9] = await Promise.all([
    sb.from("attivazioni").select("*").eq("id", id).maybeSingle(),
    sb.from("attivazione_servizi").select("id, giorno, tipo").eq("attivazione_id", id),
    sb.from("attivazione_sezioni").select("id, sezione, stato, risposto_at").eq("attivazione_id", id),
    sb.from("attivazioni_patenti").select("nome").order("ordine").order("nome"),
    sb.from("attivazioni_abilitazioni").select("nome").order("ordine").order("nome"),
    caricaAdesioniEsercitazione(id),
    sb.from("attivazioni_esigenze").select("nome, con_nota").order("ordine").order("nome"),
    // cucina: totali volontari + ospiti + extra ed esigenze, senza dati personali (anche livello base)
    sb.rpc("attivazione_cucina", { p_attivazione_id: id }),
    completo ? sb.from("attivazione_ospiti").select("id, nome, ente_ruolo, note, esigenze, esigenze_note, attivazione_ospiti_servizi(servizio_id)").eq("attivazione_id", id).order("nome") : vuoto,
    completo ? sb.from("attivazione_extra").select("id, servizio_id, quantita, descrizione").eq("attivazione_id", id).order("id") : vuoto
  ]);
  const err = r1.error || r2.error || r3.error || r4.error || r5.error || ad.error || r6.error || r7.error || r8.error || r9.error;
  if (err){ alert("Errore: " + err.message); return; }
  if (!r1.data){ alert("Evento non trovato."); return; }
  _attivazioneTipo = r1.data.tipo;

  // emergenza: riepilogo per giorno (anche base, senza dati personali), mezzi e materiali delle Sezioni, tipologie
  let emerg = { giorni:[], mezzi:[], materiali:[], tipologie:[] };
  if (r1.data.tipo === "emergenza"){
    const [g, m, mt, tp] = await Promise.all([
      sb.rpc("attivazione_giorni", { p_attivazione_id: id }),
      sb.from("attivazione_mezzi").select("id, attivazione_sezione_id, tipo, targa, giorni, note").eq("attivazione_id", id).order("id"),
      sb.from("attivazione_materiali").select("id, attivazione_sezione_id, quantita, descrizione, note").eq("attivazione_id", id).order("id"),
      sb.from("attivazioni_tipologie").select("nome").order("ordine").order("nome")
    ]);
    const errE = g.error || m.error || mt.error || tp.error;
    if (errE){ alert("Errore: " + errE.message); return; }
    emerg = { giorni:(g.data && g.data.giorni) || [], mezzi:m.data || [], materiali:mt.data || [], tipologie:(tp.data || []).map(x => x.nome) };
  }

  const ordineTipo = t => ORDINE_SERVIZIO.indexOf(t);
  const sezioni = (r3.data || []).sort((a,b) => a.sezione.localeCompare(b.sezione));
  const stessaEsercitazione = _cruscotto && _cruscotto.es.id === id;
  _cruscotto = {
    es: r1.data,
    servizi: (r2.data || []).sort((a,b) => a.giorno.localeCompare(b.giorno) || ordineTipo(a.tipo) - ordineTipo(b.tipo)),
    sezioni,
    adesioni: ad.data.map(a => ({ ...a, sezione: sezioni.find(s => s.id === a.sezione_id)?.sezione || "—" }))
                     .sort((a,b) => a.sezione.localeCompare(b.sezione) || a.cognome.localeCompare(b.cognome) || a.nome.localeCompare(b.nome)),
    patenti: (r4.data || []).map(p => p.nome),
    abilitazioni: (r5.data || []).map(p => p.nome),
    esigenze: r6.data || [],
    cucina: r7.data || { servizi:[], esigenze:[] },
    ospiti: (r8.data || []).map(o => ({ ...o, esigenze:o.esigenze || [], servizi:(o.attivazione_ospiti_servizi || []).map(x => x.servizio_id) })),
    extra: r9.data || [],
    giorni: emerg.giorni,
    mezzi: emerg.mezzi.map(x => ({ ...x, giorni:x.giorni || [], sezione: sezioni.find(s => s.id === x.attivazione_sezione_id)?.sezione || "—" })),
    materiali: emerg.materiali.map(x => ({ ...x, sezione: sezioni.find(s => s.id === x.attivazione_sezione_id)?.sezione || "—" })),
    tipologie: emerg.tipologie,
    tab: tab || (stessaEsercitazione ? _cruscotto.tab : null) || "riepilogo",
    filtro: stessaEsercitazione ? _cruscotto.filtro : { search:"", sezione:"" }
  };
  renderCruscottoEsercitazione();
}

// Numeri del cruscotto (usati anche dall'export Excel).
// Pasti e posti letto: totali della cucina = volontari + ospiti + extra.
function calcolaRiepilogoEsercitazione(c){
  const servizioPerId = new Map(c.servizi.map(s => [s.id, s]));
  const perServizio = new Map(c.servizi.map(s => [s.id, 0]));
  const cucinaPerId = new Map(((c.cucina && c.cucina.servizi) || []).map(s => [s.id, s]));
  if (cucinaPerId.size){
    c.servizi.forEach(s => { const k = cucinaPerId.get(s.id); if (k) perServizio.set(s.id, k.volontari + k.ospiti + k.extra); });
  } else {
    c.adesioni.forEach(a => a.servizi.forEach(id => { if (perServizio.has(id)) perServizio.set(id, perServizio.get(id) + 1); }));
  }

  // pasti e pernotti: le giornate di disponibilità (emergenze) non contano
  const giorni = [...new Set(c.servizi.filter(s => s.tipo !== "disponibile").map(s => s.giorno))];
  const perGiorno = giorni.map(g => {
    const riga = { giorno:g };
    TIPI_SERVIZIO.forEach(t => {
      const s = c.servizi.find(x => x.giorno === g && x.tipo === t);
      riga[t] = s ? perServizio.get(s.id) : null; // null = servizio non previsto quel giorno
    });
    return riga;
  });
  let pasti = 0, pernotti = 0, postiLetto = 0;
  perServizio.forEach((n, id) => {
    const tipo = servizioPerId.get(id).tipo;
    if (tipo === "disponibile") return;
    if (tipo === "pernotto"){ pernotti += n; postiLetto = Math.max(postiLetto, n); }
    else pasti += n;
  });

  const volontariPerSezione = new Map(c.sezioni.map(s => [s.id, 0]));
  c.adesioni.forEach(a => volontariPerSezione.set(a.sezione_id, (volontariPerSezione.get(a.sezione_id) || 0) + 1));
  const conta = (lista, campo) => lista.map(n => ({ nome:n, n: c.adesioni.filter(a => (a[campo] || []).includes(n)).length }));

  return {
    volontari: c.adesioni.length,
    sezioniTotali: c.sezioni.length,
    sezioniRisposto: c.sezioni.filter(s => s.stato === "risposto").length,
    sezioniNonPartecipa: c.sezioni.filter(s => s.stato === "non_partecipa").length,
    pasti, pernotti, postiLetto, perGiorno, volontariPerSezione,
    patenti: conta(c.patenti, "patenti"),
    abilitazioni: conta(c.abilitazioni, "abilitazioni")
  };
}

function barreEsercitazione(righe){
  const max = Math.max(1, ...righe.map(r => r.n));
  if (!righe.length) return `<div class="storico-empty">Nessun dato.</div>`;
  return `<div class="es-barre">${righe.map(r => `
    <div class="es-barra">
      <span class="es-barra-nome">${escapeHtml(r.nome)}</span>
      <span class="es-barra-traccia"><span style="width:${Math.round(r.n / max * 100)}%"></span></span>
      <span class="es-barra-n">${r.n}</span>
    </div>`).join("")}</div>`;
}

/* ---------- Riepilogo per giorno (emergenze): dati da attivazione_giorni(), anche livello base ---------- */
// conteggi { nome: n } → "nome n · nome n" (dal più frequente)
function testoConteggi(obj){
  return Object.entries(obj || {}).filter(([k]) => k).sort((a,b) => b[1] - a[1]).map(([k,n]) => `${k} ${n}`).join(" · ");
}
// colonne tipologia: la lista attuale più quelle già usate e poi tolte dalla lista
function tipologieRiepilogo(c){
  return [...new Set([...c.tipologie, ...c.giorni.flatMap(g => Object.keys(g.tipologie || {}).filter(Boolean))])];
}

function descriviServiziAdesione(a){
  const servizi = _cruscotto.servizi.filter(s => a.servizi.includes(s.id));
  const giornate = servizi.filter(s => s.tipo === "disponibile");
  const pasti = servizi.filter(s => s.tipo !== "pernotto" && s.tipo !== "disponibile").length;
  const notti = servizi.filter(s => s.tipo === "pernotto").length;
  // giornate di disponibilità: elencate, con l'orario se indicato
  const testoGiornate = giornate.map(s => {
    const o = (a.orari || {})[s.id];
    return `${labelGiornoBreve(s.giorno)}${o ? ` ${o.dalle}–${o.alle}` : ""}`;
  }).join(", ");
  return [testoGiornate, pasti ? `${pasti} past${pasti === 1 ? "o" : "i"}` : "", notti ? `${notti} nott${notti === 1 ? "e" : "i"}` : ""].filter(Boolean).join(", ") || "—";
}

/* ---------- Excel per Sezione (stesso modello della pagina pubblica: esercitazioni-excel.js) ---------- */
function sezioneSceltaPerExcel(){
  const c = _cruscotto;
  const s = c.sezioni.find(x => String(x.id) === String(c.filtro.sezione));
  if (!s){ alert("Scegli prima la Sezione dal menu \"Tutte le Sezioni\"."); return null; }
  return s;
}

function configExcelSezione(s){
  const c = _cruscotto;
  return {
    titolo: c.es.titolo, tipoNome: testiTipo(c.es.tipo).Nome, sezione: s.sezione,
    date: periodoAttivazioneIt(c.es),
    campi: c.es.campi || CAMPI_DEFAULT, patenti: c.patenti, abilitazioni: c.abilitazioni, servizi: c.servizi, tipologie: c.tipologie,
    esigenze: c.esigenze, volontari: c.adesioni.filter(a => a.sezione_id === s.id), maxVolontari: 150
  };
}

async function scaricaModelloExcelSezione(){
  const s = sezioneSceltaPerExcel();
  if (!s) return;
  try{ await window.EsercitazioniExcel.scaricaModello(configExcelSezione(s)); }
  catch(e){ alert("Errore: " + e.message); }
}

async function caricaExcelSezione(ev){
  const file = ev.target.files[0];
  ev.target.value = "";
  const s = sezioneSceltaPerExcel();
  if (!file || !s) return;
  const c = _cruscotto;
  const box = document.getElementById("es-vol-form");
  box.innerHTML = `<div class="loading-spin">Lettura del file…</div>`;
  let esito;
  try{ esito = await window.EsercitazioniExcel.leggiFile(file, configExcelSezione(s)); }
  catch(e){ box.innerHTML = `<p style="color:var(--rosso);">Errore: ${escapeHtml(e.message)}</p>`; return; }
  const validi = esito.righe.filter(r => !r.errori.length).map(r => r.volontario);
  box.innerHTML = `
    <div class="mini-form">
      <div class="section-title" style="margin-top:0;">Excel della Sezione ${escapeHtml(s.sezione)}</div>
      ${window.EsercitazioniExcel.htmlAnteprima(esito)}
      <p class="es-aiuto" style="margin-top:10px;">I volontari validi vengono aggiunti o aggiornati (stesso codice fiscale); quelli già iscritti e non presenti nel file restano. Il salvataggio passa dagli stessi controlli della pagina delle Sezioni e segna la Sezione come "risposto".</p>
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="es-excel-annulla">Annulla</button>
        ${validi.length ? `<button type="button" class="btn-save" id="es-excel-salva">Salva ${validi.length} volontari</button>` : ""}
      </div>
    </div>`;
  document.getElementById("es-excel-annulla").addEventListener("click", () => { box.innerHTML = ""; });
  const salva = document.getElementById("es-excel-salva");
  if (!salva) return;
  salva.addEventListener("click", async () => {
    // elenco completo della Sezione = iscritti attuali aggiornati con il file
    const attuali = c.adesioni.filter(a => a.sezione_id === s.id).map(a => ({
      cognome:a.cognome, nome:a.nome, codice_fiscale:a.codice_fiscale, cellulare:a.cellulare || "",
      patenti:a.patenti, abilitazioni:a.abilitazioni, servizi:a.servizi, note:a.note || null,
      esigenze:a.esigenze || [], esigenze_note:a.esigenze_note || null
    }));
    validi.forEach(v => {
      const i = attuali.findIndex(x => x.codice_fiscale === v.codice_fiscale);
      if (i < 0) attuali.push(v);
      else attuali[i] = {
        ...v,
        cellulare: campoAttivo(c.es, "cellulare") ? v.cellulare : attuali[i].cellulare,
        patenti: campoAttivo(c.es, "patenti") ? v.patenti : attuali[i].patenti,
        abilitazioni: campoAttivo(c.es, "abilitazioni") ? v.abilitazioni : attuali[i].abilitazioni,
        servizi: campoAttivo(c.es, "servizi") ? v.servizi : attuali[i].servizi,
        esigenze: campoAttivo(c.es, "esigenze") ? v.esigenze : attuali[i].esigenze,
        esigenze_note: campoAttivo(c.es, "esigenze") ? v.esigenze_note : attuali[i].esigenze_note,
        note: campoAttivo(c.es, "note") ? v.note : attuali[i].note
      };
    });
    if (attuali.length > 150){ alert("La Sezione supererebbe 150 volontari."); return; }
    salva.disabled = true; salva.textContent = "Salvataggio…";
    const { data: link, error: errLink } = await sb.rpc("attivazione_link", { p_attivazione_id: c.es.id });
    const token = (link || []).find(l => l.attivazione_sezione_id === s.id)?.token;
    if (errLink || !token){ salva.disabled = false; salva.textContent = "Riprova"; alert("Errore: " + (errLink?.message || "link della Sezione non trovato.")); return; }
    const { error } = await sb.rpc("adesione_salva", { p_token: token, p_volontari: attuali });
    if (error){
      salva.disabled = false; salva.textContent = "Riprova";
      alert("Salvataggio non riuscito: " + error.message + (/chiuse/i.test(error.message) ? "\n\nPer caricare dati con le adesioni chiuse, riapri temporaneamente le adesioni (stato \"Adesioni aperte\")." : ""));
      return;
    }
    apriCruscottoEsercitazione(c.es.id, "volontari");
  });
}
