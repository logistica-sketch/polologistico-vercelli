async function caricaLibreriaFirme(){
  const { data, error } = await sb.from("firme_salvate").select("*").order("nome");
  const grid = document.getElementById("firma-lib-grid");
  if (!grid) return;
  if (error){ grid.innerHTML = `<p style="font-size:12px;">Errore: ${escapeHtml(error.message)}</p>`; return; }
  _firmeLibreria = data || [];

  if (_firmeLibreria.length === 0){
    grid.innerHTML = `<p style="font-size:12px;color:var(--grigio-600);grid-column:1/-1;">Nessuna firma salvata. Caricane una.</p>`;
    return;
  }

  grid.innerHTML = _firmeLibreria.map(f => {
    const { data: u } = sb.storage.from(STORAGE_BUCKET_FIRME).getPublicUrl(f.storage_path);
    const selezionata = _firmaSelezionataId === f.id;
    return `
      <div class="firma-lib-item ${selezionata?"selezionata":""}" data-id="${f.id}" data-url="${u.publicUrl}">
        <img src="${u.publicUrl}" alt="${escapeHtml(f.nome)}">
        <div class="nome">${escapeHtml(f.nome)}</div>
        <div class="del" data-elimina-firma="${f.id}">✕</div>
      </div>
    `;
  }).join("");

  grid.querySelectorAll(".firma-lib-item").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.dataset.eliminaFirma) return; // gestito separatamente
      _firmaSelezionataId = parseInt(el.dataset.id);
      caricaLibreriaFirme();
    });
  });
  grid.querySelectorAll("[data-elimina-firma]").forEach(b => b.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!confirm("Eliminare questa firma dalla libreria?")) return;
    const id = parseInt(b.dataset.eliminaFirma);
    const firma = _firmeLibreria.find(f => f.id === id);
    if (firma) await sb.storage.from(STORAGE_BUCKET_FIRME).remove([firma.storage_path]);
    await sb.from("firme_salvate").delete().eq("id", id);
    if (_firmaSelezionataId === id) _firmaSelezionataId = null;
    caricaLibreriaFirme();
  }));
}

async function caricaNuovaFirma(ev){
  const file = ev.target.files[0];
  if (!file) return;
  ev.target.value = "";
  const nome = prompt("Nome per questa firma (es. il tuo nome):", file.name.replace(/\.png$/i, ""));
  if (!nome) return;

  const path = `${Date.now()}_${file.name}`;
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_FIRME).upload(path, file, { contentType: "image/png" });
  if (upErr){ alert("Errore upload: " + upErr.message); return; }

  const { error } = await sb.from("firme_salvate").insert({ nome, storage_path: path, created_by: state.user.id });
  if (error){ alert("Errore: " + error.message); return; }

  caricaLibreriaFirme();
}

async function caricaPdfPerFirma(ev){
  const file = ev.target.files[0];
  if (!file) return;

  document.getElementById("firma-pdf-stato").textContent = "Caricamento PDF…";
  _firmePosizionate = [];

  const buf = await file.arrayBuffer();
  _pdfBytesOriginali = buf.slice(0); // copia, perché pdf.js consuma il buffer

  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  _pdfCorrente = pdf;

  const viewer = document.getElementById("firma-pdf-viewer");
  viewer.innerHTML = "";

  for (let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.3 });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport }).promise;

    const wrap = document.createElement("div");
    wrap.className = "firma-page-wrap";
    wrap.dataset.pagina = i;
    wrap.style.width = viewport.width + "px";
    wrap.style.height = viewport.height + "px";
    wrap.appendChild(canvas);
    wrap.addEventListener("click", (e) => onClickPaginaPerFirma(e, wrap, i));

    const pageNumLabel = document.createElement("div");
    pageNumLabel.className = "firma-page-num";
    pageNumLabel.textContent = `Pagina ${i} di ${pdf.numPages}`;

    viewer.appendChild(pageNumLabel);
    viewer.appendChild(wrap);
  }

  document.getElementById("firma-pdf-stato").textContent = `PDF caricato: ${file.name} (${pdf.numPages} pagine)`;
  document.getElementById("btn-scarica-pdf-firmato").style.display = "block";
}

function onClickPaginaPerFirma(e, wrap, numeroPagina){
  if (e.target.closest(".firma-overlay-sign")) return; // click su firma esistente, non aggiungerne una nuova
  if (!_firmaSelezionataId){
    alert("Seleziona prima una firma dalla libreria a sinistra.");
    return;
  }
  const firma = _firmeLibreria.find(f => f.id === _firmaSelezionataId);
  const { data: u } = sb.storage.from(STORAGE_BUCKET_FIRME).getPublicUrl(firma.storage_path);

  const rect = wrap.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const larghezzaIniziale = 140;
  const altezzaIniziale = 60;

  const posizione = {
    id: "fp_" + Date.now(),
    pagina: numeroPagina,
    xPct: (x - larghezzaIniziale/2) / rect.width,
    yPct: (y - altezzaIniziale/2) / rect.height,
    wPct: larghezzaIniziale / rect.width,
    hPct: altezzaIniziale / rect.height,
    firmaUrl: u.publicUrl
  };
  _firmePosizionate.push(posizione);
  renderOverlayFirma(wrap, posizione);
}

function renderOverlayFirma(wrap, pos){
  const rect = wrap.getBoundingClientRect();
  const overlay = document.createElement("div");
  overlay.className = "firma-overlay-sign";
  overlay.dataset.id = pos.id;
  overlay.style.left = (pos.xPct * rect.width) + "px";
  overlay.style.top = (pos.yPct * rect.height) + "px";
  overlay.style.width = (pos.wPct * rect.width) + "px";
  overlay.style.height = (pos.hPct * rect.height) + "px";
  overlay.innerHTML = `<img src="${pos.firmaUrl}"><div class="firma-resize-handle"></div><div class="del" style="position:absolute;top:-8px;left:-8px;" data-rimuovi-firma="${pos.id}">✕</div>`;
  wrap.appendChild(overlay);

  abilitaDragResize(overlay, wrap, pos);

  overlay.querySelector("[data-rimuovi-firma]").addEventListener("click", (e) => {
    e.stopPropagation();
    overlay.remove();
    _firmePosizionate = _firmePosizionate.filter(p => p.id !== pos.id);
  });
}

function abilitaDragResize(overlay, wrap, pos){
  let modo = null; // 'drag' | 'resize'
  let startX, startY, startLeft, startTop, startW, startH;

  function pointerPos(e){
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  overlay.addEventListener("mousedown", (e) => iniziaAzione(e, "drag"));
  overlay.addEventListener("touchstart", (e) => iniziaAzione(e, "drag"), { passive:false });
  overlay.querySelector(".firma-resize-handle").addEventListener("mousedown", (e) => { e.stopPropagation(); iniziaAzione(e, "resize"); });
  overlay.querySelector(".firma-resize-handle").addEventListener("touchstart", (e) => { e.stopPropagation(); iniziaAzione(e, "resize"); }, { passive:false });

  function iniziaAzione(e, tipo){
    if (e.target.dataset.rimuoviFirma) return;
    e.preventDefault();
    modo = tipo;
    const p = pointerPos(e);
    startX = p.x; startY = p.y;
    startLeft = parseFloat(overlay.style.left);
    startTop = parseFloat(overlay.style.top);
    startW = parseFloat(overlay.style.width);
    startH = parseFloat(overlay.style.height);
    document.addEventListener("mousemove", muovi);
    document.addEventListener("touchmove", muovi, { passive:false });
    document.addEventListener("mouseup", fine);
    document.addEventListener("touchend", fine);
  }

  function muovi(e){
    if (!modo) return;
    e.preventDefault();
    const p = pointerPos(e);
    const dx = p.x - startX, dy = p.y - startY;
    const rect = wrap.getBoundingClientRect();

    if (modo === "drag"){
      overlay.style.left = Math.max(0, Math.min(rect.width - startW, startLeft + dx)) + "px";
      overlay.style.top = Math.max(0, Math.min(rect.height - startH, startTop + dy)) + "px";
    } else {
      overlay.style.width = Math.max(30, startW + dx) + "px";
      overlay.style.height = Math.max(20, startH + dy) + "px";
    }
  }

  function fine(){
    if (!modo) return;
    modo = null;
    document.removeEventListener("mousemove", muovi);
    document.removeEventListener("touchmove", muovi);
    document.removeEventListener("mouseup", fine);
    document.removeEventListener("touchend", fine);

    // aggiorna percentuali salvate
    const rect = wrap.getBoundingClientRect();
    pos.xPct = parseFloat(overlay.style.left) / rect.width;
    pos.yPct = parseFloat(overlay.style.top) / rect.height;
    pos.wPct = parseFloat(overlay.style.width) / rect.width;
    pos.hPct = parseFloat(overlay.style.height) / rect.height;
  }
}

async function generaPdfFirmato(){
  if (!_pdfBytesOriginali){ alert("Carica prima un PDF."); return; }
  if (_firmePosizionate.length === 0){
    if (!confirm("Non hai posizionato nessuna firma. Scaricare comunque il PDF originale?")) return;
  }

  const btn = document.getElementById("btn-scarica-pdf-firmato");
  btn.disabled = true; btn.textContent = "Generazione…";

  try{
    const { PDFDocument } = PDFLib;
    const pdfDoc = await PDFDocument.load(_pdfBytesOriginali.slice(0));
    const pagine = pdfDoc.getPages();

    // cache immagini già scaricate per evitare richieste duplicate
    const cacheImmagini = {};

    for (const pos of _firmePosizionate){
      const pagina = pagine[pos.pagina - 1];
      if (!pagina) continue;
      const { width: pw, height: ph } = pagina.getSize();

      if (!cacheImmagini[pos.firmaUrl]){
        const resp = await fetch(pos.firmaUrl);
        const bytes = await resp.arrayBuffer();
        cacheImmagini[pos.firmaUrl] = await pdfDoc.embedPng(bytes);
      }
      const img = cacheImmagini[pos.firmaUrl];

      const wPdf = pos.wPct * pw;
      const hPdf = pos.hPct * ph;
      const xPdf = pos.xPct * pw;
      // PDF ha l'origine in basso a sinistra, il viewer in alto: convertiamo
      const yPdf = ph - (pos.yPct * ph) - hPdf;

      pagina.drawImage(img, { x: xPdf, y: yPdf, width: wPdf, height: hPdf });
    }

    const pdfBytesFinale = await pdfDoc.save();
    const blob = new Blob([pdfBytesFinale], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "documento_firmato.pdf";
    a.click();
    URL.revokeObjectURL(url);

  }catch(err){
    alert("Errore nella generazione del PDF: " + err.message);
  }

  btn.disabled = false; btn.textContent = "⬇️ Scarica PDF firmato";
}

function renderLibroMatricolaTable(){

      if (!campi.some(c => (c||"").toLowerCase().includes(q))) return false;
    }
    if (f.sezione && r.sezione !== f.sezione) return false;
    if (f.tipo && r.veicolo_tipo !== f.tipo) return false;
    return true;
  });

  const attivi = filtrati.filter(r => r.stato !== "dismesso");
  const dismessi = filtrati.filter(r => r.stato === "dismesso");

  document.getElementById("lm-results-count").textContent = `${attivi.length} di ${_libroMatricolaCache.filter(r=>r.stato!=="dismesso").length} mezzi attivi`;

    sezioneDismessi.style.marginTop = "20px";

    wrap.appendChild(sezioneDismessi);
  }

    sezioneDismessi.style.display = "none";
  } else {
    sezioneDismessi.style.display = "block";
    sezioneDismessi.innerHTML = `
      <button class="collapse-head" id="lm-toggle-dismessi">
        <span>🗑️ Mezzi dismessi</span>
        <span class="collapse-badge" style="display:inline-block;background:var(--grigio-600);">${dismessi.length}</span>
        <span class="collapse-arrow">▾</span>
      </button>

    `;

    const body = document.getElementById("lm-body-dismessi");
    toggle.addEventListener("click", () => {
      const apri = body.style.display !== "block";
      body.style.display = apri ? "block" : "none";
      toggle.querySelector(".collapse-arrow").textContent = apri ? "▴" : "▾";
    });
  }

  document.querySelectorAll(".lm-riga[data-id]").forEach(tr => {
    tr.addEventListener("click", () => apriModalMezzoLibroMatricola(parseInt(tr.dataset.id)));
  });
}

function apriModalMezzoLibroMatricola(id){

function renderModalLibroMatricola(){
  chiudiModal();
  const r = _modalLibroMatricolaCorrente;

      note: fd.get("note") || null
    };
    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    let result;
    if (r.id){
      result = await sb.from("libro_matricola").update(payload).eq("id", r.id).select().single();
    } else {
      result = await sb.from("libro_matricola").insert(payload).select().single();
    }
    if (result.error){ alert("Errore: " + result.error.message); btn.disabled=false; btn.textContent="Salva"; return; }

    chiudiModal();
    renderLibroMatricola();
  });

function esportaLibroMatricolaExcel(righe, nomeFile){

    "Data Incl.": r.data_inclusione ? formatDataIt(r.data_inclusione) : "",

    "Provincia": r.provincia || "",

    "Sezione": r.sezione || "",
    "Premio annuo RC": r.premio_annuo_rc ?? "",
    "Premio annuo Tutela Legale": r.premio_annuo_tutela_legale ?? "",
    "Conguaglio RC": r.conguaglio_rc || "",
    "Conguaglio Tutela Legale": r.conguaglio_tutela_legale || "",
    "Veicolo tipo": r.veicolo_tipo || ""
  }));
  const ws = XLSX.utils.json_to_sheet(dati);

}

/* ---------- EXPORT PDF ---------- */
function esportaLibroMatricolaPdf(righe, titolo){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape" });

  doc.setFontSize(13);
  doc.text(titolo, 14, 14);
  doc.setFontSize(8.5);
  doc.text(`Generato il ${formatDataIt(new Date().toISOString().slice(0,10))} — ${righe.length} mezzi`, 14, 20);

  let y = 30;
  const colonne = [
    { label:"Targa/Telaio", w:28 },
    { label:"Descrizione", w:55 },
    { label:"Sezione", w:30 },
    { label:"Tipo veicolo", w:48 },
    { label:"Premio RC", w:22 },
    { label:"Premio TL", w:22 },
    { label:"Data incl.", w:24 }
  ];
  function intestazione(yPos){
    doc.setFont(undefined, "bold");
    doc.setFontSize(8);
    let x = 14;
    colonne.forEach(c => { doc.text(c.label, x, yPos); x += c.w; });
    doc.setFont(undefined, "normal");
    doc.line(14, yPos+2, 280, yPos+2);
  }
  intestazione(y);
  y += 7;

  righe.forEach(r => {
    if (y > 195){ doc.addPage(); y = 18; intestazione(y); y += 7; }
    let x = 14;
    const valori = [
      r.targa_telaio,
      (r.descrizione_bene||"—").slice(0,32),
      (r.sezione||"—").slice(0,18),
      (r.veicolo_tipo||"—").slice(0,28),
      r.premio_annuo_rc!=null ? Number(r.premio_annuo_rc).toFixed(2) : "—",
      r.premio_annuo_tutela_legale!=null ? Number(r.premio_annuo_tutela_legale).toFixed(2) : "—",
      r.data_inclusione ? formatDataIt(r.data_inclusione) : "—"
    ];
    valori.forEach((v, i) => { doc.text(String(v), x, y); x += colonne[i].w; });
    y += 6;
  });

  doc.save(`${titolo.replace(/\s+/g,"_")}.pdf`);
}

/* ---------- IMPORT MASSIVO ZIP POLIZZE ---------- */
async function importaZipPolizzeLibroMatricola(ev){
  const file = ev.target.files[0];
  if (!file) return;
  ev.target.value = "";

  if (!confirm(`Importare le polizze dal file ${file.name}?\n\nOgni PDF nella root deve essere nominato NUMERO_TARGA.PDF (es. 000053_GA132VZ.PDF) → tipo Polizza.\nOgni PDF nella cartella CAI deve essere nominato TARGA_CAI.PDF → tipo CAI.\n\nVerranno associati al mezzo corrispondente per targa, con anno ${new Date().getFullYear()}.`)) return;

  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(255,255,255,0.9);z-index:600;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;";
  overlay.innerHTML = `<div class="loading-spin">Importazione in corso, non chiudere questa pagina…</div><div id="import-zip-polizze-progress" style="font-size:13px;color:var(--grigio-600);"></div>`;
  document.body.appendChild(overlay);
  const progressEl = overlay.querySelector("#import-zip-polizze-progress");

  const annoCorrente = new Date().getFullYear();

  try{
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const pdfEntries = Object.values(zip.files).filter(f => !f.dir && /\.pdf$/i.test(f.name));

    let ok = 0, nonTrovati = [], errori = [];
    let i = 0;
    for (const entry of pdfEntries){
      i++;
      progressEl.textContent = `${i} di ${pdfEntries.length}…`;

      const nomeBase = entry.name.split("/").pop();
      const inCartellaCai = /\/CAI\//i.test(entry.name) || /_CAI\.PDF$/i.test(nomeBase);

      let targa = null, tipo = null;
      if (inCartellaCai){
        const m = nomeBase.match(/^(.+?)_CAI\.PDF$/i);
        if (m){ targa = m[1].toUpperCase(); tipo = "cai"; }
      } else {
        const m = nomeBase.match(/^\d+_(.+?)\.PDF$/i);
        if (m){ targa = m[1].toUpperCase(); tipo = "polizza"; }
      }

      if (!targa){
        errori.push(`${nomeBase}: nome file non riconosciuto (formato atteso NUMERO_TARGA.PDF o TARGA_CAI.PDF)`);
        continue;
      }

      const mezzo = _libroMatricolaCache.find(r => (r.targa_telaio||"").toUpperCase() === targa);
      if (!mezzo){
        nonTrovati.push(`${nomeBase} (targa: ${targa})`);
        continue;
      }

      try{
        const blob = await entry.async("blob");
        const path = `${mezzo.targa_telaio}/${Date.now()}_${nomeBase}`.replace(/\s+/g, "_");
        const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_DOC_LIBRO_MATRICOLA).upload(path, blob, { contentType: "application/pdf" });
        if (upErr) throw upErr;

        const nomeFileSalvato = `${mezzo.targa_telaio} - ${tipo === "cai" ? "CAI" : "Polizza"} ${annoCorrente}`;
        const { error: docErr } = await sb.from("documenti_libro_matricola").insert({
          libro_matricola_id: mezzo.id,
          tipo: tipo,
          anno: annoCorrente,
          nome_file: nomeFileSalvato,
          storage_path: path,
          created_by: state.user.id
        });
        if (docErr) throw docErr;
        ok++;
      }catch(err){
        errori.push(`${nomeBase}: ${err.message}`);
      }
    }

    overlay.remove();
    let msg = `Import completato.\nDocumenti caricati: ${ok}\nMezzi non trovati: ${nonTrovati.length}`;
    if (nonTrovati.length) msg += `\n\nNon trovati:\n` + nonTrovati.join("\n");
    if (errori.length) msg += `\n\nErrori:\n` + errori.join("\n");
    alert(msg);

    renderLibroMatricola();

  }catch(err){
    overlay.remove();
    alert("Errore nella lettura dello ZIP: " + err.message);
  }
}

                ${(firme||[]).map(f => `<option value="${f.storage_path}" ${conv?.firma_path===f.storage_path?"selected":""}>${escapeHtml(f.nome)}</option>`).join("")}

          <div class="form-actions">
            ${conv ? `<button type="button" class="btn-danger" id="btn-elimina-conv">Elimina</button>` : ""}
            <button type="button" class="btn-cancel" id="btn-cancel-conv">Annulla</button>
            <button type="submit" class="btn-save">Salva e genera PDF</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  document.getElementById("btn-cancel-conv").addEventListener("click", chiudiModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) chiudiModal(); });
  if (conv) document.getElementById("btn-elimina-conv").addEventListener("click", async () => {
    if (!confirm("Eliminare questa convocazione?")) return;
    await sb.from("convocazioni").delete().eq("id", conv.id);
    chiudiModal();
    renderConvocazioni();
  });

  document.getElementById("select-gruppo-destinatari").addEventListener("change", (e) => {
    const g = _gruppiDestinatariCache.find(x => x.id === parseInt(e.target.value));
    if (g) document.querySelector('textarea[name="destinatari"]').value = g.righe;
  });

  document.getElementById("form-convocazione").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      tipo: fd.get("tipo"),
      oggetto: fd.get("oggetto").trim(),
      luogo_data: fd.get("luogo_data") || "",
      data_documento: fd.get("data_documento"),
      destinatari: fd.get("destinatari").trim(),
      destinatari_pc: fd.get("destinatari_pc") || null,
      data_riunione_1: fd.get("data_riunione_1") || null,
      ora_riunione_1: fd.get("ora_riunione_1") || null,
      data_riunione_2: fd.get("data_riunione_2") || null,
      ora_riunione_2: fd.get("ora_riunione_2") || null,
      luogo_riunione: fd.get("luogo_riunione") || null,
      ordine_del_giorno: fd.get("ordine_del_giorno").trim(),
      testo_aggiuntivo: fd.get("testo_aggiuntivo") || null,
      testo_chiusura: fd.get("testo_chiusura").trim(),
      firma_path: fd.get("firma_path") || null,
      firmatario_nome: fd.get("firmatario_nome").trim(),
      firmatario_ruolo: fd.get("firmatario_ruolo").trim(),
      created_by: state.user.id
    };

    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    let result;
    if (conv){
      result = await sb.from("convocazioni").update(payload).eq("id", conv.id).select().single();
    } else {
      result = await sb.from("convocazioni").insert(payload).select().single();
    }
    if (result.error){ alert("Errore: " + result.error.message); btn.disabled=false; btn.textContent="Salva e genera PDF"; return; }

    await generaPdfConvocazione(result.data);

    chiudiModal();
    renderConvocazioni();
  });
}

/* ---------- GENERAZIONE PDF ---------- */
async function generaPdfConvocazione(conv){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  try{ doc.addImage(LOGO_ANA_V2_BASE64, "PNG", 14, 10, 22, 22); }catch(e){}

  doc.setFontSize(11);
  doc.setFont(undefined, "bold");
  doc.text("COORDINAMENTO DELLE SEZIONI PIEMONTESI", 105, 14, { align:"center" });
  doc.text("DELL'ASSOCIAZIONE NAZIONALE ALPINI", 105, 20, { align:"center" });
  doc.setFontSize(9);
  doc.text("PROTEZIONE CIVILE", 105, 26, { align:"center" });
  doc.setFont(undefined, "normal");
  doc.setFontSize(7.5);
  doc.text("Sede Legale: Corso Marche 79 - 10146 Torino (TO)", 105, 32, { align:"center" });
  doc.text("Mail: info@coordanapiemonte.it - PEC: coordanapiemonte@pec.it", 105, 36, { align:"center" });
  doc.text("Iscrizione Regione Piemonte: D.P.G.R. n° 940 del 06/04/2011", 105, 40, { align:"center" });
  doc.text("Iscrizione nelle OO.VV. del DPC – DPR 194/01: n° DPC 8597 del 07/02/2011", 105, 44, { align:"center" });
  doc.line(14, 48, 196, 48);

  let y = 58;
  doc.setFontSize(10);
  doc.text(`${conv.luogo_data} ${formatDataIt(conv.data_documento)}`, 14, y); y += 9;

  doc.text("Dal Presidente a:", 14, y); y += 6;
  doc.setFont(undefined, "bold");
  conv.destinatari.split("\n").forEach(riga => {
    if (riga.trim()){ doc.text(riga.trim(), 14, y); y += 5.5; }
  });
  doc.setFont(undefined, "normal");

  if (conv.destinatari_pc && conv.destinatari_pc.trim()){
    y += 2;
    doc.text("e, p.c", 14, y); y += 6;
    doc.setFont(undefined, "bold");
    conv.destinatari_pc.split("\n").forEach(riga => {
      if (riga.trim()){ doc.text(riga.trim(), 14, y); y += 5.5; }
    });
    doc.setFont(undefined, "normal");
  }

  y += 6;
  doc.setFont(undefined, "bold");
  doc.text(`Oggetto: ${conv.oggetto}`, 14, y, { maxWidth: 182 });
  doc.setFont(undefined, "normal");
  y += 10;

  let testoRiunione = `Carissimo, è convocata la riunione per `;
  if (conv.data_riunione_1){
    testoRiunione += `${formatDataIt(conv.data_riunione_1)}${conv.ora_riunione_1 ? " alle ore " + conv.ora_riunione_1 : ""}`;
  }
  if (conv.data_riunione_2){
    testoRiunione += ` in prima convocazione e per ${formatDataIt(conv.data_riunione_2)}${conv.ora_riunione_2 ? " alle ore " + conv.ora_riunione_2 : ""} in seconda convocazione`;
  }
  if (conv.luogo_riunione){
    testoRiunione += `, ${conv.luogo_riunione}.`;
  } else {
    testoRiunione += ".";
  }
  const righeTesto = doc.splitTextToSize(testoRiunione, 182);
  doc.text(righeTesto, 14, y);
  y += righeTesto.length * 5.5 + 8;

  doc.setFont(undefined, "bold");
  doc.text("ORDINE DEL GIORNO", 14, y); y += 7;
  doc.setFont(undefined, "normal");
  conv.ordine_del_giorno.split("\n").filter(r => r.trim()).forEach((riga, i) => {
    if (y > 260){ doc.addPage(); y = 20; }
    const righeOdg = doc.splitTextToSize(`${i+1}) ${riga.trim()}`, 182);
    doc.text(righeOdg, 14, y);
    y += righeOdg.length * 5.5 + 1;
  });
  y += 4;

  if (conv.testo_aggiuntivo && conv.testo_aggiuntivo.trim()){
    const righeAgg = doc.splitTextToSize(conv.testo_aggiuntivo.trim(), 182);
    doc.text(righeAgg, 14, y);
    y += righeAgg.length * 5.5 + 6;
  }

  const righeChiusura = doc.splitTextToSize(conv.testo_chiusura, 182);
  doc.text(righeChiusura, 14, y);
  y += righeChiusura.length * 5.5 + 16;

  if (y > 250){ doc.addPage(); y = 30; }

  if (conv.firma_path){
    try{
      const { data: u } = sb.storage.from(STORAGE_BUCKET_FIRME).getPublicUrl(conv.firma_path);
      const resp = await fetch(u.publicUrl);
      const blob = await resp.blob();
      const dataUrl = await new Promise((res) => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result);
        reader.readAsDataURL(blob);
      });
      doc.addImage(dataUrl, "PNG", 130, y, 60, 22);
      y += 22;
    }catch(err){ /* nessuna firma, procedo senza */ }
  }

  doc.setFontSize(10);
  doc.text(conv.firmatario_ruolo, 196, y, { align: "right" }); y += 5.5;
  doc.text(conv.firmatario_nome, 196, y, { align: "right" });

  doc.save(`${conv.oggetto.replace(/[^a-zA-Z0-9]/g,"_").slice(0,60)}.pdf`);
}

const STORAGE_BUCKET_FIRME_PERSONALI = "firme-personali";

function apriFormCambioPassword(){
  const box = document.getElementById("cambio-password-form");
  box.innerHTML = `
    <form id="form-cambia-password">
      <div class="form-field" style="margin-bottom:8px;">
        <label>Nuova password</label>
        <input type="password" name="nuova_password" required minlength="6">
      </div>
      <div class="form-field" style="margin-bottom:8px;">
        <label>Conferma nuova password</label>
        <input type="password" name="conferma_password" required minlength="6">
      </div>
      <div id="errore-cambio-password" style="color:var(--rosso);font-size:12px;margin-bottom:8px;display:none;"></div>
      <div class="form-actions" style="border-top:none;padding-top:0;">
        <button type="button" class="btn-cancel" id="btn-annulla-cambio-password">Annulla</button>
        <button type="submit" class="btn-save">Salva password</button>
      </div>
    </form>
  `;
  document.getElementById("btn-annulla-cambio-password").addEventListener("click", () => { box.innerHTML = ""; });
  document.getElementById("form-cambia-password").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const nuova = fd.get("nuova_password");
    const conferma = fd.get("conferma_password");
    const errBox = document.getElementById("errore-cambio-password");
    errBox.style.display = "none";

    if (nuova !== conferma){
      errBox.textContent = "Le due password non coincidono.";
      errBox.style.display = "block";
      return;
    }

    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    const { error } = await sb.auth.updateUser({ password: nuova });

    if (error){
      errBox.textContent = "Errore: " + error.message;
      errBox.style.display = "block";
      btn.disabled = false; btn.textContent = "Salva password";
      return;
    }

    box.innerHTML = `<p style="font-size:12.5px;color:var(--verde);">Password aggiornata con successo.</p>`;
  });
}

async function renderFirmaPersonaleBox(){
  const box = document.getElementById("firma-personale-box");
  if (!box) return;

  const path = state.profile.firma_personale_path;
  let urlFirma = null;
  if (path){
    const { data: u } = sb.storage.from(STORAGE_BUCKET_FIRME_PERSONALI).getPublicUrl(path);
    urlFirma = u.publicUrl + "?t=" + Date.now();
  }

  box.innerHTML = `
    <div class="stat-card" style="max-width:340px;">
      ${urlFirma ? `<img src="${urlFirma}" alt="La tua firma" style="max-width:100%;height:80px;object-fit:contain;display:block;margin-bottom:10px;">` : `<p style="font-size:12.5px;color:var(--grigio-600);">Nessuna firma salvata.</p>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-add-mini" id="btn-disegna-firma-personale">${urlFirma ? "Rifai la firma" : "Crea la mia firma"}</button>
        <label class="btn-add-mini" style="cursor:pointer;">
          Carica immagine PNG
          <input type="file" id="input-carica-firma-png" accept="image/png" style="display:none;">
        </label>
      </div>
    </div>
    <div id="firma-personale-editor" style="margin-top:12px;"></div>
  `;

  document.getElementById("input-carica-firma-png").addEventListener("change", async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    ev.target.value = "";

    const nuovoPath = `${state.user.id}.png`;
    const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_FIRME_PERSONALI).upload(nuovoPath, file, { upsert:true, contentType:"image/png" });
    if (upErr){ alert("Errore upload: " + upErr.message); return; }

    const { error } = await sb.from("app_users").update({ firma_personale_path: nuovoPath }).eq("id", state.user.id);
    if (error){ alert("Errore: " + error.message); return; }

    state.profile.firma_personale_path = nuovoPath;
    renderFirmaPersonaleBox();
  });

  document.getElementById("btn-disegna-firma-personale").addEventListener("click", () => {
    const editorBox = document.getElementById("firma-personale-editor");
    editorBox.innerHTML = `
      <div id="canvas-firma-personale"></div>
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="btn-annulla-firma-personale">Annulla</button>
        <button type="button" class="btn-save" id="btn-salva-firma-personale">Salva firma</button>
      </div>
    `;
    const firma = creaCanvasFirma(document.getElementById("canvas-firma-personale"));

    document.getElementById("btn-annulla-firma-personale").addEventListener("click", () => { editorBox.innerHTML = ""; });
    document.getElementById("btn-salva-firma-personale").addEventListener("click", async () => {
      if (firma.isEmpty()){ alert("Disegna la firma prima di salvare."); return; }
      const btn = document.getElementById("btn-salva-firma-personale");
      btn.disabled = true; btn.textContent = "Salvataggio…";

      const dataUrl = firma.toPng();
      const blob = await (await fetch(dataUrl)).blob();
      const nuovoPath = `${state.user.id}.png`;

      const { error: upErr } = await sb.storage.from(STORAGE_BUCKET_FIRME_PERSONALI).upload(nuovoPath, blob, { upsert:true, contentType:"image/png" });
      if (upErr){ alert("Errore upload: " + upErr.message); btn.disabled=false; btn.textContent="Salva firma"; return; }

      const { error } = await sb.from("app_users").update({ firma_personale_path: nuovoPath }).eq("id", state.user.id);
      if (error){ alert("Errore: " + error.message); btn.disabled=false; btn.textContent="Salva firma"; return; }

      state.profile.firma_personale_path = nuovoPath;
      editorBox.innerHTML = "";
      renderFirmaPersonaleBox();
    });
  });
}

    if (apri && !logCaricato){ logCaricato = true; caricaLogAccessi(); }
  });

  renderListaUtenti(data);
}

async function caricaLogAccessi(){
  const wrap = document.getElementById("body-log-accessi");
  if (!wrap) return;

  const { data, error } = await sb.from("log_accessi").select("*").order("accesso_il", { ascending:false }).limit(100);
  if (error){ wrap.innerHTML = `<p>Errore: ${escapeHtml(error.message)}</p>`; return; }

  if (!data || data.length === 0){
    wrap.innerHTML = `<div class="storico-empty">Nessun accesso registrato.</div>`;
    return;
  }

  wrap.innerHTML = `
    <table class="storico-table">
      <thead><tr><th>Utente</th><th>Data/ora accesso</th><th></th></tr></thead>
      <tbody>
        ${data.map(r => `
          <tr style="cursor:pointer;" data-apri-sessione="${r.id}" data-utente-id="${r.utente_id}" data-accesso-il="${r.accesso_il}" data-nome="${escapeHtml(r.utente_nome||r.utente_email)}">
            <td>${escapeHtml(r.utente_nome || r.utente_email)}</td>
            <td>${formatDataOraIt(r.accesso_il)}</td>
            <td style="color:var(--blu-500);font-weight:600;">Vedi operazioni →</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;

  wrap.querySelectorAll("[data-apri-sessione]").forEach(tr => {
    tr.addEventListener("click", () => apriModalSessione(
      tr.dataset.utenteId, tr.dataset.accessoIl, tr.dataset.nome, data
    ));
  });
}

let _utenteEspansoId = null;

function renderListaUtenti(utenti){
  const wrap = document.getElementById("utenti-list");
  wrap.innerHTML = utenti.map(u => {
    const espanso = _utenteEspansoId === u.id;
    return `
    <div class="collapse-block" style="margin-bottom:10px;">
      <button class="collapse-head" data-toggle-utente="${u.id}">
        <span>${escapeHtml(u.nome)}</span>
        <span class="tag" style="background:var(--grigio-100);color:var(--grigio-800);margin-left:8px;">${labelRuolo(u.ruolo)}</span>
        <span class="tag" style="background:${u.attivo?"var(--verde-bg)":"var(--rosso-bg)"};color:${u.attivo?"var(--verde)":"var(--rosso)"};">${u.attivo?"Attivo":"Disattivato"}</span>
        <span class="collapse-arrow">${espanso?"▴":"▾"}</span>
      </button>
      <div class="collapse-body" id="utente-body-${u.id}" style="display:${espanso?"block":"none"};">
        <div class="form-grid">
          <div class="form-field"><label>Nome</label><input data-field="nome" data-id="${u.id}" value="${escapeHtml(u.nome)}"></div>
          <div class="form-field"><label>Email</label><input value="${escapeHtml(u.email)}" disabled></div>
          <div class="form-field">
            <label>Ruolo</label>
            <select data-field="ruolo" data-id="${u.id}">
              ${["it_admin","specialita","segreteria","standard"].map(r => `<option value="${r}" ${u.ruolo===r?"selected":""}>${labelRuolo(r)}</option>`).join("")}
            </select>
          </div>
          <div class="form-field">
            <label>Attivo</label>
            <div class="form-checkbox"><input type="checkbox" data-field="attivo" data-id="${u.id}" ${u.attivo?"checked":""}><label style="margin:0;">Utente attivo</label></div>
          </div>
          <div class="form-field full">
            <label>Pagine abilitate</label>
            <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;align-items:center;">
              ${PAGINE_PERMESSO.map(p => {
                if (p.livelli){
                  const valoreAttuale = (u.permessi && (u.permessi[p.key] === "completo" || u.permessi[p.key] === "base")) ? u.permessi[p.key] : "no";
                  return `
                    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;">
                      ${p.label}
                      <select data-perm-livello="${p.key}" data-id="${u.id}" style="font-size:12px;padding:3px 6px;">
                        <option value="no" ${valoreAttuale==="no"?"selected":""}>Nessun accesso</option>
                        <option value="base" ${valoreAttuale==="base"?"selected":""}>Base</option>
                        <option value="completo" ${valoreAttuale==="completo"?"selected":""}>Completo</option>
                      </select>
                    </label>
                  `;
                }
                return `
                  <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;">
                    <input type="checkbox" data-perm="${p.key}" data-id="${u.id}" ${u.permessi && u.permessi[p.key] ? "checked" : ""}>
                    ${p.label}
                  </label>
                `;
              }).join("")}
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-cancel" data-reset-password="${u.id}" data-email="${escapeHtml(u.email)}">Resetta password</button>
          <button class="btn-save" data-save="${u.id}">Salva</button>
        </div>
      </div>
    </div>
  `;
  }).join("");

  wrap.querySelectorAll('[data-toggle-utente]').forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.toggleUtente;
      _utenteEspansoId = (_utenteEspansoId === id) ? null : id;
      renderListaUtenti(utenti);
    });
  });
  wrap.querySelectorAll('[data-save]').forEach(btn => {
    btn.addEventListener("click", () => salvaUtente(btn.dataset.save, utenti));
  });
  wrap.querySelectorAll('[data-reset-password]').forEach(btn => {
    btn.addEventListener("click", () => resettaPasswordUtente(btn.dataset.email));
  });
}

async function resettaPasswordUtente(email){
  if (!confirm(`Inviare a ${email} un'email per reimpostare la password?`)) return;
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if (error){ alert("Errore: " + error.message); return; }
  alert("Email di reset password inviata.");
}

async function salvaUtente(id, utenti){
  const nome = document.querySelector(`[data-field="nome"][data-id="${id}"]`).value.trim();
  const ruolo = document.querySelector(`[data-field="ruolo"][data-id="${id}"]`).value;
  const attivo = document.querySelector(`[data-field="attivo"][data-id="${id}"]`).checked;
  const permessi = {};
  PAGINE_PERMESSO.forEach(p => {
    if (p.livelli){
      const valore = document.querySelector(`[data-perm-livello="${p.key}"][data-id="${id}"]`).value;
      permessi[p.key] = valore === "no" ? false : valore;
    } else {
      permessi[p.key] = document.querySelector(`[data-perm="${p.key}"][data-id="${id}"]`).checked;
    }
  });

  const { error } = await sb.from("app_users").update({ nome, ruolo, attivo, permessi }).eq("id", id);
  if (error){ alert("Errore: " + error.message); return; }

  if (id === state.user.id){
    state.profile.nome = nome;
    state.profile.ruolo = ruolo;
    state.profile.permessi = permessi;
    document.getElementById("sidebar-user-name").textContent = nome;
    document.getElementById("sidebar-user-role").textContent = labelRuolo(ruolo);
    renderSidebar();
  }

  alert("Utente aggiornato.");
  renderGestioneUtenti();
}

/* ---------- LOG ATTIVITÀ PER UTENTE ---------- */
const LABEL_TABELLE_LOG = {
  automezzi: "Automezzi", manutenzioni_automezzi: "Manutenzioni automezzi", movimenti_automezzi: "Movimenti automezzi",
  documenti_automezzi: "Documenti automezzi", tlc_apparati: "Apparati TLC", movimentazioni_tlc: "Movimentazioni TLC",
  movimentazioni_tlc_apparati: "Dettaglio movimentazioni TLC", tlc_categorie: "Categorie TLC",
  volontari_formazione: "Volontari Formazione", edizioni_corso: "Edizioni corso", catalogo_corsi: "Catalogo corsi",
  iscrizioni_corsi: "Iscrizioni corsi", documenti_volontario: "Documenti volontario", documenti_catalogo_corsi: "Documenti catalogo",
  firme_salvate: "Firme salvate", app_users: "Utenti app"
};
const LABEL_OPERAZIONE_LOG = { INSERT:"Creazione", UPDATE:"Modifica", DELETE:"Eliminazione" };

async function apriModalSessione(utenteId, accessoIl, nomeUtente, tutteLeSessioni){
  // Trova la sessione successiva dello STESSO utente per delimitare la finestra temporale
  const sessioniUtente = tutteLeSessioni
    .filter(s => s.utente_id === utenteId)
    .sort((a,b) => new Date(a.accesso_il) - new Date(b.accesso_il));
  const idx = sessioniUtente.findIndex(s => s.accesso_il === accessoIl);
  const fine = (idx >= 0 && idx < sessioniUtente.length - 1) ? sessioniUtente[idx + 1].accesso_il : null;

  chiudiModal();
  const overlay = document.createElement("div");
  overlay.id = "modal-overlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:900px;">
      <div class="modal-head">
        <h3>${escapeHtml(nomeUtente)} — sessione del ${formatDataOraIt(accessoIl)}</h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size:12.5px;color:var(--grigio-600);margin-top:0;">
          Operazioni eseguite da ${formatDataOraIt(accessoIl)}${fine ? ` a ${formatDataOraIt(fine)} (accesso successivo)` : " ad ora (sessione più recente)"}.
        </p>
        <div id="sessione-attivita-list"><div class="loading-spin">Caricamento…</div></div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  overlay.addEventListener("click", (ev) => { if (ev.target === overlay) chiudiModal(); });

  let query = sb.from("log_attivita").select("*").eq("utente_id", utenteId).gte("creato_il", accessoIl).order("creato_il", { ascending:false });
  if (fine) query = query.lt("creato_il", fine);

  const { data, error } = await query;
  const wrap = document.getElementById("sessione-attivita-list");
  if (error){ wrap.innerHTML = `<p>Errore: ${escapeHtml(error.message)}</p>`; return; }

  if (!data || data.length === 0){
    wrap.innerHTML = `<div class="empty-state"><div class="ic">📋</div>Nessuna operazione registrata in questa sessione.</div>`;
    return;
  }

  wrap.innerHTML = `
    <table class="storico-table">
      <thead><tr><th>Data/ora</th><th>Tabella</th><th>Operazione</th><th>Dettaglio</th></tr></thead>
      <tbody>
        ${data.map(r => `
          <tr>
            <td style="white-space:nowrap;">${formatDataOraIt(r.creato_il)}</td>
            <td>${LABEL_TABELLE_LOG[r.tabella] || r.tabella}</td>
            <td><span class="tag" style="background:${coloreOperazioneLog(r.operazione)};color:#fff;">${LABEL_OPERAZIONE_LOG[r.operazione]}</span></td>
            <td>${descrizioneSinteticaLog(r)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function formatDataOraIt(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("it-IT") + " " + d.toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" });
}

function coloreOperazioneLog(op){
  if (op === "INSERT") return "var(--verde)";
  if (op === "DELETE") return "var(--rosso)";
  return "var(--giallo)";
}

function descrizioneSinteticaLog(r){
  const dati = r.dati_dopo || r.dati_prima || {};
  const candidati = ["targa","selettiva","label","cognome","nome","nome_file","codice"];
  let etichetta = "";
  for (const c of candidati){
    if (dati[c]){ etichetta += (etichetta ? " " : "") + dati[c]; if (etichetta.split(" ").length >= 2) break; }
  }
  if (!etichetta) etichetta = `ID ${r.record_id || "?"}`;

  if (r.operazione === "UPDATE" && r.dati_prima && r.dati_dopo){
    const cambiati = Object.keys(r.dati_dopo).filter(k => JSON.stringify(r.dati_prima[k]) !== JSON.stringify(r.dati_dopo[k]) && k !== "updated_at");
    if (cambiati.length > 0){
      return `${escapeHtml(etichetta)} — campi modificati: ${cambiati.map(escapeHtml).join(", ")}`;
    }
  }
  return escapeHtml(etichetta);
}
