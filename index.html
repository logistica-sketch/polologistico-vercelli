<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Polo Logistico 1 RGPT/CAP Vercelli</title>
<link rel="icon" href="data:,">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --blu-900:#0b2545;
  --blu-700:#13315c;
  --blu-500:#1d4e89;
  --blu-300:#3a6ea5;
  --grigio-100:#f4f6f9;
  --grigio-200:#e6e9ee;
  --grigio-400:#c2c8d2;
  --grigio-600:#8a93a3;
  --grigio-800:#3d4452;
  --rosso:#c0392b;
  --rosso-bg:#fdecea;
  --giallo:#b8860b;
  --giallo-bg:#fdf3da;
  --verde:#2e7d32;
  --verde-bg:#eaf6ea;
  --bianco:#ffffff;
  --radius:10px;
  --shadow:0 1px 3px rgba(11,37,69,0.08), 0 1px 2px rgba(11,37,69,0.06);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);
  background:var(--grigio-100);
  color:var(--grigio-800);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- LOGIN ---------- */
#login-screen{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--blu-900),var(--blu-500));
  z-index:1000;
}
.login-box{
  background:var(--bianco);
  border-radius:var(--radius);
  padding:36px 32px;
  width:100%;
  max-width:360px;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
}
.login-box h1{
  font-size:18px;margin:0 0 4px;color:var(--blu-900);
}
.login-box p.sub{
  margin:0 0 24px;color:var(--grigio-600);font-size:13px;
}
.field{margin-bottom:14px;}
.field label{
  display:block;font-size:12px;font-weight:600;
  color:var(--grigio-800);margin-bottom:5px;
}
.field input{
  width:100%;padding:10px 12px;
  border:1px solid var(--grigio-400);
  border-radius:8px;font-size:14px;
}
.field input:focus{outline:none;border-color:var(--blu-500);}
.btn{
  width:100%;padding:11px;border:none;border-radius:8px;
  background:var(--blu-500);color:#fff;font-size:14px;font-weight:600;
  margin-top:6px;transition:background .15s;
}
.btn:hover{background:var(--blu-700);}
.btn:disabled{opacity:.6;cursor:default;}
.btn-secondary{
  background:transparent;color:var(--blu-500);border:1px solid var(--grigio-400);
}
.btn-secondary:hover{background:var(--grigio-100);}
.login-error{
  background:var(--rosso-bg);color:var(--rosso);
  padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;
}
.login-msg-ok{
  background:var(--verde-bg);color:var(--verde);
  padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;
}
.login-switch{
  text-align:center;margin-top:16px;font-size:13px;color:var(--grigio-600);
}
.login-switch span{color:var(--blu-500);font-weight:600;cursor:pointer;}

/* ---------- LAYOUT ---------- */
#app-shell{display:none;min-height:100vh;}
#app-shell.visible{display:flex;}

#sidebar{
  width:230px;flex-shrink:0;
  background:var(--blu-900);
  color:#cdd9ea;
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;
  z-index:100;
  transition:transform .2s ease;
}
.sidebar-header{
  padding:20px 18px 14px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.sidebar-header .org{font-size:11px;letter-spacing:.5px;color:#8aa3c7;text-transform:uppercase;}
.sidebar-header .title{font-size:15px;font-weight:700;color:#fff;margin-top:3px;line-height:1.3;}

.nav-list{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:8px;
  font-size:13.5px;font-weight:500;
  color:#cdd9ea;margin-bottom:2px;
  cursor:pointer;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--blu-500);color:#fff;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-badge{
  margin-left:auto;background:var(--rosso);color:#fff;
  font-size:10px;font-weight:700;border-radius:999px;
  padding:1px 6px;min-width:16px;text-align:center;
}

.sidebar-footer{
  padding:14px 16px;border-top:1px solid rgba(255,255,255,0.08);
}
.sidebar-user{font-size:12.5px;color:#fff;font-weight:600;}
.sidebar-role{font-size:11px;color:#8aa3c7;margin-top:2px;}
.sidebar-logout{
  margin-top:10px;font-size:12px;color:#e09b96;cursor:pointer;font-weight:600;
}
.sidebar-logout:hover{color:#fff;}

#sidebar-toggle{
  display:none;
  position:fixed;top:14px;left:14px;z-index:200;
  background:var(--blu-900);color:#fff;border:none;
  width:38px;height:38px;border-radius:8px;font-size:16px;
  box-shadow:var(--shadow);
}

#main-area{
  margin-left:230px;
  flex:1;
  min-width:0;
  display:flex;flex-direction:column;
}
#topbar{
  background:var(--bianco);
  border-bottom:1px solid var(--grigio-200);
  padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
#topbar h2{margin:0;font-size:17px;color:var(--blu-900);}
#topbar .topbar-sub{font-size:12px;color:var(--grigio-600);margin-top:2px;}

#page-content{padding:24px 28px 60px;flex:1;}

/* ---------- COMPONENTI COMUNI ---------- */
.alert-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;margin-bottom:26px;
}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:16px 18px;
  box-shadow:var(--shadow);
}
.stat-card .num{font-size:26px;font-weight:700;color:var(--blu-900);}
.stat-card .lbl{font-size:12px;color:var(--grigio-600);margin-top:2px;}

.section-title{
  font-size:14px;font-weight:700;color:var(--blu-900);
  margin:28px 0 12px;text-transform:uppercase;letter-spacing:.3px;
}
.section-title:first-child{margin-top:0;}

.alert-list{display:flex;flex-direction:column;gap:8px;}
.alert-row{
  display:flex;align-items:center;gap:12px;
  background:#fff;border-radius:8px;padding:12px 14px;
  box-shadow:var(--shadow);cursor:pointer;
  border-left:4px solid var(--grigio-400);
  transition:transform .1s;
}
.alert-row:hover{transform:translateX(2px);}
.alert-row.scaduto{border-left-color:var(--rosso);}
.alert-row.avvicinamento{border-left-color:var(--giallo);}
.alert-row .dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.alert-row.scaduto .dot{background:var(--rosso);}
.alert-row.avvicinamento .dot{background:var(--giallo);}
.alert-row .desc{flex:1;font-size:13.5px;font-weight:500;}
.alert-row .data{font-size:12px;color:var(--grigio-600);white-space:nowrap;}
.alert-row .tag{
  font-size:10.5px;font-weight:700;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;white-space:nowrap;
}
.alert-row.scaduto .tag{background:var(--rosso-bg);color:var(--rosso);}
.alert-row.avvicinamento .tag{background:var(--giallo-bg);color:var(--giallo);}

.empty-state{
  text-align:center;padding:36px 20px;color:var(--grigio-600);font-size:13.5px;
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
}
.empty-state .ic{font-size:28px;margin-bottom:8px;}

.placeholder-page{
  background:#fff;border-radius:var(--radius);padding:40px;text-align:center;
  box-shadow:var(--shadow);color:var(--grigio-600);
}
.placeholder-page h3{color:var(--blu-900);margin-top:0;}

.loading-spin{
  text-align:center;padding:40px;color:var(--grigio-600);font-size:13px;
}

/* ---------- TOOLBAR FILTRI ---------- */
.toolbar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  margin-bottom:18px;
}
.toolbar input[type="search"]{
  flex:1;min-width:160px;padding:9px 12px;
  border:1px solid var(--grigio-400);border-radius:8px;font-size:13.5px;
}
.toolbar select{
  padding:9px 10px;border:1px solid var(--grigio-400);border-radius:8px;
  font-size:13px;background:#fff;color:var(--grigio-800);
}
.toolbar .btn-add{
  background:var(--blu-500);color:#fff;border:none;border-radius:8px;
  padding:9px 16px;font-size:13.5px;font-weight:600;white-space:nowrap;
}
.toolbar .btn-add:hover{background:var(--blu-700);}
.results-count{font-size:12px;color:var(--grigio-600);margin-bottom:12px;}

/* ---------- GRIGLIA CARD MEZZI ---------- */
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}
.veicolo-card{
  background:#fff;border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;
  transition:transform .12s, box-shadow .12s;
}
.veicolo-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(11,37,69,0.12);}
.veicolo-card .foto-wrap{
  width:100%;aspect-ratio:4/3;background:var(--grigio-200);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.veicolo-card .foto-wrap img{width:100%;height:100%;object-fit:cover;}
.veicolo-card .foto-wrap .ph{font-size:34px;color:var(--grigio-400);}
.veicolo-card .badge-cat{
  position:absolute;top:8px;left:8px;
  background:rgba(11,37,69,0.85);color:#fff;
  font-size:10px;font-weight:700;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;letter-spacing:.3px;
}
.veicolo-card .badge-stato{
  position:absolute;top:8px;right:8px;
  width:10px;height:10px;border-radius:50%;
  border:2px solid #fff;
}
.veicolo-card .badge-stato.scaduto{background:var(--rosso);}
.veicolo-card .badge-stato.avvicinamento{background:var(--giallo);}
.veicolo-card .badge-stato.ok{background:var(--verde);}
.veicolo-card .info{padding:12px 14px;}
.veicolo-card .targa{
  font-size:14.5px;font-weight:700;color:var(--blu-900);
  font-family:monospace;letter-spacing:.5px;
}
.veicolo-card .modello{font-size:12.5px;color:var(--grigio-800);margin-top:2px;}
.veicolo-card .meta{font-size:11.5px;color:var(--grigio-600);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;}
.veicolo-card .meta span{background:var(--grigio-100);padding:2px 7px;border-radius:5px;}

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(11,37,69,0.5);
  display:flex;align-items:center;justify-content:center;
  z-index:500;padding:20px;
}
.modal-box{
  background:#fff;border-radius:var(--radius);
  width:100%;max-width:760px;max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,0.3);
}
.modal-head{
  padding:18px 22px;border-bottom:1px solid var(--grigio-200);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{margin:0;font-size:16px;color:var(--blu-900);font-family:monospace;}
.modal-close{
  background:none;border:none;font-size:20px;color:var(--grigio-600);
  width:30px;height:30px;border-radius:6px;
}
.modal-close:hover{background:var(--grigio-100);}
.modal-tabs{
  display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--grigio-200);
  overflow-x:auto;
}
.modal-tab{
  padding:11px 14px;font-size:13px;font-weight:600;color:var(--grigio-600);
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
}
.modal-tab.active{color:var(--blu-500);border-bottom-color:var(--blu-500);}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1;}

/* ---------- FOTO 4 LATI ---------- */
.foto-grid4{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;
}
.foto-slot{
  position:relative;aspect-ratio:4/3;border-radius:8px;
  background:var(--grigio-200);overflow:hidden;
  border:1.5px dashed var(--grigio-400);
}
.foto-slot img{width:100%;height:100%;object-fit:cover;}
.foto-slot .lbl{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(11,37,69,0.75);color:#fff;font-size:11px;font-weight:600;
  padding:4px 8px;text-align:center;
}
.foto-slot .ph{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--grigio-600);font-size:11px;gap:4px;
}
.foto-slot .ph .ic{font-size:22px;}
.foto-slot input[type="file"]{
  position:absolute;inset:0;opacity:0;cursor:pointer;
}
.foto-slot.uploading::after{
  content:"Caricamento…";position:absolute;inset:0;
  background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--blu-700);
}

/* ---------- FORM GENERICO ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.form-grid .full{grid-column:1 / -1;}
.form-field label{
  display:block;font-size:11.5px;font-weight:600;color:var(--grigio-800);margin-bottom:4px;
}
.form-field input, .form-field select, .form-field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--grigio-400);
  border-radius:7px;font-size:13px;
}
.form-field textarea{resize:vertical;min-height:60px;}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus{
  outline:none;border-color:var(--blu-500);
}
.form-checkbox{display:flex;align-items:center;gap:8px;margin-top:6px;}
.form-checkbox input{width:auto;}
.form-actions{
  display:flex;justify-content:flex-end;gap:8px;margin-top:18px;
  padding-top:14px;border-top:1px solid var(--grigio-200);
}
.btn-save{
  background:var(--blu-500);color:#fff;border:none;border-radius:8px;
  padding:9px 18px;font-size:13.5px;font-weight:600;
}
.btn-save:hover{background:var(--blu-700);}
.btn-cancel{
  background:none;border:1px solid var(--grigio-400);border-radius:8px;
  padding:9px 18px;font-size:13.5px;font-weight:600;color:var(--grigio-800);
}
.btn-danger{
  background:var(--rosso-bg);color:var(--rosso);border:none;border-radius:8px;
  padding:9px 14px;font-size:12.5px;font-weight:600;
}
.btn-danger:hover{background:#f8d7d3;}

/* ---------- STORICO (manutenzioni / movimenti) ---------- */
.storico-toolbar{display:flex;justify-content:flex-end;margin-bottom:10px;}
.btn-add-mini{
  background:var(--blu-500);color:#fff;border:none;border-radius:7px;
  padding:7px 13px;font-size:12.5px;font-weight:600;
}
.btn-add-mini:hover{background:var(--blu-700);}
.storico-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.storico-table th{
  text-align:left;font-size:11px;text-transform:uppercase;color:var(--grigio-600);
  border-bottom:1px solid var(--grigio-200);padding:6px 8px;font-weight:700;
}
.storico-table td{padding:8px 8px;border-bottom:1px solid var(--grigio-100);}
.storico-table tr:last-child td{border-bottom:none;}
.storico-empty{
  text-align:center;padding:22px;color:var(--grigio-600);font-size:12.5px;
}
.mini-form{
  background:var(--grigio-100);border-radius:8px;padding:14px;margin-bottom:14px;
}
.row-del{
  background:none;border:none;color:var(--rosso);font-size:11px;font-weight:600;cursor:pointer;
}
.row-del:hover{text-decoration:underline;}

/* ---------- RESPONSIVE ---------- */
@media (max-width:880px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main-area{margin-left:0;}
  #sidebar-toggle{display:flex;align-items:center;justify-content:center;}
  #page-content{padding:20px 16px 50px;}
  #topbar{padding:14px 18px 14px 60px;}
  .form-grid{grid-template-columns:1fr;}
  .foto-grid4{grid-template-columns:1fr 1fr;}
  .modal-box{max-height:94vh;}
  .storico-table{display:block;overflow-x:auto;white-space:nowrap;}
}
</style>
</head>

<div id="login-screen">

    <p class="sub">Vercelli — accesso gestionale</p>

      <div class="field">

    <div class="login-switch">

  </div>
</div>

/* ============================================================

function formatDataIt(dateStr){
  if(!dateStr) return "—";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("it-IT", { day:"2-digit", month:"2-digit", year:"numeric" });
}

function giorniDaOggi(dateStr){
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - oggi) / 86400000);
}

function statoScadenza(dateStr, giorniPreavviso){
  const g = giorniDaOggi(dateStr);
  if (g < 0) return "scaduto";
  if (g <= giorniPreavviso) return "avvicinamento";
  return "ok";
}

function escapeHtml(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   AUTH
   ============================================================ */
async function initAuth(){
  const { data } = await sb.auth.getSession();
  if (data.session){
    await onAuthenticated(data.session.user);
  } else {
    showLogin();
  }

  sb.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT"){
      showLogin();
    }
  });
}

async function onAuthenticated(user){
  state.user = user;

  // carica profilo applicativo
  const { data: profile, error } = await sb
    .from("app_users")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if (error || !profile){
    // primo accesso: nessun profilo app_users ancora collegato.
    // Creiamo un profilo di default come 'viewer' così l'admin può poi promuoverlo da Impostazioni.
    const { data: created } = await sb
      .from("app_users")
      .insert({ id: user.id, nome: user.email.split("@")[0], email: user.email, ruolo: "viewer" })
      .select()
      .single();
    state.profile = created || { nome: user.email, ruolo: "viewer" };
  } else {
    state.profile = profile;
  }

  showApp();
}

function showLogin(){
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app-shell").classList.remove("visible");
}

function showApp(){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-shell").classList.add("visible");
  document.getElementById("sidebar-user-name").textContent = state.profile.nome || state.user.email;
  document.getElementById("sidebar-user-role").textContent = labelRuolo(state.profile.ruolo);
  renderSidebar();
  router();
}

function labelRuolo(r){
  const map = { admin:"Amministratore", resp_automezzi:"Responsabile Automezzi", resp_tlc:"Responsabile TLC", viewer:"Visualizzatore" };
  return map[r] || r;
}

function userCanSee(roles){
  if (!roles) return true;
  return roles.includes(state.profile.ruolo);
}

document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const btn = document.getElementById("btn-login");
  const errBox = document.getElementById("login-error");
  const okBox = document.getElementById("login-msg-ok");
  errBox.style.display = "none";
  okBox.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Accesso in corso…";

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = "Accedi";

  if (error){
    errBox.textContent = "Credenziali non valide o utente non abilitato.";
    errBox.style.display = "block";
    return;
  }
  await onAuthenticated(data.user);
});

document.getElementById("link-reset").addEventListener("click", async () => {
  const email = document.getElementById("login-email").value.trim();
  const errBox = document.getElementById("login-error");
  const okBox = document.getElementById("login-msg-ok");
  errBox.style.display = "none";
  okBox.style.display = "none";

  if (!email){
    errBox.textContent = "Inserisci la tua email nel campo sopra, poi clicca di nuovo.";
    errBox.style.display = "block";
    return;
  }
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if (error){
    errBox.textContent = "Errore nell'invio email di reset.";
    errBox.style.display = "block";
  } else {
    okBox.textContent = "Email di reset inviata, controlla la posta.";
    okBox.style.display = "block";
  }
});

document.getElementById("btn-logout").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.hash = "#/home";
});

function renderSidebar(){
  const list = document.getElementById("nav-list");
  list.innerHTML = MENU.filter(m => userCanSee(m.roles)).map(m => `
    <div class="nav-item ${state.route === m.route ? "active" : ""}" data-route="${m.route}">
      <span class="ic">${m.icon}</span>
      <span>${m.label}</span>
      <span class="nav-badge" id="badge-${m.route}" style="display:none;"></span>
    </div>
  `).join("");

  list.querySelectorAll(".nav-item").forEach(el => {
    el.addEventListener("click", () => { location.hash = "#/" + el.dataset.route; });
  });

  // toggle mobile dopo click su una voce
  list.querySelectorAll(".nav-item").forEach(el => {
    el.addEventListener("click", () => document.getElementById("sidebar").classList.remove("open"));
  });

  refreshAlertBadge();
}

document.getElementById("sidebar-toggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
});

async function refreshAlertBadge(){
  try{
    const { data, error } = await sb.from("v_scadenze").select("*");
    if (error || !data) return;
    const urgenti = data.filter(r => r.data_scadenza && statoScadenza(r.data_scadenza, r.giorni_preavviso) !== "ok");
    const badge = document.getElementById("badge-home");
    if (badge){
      if (urgenti.length > 0){
        badge.textContent = urgenti.length;
        badge.style.display = "inline-block";
      } else {
        badge.style.display = "none";
      }
    }
  }catch(e){ /* silenzioso */ }
}

const PAGE_TITLES = {
  home: ["Home", "Situazione generale e alert"],
  automezzi: ["Automezzi", "Flotta, revisioni e movimentazioni"],
  tlc: ["TLC / Radio", "Apparati e movimentazioni"],
  impostazioni: ["Impostazioni", "Utenti, ruoli e configurazioni"]
};

function router(){
  const hash = location.hash.replace("#/", "") || "home";
  const route = MENU.some(m => m.route === hash) ? hash : "home";
  state.route = route;

  const [title, sub] = PAGE_TITLES[route] || ["", ""];
  document.getElementById("topbar-title").textContent = title;
  document.getElementById("topbar-sub").textContent = sub;

  renderSidebar();

  const content = document.getElementById("page-content");
  content.innerHTML = `<div class="loading-spin">Caricamento…</div>`;

  if (route === "home") renderHome();
  else if (route === "automezzi") renderAutomezzi();
  else if (route === "tlc") renderTlc();
  else if (route === "impostazioni") renderImpostazioni();
}
window.addEventListener("hashchange", router);

function generaReportRevisioniMese(automezzi){
  const oggi = new Date();
  const mesiIt = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

  const elenco = (automezzi || [])
    .filter(m => m.scadenza_revisione && statoScadenza(m.scadenza_revisione, 30) !== "ok")
    .sort((a,b) => new Date(a.scadenza_revisione) - new Date(b.scadenza_revisione));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text("Polo Logistico 1 RGPT/CAP Vercelli", 14, 16);
  doc.setFontSize(11);
  doc.text(`Report revisioni scadute e in scadenza`, 14, 24);
  doc.setFontSize(9);
  doc.text(`Generato il ${formatDataIt(oggi.toISOString().slice(0,10))}`, 14, 30);

  let y = 42;
  doc.setFontSize(9);
  doc.setFont(undefined, "bold");
  doc.text("Targa", 14, y);
  doc.text("Marca/Modello", 45, y);
  doc.text("Categoria", 100, y);
  doc.text("Posizione", 135, y);
  doc.text("Scadenza", 170, y);
  doc.setFont(undefined, "normal");
  y += 4;
  doc.line(14, y, 196, y);
  y += 6;

  if (elenco.length === 0){
    doc.text("Nessuna revisione scaduta o in scadenza.", 14, y);
  } else {
    elenco.forEach(m => {
      if (y > 280){ doc.addPage(); y = 20; }
      const scaduto = statoScadenza(m.scadenza_revisione, 30) === "scaduto";
      if (scaduto) doc.setTextColor(192,57,43); else doc.setTextColor(0,0,0);
      doc.text(m.targa, 14, y);
      doc.text(`${m.marca||""} ${m.modello||""}`.trim().slice(0,28), 45, y);
      doc.text(m.categoria || "—", 100, y);
      doc.text(m.posizione || "—", 135, y);
      doc.text(formatDataIt(m.scadenza_revisione), 170, y);
      doc.setTextColor(0,0,0);
      y += 7;
    });
  }

  doc.save(`report_revisioni_${oggi.toISOString().slice(0,10)}.pdf`);
}

function renderAlertList(items, classe){
  if (items.length === 0){
    return `<div class="empty-state"><div class="ic">✅</div>Nessuna voce in questo stato.</div>`;
  }
  return `<div class="alert-list">` + items.map(it => `
    <div class="alert-row ${classe}" data-modulo="${it.modulo}" data-rif="${it.riferimento_id}">
      <span class="dot"></span>
      <span class="desc">${escapeHtml(it.descrizione)}</span>
      <span class="tag">${it.tipo}</span>
      <span class="data">${formatDataIt(it.data_scadenza)} ${it.giorni < 0 ? `(${Math.abs(it.giorni)}gg fa)` : `(in ${it.giorni}gg)`}</span>
    </div>
  `).join("") + `</div>`;
}

const STORAGE_BUCKET_MEZZI = "mezzi-foto";
let _automezziCache = [];
let _automezziFiltro = { search:"", categoria:"", posizione:"", proprietario:"" };

function pathFotoMezzo(targa, lato){
  // lato: fronte | retro | sx | dx
  return `${targa}/${lato}.jpg`;
}
function urlFotoMezzo(targa, lato){
  const { data } = sb.storage.from(STORAGE_BUCKET_MEZZI).getPublicUrl(pathFotoMezzo(targa, lato));
  return data.publicUrl;
}

      <select id="am-filtro-categoria">

          `<option value="${c}" ${_automezziFiltro.categoria===c?"selected":""}>${c}</option>`).join("")}
      </select>
      <select id="am-filtro-posizione">
        <option value="">Tutte le posizioni</option>
        ${["POLO VERCELLI","SEZIONE","VOLONTARIO"].map(p =>
          `<option value="${p}" ${_automezziFiltro.posizione===p?"selected":""}>${p}</option>`).join("")}
      </select>
      <select id="am-filtro-proprietario">
        <option value="">Tutti i proprietari</option>
        ${["ANA","CAP","REGIONE PIEMONTE"].map(p =>
          `<option value="${p}" ${_automezziFiltro.proprietario===p?"selected":""}>${p}</option>`).join("")}
      </select>
      <button class="btn-add" id="am-btn-nuovo">+ Nuovo mezzo</button>
    </div>
    <div class="results-count" id="am-results-count"></div>
    <div class="card-grid" id="am-grid"></div>
  `;

  document.getElementById("am-search").addEventListener("input", e => { _automezziFiltro.search = e.target.value; renderAutomezziGrid(); });
  document.getElementById("am-filtro-categoria").addEventListener("change", e => { _automezziFiltro.categoria = e.target.value; renderAutomezziGrid(); });
  document.getElementById("am-filtro-posizione").addEventListener("change", e => { _automezziFiltro.posizione = e.target.value; renderAutomezziGrid(); });
  document.getElementById("am-filtro-proprietario").addEventListener("change", e => { _automezziFiltro.proprietario = e.target.value; renderAutomezziGrid(); });
  document.getElementById("am-btn-nuovo").addEventListener("click", () => apriModalMezzo(null));

  renderAutomezziGrid();
}

function renderAutomezziGrid(){
  const f = _automezziFiltro;
  const filtrati = _automezziCache.filter(m => {
    if (f.search && !m.targa.toLowerCase().includes(f.search.toLowerCase())) return false;
    if (f.categoria && m.categoria !== f.categoria) return false;
    if (f.posizione && m.posizione !== f.posizione) return false;
    if (f.proprietario && m.proprietario !== f.proprietario) return false;
    return true;
  });

  document.getElementById("am-results-count").textContent = `${filtrati.length} di ${_automezziCache.length} mezzi`;

  const grid = document.getElementById("am-grid");
  if (filtrati.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="ic">🔍</div>Nessun mezzo corrisponde ai filtri.</div>`;
    return;
  }

  grid.innerHTML = filtrati.map(m => {
    const stato = m.scadenza_revisione ? statoScadenza(m.scadenza_revisione, 30) : "ok";
    const fotoUrl = m.foto_fronte ? urlFotoMezzo(m.targa, "fronte") : null;
    return `
      <div class="veicolo-card" data-id="${m.id}">
        <div class="foto-wrap">
          ${fotoUrl ? `<img src="${fotoUrl}" alt="${escapeHtml(m.targa)}" onerror="this.parentElement.innerHTML='<span class=ph>🚐</span>'">` : `<span class="ph">🚐</span>`}
          ${m.categoria ? `<span class="badge-cat">${m.categoria}</span>` : ""}
          <span class="badge-stato ${stato}" title="Revisione: ${stato}"></span>
        </div>
        <div class="info">
          <div class="targa">${escapeHtml(m.targa)}</div>
          <div class="modello">${escapeHtml(m.marca || "")} ${escapeHtml(m.modello || "")}</div>
          <div class="meta">
            ${m.posizione ? `<span>${m.posizione}</span>` : ""}
            ${m.proprietario ? `<span>${m.proprietario}</span>` : ""}
          </div>
        </div>
      </div>
    `;
  }).join("");

  grid.querySelectorAll(".veicolo-card").forEach(el => {
    el.addEventListener("click", () => apriModalMezzo(parseInt(el.dataset.id)));
  });
}

/* ---------- MODAL MEZZO ---------- */
let _modalMezzoCorrente = null;
let _modalMezzoTab = "dati";

function apriModalMezzo(id){
  _modalMezzoCorrente = id ? _automezziCache.find(m => m.id === id) : null;
  _modalMezzoTab = "dati";
  renderModalMezzo();
}

function chiudiModal(){
  const ov = document.getElementById("modal-overlay");
  if (ov) ov.remove();
}

function renderModalMezzo(){
  chiudiModal();
  const m = _modalMezzoCorrente;
  const isNuovo = !m;

  const overlay = document.createElement("div");
  overlay.id = "modal-overlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <h3>${isNuovo ? "Nuovo mezzo" : escapeHtml(m.targa)}</h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      ${isNuovo ? "" : `
        <div class="modal-tabs">
          <div class="modal-tab ${_modalMezzoTab==="dati"?"active":""}" data-tab="dati">Scheda</div>
          <div class="modal-tab ${_modalMezzoTab==="foto"?"active":""}" data-tab="foto">Foto</div>
          <div class="modal-tab ${_modalMezzoTab==="documenti"?"active":""}" data-tab="documenti">Documenti</div>
          <div class="modal-tab ${_modalMezzoTab==="manutenzioni"?"active":""}" data-tab="manutenzioni">Manutenzioni</div>
          <div class="modal-tab ${_modalMezzoTab==="movimenti"?"active":""}" data-tab="movimenti">Movimentazioni</div>
        </div>
      `}
      <div class="modal-body" id="modal-body"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById("modal-close-btn").addEventListener("click", chiudiModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) chiudiModal(); });

  overlay.querySelectorAll(".modal-tab").forEach(tab => {
    tab.addEventListener("click", () => { _modalMezzoTab = tab.dataset.tab; renderModalMezzo(); });
  });

  if (isNuovo || _modalMezzoTab === "dati") renderTabDatiMezzo();
  else if (_modalMezzoTab === "foto") renderTabFotoMezzo();
  else if (_modalMezzoTab === "documenti") renderTabDocumenti();
  else if (_modalMezzoTab === "manutenzioni") renderTabManutenzioni();
  else if (_modalMezzoTab === "movimenti") renderTabMovimentiMezzo();
}

    const btn = e.target.querySelector(".btn-save");
    btn.disabled = true; btn.textContent = "Salvataggio…";

    let result;
    if (m.id){
      result = await sb.from("automezzi").update(payload).eq("id", m.id).select().single();
    } else {
      result = await sb.from("automezzi").insert(payload).select().single();
    }

    if (result.error){
      alert("Errore salvataggio: " + result.error.message);

function renderTabFotoMezzo(){
  const m = _modalMezzoCorrente;
  const body = document.getElementById("modal-body");
  const lati = [
    { key:"fronte", label:"Fronte (copertina)" },
    { key:"retro", label:"Retro" },
    { key:"sx", label:"Fianco sinistro" },
    { key:"dx", label:"Fianco destro" }
  ];

  body.innerHTML = `
    <div class="foto-grid4">
      ${lati.map(l => {
        const has = m["foto_" + l.key];
        const url = has ? urlFotoMezzo(m.targa, l.key) + "?t=" + Date.now() : null;
        return `
          <div class="foto-slot" id="slot-${l.key}">
            ${url ? `<img src="${url}">` : `<div class="ph"><span class="ic">📷</span>${l.label}</div>`}
            <div class="lbl">${l.label}</div>
            <input type="file" accept="image/*,.heic,.heif" data-lato="${l.key}">
          </div>
        `;
      }).join("")}
    </div>
    <p style="font-size:12px;color:var(--grigio-600);">Tocca un riquadro per caricare o sostituire la foto. Le immagini si salvano automaticamente.</p>
  `;

  body.querySelectorAll('input[type="file"]').forEach(input => {
    input.addEventListener("change", async (e) => {
      let file = e.target.files[0];
      if (!file) return;
      const lato = e.target.dataset.lato;
      const slot = document.getElementById("slot-" + lato);
      slot.classList.add("uploading");

      // Rileva HEIC/HEIF (foto iPhone) e converte in JPEG prima dell'upload,
      // perché Supabase Storage non accetta quel formato.
      const isHeic = /\.heic$/i.test(file.name) || /\.heif$/i.test(file.name) ||
                     file.type === "image/heic" || file.type === "image/heif";
      if (isHeic){
        try{
          const blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.85 });
          file = new File([blob], file.name.replace(/\.(heic|heif)$/i, ".jpg"), { type: "image/jpeg" });
        }catch(convErr){
          slot.classList.remove("uploading");
          alert("Errore nella conversione della foto HEIC. Riprova o usa un'altra foto.");
          return;
        }
      }

      const path = pathFotoMezzo(m.targa, lato);
      const { error } = await sb.storage.from(STORAGE_BUCKET_MEZZI).upload(path, file, { upsert: true, contentType: "image/jpeg" });

      slot.classList.remove("uploading");

      if (error){
        alert("Errore upload: " + error.message);
        return;
      }

      // aggiorna flag in DB
      const campo = "foto_" + lato;
      await sb.from("automezzi").update({ [campo]: true }).eq("id", m.id);
      m[campo] = true;
      const idx = _automezziCache.findIndex(x => x.id === m.id);
      if (idx >= 0) _automezziCache[idx][campo] = true;

      renderTabFotoMezzo();
      if (lato === "fronte") renderAutomezziGrid();
    });
  });
}

async function caricaDocumenti(){
  const m = _modalMezzoCorrente;
  const { data, error } = await sb.from("documenti_automezzi").select("*").eq("automezzo_id", m.id).order("created_at", { ascending:false });
  const wrap = document.getElementById("documenti-list");
  if (!wrap) return;
  if (error){ wrap.innerHTML = `<p>Errore: ${escapeHtml(error.message)}</p>`; return; }
  if (!data || data.length === 0){ wrap.innerHTML = `<div class="storico-empty">Nessun documento caricato.</div>`; return; }

  wrap.innerHTML = `
    <table class="storico-table">
      <thead><tr><th>Tipo</th><th>File</th><th>Data doc.</th><th></th><th></th></tr></thead>
      <tbody>
        ${data.map(d => {
          const { data: u } = sb.storage.from(STORAGE_BUCKET_DOC_MEZZI).getPublicUrl(d.storage_path);
          const lbl = TIPI_DOCUMENTO.find(t => t.value === d.tipo)?.label || d.tipo;
          return `
            <tr>
              <td>${lbl}</td>
              <td>${escapeHtml(d.nome_file)}</td>
              <td>${d.data_documento ? formatDataIt(d.data_documento) : "—"}</td>
              <td><a href="${u.publicUrl}" target="_blank" rel="noopener">Apri</a></td>
              <td><button class="row-del" data-id="${d.id}" data-path="${d.storage_path}">Elimina</button></td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll(".row-del").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("Eliminare questo documento?")) return;
    await sb.storage.from(STORAGE_BUCKET_DOC_MEZZI).remove([b.dataset.path]);
    await sb.from("documenti_automezzi").delete().eq("id", parseInt(b.dataset.id));
    caricaDocumenti();
  }));
}
