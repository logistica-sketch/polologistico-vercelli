<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b2545">
<title>Adesioni – Polo Logistico</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="stile.css">
<script src="https://unpkg.com/@supabase/supabase-js@2.117.2"></script>
<script src="esercitazioni-excel.js"></script>
<!--
  Pagina pubblica per le Sezioni: nessun login, il link contiene il token (?t=).
  Usa SOLO le RPC adesione_get / adesione_salva / adesione_nessuna (anon non legge le tabelle).
  La bozza non ancora inviata resta in localStorage su questo dispositivo.
-->
<style>
  body{ background:var(--grigio-100); }
  .pagina{ max-width:640px; margin:0 auto; padding:16px 14px 110px; }
  .testata{
    background:linear-gradient(135deg,var(--blu-900),var(--blu-500)); color:#fff;
    border-radius:var(--radius); padding:18px 18px 16px; margin-bottom:14px;
  }
  .testata .org{ font-size:10.5px; letter-spacing:.4px; text-transform:uppercase; color:#b9cbe4; }
  .testata h1{ font-size:20px; margin:4px 0 8px; line-height:1.25; }
  .testata .riga{ font-size:13.5px; margin-top:3px; color:#e6edf7; }
  .testata .sezione{
    display:inline-block; margin-top:10px; background:rgba(255,255,255,.16);
    padding:5px 11px; border-radius:999px; font-weight:700; font-size:13px;
  }
  .scheda{ background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px; }
  .scheda h2{ font-size:15px; margin:0 0 10px; color:var(--blu-900); }
  .aiuto{ font-size:12.5px; color:var(--grigio-600); margin:0 0 10px; line-height:1.45; }
  .messaggio{ border-radius:var(--radius); padding:16px; font-size:14px; line-height:1.5; margin-bottom:14px; }
  .messaggio h2{ font-size:16px; margin:0 0 6px; }
  .msg-errore{ background:var(--rosso-bg); color:var(--rosso); }
  .msg-ok{ background:var(--verde-bg); color:var(--verde); }
  .msg-info{ background:#e8eef7; color:var(--blu-500); }
  .msg-avviso{ background:var(--giallo-bg); color:var(--giallo); }
  .vol{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--grigio-200); }
  .vol:last-child{ border-bottom:none; }
  .vol .chi{ flex:1; min-width:0; }
  .vol .nome{ font-weight:700; font-size:14px; color:var(--blu-900); }
  .vol .dett{ font-size:12px; color:var(--grigio-600); margin-top:2px; overflow-wrap:anywhere; }
  .vol button{ border:none; background:none; font-size:13px; font-weight:600; padding:8px 6px; cursor:pointer; }
  .b-modifica{ color:var(--blu-500); }
  .b-togli{ color:var(--rosso); }
  .vuoto{ text-align:center; color:var(--grigio-600); font-size:13px; padding:14px 0; }
  label.campo{ display:block; font-size:12.5px; font-weight:600; color:var(--grigio-800); margin:12px 0 5px; }
  input.testo{
    width:100%; font-size:16px; padding:11px 12px; border:1px solid var(--grigio-400);
    border-radius:8px; font-family:var(--font); background:#fff;
  }
  input.testo:focus{ outline:none; border-color:var(--blu-500); }
  input.cf{ text-transform:uppercase; font-family:ui-monospace,Menlo,Consolas,monospace; letter-spacing:.5px; }
  .errore-campo{ color:var(--rosso); font-size:12px; margin-top:4px; min-height:1em; }
  .pulsanti{ display:flex; flex-wrap:wrap; gap:7px; }
  .pill{
    border:1.5px solid var(--grigio-400); background:#fff; color:var(--grigio-800);
    border-radius:999px; padding:8px 14px; font-size:13.5px; font-weight:600; cursor:pointer;
    min-height:38px; font-family:var(--font);
  }
  .pill.on{ background:var(--blu-500); border-color:var(--blu-500); color:#fff; }
  .riga-elenco{ border:1px solid var(--grigio-200); border-radius:8px; padding:2px 12px 12px; margin-bottom:10px; }
  .orario{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12.5px; color:var(--grigio-600); }
  .orario input{ font-size:15px; padding:6px 8px; border:1px solid var(--grigio-400); border-radius:8px; font-family:var(--font); }
  .giorno{ margin-bottom:10px; }
  .giorno .data{ font-size:12.5px; font-weight:700; color:var(--blu-900); margin-bottom:5px; text-transform:capitalize; }
  .azioni{ display:flex; gap:8px; margin-top:16px; }
  .azioni button, .grande{
    flex:1; border:none; border-radius:9px; padding:13px 14px; font-size:15px; font-weight:700;
    cursor:pointer; font-family:var(--font);
  }
  .primario{ background:var(--blu-500); color:#fff; }
  .primario:disabled{ opacity:.6; }
  .secondario{ background:#fff; color:var(--grigio-800); border:1.5px solid var(--grigio-400) !important; }
  .pericolo{ background:#fff; color:var(--rosso); border:1.5px solid var(--rosso) !important; }
  .barra-invio{
    position:fixed; left:0; right:0; bottom:0; background:#fff; box-shadow:0 -2px 10px rgba(11,37,69,.1);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .barra-invio .dentro{ max-width:640px; margin:0 auto; display:flex; gap:8px; }
  .barra-invio button{ flex:1; }
  .riepilogo-num{ display:flex; gap:10px; margin:10px 0 4px; }
  .riepilogo-num div{ flex:1; background:var(--grigio-100); border-radius:8px; padding:10px; text-align:center; }
  .riepilogo-num strong{ display:block; font-size:22px; color:var(--blu-900); }
  .riepilogo-num span{ font-size:11.5px; color:var(--grigio-600); }
  .caricamento{ text-align:center; color:var(--grigio-600); padding:50px 0; font-size:14px; }
  .piede{ text-align:center; font-size:11px; color:var(--grigio-600); margin-top:18px; }
</style>
</head>
<body>
<div class="pagina">
  <div id="app"><div class="caricamento">Caricamento…</div></div>
  <div class="piede">Polo Logistico 1° RGPT/CAP Vercelli · ANA Protezione Civile</div>
</div>
<div class="barra-invio" id="barra-invio" style="display:none;">
  <div class="dentro">
    <button class="grande pericolo" id="btn-non-partecipa">La Sezione non partecipa</button>
    <button class="grande primario" id="btn-invia">Invia adesione</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://hzovguvwnadoptwrdyub.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6b3ZndXZ3bmFkb3B0d3JkeXViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NjM3OTAsImV4cCI6MjA5NzUzOTc5MH0.wUyxlGUU6rVM2AC4YLtkTb2D4XPQuAzpTnfWYEMoDdE";
  const MAX_VOLONTARI = 150;
  const MAX_MEZZI = 50, MAX_MATERIALI = 100;
  // "disponibile" = giornata di disponibilità (emergenze)
  const TIPI = ["disponibile", "colazione", "pranzo", "cena", "pernotto"];
  const LABEL_TIPO = { disponibile:"Disponibile", colazione:"Colazione", pranzo:"Pranzo", cena:"Cena", pernotto:"Pernotto" };
  // campi che, se assenti dalla configurazione, valgono "non richiesto" (come sul DB)
  const NON_RICHIESTI_SE_ASSENTI = ["esigenze", "tipologia", "art39", "orari", "mezzi", "materiali"];
  const ENTI = { CAP:"CAP", "1RGPT":"1° RGPT" };

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
  });

  const token = (new URLSearchParams(location.search).get("t") || "").trim();
  const CHIAVE_BOZZA = "adesione_bozza_" + token;

  const app = document.getElementById("app");
  const barra = document.getElementById("barra-invio");

  // stato pagina
  let dati = null;          // risposta di adesione_get
  let volontari = [];       // elenco in lavorazione
  let mezzi = [];           // emergenze: mezzi della Sezione { tipo, targa, note, giorni[] }
  let materiali = [];       // emergenze: materiali { quantita, descrizione, note }
  let modifica = null;      // indice del volontario in modifica (null = nuovo)
  let formAperto = false;
  let formBozza = null;     // campi del form non ancora aggiunti all'elenco
  let vista = "elenco";     // elenco | conferma | chiuso
  let invioInCorso = false;

  /* ---------- utilità ---------- */
  function esc(s){
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }
  function dataIt(iso){
    if (!iso) return "";
    const [a, m, g] = String(iso).slice(0,10).split("-");
    return `${g}/${m}/${a}`;
  }
  function dataOraIt(iso){
    if (!iso) return "";
    return new Date(iso).toLocaleString("it-IT", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }
  function giornoLungo(iso){
    return new Date(iso + "T00:00:00").toLocaleDateString("it-IT", { weekday:"long", day:"numeric", month:"long" });
  }
  // stesso controllo di cf_valido() sul database
  function cfValido(cf){
    if (!/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/.test(cf || "")) return false;
    const dispari = [1,0,5,7,9,13,15,17,19,21,2,4,18,20,11,3,6,8,12,14,16,10,22,25,24,23];
    let s = 0;
    for (let i = 0; i < 15; i++){
      const c = cf[i];
      const v = /[0-9]/.test(c) ? c.charCodeAt(0) - 48 : c.charCodeAt(0) - 65;
      s += (i % 2 === 0) ? dispari[v] : v;
    }
    return cf[15] === String.fromCharCode(65 + s % 26);
  }
  function pulisciCf(v){ return String(v || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(0, 16); }
  function messaggioErrore(err){
    const m = (err && err.message) ? err.message : "";
    if (/Failed to fetch|NetworkError|network/i.test(m)) return "Connessione assente o instabile. Controlla la rete e riprova: i dati inseriti restano salvati su questo telefono.";
    return m || "Si è verificato un errore. Riprova tra qualche minuto.";
  }

  /* ---------- bozza locale (localStorage, solo su questo dispositivo) ---------- */
  function salvaBozza(){
    try{
      localStorage.setItem(CHIAVE_BOZZA, JSON.stringify({ volontari, mezzi, materiali, form: formAperto ? leggiForm() : null, modifica, salvata: Date.now() }));
    }catch(e){ /* storage non disponibile: si continua senza bozza */ }
  }
  function leggiBozza(){
    try{ const v = localStorage.getItem(CHIAVE_BOZZA); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  }
  function cancellaBozza(){
    try{ localStorage.removeItem(CHIAVE_BOZZA); }catch(e){}
  }
  function normalizzaVolontari(lista){
    return (lista || []).map(v => ({
      cognome: v.cognome || "", nome: v.nome || "", codice_fiscale: v.codice_fiscale || "",
      cellulare: v.cellulare || "", note: v.note || null,
      patenti: v.patenti || [], abilitazioni: v.abilitazioni || [],
      esigenze: v.esigenze || [], esigenze_note: v.esigenze_note || null,
      servizi: (v.servizi || []).map(Number),
      tipologia: v.tipologia || null, art39: !!v.art39,
      // orari per giornata di disponibilità: { "id servizio": { dalle, alle } }; assente = giornata intera
      orari: Object.fromEntries(Object.entries(v.orari || {}).map(([k, o]) => [String(k), { dalle:o.dalle, alle:o.alle }]))
    }));
  }
  function normalizzaMezzi(lista){
    return (lista || []).map(m => ({ tipo: m.tipo || "", targa: m.targa || "", note: m.note || "", giorni: (m.giorni || []).map(String) }));
  }
  function normalizzaMateriali(lista){
    return (lista || []).map(m => ({ quantita: m.quantita === null || m.quantita === undefined ? "" : String(m.quantita), descrizione: m.descrizione || "", note: m.note || "" }));
  }
  function stessoElenco(a, b){ return JSON.stringify(a) === JSON.stringify(b); }

  /* ---------- caricamento ---------- */
  async function carica(){
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token)){
      return mostraBlocco("Link non valido", "Il link che hai aperto non è completo. Usa il link ricevuto per mail dal Polo Logistico, oppure chiedine uno nuovo.", "errore");
    }
    const { data, error } = await sb.rpc("adesione_get", { p_token: token });
    if (error) return mostraBlocco("Impossibile aprire l'adesione", messaggioErrore(error), "errore");
    dati = data;

    const inviati = { volontari: normalizzaVolontari(dati.volontari), mezzi: normalizzaMezzi(dati.mezzi), materiali: normalizzaMateriali(dati.materiali) };
    const bozza = dati.modificabile ? leggiBozza() : null;
    if (!dati.modificabile) cancellaBozza();

    const daBozza = bozza ? { volontari: normalizzaVolontari(bozza.volontari), mezzi: normalizzaMezzi(bozza.mezzi || dati.mezzi), materiali: normalizzaMateriali(bozza.materiali || dati.materiali) } : null;
    if (bozza && (!stessoElenco(daBozza, inviati) || bozza.form)){
      ({ volontari, mezzi, materiali } = daBozza);
      if (bozza.form){ formAperto = true; formBozza = bozza.form; modifica = bozza.modifica ?? null; }
      vista = "elenco";
      disegna({ bozzaRipresa: true });
      return;
    }
    ({ volontari, mezzi, materiali } = inviati);
    vista = !dati.modificabile ? "chiuso" : (dati.stato_sezione === "in_attesa" ? "elenco" : "conferma");
    disegna();
  }

  function mostraBlocco(titolo, testo, tipo){
    barra.style.display = "none";
    app.innerHTML = `
      <div class="messaggio msg-${tipo}"><h2>${esc(titolo)}</h2>${esc(testo)}</div>`;
  }

  // "esercitazione" | "emergenza": stessa pagina, testi diversi
  function nomeTipo(){ return dati.attivazione.tipo === "emergenza" ? "Emergenza" : "Esercitazione"; }
  function periodo(e){
    if (!e.data_fine) return `dal ${dataIt(e.data_inizio)} (in corso)`;
    return e.data_fine !== e.data_inizio ? `${dataIt(e.data_inizio)} – ${dataIt(e.data_fine)}` : dataIt(e.data_inizio);
  }

  /* ---------- disegno ---------- */
  function testata(){
    const e = dati.attivazione;
    const date = periodo(e);
    return `
      <div class="testata">
        <div class="org">${nomeTipo()} ${esc(ENTI[e.ente] || e.ente)}</div>
        <h1>${esc(e.titolo)}</h1>
        <div class="riga">📅 ${esc(date)}</div>
        ${e.luogo ? `<div class="riga">📍 ${esc(e.luogo)}</div>` : ""}
        ${e.chiusura_adesioni ? `<div class="riga">⏳ Adesioni entro il ${esc(dataOraIt(e.chiusura_adesioni))}</div>` : ""}
        <div class="sezione">Sezione ${esc(dati.sezione)}</div>
      </div>
      ${e.descrizione ? `<div class="scheda"><p class="aiuto" style="margin:0;white-space:pre-line;color:var(--grigio-800);">${esc(e.descrizione)}</p></div>` : ""}`;
  }

  // Campi configurati sull'evento: non_richiesto | facoltativo | obbligatorio
  // come sul DB: campo assente = facoltativo, tranne quelli in NON_RICHIESTI_SE_ASSENTI
  function livello(k){ return (dati.campi && dati.campi[k]) || (NON_RICHIESTI_SE_ASSENTI.includes(k) ? "non_richiesto" : "facoltativo"); }
  function emergenza(){ return dati.attivazione.tipo === "emergenza"; }
  // giorni selezionabili per i mezzi: le giornate di disponibilità (o, se non ci sono, tutti i giorni della griglia)
  function giorniMezzi(){
    const disp = (dati.servizi || []).filter(s => s.tipo === "disponibile").map(s => s.giorno);
    return [...new Set(disp.length ? disp : (dati.servizi || []).map(s => s.giorno))];
  }
  function giornoBreve(iso){
    return new Date(iso + "T00:00:00").toLocaleDateString("it-IT", { weekday:"short", day:"2-digit", month:"2-digit" });
  }
  function esigenzeConNota(){ return (dati.esigenze || []).filter(e => e.con_nota).map(e => e.nome); }
  // pernotto della notte X → colazione del giorno X+1 (se prevista)
  function colazioneDopo(servizioPernotto){
    const d = new Date(servizioPernotto.giorno + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + 1);
    const g = d.toISOString().slice(0, 10);
    return (dati.servizi || []).find(s => s.giorno === g && s.tipo === "colazione");
  }
  function attivo(k){ return livello(k) !== "non_richiesto"; }
  function obblig(k){ return livello(k) === "obbligatorio"; }
  function asterisco(k){ return obblig(k) ? " *" : ""; }

  function servizioPerId(id){ return (dati.servizi || []).find(s => s.id === id); }
  function riassuntoServizi(v){
    const s = v.servizi.map(servizioPerId).filter(Boolean);
    const giornate = s.filter(x => x.tipo === "disponibile").sort((a, b) => a.giorno.localeCompare(b.giorno))
      .map(x => giornoBreve(x.giorno) + (v.orari && v.orari[x.id] ? ` ${v.orari[x.id].dalle}–${v.orari[x.id].alle}` : ""));
    const pasti = s.filter(x => x.tipo !== "pernotto" && x.tipo !== "disponibile").length;
    const notti = s.filter(x => x.tipo === "pernotto").length;
    return [giornate.join(", "), pasti ? `${pasti} past${pasti === 1 ? "o" : "i"}` : "", notti ? `${notti} nott${notti === 1 ? "e" : "i"}` : ""].filter(Boolean).join(", ") || "nessun servizio";
  }
  // Dettaglio di un volontario: solo i campi attivi
  function dettaglioVolontario(v, conCf){
    const parti = [];
    if (attivo("tipologia") && v.tipologia) parti.push(v.tipologia);
    if (conCf) parti.push(v.codice_fiscale);
    if (attivo("art39") && v.art39) parti.push("art. 39");
    if (attivo("servizi") && (dati.servizi || []).length) parti.push(riassuntoServizi(v));
    if (attivo("patenti") && v.patenti.length) parti.push("Patenti " + v.patenti.join(", "));
    if (attivo("abilitazioni") && v.abilitazioni.length) parti.push(v.abilitazioni.join(", "));
    if (attivo("esigenze") && v.esigenze.length) parti.push("🍽 " + v.esigenze.join(", "));
    return parti.join(" · ");
  }

  function disegna(opz){
    opz = opz || {};
    if (vista === "chiuso") return disegnaChiuso();
    if (vista === "conferma") return disegnaConferma(opz);
    disegnaElenco(opz);
  }

  function disegnaChiuso(){
    barra.style.display = "none";
    const e = dati.attivazione;
    const motivo = e.stato === "aperta" ? "Il termine per le adesioni è scaduto." : "Le adesioni per questo evento sono chiuse.";
    let riepilogo = "";
    if (dati.stato_sezione === "risposto") riepilogo = `La vostra Sezione ha inviato l'adesione per <strong>${volontari.length}</strong> volontari${dati.risposto_at ? ` (${esc(dataOraIt(dati.risposto_at))})` : ""}.`;
    else if (dati.stato_sezione === "non_partecipa") riepilogo = "La vostra Sezione ha indicato che non partecipa.";
    else riepilogo = "La vostra Sezione non ha inviato l'adesione.";
    app.innerHTML = testata() + `
      <div class="messaggio msg-avviso"><h2>Adesioni chiuse</h2>${esc(motivo)}<br>${riepilogo}<br>Per modifiche contattate il Polo Logistico.</div>`;
  }

  function disegnaConferma(opz){
    barra.style.display = "none";
    const nonPartecipa = dati.stato_sezione === "non_partecipa";
    const pasti = volontari.reduce((n, v) => n + v.servizi.map(servizioPerId).filter(s => s && s.tipo !== "pernotto" && s.tipo !== "disponibile").length, 0);
    const notti = volontari.reduce((n, v) => n + v.servizi.map(servizioPerId).filter(s => s && s.tipo === "pernotto").length, 0);
    const conPasti = (dati.servizi || []).some(s => s.tipo !== "disponibile");
    app.innerHTML = testata() + `
      <div class="messaggio msg-ok">
        <h2>${opz.appenaInviato ? "Grazie, adesione ricevuta!" : (nonPartecipa ? "Risposta registrata" : "Adesione inviata")}</h2>
        ${nonPartecipa ? "Avete indicato che la Sezione <strong>non partecipa</strong>." : `Volontari iscritti: <strong>${volontari.length}</strong>.`}
        ${dati.risposto_at ? `<br><span style="font-size:12.5px;">Ultimo invio: ${esc(dataOraIt(dati.risposto_at))}</span>` : ""}
      </div>
      ${nonPartecipa ? "" : `
      <div class="scheda">
        <h2>Riepilogo</h2>
        <div class="riepilogo-num">
          <div><strong>${volontari.length}</strong><span>volontari</span></div>
          ${attivo("servizi") && conPasti ? `
          <div><strong>${pasti}</strong><span>pasti</span></div>
          <div><strong>${notti}</strong><span>pernotti</span></div>` : ""}
          ${attivo("mezzi") ? `<div><strong>${mezzi.length}</strong><span>mezzi</span></div>` : ""}
          ${attivo("materiali") ? `<div><strong>${materiali.length}</strong><span>materiali</span></div>` : ""}

  /* ---------- mezzi e materiali (emergenze): righe modificabili sul posto ---------- */

  function htmlMateriali(){
    return `

        <h2>Materiali della Sezione (${materiali.length})</h2>
        <p class="aiuto">Materiali messi a disposizione (es. motopompe, gruppi elettrogeni, tende).</p>
        ${materiali.map((m, i) => `
          <div class="riga-elenco" data-materiale="${i}">
            <label class="campo">Quantità *</label>
            <input class="testo" data-campo="quantita" type="number" inputmode="numeric" min="1" max="10000" value="${esc(m.quantita)}">
            <label class="campo">Descrizione *</label>
            <input class="testo" data-campo="descrizione" maxlength="150" autocomplete="off" value="${esc(m.descrizione)}">
            <label class="campo">Note</label>
            <input class="testo" data-campo="note" maxlength="300" autocomplete="off" value="${esc(m.note)}">

        <div class="azioni"><button type="button" class="secondario" id="btn-agg-materiale">+ Aggiungi materiale</button></div>
      </div>`;

  function collegaMezziMateriali(){
    app.querySelectorAll("[data-mezzo]").forEach(r => {
      const m = mezzi[parseInt(r.dataset.mezzo, 10)];
      r.querySelectorAll("input[data-campo]").forEach(inp => inp.addEventListener("input", () => { m[inp.dataset.campo] = inp.value; salvaBozza(); }));
      r.querySelectorAll(".pill[data-giorno]").forEach(p => p.addEventListener("click", () => {
        const on = !p.classList.contains("on");
        p.classList.toggle("on", on); p.setAttribute("aria-pressed", on);
        m.giorni = on ? [...m.giorni, p.dataset.giorno].sort() : m.giorni.filter(g => g !== p.dataset.giorno);
        salvaBozza();
      }));
    });
    app.querySelectorAll("[data-materiale]").forEach(r => {
      const m = materiali[parseInt(r.dataset.materiale, 10)];
      r.querySelectorAll("input[data-campo]").forEach(inp => inp.addEventListener("input", () => { m[inp.dataset.campo] = inp.value; salvaBozza(); }));
    });
    app.querySelectorAll("[data-togli-mezzo]").forEach(b => b.addEventListener("click", () => {
      mezzi.splice(parseInt(b.dataset.togliMezzo, 10), 1); salvaBozza(); disegna();
    }));
    app.querySelectorAll("[data-togli-materiale]").forEach(b => b.addEventListener("click", () => {
      materiali.splice(parseInt(b.dataset.togliMateriale, 10), 1); salvaBozza(); disegna();
    }));
    const aggM = document.getElementById("btn-agg-mezzo");
    if (aggM) aggM.addEventListener("click", () => {
      if (mezzi.length >= MAX_MEZZI){ alert(`Si possono indicare al massimo ${MAX_MEZZI} mezzi.`); return; }
      mezzi.push({ tipo:"", targa:"", note:"", giorni: giorniMezzi() }); salvaBozza(); disegna();
    });
    const aggMt = document.getElementById("btn-agg-materiale");
    if (aggMt) aggMt.addEventListener("click", () => {
      if (materiali.length >= MAX_MATERIALI){ alert(`Si possono indicare al massimo ${MAX_MATERIALI} materiali.`); return; }
      materiali.push({ quantita:"1", descrizione:"", note:"" }); salvaBozza(); disegna();
    });
  }
  // righe del tutto vuote = ignorate; ritorna { mezzi, materiali, errori[] } pronti per adesione_salva
  function preparaMezziMateriali(){
    const errori = [];
    const outMezzi = mezzi.filter(m => m.tipo.trim() || m.targa.trim() || m.note.trim()).map((m, i) => {
      if (!m.tipo.trim()) errori.push(`Mezzo n. ${i + 1}: indicate il tipo di mezzo.`);
      return { tipo: m.tipo.trim(), targa: m.targa.replace(/\s/g, "").toUpperCase() || null, note: m.note.trim() || null, giorni: m.giorni };
    });
    const outMat = materiali.filter(m => String(m.quantita).trim() || m.descrizione.trim() || m.note.trim()).map((m, i) => {
      const q = Number(m.quantita);
      if (!m.descrizione.trim()) errori.push(`Materiale n. ${i + 1}: indicate la descrizione.`);
      if (!Number.isInteger(q) || q < 1 || q > 10000) errori.push(`Materiale n. ${i + 1}: la quantità deve essere un numero da 1 a 10000.`);
      return { quantita: q, descrizione: m.descrizione.trim(), note: m.note.trim() || null };
    });
    return { mezzi: outMezzi, materiali: outMat, errori };
  }

  /* ---------- Excel: modello e caricamento (modulo esercitazioni-excel.js) ---------- */
  function configExcel(){
    const e = dati.attivazione;
    return {
      titolo: e.titolo, tipoNome: nomeTipo(), sezione: dati.sezione,
      date: periodo(e),
      campi: dati.campi || {}, patenti: dati.patenti || [], abilitazioni: dati.abilitazioni || [], tipologie: dati.tipologie || [],
      servizi: dati.servizi || [], esigenze: dati.esigenze || [], volontari, maxVolontari: MAX_VOLONTARI
    };
  }

  function collegaExcel(){
    const bModello = document.getElementById("btn-modello-excel");
    const bCarica = document.getElementById("btn-carica-excel");
    const input = document.getElementById("input-excel");
    const box = document.getElementById("anteprima-excel");
    if (!bModello || !window.EsercitazioniExcel) return;

    bModello.addEventListener("click", async () => {
      bModello.disabled = true;
      try{ await window.EsercitazioniExcel.scaricaModello(configExcel()); }
      catch(e){ alert(messaggioErrore(e)); }
      bModello.disabled = false;
    });
    bCarica.addEventListener("click", () => input.click());
    input.addEventListener("change", async () => {
      const file = input.files[0];
      input.value = "";
      if (!file) return;
      box.innerHTML = `<div class="aiuto">Lettura del file…</div>`;
      let esito;
      try{ esito = await window.EsercitazioniExcel.leggiFile(file, configExcel()); }
      catch(e){ box.innerHTML = `<div class="messaggio msg-errore">${esc(messaggioErrore(e))}</div>`; return; }
      const validi = esito.righe.filter(r => !r.errori.length).map(r => r.volontario);
      box.innerHTML = window.EsercitazioniExcel.htmlAnteprima(esito) + (validi.length ? `
        <div class="azioni">
          <button class="secondario" id="btn-excel-annulla">Annulla</button>
          <button class="primario" id="btn-excel-aggiungi">Aggiungi ${validi.length} all'elenco</button>
        </div>` : "");
      box.scrollIntoView({ behavior:"smooth", block:"start" });
      const annulla = document.getElementById("btn-excel-annulla");
      if (annulla) annulla.addEventListener("click", () => { box.innerHTML = ""; });
      const aggiungi = document.getElementById("btn-excel-aggiungi");
      if (aggiungi) aggiungi.addEventListener("click", () => uniscidaExcel(validi));
    });
  }

  // I volontari del file entrano nell'elenco: stesso CF = aggiornato, altrimenti aggiunto.
  // Chi è in elenco ma non nel file resta (si toglie a mano).
  function uniscidaExcel(validi){
    const nuovi = validi.filter(v => !volontari.some(x => x.codice_fiscale === v.codice_fiscale)).length;
    if (volontari.length + nuovi > MAX_VOLONTARI){
      alert(`Con questo file l'elenco supererebbe ${MAX_VOLONTARI} volontari.`);
      return;
    }
    let aggiornati = 0;
    validi.forEach(letto => {
      const v = normalizzaVolontari([letto])[0];
      const i = volontari.findIndex(x => x.codice_fiscale === v.codice_fiscale);
      if (i < 0){ volontari.push(v); return; }
      const prec = volontari[i];
      volontari[i] = {
        ...v,
        // tipologia e art. 39 solo se nel modello; gli orari non ci sono: restano quelli inseriti, sulle giornate ancora scelte
        tipologia: attivo("tipologia") ? v.tipologia : prec.tipologia,
        art39: attivo("art39") ? v.art39 : prec.art39,
        orari: Object.fromEntries(Object.entries(prec.orari || {}).filter(([k]) => v.servizi.includes(Number(k)))),
        // campi non presenti nel modello (non richiesti): si conserva quanto già inserito
        cellulare: attivo("cellulare") ? v.cellulare : prec.cellulare,
        patenti: attivo("patenti") ? v.patenti : prec.patenti,
        abilitazioni: attivo("abilitazioni") ? v.abilitazioni : prec.abilitazioni,
        servizi: attivo("servizi") ? v.servizi : prec.servizi,
        esigenze: attivo("esigenze") ? v.esigenze : prec.esigenze,
        esigenze_note: attivo("esigenze") ? v.esigenze_note : prec.esigenze_note,
        note: attivo("note") ? v.note : prec.note
      };
      aggiornati++;
    });
    volontari.sort((a, b) => a.cognome.localeCompare(b.cognome) || a.nome.localeCompare(b.nome));
    salvaBozza();
    disegna({ info: `Dal file: ${nuovi} volontari aggiunti, ${aggiornati} aggiornati. Controllate l'elenco e premete "Invia adesione" per confermare.` });
  }

  /* ---------- form volontario ---------- */
  function apriForm(indice){
    if (indice === null && volontari.length >= MAX_VOLONTARI){
      alert(`Si possono inserire al massimo ${MAX_VOLONTARI} volontari.`);

    disegna();
    salvaBozza();
    const box = document.getElementById("box-form");
    if (box) box.scrollIntoView({ behavior:"smooth", block:"start" });
  }

        ${attivo("esigenze") && (dati.esigenze || []).length ? `
          <label class="campo">Esigenze alimentari</label>
          <div class="pulsanti">${pills((dati.esigenze || []).map(e => e.nome), v.esigenze, "esigenze")}</div>
          <label class="campo" for="f-esig-note">Nota esigenze alimentari${esigenzeConNota().length ? ` <span style="font-weight:400;color:var(--grigio-600);">(obbligatoria per ${esc(esigenzeConNota().join(" e ").toLowerCase())})</span>` : ""}</label>
          <input class="testo" id="f-esig-note" name="esigenze_note" autocomplete="off" maxlength="300" placeholder="es. allergico alle arachidi" value="${esc(v.esigenze_note || "")}">` : ""}
        <div class="errore-campo" id="err-form" style="margin-top:10px;"></div>
        <div class="azioni">
          <button type="button" class="secondario" id="btn-annulla-form">Annulla</button>
          <button type="submit" class="primario">${modifica === null ? "Aggiungi all'elenco" : "Salva"}</button>
        </div>
      </form>`;
    const form = document.getElementById("form-volontario");
    const cf = document.getElementById("f-cf");

    cf.addEventListener("input", () => {
      const pos = cf.selectionStart;
      cf.value = pulisciCf(cf.value);
      try{ cf.setSelectionRange(pos, pos); }catch(e){}
      const err = document.getElementById("err-cf");
      err.textContent = cf.value.length === 16 && !cfValido(cf.value) ? "Codice fiscale non valido: controlla i caratteri." : "";
    });
    const accendi = (p, on) => { p.classList.toggle("on", on); p.setAttribute("aria-pressed", on); };
    form.querySelectorAll(".pill[data-gruppo]").forEach(p => p.addEventListener("click", () => {
      accendi(p, !p.classList.contains("on"));
      // pernotto della notte X spuntato → colazione del giorno X+1 spuntata (resta modificabile)
      if (p.dataset.gruppo === "servizi" && p.classList.contains("on")){
        const s = servizioPerId(Number(p.dataset.valore));
        const col = s && s.tipo === "pernotto" ? colazioneDopo(s) : null;
        const pCol = col ? form.querySelector(`.pill[data-gruppo="servizi"][data-valore="${col.id}"]`) : null;
        if (pCol) accendi(pCol, true);
      }
      salvaBozza();
    }));
    // scelta singola (tipologia) o sì/no (art. 39): ripremere la voce accesa la spegne
    form.querySelectorAll(".pill[data-unico]").forEach(p => p.addEventListener("click", () => {
      const on = !p.classList.contains("on");
      form.querySelectorAll(`.pill[data-unico="${p.dataset.unico}"]`).forEach(x => accendi(x, false));
      accendi(p, on);
      salvaBozza();
    }));
    // scrivere un orario seleziona anche la giornata
    form.querySelectorAll("input[data-ora]").forEach(inp => inp.addEventListener("change", () => {
      const p = form.querySelector(`.pill[data-gruppo="servizi"][data-valore="${inp.dataset.servizio}"]`);
      if (inp.value && p) accendi(p, true);
    }));
    const tutti = document.getElementById("btn-tutti-servizi");
    if (tutti) tutti.addEventListener("click", () => {
      const pills = [...form.querySelectorAll('.pill[data-gruppo="servizi"]')];
      const accendi = pills.some(p => !p.classList.contains("on"));
      pills.forEach(p => { p.classList.toggle("on", accendi); p.setAttribute("aria-pressed", accendi); });
      salvaBozza();
    });
    form.querySelectorAll("input").forEach(i => i.addEventListener("change", salvaBozza));
    document.getElementById("btn-annulla-form").addEventListener("click", chiudiForm);
    form.addEventListener("submit", (ev) => { ev.preventDefault(); confermaForm(); });
  }

  function leggiForm(){
    const form = document.getElementById("form-volontario");
    if (!form) return formBozza;
    const scelti = g => [...form.querySelectorAll(`.pill.on[data-gruppo="${g}"]`)].map(p => p.dataset.valore);
    const unico = g => { const p = form.querySelector(`.pill.on[data-unico="${g}"]`); return p ? p.dataset.valore : null; };
    const precedente = modifica !== null ? volontari[modifica] : null;
    const servizi = attivo("servizi") ? scelti("servizi").map(Number) : (precedente ? precedente.servizi : []);
    // orari: solo sulle giornate scelte e con almeno un orario scritto (i casi incompleti li segnala erroriVolontario)
    const orari = {};
    if (attivo("orari")) form.querySelectorAll('input[data-ora="dalle"]').forEach(inp => {
      const alle = form.querySelector(`input[data-ora="alle"][data-servizio="${inp.dataset.servizio}"]`);
      if (!servizi.includes(Number(inp.dataset.servizio)) || (!inp.value && !alle.value)) return;
      orari[inp.dataset.servizio] = { dalle: inp.value, alle: alle.value };
    });
    // campi non richiesti: si conserva il valore precedente (il server li ignora comunque)
    return {
      tipologia: attivo("tipologia") ? unico("tipologia") : (precedente ? precedente.tipologia : null),
      art39: attivo("art39") ? unico("art39") === "si" : (precedente ? precedente.art39 : false),
      orari: attivo("orari") ? orari : (precedente ? precedente.orari : {}),
      cognome: form.cognome.value.trim().toUpperCase(),
      nome: form.nome.value.trim().toUpperCase(),
      codice_fiscale: pulisciCf(form.codice_fiscale.value),
      cellulare: form.cellulare ? form.cellulare.value.trim() : (precedente ? precedente.cellulare : ""),
      patenti: attivo("patenti") ? scelti("patenti") : (precedente ? precedente.patenti : []),
      abilitazioni: attivo("abilitazioni") ? scelti("abilitazioni") : (precedente ? precedente.abilitazioni : []),
      servizi,
      esigenze: form.esigenze_note ? scelti("esigenze") : (precedente ? (precedente.esigenze || []) : []),
      esigenze_note: form.esigenze_note ? (form.esigenze_note.value.trim() || null) : (precedente ? precedente.esigenze_note : null),
      note: form.note ? (form.note.value.trim() || null) : (precedente ? precedente.note : null)
    };
  }

  // Controlli lato client (gli stessi li ripete il server in adesione_salva)
  function erroriVolontario(v){
    const errori = [];
    if (!v.cognome || !v.nome) errori.push("Cognome e nome sono obbligatori.");
    if (!cfValido(v.codice_fiscale)) errori.push("Il codice fiscale non è valido.");
    if (obblig("cellulare") && !v.cellulare) errori.push("Il cellulare è obbligatorio.");
    if (obblig("note") && !v.note) errori.push("Le note sono obbligatorie.");
    if (obblig("patenti") && !v.patenti.length) errori.push("Indicate almeno una patente.");
    if (obblig("abilitazioni") && !v.abilitazioni.length) errori.push("Indicate almeno un'abilitazione.");
    if (obblig("tipologia") && !v.tipologia) errori.push("Indicate la tipologia.");
    if (obblig("servizi") && (dati.servizi || []).length && !v.servizi.length)
      errori.push(emergenza() ? "Indicate almeno una giornata di disponibilità." : "Indicate almeno un pasto o pernotto.");
    Object.entries(v.orari || {}).forEach(([id, o]) => {
      const s = servizioPerId(Number(id));
      const giorno = s ? giornoBreve(s.giorno) : "";
      if (!o.dalle || !o.alle) errori.push(`${giorno}: indicate l'ora di inizio e di fine, oppure lasciatele vuote per la giornata intera.`);
      else if (o.dalle === o.alle) errori.push(`${giorno}: inizio e fine non possono coincidere.`);
    });
    if (attivo("esigenze") && (v.esigenze || []).some(e => esigenzeConNota().includes(e)) && !v.esigenze_note)
      errori.push("Descrivete l'esigenza alimentare nella nota (es. a cosa è allergico).");
    return errori;
  }

  function confermaForm(){
    const v = leggiForm();
    const err = document.getElementById("err-form");
    const errori = erroriVolontario(v);
    if (volontari.some((x, i) => i !== modifica && x.codice_fiscale === v.codice_fiscale)) errori.push("Questo codice fiscale è già nell'elenco.");
    if (errori.length){ err.textContent = errori.join(" "); return; }
    if (modifica === null) volontari.push(v); else volontari[modifica] = v;
    volontari.sort((a, b) => a.cognome.localeCompare(b.cognome) || a.nome.localeCompare(b.nome));
    chiudiForm();
  }

  /* ---------- invio ---------- */
  async function invia(){
    if (invioInCorso) return;
    if (formAperto){ alert("Completate o annullate prima il volontario che state inserendo."); return; }
    const conMezzi = attivo("mezzi"), conMateriali = attivo("materiali");
    const mm = preparaMezziMateriali();
    if (mm.errori.length){ alert(mm.errori.join("\n")); return; }
    const nMezzi = conMezzi ? mm.mezzi.length : 0, nMateriali = conMateriali ? mm.materiali.length : 0;
    if (!volontari.length && !nMezzi && !nMateriali){ alert('Inserite almeno un volontario, oppure usate "La Sezione non partecipa".'); return; }
    if (volontari.length > MAX_VOLONTARI){ alert(`Si possono inviare al massimo ${MAX_VOLONTARI} volontari.`); return; }
    const cosa = [`${volontari.length} volontari`, conMezzi ? `${nMezzi} mezzi` : "", conMateriali ? `${nMateriali} materiali` : ""].filter(Boolean).join(", ");
    if (!confirm(`Inviare l'adesione con ${cosa}?`)) return;
    // orari solo sulle giornate scelte (il server rifiuta orari su giornate non scelte)
    const elenco = volontari.map(v => ({ ...v, orari: Object.fromEntries(Object.entries(v.orari || {}).filter(([k]) => v.servizi.includes(Number(k)))) }));
    const dato = conMezzi || conMateriali
      ? { volontari: elenco, ...(conMezzi ? { mezzi: mm.mezzi } : {}), ...(conMateriali ? { materiali: mm.materiali } : {}) }
      : elenco;
    await esegui("adesione_salva", { p_token: token, p_volontari: dato });
  }

  async function nonPartecipa(){
    if (invioInCorso) return;
    const testo = volontari.length || mezzi.length || materiali.length || dati.stato_sezione === "risposto"
      ? `Confermate che la Sezione NON partecipa? L'elenco dei volontari${attivo("mezzi") || attivo("materiali") ? ", dei mezzi e dei materiali" : ""} inviato finora verrà cancellato.`
      : `Confermate che la Sezione NON partecipa a questa ${nomeTipo().toLowerCase()}?`;
    if (!confirm(testo)) return;
    await esegui("adesione_nessuna", { p_token: token });
  }

  async function esegui(funzione, parametri){
    invioInCorso = true;
    const bInvia = document.getElementById("btn-invia");
    const bNo = document.getElementById("btn-non-partecipa");
    bInvia.disabled = bNo.disabled = true;
    const testoInvia = bInvia.textContent;
    bInvia.textContent = "Invio…";
    const { error } = await sb.rpc(funzione, parametri);
    bInvia.disabled = bNo.disabled = false;
    bInvia.textContent = testoInvia;
    invioInCorso = false;
    if (error){
      disegna({ errore: messaggioErrore(error) });
      return;
    }
    cancellaBozza();
    const { data, error: errGet } = await sb.rpc("adesione_get", { p_token: token });
    if (errGet) return mostraBlocco("Adesione inviata", "L'invio è riuscito, ma non è stato possibile ricaricare il riepilogo. Riaprite il link per vederlo.", "ok");
    dati = data;
    volontari = normalizzaVolontari(dati.volontari);
    mezzi = normalizzaMezzi(dati.mezzi);
    materiali = normalizzaMateriali(dati.materiali);
    vista = dati.modificabile ? "conferma" : "chiuso";
    disegna({ appenaInviato: true });
    window.scrollTo(0, 0);
  }

  document.getElementById("btn-invia").addEventListener("click", invia);
  document.getElementById("btn-non-partecipa").addEventListener("click", nonPartecipa);
  window.addEventListener("pagehide", () => { if (dati && dati.modificabile && vista === "elenco") salvaBozza(); });

  carica().catch(err => mostraBlocco("Impossibile aprire l'adesione", messaggioErrore(err), "errore"));
})();
</script>
