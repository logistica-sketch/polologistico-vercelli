<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firma Documenti, prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#e8ecf1;--panel:#ffffff;--panel-2:#f4f6f9;--ink:#13233a;--muted:#5a6a7f;--line:#d4dbe5;
  --blu-900:#0f2a4a;--blu-700:#173f6e;--blu-600:#1f5fa8;--blu-100:#e2ecf8;--focus:#1f5fa8;
  --danger:#b42318;--danger-100:#fde8e6;--ok:#2f7d4f;--ok-100:#e3f2e8;--warn:#8a5d00;--warn-100:#fff3d1;
  --desk:#cdd5df;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1420;--panel:#131e2d;--panel-2:#182537;--ink:#e5ecf5;--muted:#95a5ba;--line:#26374c;
    --blu-100:#18304f;--blu-600:#6aa5ec;--focus:#6aa5ec;
    --danger:#f97066;--danger-100:#3a1714;--ok:#5cc489;--ok-100:#14301f;--warn:#f2c14b;--warn-100:#342910;
    --desk:#0a111b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1420;--panel:#131e2d;--panel-2:#182537;--ink:#e5ecf5;--muted:#95a5ba;--line:#26374c;
  --blu-100:#18304f;--blu-600:#6aa5ec;--focus:#6aa5ec;
  --danger:#f97066;--danger-100:#3a1714;--ok:#5cc489;--ok-100:#14301f;--warn:#f2c14b;--warn-100:#342910;
  --desk:#0a111b;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blu-900)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.i{display:inline-flex;flex:none}
.i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* barra superiore */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:20px;padding:10px 20px;background:var(--blu-900);color:#fff}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--blu-900);display:grid;place-items:center}
.brand .mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand strong{display:block;font-size:16px;letter-spacing:-.01em}
.brand span{display:block;font-size:12.5px;color:#b9c9de}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:9px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;color:#d5e1f0;padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--blu-900)}
.docname{font-size:13px;color:#b9c9de;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* layout */
.main{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr) 310px}
.panel{background:var(--panel);overflow:auto;padding:18px 18px 28px}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.stage{overflow:auto;background:var(--desk);padding:28px 24px 40px}
.panel h3{font-size:13.5px;font-weight:700;margin:22px 0 10px;color:var(--ink)}
.panel h3:first-child{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 12px;cursor:pointer;text-align:left;font-size:14px;font-weight:500}
.btn:hover{background:var(--panel-2)}
.btn+.btn{margin-top:8px}
.btn.primary{background:var(--blu-600);border-color:var(--blu-600);color:#fff;font-weight:600;justify-content:center}
:root:not([data-theme="light"]) .btn.primary{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0c1420}}
:root[data-theme="dark"] .btn.primary{color:#0c1420}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.btn.danger:hover{background:var(--danger-100)}
.btn.big{padding:12px 14px;font-size:15px}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px;cursor:pointer;font-size:13.5px;font-weight:600}
.tool .i{color:var(--fc)}
.tool[aria-pressed="true"]{border-color:var(--fc);background:color-mix(in srgb,var(--fc) 10%,var(--panel));box-shadow:inset 0 0 0 1px var(--fc)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.hint.on{color:var(--blu-600);font-weight:600}

.flist{list-style:none;margin:0;padding:0}
.flist li+li{margin-top:2px}
.flist button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:6px;padding:6px 8px;cursor:pointer;text-align:left;font-size:13.5px}
.flist button:hover{background:var(--panel-2)}
.flist button[aria-current="true"]{background:var(--blu-100)}
.flist .i{color:var(--fc)}
.flist .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flist .pg{font-size:12px;color:var(--muted)}
.empty-list{font-size:13px;color:var(--muted)}

.t-text,.t-date{--fc:#1f5fa8}
.t-check{--fc:#2f7d4f}
.t-sign{--fc:#a86f00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .panel .t-text,:root:not([data-theme="light"]) .panel .t-date{--fc:#6aa5ec}:root:not([data-theme="light"]) .panel .t-check{--fc:#5cc489}:root:not([data-theme="light"]) .panel .t-sign{--fc:#f2b84b}}
:root[data-theme="dark"] .panel .t-text,:root[data-theme="dark"] .panel .t-date{--fc:#6aa5ec}
:root[data-theme="dark"] .panel .t-check{--fc:#5cc489}
:root[data-theme="dark"] .panel .t-sign{--fc:#f2b84b}

/* form proprietà */
.prop label{display:block;font-size:13px;font-weight:600;margin-bottom:12px}
.prop input[type=text],.prop input[type=number],.prop select,.recs select{display:block;width:100%;margin-top:5px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-weight:400;font-size:14px}
.prop .chk{display:flex;align-items:center;gap:8px;font-weight:500}
.prop .chk input{width:16px;height:16px;margin:0}
.pos{font-size:12.5px;color:var(--muted);margin:4px 0 14px}
.steps{margin:0;padding-left:20px;font-size:14px}
.steps li+li{margin-top:6px}
.recs label{display:block;font-size:13px;font-weight:600;margin-bottom:14px}

.meter{height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.meter span{display:block;height:100%;background:var(--ok);transition:width .25s}
.status{list-style:none;margin:12px 0 18px;padding:0}
.status button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:6px 4px;border-radius:6px;cursor:pointer;text-align:left;font-size:13.5px}
.status button:hover{background:var(--panel-2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line)}
.dot.ok{background:var(--ok)}
.dot.miss{background:var(--danger)}
.status .st{margin-left:auto;font-size:12px;color:var(--muted)}
.note{display:flex;gap:9px;font-size:12.5px;color:var(--muted);background:var(--panel-2);border-radius:8px;padding:10px 12px;margin-top:16px}
.note .i svg{width:17px;height:17px}

/* fogli */
#pages{max-width:820px;margin:0 auto}
.page{position:relative;width:100%;background:#fff;margin:0 auto 40px;box-shadow:0 1px 2px rgba(10,25,45,.25),0 10px 28px rgba(10,25,45,.16);color-scheme:light}
.page canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0}
.overlay.placing{cursor:crosshair}
.pnum{position:absolute;left:0;top:100%;margin-top:8px;font-size:12px;color:var(--muted)}
.loading,.empty{text-align:center;color:var(--muted);padding:60px 20px}

.field{position:absolute;--fc:#1f5fa8;border:1.5px dashed var(--fc);background:color-mix(in srgb,var(--fc) 9%,transparent);border-radius:3px;cursor:move;touch-action:none;font-family:Helvetica,Arial,sans-serif}
.field.t-check{--fc:#2f7d4f}
.field.t-sign{--fc:#a86f00}
.field .tag{position:absolute;left:-1.5px;bottom:100%;display:none;align-items:center;gap:4px;background:var(--fc);color:#fff;font:600 11px/1 "Public Sans",sans-serif;padding:4px 7px 3px;border-radius:4px 4px 0 0;white-space:nowrap;pointer-events:none;z-index:2}
.field .tag .i svg{width:12px;height:12px;stroke-width:2.2}
.field:hover .tag,.field.sel .tag{display:flex}
.field .ph{position:absolute;inset:0;display:flex;align-items:center;padding:0 3px;overflow:hidden;white-space:nowrap;color:color-mix(in srgb,var(--fc) 80%,#000);font-size:calc(var(--k,1) * var(--fs,10) * 1px);pointer-events:none;opacity:.85}
.field.t-sign .ph{justify-content:center;font:600 calc(var(--k,1) * 13px) "Public Sans",sans-serif}
.field.sel{border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--fc) 28%,transparent);z-index:3}
.field .handle{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:#fff;border:2px solid var(--fc);border-radius:3px;cursor:nwse-resize;display:none}
.field.sel .handle{display:block}

.cf{position:absolute;font-family:Helvetica,Arial,sans-serif}
.cf input{position:absolute;inset:0;width:100%;height:100%;border:0;border-bottom:1.5px solid #1f5fa8;background:rgba(31,95,168,.07);padding:0 3px;font-size:calc(var(--k,1) * var(--fs,10) * 1px);color:#0d1a40;border-radius:2px 2px 0 0}
.cf input:focus{background:rgba(31,95,168,.14);outline:none;box-shadow:0 0 0 2px #1f5fa8}
.cf .cb{position:absolute;inset:0;border:1.5px solid #2f7d4f;background:rgba(47,125,79,.08);border-radius:2px;cursor:pointer;padding:0;display:grid;place-items:center;color:#0d1a40}
.cf .cb svg{width:85%;height:85%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.cf .sg{position:absolute;inset:0;border:1.5px dashed #a86f00;background:rgba(168,111,0,.07);border-radius:3px;cursor:pointer;display:grid;place-items:center;font:600 calc(var(--k,1) * 12px) "Public Sans",sans-serif;color:#7a5200;padding:2px}
.cf .sg.done{border-style:solid;background:transparent;border-color:rgba(168,111,0,.35)}
.cf .sg img{max-width:100%;max-height:100%;display:block}
.cf.missing input,.cf.missing .cb,.cf.missing .sg{border-color:#b42318!important;box-shadow:0 0 0 2px rgba(180,35,24,.35)}

/* modale */
.modal{position:fixed;inset:0;z-index:20;background:rgba(6,15,28,.55);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border-radius:12px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.sheet h2{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.sheet p{margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.row .grow{flex:1}
.row .btn{width:auto}
.row .btn+.btn{margin-top:0}
.pad{position:relative;height:200px;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;color-scheme:light}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.pad .bl{position:absolute;left:24px;right:24px;bottom:46px;border-bottom:1px solid #c9d1dc;pointer-events:none}
.pad .x{position:absolute;left:24px;bottom:50px;color:#9aa6b6;font-size:18px;pointer-events:none}
.res{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:start;margin:14px 0}
.res .thumb{border:1px solid var(--line);background:#fff}
.res canvas{display:block;width:100%}
.res dl{margin:0;font-size:14px}
.res dt{color:var(--muted);font-size:12.5px}
.res dd{margin:0 0 10px;font-weight:600;word-break:break-all}
.res .hash{font:500 12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre.json{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:50vh;overflow:auto;margin:12px 0 0;white-space:pre}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--blu-900);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.mbar{display:none}

@media (max-width:960px){
  html,body{height:auto}
  body{display:block}
  .main{display:flex;flex-direction:column}
  .left,.right{border:0;border-bottom:1px solid var(--line)}
  .right{border-top:1px solid var(--line)}
  .stage{padding:20px 12px 28px}
  .top{flex-wrap:wrap;gap:10px 16px;padding:10px 14px}
  .docname{display:none}
  .seg{margin-left:0;width:100%}
  .seg button{flex:1}
  .mbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
  .mbar[hidden]{display:none}
  body.has-mbar{padding-bottom:76px}
  .res{grid-template-columns:110px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const VOLONTARI=[

];

/* ---------- render documento ---------- */
async function renderDoc(){
  const tok=++renderTok;const box=$('#pages');
  $('#docName').textContent=state.docName||'';
  box.innerHTML='<p class="loading">Sto preparando il documento…</p>';
  if(!window.pdfjsLib){box.innerHTML='<div class="empty">Il visualizzatore PDF non si è caricato. Ricarica la pagina.</div>';return;}
  let pdf;
  try{pdf=await pdfjsLib.getDocument({data:state.pdfBytes.slice(),isEvalSupported:false}).promise;}
  catch(e){box.innerHTML='<div class="empty">Questo file non si apre come PDF. Prova con un altro file o usa il modulo di esempio.</div>';return;}
  if(tok!==renderTok)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const avail=Math.min(($('#stage').clientWidth||800)-40,820);
  const items=[];state.pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);const v1=page.getViewport({scale:1});
    state.pages.push({w:v1.width,h:v1.height});
    const scale=Math.max(1,Math.min(3,(avail*dpr)/v1.width));const vp=page.getViewport({scale});
    const wrap=document.createElement('div');wrap.className='page';wrap.dataset.page=i-1;wrap.style.aspectRatio=v1.width+' / '+v1.height;
    const cv=document.createElement('canvas');cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
    const ov=document.createElement('div');ov.className='overlay';ov.dataset.page=i-1;ov.addEventListener('pointerdown',onOverlayDown);
    const n=document.createElement('div');n.className='pnum';n.textContent='Pagina '+i+' di '+pdf.numPages;
    wrap.append(cv,ov,n);items.push({wrap,page,vp,cv});
  }
  if(tok!==renderTok)return;
  box.innerHTML='';ro.disconnect();
  items.forEach(it=>{box.appendChild(it.wrap);ro.observe(it.wrap);});
  state.fields=state.fields.filter(f=>f.page<state.pages.length);
  renderFields();
  for(const it of items){if(tok!==renderTok)return;try{await it.page.render({canvasContext:it.cv.getContext('2d'),viewport:it.vp}).promise;}catch(e){}}
}

function ovOf(pi){return document.querySelector('.overlay[data-page="'+pi+'"]');}
function place(el,f){const p=state.pages[f.page];el.style.left=(f.x/p.w*100)+'%';el.style.top=(f.y/p.h*100)+'%';el.style.width=(f.w/p.w*100)+'%';el.style.height=(f.h/p.h*100)+'%';el.style.setProperty('--fs',f.size||10);}

function fieldEl(f){
  if(state.mode==='modello'){
    const el=document.createElement('div');el.className='field t-'+f.type+(state.sel===f.id?' sel':'');el.dataset.id=f.id;el.tabIndex=0;
    el.setAttribute('aria-label',TYPES[f.type].label+': '+f.name);
    const ph=f.type==='sign'?'Firma':f.type==='check'?'':srcLabel(f.source);
    el.innerHTML='<span class="tag">'+ic(TYPES[f.type].icon)+esc(f.name)+(f.required?' *':'')+'</span><span class="ph">'+esc(ph)+'</span><span class="handle" aria-hidden="true"></span>';
    el.addEventListener('focus',()=>{if(state.sel!==f.id)select(f.id);});
    place(el,f);return el;
  }
  const el=document.createElement('div');el.className='cf';el.dataset.id=f.id;place(el,f);
  const v=state.values[f.id];
  if(f.type==='text'||f.type==='date'){
    const inp=document.createElement('input');inp.type='text';inp.value=v||'';inp.setAttribute('aria-label',f.name);
    if(f.type==='date')inp.placeholder='gg/mm/aaaa';
    inp.addEventListener('input',()=>{state.values[f.id]=inp.value;el.classList.remove('missing');renderRight();});
    el.appendChild(inp);
  }else if(f.type==='check'){
    const b=document.createElement('button');b.type='button';b.className='cb';b.setAttribute('aria-pressed',v?'true':'false');b.setAttribute('aria-label',f.name);
    b.innerHTML=v?'<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>':'';
    b.addEventListener('click',()=>{state.values[f.id]=!state.values[f.id];refreshField(f);renderRight();});
    el.appendChild(b);
  }else{
    const b=document.createElement('button');b.type='button';b.className='sg'+(v?' done':'');b.setAttribute('aria-label',(v?'Rifai ':'Inserisci ')+f.name);
    b.innerHTML=v?'<img alt="" src="'+v+'">':'Tocca per firmare';
    b.addEventListener('click',()=>openSign(f));
    el.appendChild(b);
  }
  return el;
}
function renderFields(){
  document.querySelectorAll('.overlay').forEach(ov=>{ov.innerHTML='';ov.classList.toggle('placing',state.mode==='modello'&&!!state.tool);});
  state.fields.forEach(f=>{const ov=ovOf(f.page);if(ov)ov.appendChild(fieldEl(f));});
}
function refreshField(f){const old=document.querySelector('[data-id="'+f.id+'"]');const ov=ovOf(f.page);if(!ov)return;const n=fieldEl(f);if(old&&old.parentNode===ov)ov.replaceChild(n,old);else{if(old)old.remove();ov.appendChild(n);}}

/* ---------- interazione modello ---------- */
function onOverlayDown(e){
  if(state.mode!=='modello')return;
  const ov=e.currentTarget;const pi=+ov.dataset.page;const p=state.pages[pi];
  const r=ov.getBoundingClientRect();const k=r.width/p.w;
  const fe=e.target.closest('.field');
  if(fe){
    const f=getF(fe.dataset.id);if(!f)return;
    if(state.sel!==f.id)select(f.id);
    drag={f,el:fe,resize:e.target.classList.contains('handle'),sx:e.clientX,sy:e.clientY,ox:f.x,oy:f.y,ow:f.w,oh:f.h,k,p,moved:false};
    e.preventDefault();return;
  }
  if(state.tool){
    const t=TYPES[state.tool];const cx=(e.clientX-r.left)/k,cy=(e.clientY-r.top)/k;
    const src=state.tool==='date'?'sistema.oggi':'manuale';
    const count=state.fields.filter(x=>x.type===state.tool).length+1;
    const f={id:uid(),page:pi,type:state.tool,name:t.label+' '+count,source:src,x:Math.max(0,Math.min(p.w-t.w,cx-t.w/2)),y:Math.max(0,Math.min(p.h-t.h,cy-t.h/2)),w:t.w,h:t.h,size:10.5,required:state.tool==='sign'};
    state.fields.push(f);setTool(null);ov.appendChild(fieldEl(f));select(f.id);persist();
    e.preventDefault();return;
  }
  select(null);
}
window.addEventListener('pointermove',e=>{
  if(!drag)return;const d=drag;const dx=(e.clientX-d.sx)/d.k,dy=(e.clientY-d.sy)/d.k;
  if(Math.abs(dx)+Math.abs(dy)>.5)d.moved=true;
  const f=d.f,p=d.p;
  if(d.resize){
    if(f.type==='check'){const s=Math.max(8,Math.min(Math.min(p.w-f.x,p.h-f.y),d.ow+Math.max(dx,dy)));f.w=f.h=s;}
    else{f.w=Math.max(20,Math.min(p.w-f.x,d.ow+dx));f.h=Math.max(10,Math.min(p.h-f.y,d.oh+dy));}
  }else{f.x=Math.max(0,Math.min(p.w-f.w,d.ox+dx));f.y=Math.max(0,Math.min(p.h-f.h,d.oy+dy));}
  place(d.el,f);
});
window.addEventListener('pointerup',()=>{if(!drag)return;const m=drag.moved;drag=null;if(m){persist();renderRight();}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return;}
  if(state.mode!=='modello'||!state.sel)return;
  const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.tagName==='TEXTAREA'))return;
  const f=getF(state.sel);if(!f)return;const p=state.pages[f.page];const st=e.shiftKey?10:1;
  let mv=true;
  if(e.key==='ArrowLeft')f.x=Math.max(0,f.x-st);else if(e.key==='ArrowRight')f.x=Math.min(p.w-f.w,f.x+st);
  else if(e.key==='ArrowUp')f.y=Math.max(0,f.y-st);else if(e.key==='ArrowDown')f.y=Math.min(p.h-f.h,f.y+st);
  else if(e.key==='Delete'||e.key==='Backspace'){removeField(f.id);e.preventDefault();return;}
  else mv=false;
  if(mv){e.preventDefault();const el=document.querySelector('.field[data-id="'+f.id+'"]');if(el)place(el,f);persist();renderRight();}
});

function select(id){
  state.sel=id;
  document.querySelectorAll('.field').forEach(el=>el.classList.toggle('sel',el.dataset.id===id));
  renderLeft();renderRight();
}
function setTool(t){state.tool=t;document.querySelectorAll('.overlay').forEach(ov=>ov.classList.toggle('placing',!!t));renderLeft();}
function removeField(id){
  state.fields=state.fields.filter(f=>f.id!==id);delete state.values[id];
  const el=document.querySelector('[data-id="'+id+'"]');if(el)el.remove();
  state.sel=null;persist();renderLeft();renderRight();toast('Campo eliminato');
}

}
function isReady(f){const v=state.values[f.id];if(f.type==='check')return !!v;return !!(v&&String(v).trim());}

function renderRight(){
  const R=$('#right');

    if(f){

        '<label>Tipo<select id="pType">'+typeOpts+'</select></label>'+
        '<label>Dato collegato<select id="pSrc">'+sourceOptions(f)+'</select></label>'+
        ((f.type==='text'||f.type==='date')?'<label>Dimensione del testo<input type="number" id="pSize" min="6" max="24" step="0.5" value="'+f.size+'"></label>':'')+
        '<label class="chk"><input type="checkbox" id="pReq"'+(f.required?' checked':'')+'> Obbligatorio</label>'+
        '<p class="pos">Pagina '+(f.page+1)+', x '+r1(f.x)+', y '+r1(f.y)+', '+r1(f.w)+' × '+r1(f.h)+' pt. Trascina per spostare, usa l\u2019angolo per ridimensionare, frecce per rifinire.</p>'+
        '<button type="button" class="btn danger" id="pDel">'+ic('trash')+'Elimina il campo</button></div>';
      $('#pName').oninput=e=>{f.name=e.target.value;refreshField(f);persist();renderLeft();};
      $('#pType').onchange=e=>{
        f.type=e.target.value;const t=TYPES[f.type];

        const p=state.pages[f.page];f.x=Math.min(f.x,p.w-f.w);f.y=Math.min(f.y,p.h-f.h);
        refreshField(f);persist();renderLeft();renderRight();

    const n=state.fields.length;const ready=state.fields.filter(f=>isReady(f)||!f.required).length;
    const items=state.fields.map(f=>{const ok=isReady(f);const cls=ok?'ok':(f.required?'miss':'');const st=ok?'Pronto':(f.required?'Da completare':'Facoltativo');
      return '<li><button type="button" data-go="'+f.id+'"><span class="dot '+cls+'"></span>'+esc(f.name)+'<span class="st">'+st+'</span></button></li>';}).join('');
    R.innerHTML='<h3>Stato della compilazione</h3><div class="meter"><span style="width:'+(n?ready/n*100:0)+'%"></span></div>'+
      '<p class="small muted" style="margin:8px 0 0">'+ready+' di '+n+' campi pronti</p>'+
      '<ul class="status">'+items+'</ul>'+
      '<button type="button" class="btn primary big" id="bGen">Genera il PDF firmato</button>'+
      '<div class="note">'+ic('shield')+'<span>Firma elettronica semplice: va bene per moduli interni, prestiti e prese visione. Per atti formali verso enti serve la firma digitale.</span></div>';
    $('#bGen').onclick=generate;
    R.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const el=document.querySelector('.cf[data-id="'+b.dataset.go+'"]');if(!el)return;el.scrollIntoView({block:'center',behavior:'smooth'});const c=el.querySelector('input,button');if(c)setTimeout(()=>c.focus({preventScroll:true}),350);});
    $('#mbar').hidden=false;document.body.classList.add('has-mbar');
  }
}

/* ---------- modalità ---------- */
function resolve(src){
  const v=VOLONTARI[state.vol],m=MATERIALI[state.mat];
  switch(src){
    case 'volontari.nome_completo':return v.nome;case 'volontari.codice_fiscale':return v.cf;
    case 'volontari.sezione':return v.sezione;case 'volontari.telefono':return v.telefono;
    case 'tlc.descrizione':return m.descrizione;case 'tlc.codice_ana':return m.codice;case 'tlc.matricola':return m.matricola;
    case 'sistema.oggi':return today();case 'sistema.utente':return UTENTE;
    default:return null;
  }
}
function fillValues(){
  state.fields.forEach(f=>{
    if(f.source==='sistema.firma_utente'){state.values[f.id]=savedSignature(UTENTE);return;}
    const v=resolve(f.source);if(v!=null)state.values[f.id]=v;
    else if(!(f.id in state.values))state.values[f.id]=f.type==='check'?false:'';
  });
}
async function setMode(m){
  if(m===state.mode)return;
  state.mode=m;state.tool=null;state.sel=null;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  if(m==='compila'){try{await document.fonts.load('600 80px Caveat');}catch(e){}fillValues();}
  renderFields();renderPanels();
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

/* ---------- firma ---------- */
function trimCanvas(cv){
  const ctx=cv.getContext('2d');const {width:w,height:h}=cv;const d=ctx.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(x1<0)return null;const pad=6;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o.toDataURL('image/png');
}
const sigCache={};
function savedSignature(name){
  if(sigCache[name])return sigCache[name];
  const cv=document.createElement('canvas');cv.width=900;cv.height=260;const c=cv.getContext('2d');
  c.fillStyle='#16256e';c.font='600 112px Caveat, "Segoe Script", cursive';c.translate(30,170);c.rotate(-.045);c.fillText(name,0,0);
  c.setTransform(1,0,0,1,0,0);c.strokeStyle='#16256e';c.lineWidth=3;c.lineCap='round';
  const w=Math.min(860,c.measureText(name).width+60);c.beginPath();c.moveTo(40,205);c.quadraticCurveTo(w/2,188,w,200);c.stroke();
  return (sigCache[name]=trimCanvas(cv));
}
function openSign(f){
  const isUser=f.source==='sistema.firma_utente';
  const who=isUser?UTENTE:VOLONTARI[state.vol].nome;
  openModal('<h2>'+esc(f.name)+'</h2><p class="muted">Firma con il dito o con il mouse nel riquadro.</p>'+
    '<div class="pad" id="pad"><span class="x">×</span><span class="bl"></span><canvas id="padCv" aria-label="Riquadro firma"></canvas></div>'+
    '<div class="row"><button type="button" class="btn" id="padClear">Cancella</button>'+
    '<button type="button" class="btn" id="padSaved">Usa la firma salvata di '+esc(who)+'</button><span class="grow"></span>'+
    '<button type="button" class="btn" id="padCancel">Annulla</button><button type="button" class="btn primary" id="padOk">Applica la firma</button></div>');
  const cv=$('#padCv');const r=cv.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const c=cv.getContext('2d');c.scale(dpr,dpr);c.lineCap='round';c.lineJoin='round';c.strokeStyle='#16256e';c.lineWidth=2.4;
  let ink=false,down=false,last=null;
  const pt=e=>{const b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};};
  cv.onpointerdown=e=>{down=true;last=pt(e);cv.setPointerCapture(e.pointerId);c.beginPath();c.arc(last.x,last.y,1.1,0,Math.PI*2);c.fillStyle='#16256e';c.fill();ink=true;};
  cv.onpointermove=e=>{if(!down)return;const p=pt(e);const mx=(last.x+p.x)/2,my=(last.y+p.y)/2;c.beginPath();c.moveTo(last.x,last.y);c.quadraticCurveTo(last.x,last.y,mx,my);c.lineTo(p.x,p.y);c.stroke();last=p;ink=true;};
  cv.onpointerup=cv.onpointercancel=()=>{down=false;};
  $('#padClear').onclick=()=>{c.clearRect(0,0,cv.width,cv.height);ink=false;};
  $('#padSaved').onclick=async()=>{
    try{await document.fonts.load('600 80px Caveat');}catch(e){}
    delete sigCache[who];const url=savedSignature(who);const img=new Image();
    img.onload=()=>{c.clearRect(0,0,cv.width,cv.height);const W=r.width-48,H=r.height-70;const s=Math.min(W/img.width,H/img.height);c.drawImage(img,24+(W-img.width*s)/2,20+(H-img.height*s)/2,img.width*s,img.height*s);ink=true;};
    img.src=url;
  };
  $('#padCancel').onclick=closeModal;
  $('#padOk').onclick=()=>{
    if(!ink){toast('Il riquadro è vuoto: firma prima di applicare.');return;}
    const url=trimCanvas(cv);if(!url){toast('Il riquadro è vuoto: firma prima di applicare.');return;}
    state.values[f.id]=url;closeModal();refreshField(f);renderRight();toast('Firma applicata');
  };
}

/* ---------- modale ---------- */
let lastFocus=null;
function openModal(html){lastFocus=document.activeElement;$('#sheet').innerHTML=html;$('#modal').hidden=false;const b=$('#sheet').querySelector('button,input,select');if(b)b.focus();}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML='';if(lastFocus&&lastFocus.focus)try{lastFocus.focus({preventScroll:true});}catch(e){}}
$('#modal').addEventListener('pointerdown',e=>{if(e.target===$('#modal'))closeModal();});

function templateJson(){
  return {
    nome:state.docName.replace(/\.pdf$/i,''),versione:1,unita:'punti PDF, origine in alto a sinistra',
    pagine:state.pages.map(p=>({larghezza:r1(p.w),altezza:r1(p.h)})),
    campi:state.fields.map(f=>{const o={id:f.id,nome:f.name,tipo:f.type,pagina:f.page+1,x:r1(f.x),y:r1(f.y),larghezza:r1(f.w),altezza:r1(f.h),dato:f.source,obbligatorio:!!f.required};if(f.type==='text'||f.type==='date')o.dimensione_testo=f.size;return o;})
  };
}
function openJson(){
  const txt=JSON.stringify(templateJson(),null,2);
  openModal('<h2>Modello in JSON</h2><p class="muted">Va nella colonna campi della tabella dei modelli. Il PDF di base resta nello storage.</p><pre class="json" id="jsonPre">'+esc(txt)+'</pre>'+
    '<div class="row"><button type="button" class="btn" id="jCopy">'+ic('code')+'Copia</button><button type="button" class="btn" id="jDl">'+ic('download')+'Scarica il JSON</button><span class="grow"></span><button type="button" class="btn primary" id="jClose">Chiudi</button></div>');
  $('#jCopy').onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('JSON copiato');}catch(e){const rg=document.createRange();rg.selectNodeContents($('#jsonPre'));const s=getSelection();s.removeAllRanges();s.addRange(rg);toast('Testo selezionato: copialo con Ctrl+C');}};
  $('#jDl').onclick=()=>offer((templateJson().nome||'modello')+'.json',txt,'JSON scaricato');
  $('#jClose').onclick=closeModal;
}

/* ---------- generazione PDF ---------- */
const safe=s=>String(s).replace(/[^\x20-\x7E\xA0-\xFF\u2018\u2019\u201C\u201D\u2013\u2014\u20AC\u2026]/g,'?');
async function generate(){
  const missing=state.fields.filter(f=>f.required&&!isReady(f));
  document.querySelectorAll('.cf').forEach(el=>el.classList.toggle('missing',missing.some(f=>f.id===el.dataset.id)));
  if(missing.length){
    toast(missing.length===1?'Manca un campo obbligatorio: '+missing[0].name:'Mancano '+missing.length+' campi obbligatori, segnati in rosso.');
    const el=document.querySelector('.cf[data-id="'+missing[0].id+'"]');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
    return;
  }
  try{
    const {PDFDocument,StandardFonts,rgb}=PDFLib;
    const doc=await PDFDocument.load(state.pdfBytes.slice(),{ignoreEncryption:true});
    try{const form=doc.getForm();if(form.getFields().length)form.flatten();}catch(e){}
    const font=await doc.embedFont(StandardFonts.Helvetica);const pages=doc.getPages();const ink=rgb(.05,.1,.25);
    let firme=0;
    for(const f of state.fields){
      const p=pages[f.page];if(!p)continue;const H=p.getHeight();const v=state.values[f.id];
      if(f.type==='text'||f.type==='date'){
        if(!v)continue;const s=safe(v);let size=f.size||10;
        while(size>6&&font.widthOfTextAtSize(s,size)>f.w-4)size-=.5;
        p.drawText(s,{x:f.x+2,y:H-f.y-f.h/2-size*.35,size,font,color:ink});
      }else if(f.type==='check'){
        if(!v)continue;const pd=Math.max(1.5,f.w*.18);
        p.drawLine({start:{x:f.x+pd,y:H-f.y-pd},end:{x:f.x+f.w-pd,y:H-f.y-f.h+pd},thickness:1.4,color:ink});
        p.drawLine({start:{x:f.x+pd,y:H-f.y-f.h+pd},end:{x:f.x+f.w-pd,y:H-f.y-pd},thickness:1.4,color:ink});
      }else if(f.type==='sign'){
        if(!v)continue;const img=await doc.embedPng(v);const s=Math.min(f.w/img.width,f.h/img.height);const w=img.width*s,h=img.height*s;
        p.drawImage(img,{x:f.x+(f.w-w)/2,y:H-f.y-f.h+(f.h-h)/2,width:w,height:h});firme++;
      }
    }
    const now=new Date();const stamp=today()+' alle '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    const lp=pages[pages.length-1];
    lp.drawText(safe('Compilato e firmato elettronicamente il '+stamp+' con Firma Documenti (prototipo). Firme apposte: '+firme+'.'),{x:28,y:14,size:6.5,font,color:rgb(.45,.5,.58)});
    doc.setProducer('Firma Documenti, prototipo CAP ANA Piemonte');doc.setModificationDate(now);
    const bytes=await doc.save();
    let hash='non disponibile';
    try{const hb=await crypto.subtle.digest('SHA-256',bytes);hash=Array.from(new Uint8Array(hb)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){}
    const name=(state.docName.replace(/\.pdf$/i,'')||'documento')+'_firmato.pdf';
    state.last={bytes,name,hash};
    showResult(pages.length);
  }catch(e){
    console.error(e);toast('Non sono riuscito a generare il PDF: il file di base potrebbe essere protetto.');
  }
}
async function showResult(n){
  const L=state.last;
  openModal('<h2>PDF pronto</h2><p class="muted">I campi sono scritti nel foglio e non sono più modificabili.</p>'+
    '<div class="res"><div class="thumb"><canvas id="resCv"></canvas></div><dl>'+
    '<dt>File</dt><dd>'+esc(L.name)+'</dd><dt>Pagine</dt><dd>'+n+'</dd><dt>Dimensione</dt><dd>'+Math.max(1,Math.round(L.bytes.length/1024))+' kB</dd>'+
    '<dt>Impronta SHA-256</dt><dd class="hash">'+esc(L.hash)+'</dd></dl></div>'+
    '<p class="small muted">Nel portale l\u2019impronta si salva nel registro firme con data, ora e utente: dimostra che il file non è stato cambiato dopo la firma.</p>'+
    '<div class="row"><span class="grow"></span><button type="button" class="btn" id="rClose">Chiudi</button><button type="button" class="btn primary" id="rDl">'+ic('download')+'Scarica il PDF</button></div>');
  $('#rClose').onclick=closeModal;
  $('#rDl').onclick=()=>offer(L.name,new Blob([L.bytes],{type:'application/pdf'}),'PDF scaricato');
  try{
    const pdf=await pdfjsLib.getDocument({data:L.bytes.slice(),isEvalSupported:false}).promise;const pg=await pdf.getPage(1);
    const v1=pg.getViewport({scale:1});const vp=pg.getViewport({scale:340/v1.width});const cv=$('#resCv');if(!cv)return;
    cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  }catch(e){}
}
$('#mGen').onclick=generate;

/* ---------- caricamento file ---------- */
$('#file').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;
  const buf=new Uint8Array(await file.arrayBuffer());
  const head=String.fromCharCode.apply(null,buf.subarray(0,1024));
  if(head.indexOf('%PDF')<0){toast('Il file scelto non è un PDF.');return;}
  state.pdfBytes=buf;state.isSample=false;state.docName=file.name;state.fields=[];state.values={};state.sel=null;
  persist();await renderDoc();renderPanels();toast('PDF caricato: ora aggiungi i campi');
});

/* ---------- avvio ---------- */
async function init(){
  renderPanels();
  if(!window.PDFLib||!window.pdfjsLib){$('#pages').innerHTML='<div class="empty">Le librerie PDF non si sono caricate. Controlla la connessione e ricarica la pagina.</div>';return;}
  const saved=restore();
  if(saved&&saved.fields){
    try{
      if(saved.isSample||!saved.pdf){state.pdfBytes=await buildSample();state.isSample=true;state.docName=saved.isSample?saved.docName:'Modulo consegna materiale.pdf';state.fields=saved.isSample?saved.fields:DEFAULT_FIELDS.map(f=>Object.assign({id:uid(),page:0},f));}
      else{state.pdfBytes=fromB64(saved.pdf);state.isSample=false;state.docName=saved.docName;state.fields=saved.fields;}
      await renderDoc();renderPanels();return;
    }catch(e){}
  }
  await loadSample();
}
init();
setTimeout(dlApi,600);
})();
</script>
