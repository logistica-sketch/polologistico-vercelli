<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Firma documento – Polo Logistico 1 RGPT/CAP Vercelli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blu-900:#0f2a4a;--blu-600:#1f5fa8;--bg:#eef1f5;--panel:#fff;--ink:#13233a;--muted:#5a6a7f;--line:#d4dbe5;--ok:#2f7d4f;--ok-100:#e3f2e8;--danger:#b42318;--danger-100:#fde8e6;--giallo:#e8a600;
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--blu-900);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px}
header strong{display:block;font-size:15px}
header span{font-size:12.5px;color:#b9c9de}
main{max-width:760px;margin:0 auto;padding:18px 14px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.pages{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.page{position:relative;background:#fff;box-shadow:0 1px 3px rgba(10,25,45,.25)}
.page canvas{display:block;width:100%;height:auto}
.target{position:absolute;border:2px solid var(--giallo);background:rgba(232,166,0,.12);border-radius:3px;animation:pulse 1.6s ease-in-out 3}
.target span{position:absolute;left:-2px;bottom:100%;background:var(--giallo);color:#1d1400;font:700 11px/1 "Public Sans",sans-serif;padding:4px 7px 3px;border-radius:4px 4px 0 0;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(232,166,0,.25)}}
.pad{position:relative;height:200px;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;margin:10px 0}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad .bl{position:absolute;left:22px;right:22px;bottom:44px;border-bottom:1px solid #c9d1dc;pointer-events:none}
.pad .x{position:absolute;left:22px;bottom:48px;color:#9aa6b6;font-size:18px;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:9px;padding:11px 16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600}
button.primary{background:var(--blu-600);border-color:var(--blu-600);color:#fff;flex:1;min-width:200px}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blu-600);outline-offset:2px}
label.consenso{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin:14px 0}
label.consenso input{width:20px;height:20px;margin:2px 0 0;flex:none}
.esito{text-align:center;padding:34px 18px}
.esito .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px}
.esito .ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.esito.ok .ic{background:var(--ok-100);color:var(--ok)}
.esito.ko .ic{background:var(--danger-100);color:var(--danger)}
.hash{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;color:var(--muted)}
.errore{color:var(--danger);font-size:14px;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><strong>Polo Logistico 1° RGPT / CAP Vercelli</strong><span>Coordinamento delle Sezioni Piemontesi ANA, Protezione Civile</span></header>
<main>
  <div id="vCarico" class="card esito"><p class="muted">Sto aprendo il documento…</p></div>

  <div id="vEsito" class="card esito" hidden></div>

  <div id="vFirma" hidden>
    <div class="card">
      <h1 id="titolo"></h1>
      <p id="intro"></p>
      <p class="small muted" id="scadenza"></p>
    </div>
    <div class="card">
      <p class="small muted">Leggi il documento. Il riquadro giallo indica dove verrà messa la tua firma.</p>
      <div class="pages" id="pages"></div>
    </div>
    <div class="card" id="boxFirma">
      <h1>La tua firma</h1>
      <p class="small muted">Firma con il dito o con il mouse nel riquadro.</p>
      <div class="pad"><span class="x">×</span><span class="bl"></span><canvas id="pad" aria-label="Riquadro firma"></canvas></div>
      <div class="row"><button type="button" id="bCancella">Cancella</button></div>
      <label class="consenso"><input type="checkbox" id="consenso"><span>Ho letto il documento e lo firmo elettronicamente. So che la firma, la data, l’ora e i dati del dispositivo verranno registrati.</span></label>
      <div class="row"><button type="button" class="primary" id="bFirma" disabled>Firma il documento</button></div>
      <p class="errore" id="errore" hidden></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.2.0/dist/signature_pad.umd.min.js"></script>
<script>
(function(){
'use strict';
// ====== CONFIGURAZIONE ======
const FUNZIONE = 'https://hzovguvwnadoptwrdyub.supabase.co/functions/v1/editor-pdf-firma';
// ============================

const $ = s => document.querySelector(s);
// il token resta solo in questa scheda: tolto dalla barra dell'indirizzo, ma una ricarica funziona ancora
let token = new URLSearchParams(location.search).get('t');
try {
  if (token) { sessionStorage.setItem('firma_t', token); history.replaceState(null, '', location.pathname); }
  else token = sessionStorage.getItem('firma_t');
} catch(e) {}

const ICO_OK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
const ICO_KO = '<svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>';
const MESSAGGI = {
  non_valido: ['Link non valido', 'Controlla di aver aperto il link completo che ti è stato inviato.'],
  usato:      ['Documento già firmato', 'Questo link è già stato usato. Se pensi sia un errore, contatta chi te l’ha inviato.'],
  scaduto:    ['Link scaduto', 'Chiedi a chi te l’ha inviato di generarne uno nuovo.'],
  revocato:   ['Link non più attivo', 'La richiesta di firma è stata annullata. Chiedi a chi te l’ha inviata un nuovo link.'],
  errore:     ['Qualcosa non ha funzionato', 'Riprova tra qualche minuto. Se il problema resta, contatta chi ti ha inviato il link.']
};

function esito(tipo, titolo, testo, extra) {
  $('#vCarico').hidden = true; $('#vFirma').hidden = true;
  const e = $('#vEsito'); e.hidden = false; e.className = 'card esito ' + tipo;
  e.innerHTML = '<div class="ic">' + (tipo === 'ok' ? ICO_OK : ICO_KO) + '</div><h1></h1><p class="muted"></p>' + (extra || '');
  e.querySelector('h1').textContent = titolo; e.querySelector('p').textContent = testo;
  window.scrollTo(0, 0);
}
function errore(code) { const m = MESSAGGI[code] || MESSAGGI.errore; esito('ko', m[0], m[1]); }

async function chiama(azione, dati) {
  const res = await fetch(FUNZIONE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ azione, token }, dati || {})) });
  let body = {}; try { body = await res.json(); } catch(e) {}
  if (!res.ok) throw Object.assign(new Error(body.errore || 'errore'), { code: body.errore || 'errore' });
  return body;
}

// ---------- firma ----------
let pad = null;
function preparaPad() {
  const cv = $('#pad');
  pad = new SignaturePad(cv, { penColor: '#16256e', minWidth: 0.8, maxWidth: 2.6 });
  const resize = () => {
    const data = pad.toData(); const r = Math.max(window.devicePixelRatio || 1, 1);
    cv.width = cv.offsetWidth * r; cv.height = cv.offsetHeight * r; cv.getContext('2d').scale(r, r);
    pad.clear(); if (data.length) pad.fromData(data); aggiorna();
  };
  window.addEventListener('resize', resize); resize();
  pad.addEventListener('endStroke', aggiorna);
  $('#bCancella').onclick = () => { pad.clear(); aggiorna(); };
  $('#consenso').onchange = aggiorna;
}
function aggiorna() { $('#bFirma').disabled = !(pad && !pad.isEmpty() && $('#consenso').checked); }

function firmaRitagliata() {
  const cv = $('#pad'); const ctx = cv.getContext('2d'); const w = cv.width, h = cv.height;
  const d = ctx.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const p = 8; x0 = Math.max(0, x0 - p); y0 = Math.max(0, y0 - p); x1 = Math.min(w - 1, x1 + p); y1 = Math.min(h - 1, y1 + p);
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(cv, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o.toDataURL('image/png');
}

async function invia() {
  const png = firmaRitagliata(); if (!png) return;
  const b = $('#bFirma'); b.disabled = true; b.textContent = 'Sto firmando…'; $('#errore').hidden = true;
  try {
    const r = await chiama('firma', { firma_png: png, consenso: true });
    esito('ok', 'Documento firmato', 'Grazie, la tua firma è stata registrata. Puoi chiudere questa pagina.',
      '<p class="small muted" style="margin-top:14px">Impronta del documento firmato (SHA-256)</p><p class="hash">' + r.sha256 + '</p>');
  } catch (e) {
    if (['usato', 'scaduto', 'revocato', 'non_valido'].includes(e.code)) { errore(e.code); return; }
    b.disabled = false; b.textContent = 'Firma il documento';
    const x = $('#errore'); x.hidden = false; x.textContent = 'La firma non è stata salvata. Controlla la connessione e riprova.';
  }
}

// ---------- anteprima documento ----------
async function mostraPdf(url, campo) {
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ url, isEvalSupported: false }).promise;
  const box = $('#pages'); const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const larg = Math.min(box.clientWidth || 700, 760);
  let bersaglio = null;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i); const v1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(3, (larg * dpr) / v1.width) });
    const wrap = document.createElement('div'); wrap.className = 'page';
    const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    wrap.appendChild(cv);
    if (campo && campo.pagina === i) {
      const t = document.createElement('div'); t.className = 'target';
      t.style.left = (campo.x / v1.width * 100) + '%'; t.style.top = (campo.y / v1.height * 100) + '%';
      t.style.width = (campo.larghezza / v1.width * 100) + '%'; t.style.height = (campo.altezza / v1.height * 100) + '%';
      t.innerHTML = '<span>La tua firma</span>'; wrap.appendChild(t); bersaglio = wrap;
    }
    box.appendChild(wrap);
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  }
  return bersaglio;
}

// ---------- avvio ----------
async function avvio() {
  if (!token) { errore('non_valido'); return; }
  let dati;
  try { dati = await chiama('apri'); }
  catch (e) { errore(e.code); return; }

  $('#titolo').textContent = dati.titolo;
  $('#intro').textContent = 'Ciao ' + dati.firmatario_nome + ', ti è stato chiesto di firmare: ' + (dati.campo ? dati.campo.nome : 'questo documento') + '.';
  const sc = new Date(dati.scade_il);
  $('#scadenza').textContent = 'Il link è valido fino al ' + sc.toLocaleDateString('it-IT') + ' alle ' + sc.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) + ' e si può usare una sola volta.';
  $('#vCarico').hidden = true; $('#vFirma').hidden = false;

  preparaPad();
  $('#bFirma').onclick = invia;

  try { await mostraPdf(dati.pdf_url, dati.campo); }
  catch (e) { $('#pages').innerHTML = '<p class="errore">Non riesco a mostrare l’anteprima. Ricarica la pagina per riprovare.</p>'; }
}
avvio();
})();
</script>
</body>
</html>
